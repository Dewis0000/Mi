# Пример продакшен-конфига: статика фронтенда + прокси на API.
server {
    listen 443 ssl http2;
    server_name chernyhod.ru;

    ssl_certificate     /etc/letsencrypt/live/chernyhod.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chernyhod.ru/privkey.pem;

    root /var/www/chernyhod/web/dist;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8g;          # загрузка видеозаписей
        proxy_request_buffering off;
    }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:4000; }
    location /uploads/ { proxy_pass http://127.0.0.1:4000; expires 30d; }

    # HLS-трансляции (MediaMTX)
    location /live/hls/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_buffering off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /images/ { expires 30d; }

    # Главная — пререндеренный HTML (npm run prerender), остальные пути SPA — чистый шаблон.
    # Если пререндер не используется, index.spa.html не существует и сработает index.html.
    location = / {
        try_files /index.html =404;
    }
    location / {
        try_files $uri $uri/ /index.spa.html /index.html;
    }
}

server {
    listen 80;
    server_name chernyhod.ru;
    return 301 https://$host$request_uri;
}
