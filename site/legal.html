<section id="requisites" style="margin-top: 48px">
<h2 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; color: var(--n-12)">Реквизиты продавца</h2>
<ul style="margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 8px">
<li>Наименование: [полное наименование ИП или самозанятого]</li>
<li>ИНН: 143410969160</li>
<li>ОГРНИП (для ИП): [ОГРНИП]</li>

<section id="prices" style="margin-top: 48px">
<h2 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; color: var(--n-12)">Услуги и цены</h2>
<p style="margin: 16px 0 0">Сервис продаётся как подписка на тариф на 30 дней. Оплата списывается с баланса в StreOps, баланс пополняется онлайн через ЮKassa.</p>
<table style="margin-top: 16px; width: 100%; border-collapse: collapse; font-size: 15px">
<thead><tr style="text-align: left; color: var(--n-9)"><th style="padding: 10px 0; border-bottom: 1px solid var(--n-5); font-weight: 500">Тариф</th><th style="padding: 10px 0; border-bottom: 1px solid var(--n-5); font-weight: 500">Цена за 30 дней</th></tr></thead>
<tbody>
<tr><td style="padding: 10px 0; border-bottom: 1px solid var(--n-4)">Бесплатный</td><td style="padding: 10px 0; border-bottom: 1px solid var(--n-4)">0 ₽</td></tr>
<tr><td style="padding: 10px 0; border-bottom: 1px solid var(--n-4)">Продвинутая</td><td style="padding: 10px 0; border-bottom: 1px solid var(--n-4)">299 ₽</td></tr>
<tr><td style="padding: 10px 0; border-bottom: 1px solid var(--n-4)">Про</td><td style="padding: 10px 0; border-bottom: 1px solid var(--n-4)">499 ₽</td></tr>
<tr><td style="padding: 10px 0; border-bottom: 1px solid var(--n-4)">Максимум</td><td style="padding: 10px 0; border-bottom: 1px solid var(--n-4)">967 ₽</td></tr>
</tbody></table>
<p style="margin: 16px 0 0">Пополнение баланса: от 100 до 50 000 ₽ за один платёж. Цены указаны в рублях, без НДС.</p>
<p style="margin: 12px 0 0">Услуга предоставляется в электронном виде сразу после зачисления оплаты и активации тарифа. Доступ к сервису: streops.ru.</p>
</section>

<section id="offer" style="margin-top: 48px">
<h2 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; color: var(--n-12)">Публичная оферта</h2>
<ol style="margin: 16px 0 0; padding-left: 20px; display: grid; gap: 10px">
<li>Настоящая оферта адресована любому дееспособному лицу, принимающему её условия. Акцептом оферты считается пополнение баланса или покупка тарифа в StreOps.</li>
<li>Предмет: предоставление доступа к сервису StreOps — чат-боту, модерации, виджетам для OBS, заказу музыки и розыгрышам для стримеров Twitch.</li>
<li>Оплата производится в рублях через платёжный сервис ЮKassa. Зачисление на баланс происходит после подтверждения платежа.</li>
<li>Возврат: неиспользованный баланс возвращается по письменному запросу на email Streops_official@gmail.com в течение 2 дней с даты запроса. Возврат производится на карту или счёт, с которых была оплата. Оплаченный и активированный тариф возврату не подлежит. Если тариф оплачен с баланса, он не возвращается, но остаток баланса можно вернуть по этим же правилам.</li>
<li>Продавец вправе изменить тарифы и цены, уведомив пользователей в сервисе. Изменения не действуют на уже оплаченный период.</li>
<li>Продавец не отвечает за действия платформы Twitch и других сервисов, которыми пользуется стример. Стример отвечает за соблюдение правил Twitch и законодательства.</li>
</ol>
</section>

<section id="privacy" style="margin-top: 48px">
<h2 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; color: var(--n-12)">Политика конфиденциальности</h2>
<ul style="margin: 16px 0 0; padding-left: 20px; display: grid; gap: 10px">
<li>Мы собираем: логин, ID и имя из Twitch (при входе через Twitch), email, если Twitch его передаёт, история баланса и платежей, сообщения чата канала, которые бот обрабатывает для модерации и статистики, подключения DonationAlerts и YouTube, которые стример подключил сам.</li>
<li>Цели: работа сервиса, модерация чата, начисление тарифа и баланса, поддержка пользователя.</li>
<li>Платёжные данные карты обрабатывает ЮKassa. StreOps их не получает и не хранит.</li>
<li>Данные хранятся на сервере в России (хостинг reg.ru). Мы не продаём и не передаём данные третьим лицам, кроме сервисов, без которых сервис не работает: Twitch, YouTube, DonationAlerts, ЮKassa.</li>
<li>Пользователь может отключить подключения и удалить аккаунт в «Настройки». Удаление стирает данные сервиса.</li>
<li>Вопросы и запросы: Streops_official@gmail.com. Оператор персональных данных: продавец, указанный в реквизитах (ИНН 143410969160).</li>
</ul>
</section>
