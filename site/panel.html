<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — стрим-панель</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js?v=460ce522"></script>
<script src="assets/api.js?v=c464f264"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ov{font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9);margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--s-2);border:1px solid var(--n-5);border-radius:8px}
.av{border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;color:var(--n-1);flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--n-12);outline-offset:2px}
.btn{height:40px;padding:0 16px;border-radius:6px;border:0;background:var(--n-13);color:var(--n-1);font:500 14px/20px var(--font-sans),sans-serif;display:inline-flex;align-items:center;gap:8px;cursor:pointer;flex:none}
.btn:disabled{opacity:.6;cursor:default}
.btn-s{height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);font:500 14px/20px var(--font-sans),sans-serif;cursor:pointer;flex:none}
.btn-s:hover{border-color:var(--n-9)}
.btn-s:disabled{opacity:.6;cursor:default}
.met{padding:20px;min-width:0}
.met-v{margin:10px 0 0;font-size:32px;line-height:36px;font-weight:500;letter-spacing:-0.02em}
.met-c{margin:12px 0 0;font-size:12px;line-height:16px;color:var(--n-9)}
.msg{position:relative;display:flex;gap:8px;padding:6px 16px;font-size:13px;line-height:19px}
.msg:hover{background:rgb(var(--n-13-rgb) / .04)}
.acts{display:flex;opacity:0;pointer-events:none;position:absolute;right:12px;top:2px;gap:2px;padding:2px;border-radius:6px;background:var(--n-4);border:1px solid rgb(var(--n-13-rgb) / .14)}
.msg:hover .acts,.msg:focus-within .acts{opacity:1;pointer-events:auto}
@media (hover: none){.msg[data-sel] .acts{opacity:1;pointer-events:auto}}
.act{width:28px;height:28px;border:0;border-radius:4px;background:transparent;color:var(--n-10);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.act:hover{background:rgb(var(--n-13-rgb) / .08);color:var(--n-12)}
.act.d:hover{color:var(--accent-text)}
.act:disabled{opacity:.4;cursor:default}
.mtag{display:inline-block;margin-left:6px;padding:0 5px;border:1px solid var(--n-6);border-radius:3px;font-size:11px;line-height:16px;color:var(--n-9);white-space:nowrap;text-decoration:none}
.role{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:3px;border:1px solid var(--n-8);color:var(--n-11);flex:none;margin-top:1px}
.ev{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--n-4)}
.evi{width:32px;height:32px;border-radius:6px;border:1px solid var(--n-6);display:inline-flex;align-items:center;justify-content:center;color:var(--n-11);box-sizing:border-box;flex:none}
.qc{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:8px;border:1px solid var(--n-5);background:var(--s-2);color:var(--n-12);font-family:var(--font-sans),sans-serif;text-align:left;min-width:0}
.qc:hover{background:var(--s-3);border-color:var(--n-6)}
.empty{margin:16px 0 0;padding:20px 16px;border:1px dashed var(--n-5);border-radius:8px;font-size:14px;line-height:20px;color:var(--n-9)}
.chat{height:860px}
@media (max-width: 560px){.xo{visibility:hidden}}
@media (max-width: 700px){.chat{height:600px}.hdr{height:auto!important;padding:10px 16px!important}.wrap{padding:16px!important}}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none;white-space:nowrap;overflow:hidden}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
.sb-search{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;margin:0 0 8px;border:1px solid var(--n-6);border-radius:8px;background:rgb(var(--n-13-rgb) / .03);color:var(--n-9)}
.sb-search:focus-within{border-color:var(--n-12)}
.sb-search input{flex:1;min-width:0;min-width:0;border:0;outline:0;background:transparent;color:var(--n-12);font:400 14px/20px 'Onest',sans-serif;padding:0}
.sb-search input::placeholder{color:var(--n-9)}
.sb-search input::-webkit-search-cancel-button{display:none}
.sb-search kbd{font:400 10px/1 'JetBrains Mono',monospace;margin-left:auto;color:var(--n-9);border:1px solid var(--n-6);border-radius:4px;padding:2px 5px;white-space:nowrap}
.sb-empty{margin:8px 12px;font-size:13px;color:var(--n-9)}
.sb-hide{display:none!important}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var nav = document.querySelector('nav.sb'), box = nav && nav.querySelector('[data-sb-search]');
  if (!box) return;
  var empty = nav.querySelector('[data-sb-empty]');
  function apply() {
    var q = box.value.trim().toLowerCase(), any = false, group = null, groupHit = false;
    var rows = Array.prototype.slice.call(nav.children).filter(function (el) { return el.matches('a.sb-i, span.sb-i, p.sb-h, div.sb-sep'); });
    rows.forEach(function (el) {
      if (el.matches('p.sb-h')) { if (group) group.classList.toggle('sb-hide', !groupHit && !!q); group = el; groupHit = false; el.classList.remove('sb-hide'); return; }
      if (el.matches('div.sb-sep')) { el.classList.toggle('sb-hide', !!q); return; }
      var hit = !q || (el.textContent + ' ' + (el.getAttribute('data-kw') || '')).toLowerCase().indexOf(q) !== -1;
      el.classList.toggle('sb-hide', !hit);
      if (hit) { groupHit = true; any = true; }
    });
    if (group) group.classList.toggle('sb-hide', !!q && !groupHit);
    if (empty) empty.hidden = any || !q;
  }
  box.addEventListener('input', apply);
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var first = nav.querySelector('a.sb-i:not(.sb-hide)'); if (first) location.href = first.getAttribute('href'); }
    if (e.key === 'Escape') { box.value = ''; apply(); box.blur(); }
  });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); box.focus(); box.select(); }
  });
});
</script>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div class="hdr" style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px; flex-wrap: wrap">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<div role="status" data-dc-keep data-stre-live aria-label="Статус эфира" style="display: flex; align-items: center; height: 40px; border: 1px solid var(--n-5); border-radius: 6px">
<span style="display: inline-flex; align-items: center; gap: 8px; height: 100%; padding: 0 12px; border-right: 1px solid var(--n-5)"><span data-dot style="width: 8px; height: 8px; border-radius: 999px; background: var(--n-8)"></span><span data-label style="font-size: 11px; font-weight: 700; letter-spacing: .08em">НЕ В ЭФИРЕ</span></span>
<span class="mono" data-timer title="Длительность эфира" style="padding: 0 12px; border-right: 1px solid var(--n-5); font-size: 15px">—</span><span class="mono" data-viewers title="Зрителей сейчас" style="padding: 0 12px; font-size: 15px">—</span>
</div>
<a href="settings.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; border-radius: 6px; font-size: 14px; font-weight: 500" aria-label="Профиль" data-dc-keep data-stre-user><span class="av" style="width: 32px; height: 32px; font-size: 12px; background: linear-gradient(135deg, var(--n-10), var(--n-6))" data-av></span><span data-name>Профиль</span><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
</div>
</div>
</header>

<div class="wrap" style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">

<nav aria-label="Разделы стрим-панели" class="sb" data-dc-keep>
<label class="sb-search"><svg class="sb-ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" data-sb-search placeholder="Поиск" aria-label="Найти раздел" autocomplete="off"><kbd>Ctrl K</kbd></label><p class="sb-empty" data-sb-empty hidden>Такого раздела нет</p>
<p class="sb-h">Сегодня</p>
<a href="panel.html" class="sb-i" aria-current="page" data-kw="главная статистика эфир статус"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Старт</a>
<p class="sb-h">Чат</p>
<a href="moderation.html" class="sb-i" data-kw="фильтр чат удалить бан таймаут проверка"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<a href="mods.html" class="sb-i" data-kw="мод модераторы помощник права журнал"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Помощники</a>
<a href="commands.html" class="sb-i" data-kw="команда ответ чат кулдаун"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды</a>
<a href="timers.html" class="sb-i" data-kw="таймер сообщение напоминание"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6M12 2v3"/></svg>Таймеры</a>
<p class="sb-h">Музыка</p>
<a href="music.html" class="sb-i" data-kw="музыка трек плеер заказ очередь песня"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Очередь и заказы</a>
<a href="manage.html" class="sb-i" data-kw="помощник канал трек музыка добавить"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Управлять каналом</a>
<p class="sb-h">Эфир и сайт</p>
<a href="widgets.html" class="sb-i" data-kw="виджет obs браузер ссылка чат розыгрыш"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты для OBS</a>
<a href="site-settings.html" class="sb-i" data-kw="сайт подписчики видео значок галочка модератор"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Мой сайт</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i" data-kw="розыгрыш приз участники победитель"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<a href="clips.html" class="sb-i" data-kw="нарезка клип момент видео"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 9-12 9z"/><path d="M3 3v18"/></svg>Нарезки</a>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i" data-kw="тариф оплата аккаунт email промокод"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
<a href="support.html" class="sb-i" data-kw="помощь вопрос обращение"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Поддержка</a>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div style="min-width: 0"><h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Старт</h1><p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: var(--n-10); display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; flex: none; background: {{ head.dot }}"></span><span style="color: var(--n-12); font-weight: 500">{{ head.state }}</span><span>{{ head.info }}</span></p></div>
<p class="mono" role="status" style="margin: 0; font-size: 12px; color: var(--n-9)">{{ head.sync }}</p>
</div>



<div style="display: contents"><template data-if="banner.show">
<section aria-labelledby="bot-t" style="{{ banner.box }}">
<span class="evi" style="width: 40px; height: 40px; {{ banner.iconStyle }}"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8V4H8"></path><rect x="4" y="8" width="16" height="12" rx="2"></rect><path d="M2 14h2M20 14h2M15 13v2M9 13v2"></path></svg></span>
<div style="flex: 1 1 280px; min-width: 0">
<h2 id="bot-t" style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">{{ banner.title }}</h2>
<p style="margin: 6px 0 0; font-size: 14px; line-height: 20px; color: var(--n-10)">{{ banner.text }}</p>
<template data-if="banner.hasNote"><p style="margin: 8px 0 0; font-size: 13px; line-height: 18px; color: var(--n-9)">{{ banner.note }}</p></template>
<template data-if="banner.hasErrs"><div role="alert" style="margin-top: 12px; padding: 10px 12px; border: 2px solid var(--n-12); border-radius: 6px; font-size: 13px; line-height: 18px"><p style="margin: 0; font-weight: 600">{{ banner.errTitle }}</p><ul style="margin: 4px 0 0; padding-left: 18px"><template data-for="banner.errs" data-as="e"><li style="overflow-wrap: anywhere">{{ e.text }}</li></template></ul></div></template>
</div>
<template data-if="banner.hasBtn"><button type="button" class="{{ banner.btnClass }}" onClick="{{ enableBot }}" disabled="{{ banner.btnOff }}">{{ banner.btn }}</button></template>
</section>
</template></div>



<template data-if="showSteps"><section class="card" style="padding: 22px 24px; min-width: 0" aria-labelledby="st-t"><h2 id="st-t" style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">Первые шаги</h2><p style="margin: 4px 0 0; font-size: 13px; line-height: 18px; color: var(--n-9)">Сделано: {{ stepsDone }} из 4. Каждый шаг можно пропустить и вернуться позже.</p><ol style="list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px"><template data-for="steps" data-as="x"><li style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--n-5); border-radius: 8px"><span aria-hidden="true" style="width: 24px; height: 24px; flex: none; border-radius: 999px; border: 1px solid var(--n-6); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; {{ x.dotStyle }}">{{ x.mark }}</span><div style="min-width: 0; flex: 1"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">{{ x.title }}</p><p style="margin: 2px 0 0; font-size: 12px; line-height: 16px; color: var(--n-9)">{{ x.hint }}</p></div><template data-if="x.hasAction"><button type="button" class="btn-s" onClick="{{ x.act }}" disabled="{{ x.actOff }}">{{ x.actLabel }}</button></template></li></template></ol></section></template>
<div role="group" aria-label="Ключевые показатели" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<template data-for="kpis" data-as="k"><div class="card" style="padding: 16px 18px; min-width: 0"><p style="margin: 0; font-size: 13px; line-height: 18px; color: var(--n-10)">{{ k.label }}</p><p class="mono" style="margin: 8px 0 0; font-size: 26px; line-height: 30px; font-weight: 500; letter-spacing: -0.01em">{{ k.value }}</p><p style="margin: 6px 0 0; font-size: 12px; line-height: 16px; color: var(--n-9)">{{ k.sub }}</p><template data-if="k.hasHint"><p style="margin: 4px 0 0; font-size: 12px; line-height: 16px; color: var(--n-11)">{{ k.hint }}</p></template></div></template>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; align-items: stretch"><section class="card" style="padding: 22px 24px; min-width: 0; display: flex; flex-direction: column; gap: 14px" aria-labelledby="vw-t">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap"><div style="min-width: 0"><h2 id="vw-t" style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">Зрители</h2><p style="margin: 4px 0 0; font-size: 13px; line-height: 18px; color: var(--n-9)">за последние 3 часа · по минутам</p></div><span class="mono" style="font-size: 12px; color: var(--n-9)">макс. {{ vMax }}</span></div>

  ban: CIRCLE + 'M4.9 4.9l14.2 14.2',

  warn: 'M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z',
  review: 'M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7zM12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6',

  broadcaster: 'M3 5h11a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM23 7l-7 5 7 5z',
  moderator: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z',
  vip: 'M6 3h12l4 6-10 13L2 9z',
};
const ROLES = [['broadcaster', 'Стример', 'broadcaster'], ['moderator', 'Модератор', 'moderator'], ['vip', 'VIP', 'vip'], ['founder', 'Подписчик', 'star'], ['subscriber', 'Подписчик', 'star']];

function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}
function humanDur(s) {
  s = Number(s) || 0;
  if (s < 60) return s + ' с';
  if (s < 3600) return Math.round(s / 60) + ' мин';
  if (s < 86400) return Math.round(s / 3600) + ' ч';
  const d = Math.round(s / 86400);
  return d + ' ' + plural(d, 'день', 'дня', 'дней');
}
function when(ts) {
  const d = new Date(ts * 1000);
  const today = new Date();
  if (d.toDateString() === today.toDateString()) return StreAPI.fmtTime(ts);
  return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
}
function niceTop(max) {
  if (max <= 4) return 4;
  const raw = max / 4;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / p;
  const step = Math.ceil((n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p);
  return step * 4;
}
function tierLabel(t) {
  const m = { '1000': 'уровень 1', '2000': 'уровень 2', '3000': 'уровень 3', prime: 'Prime' };
  return m[String(t || '').toLowerCase()] || '';
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      me: null, dash: null, dashErr: '',
      chat: [], chatLoaded: false, chatErr: '', newCount: 0, sel: null, busy: {}, notes: {},
      text: '', sending: false, sendErr: '',
      hover: -1, botBusy: false, botErrors: [], testBusy: false,
    };
    this.lastId = 0;
    this.dashSig = '';
    this.localN = 0;
    this.lastOk = 0;
  }

  componentDidMount() {
    this.init();
    this.tChat = setInterval(() => this.pollChat(), CHAT_MS);
    this.tDash = setInterval(() => this.tick(), DASH_MS);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { this.pollChat(); this.tick(); } });
    window.addEventListener('pagehide', () => { clearInterval(this.tChat); clearInterval(this.tDash); });
  }

  async init() {
    const me = await StreAPI.me();
    if (me && me.user) this.setState({ me });
    this.loadDash();
    this.loadChat(true);
  }

  tick() {
    if (document.hidden) return;
    this.loadDash();
    this.loadChat(true);
  }

  // ---------- обзор ----------
  async loadDash() {
    if (this.dashBusy) return;
    this.dashBusy = true;
    try {
      const r = await StreAPI.get('dashboard');
      const sig = JSON.stringify([r.stream, r.metrics, r.chart.buckets, Math.floor(r.chart.from / 60), r.events, r.actions, r.topCommands, r.topChatters, r.hourly]);
      if (sig !== this.dashSig || this.state.dashErr) {
        this.dashSig = sig;
        this.setState({ dash: r, dashErr: '' });
      }
      this.lastOk = Date.now(); // время последней удачной проверки — без перерисовки
    } catch (e) {
      if (this.state.dashErr !== e.message) this.setState({ dashErr: e.message });
    } finally {
      this.dashBusy = false;
    }
  }

  // ---------- чат ----------
  logEl() { return document.getElementById('chat-log'); }
  atBottom() {
    const el = this.logEl();
    return !el || el.scrollHeight - el.scrollTop - el.clientHeight < 48;
  }
  scrollBottom() {
    requestAnimationFrame(() => { const el = this.logEl(); if (el) el.scrollTop = el.scrollHeight; });
  }
  botLogin() {
    const me = this.state.me;
    return String((me && me.bot && me.bot.login) || '').toLowerCase();
  }

  // full=true: последние 40 без after — так подтягиваем пометки «удалено» у уже показанных сообщений
  async loadChat(full) {
    if (this.chatBusy) return;
    this.chatBusy = true;
    try {
      const q = !full && this.lastId ? { after: this.lastId } : undefined;
      const r = await StreAPI.get('chat.recent', q);
      this.mergeChat(r.items || [], full);
    } catch (e) {
      if (!this.state.chatLoaded) this.setState({ chatErr: e.message, chatLoaded: true });
    } finally {
      this.chatBusy = false;
    }
  }
  pollChat() {
    if (document.hidden) return;
    this.loadChat(false);
  }
  mergeChat(items, full) {
    const s = this.state;
    let changed = !s.chatLoaded || !!s.chatErr;
    let chat = s.chat;
    if (full && chat.length) {
      const byId = new Map(items.map((m) => [m.id, m]));
      chat = chat.map((m) => {
        const f = !m.local && byId.get(m.id);
        if (f && f.deleted !== m.deleted) { changed = true; return Object.assign({}, m, { deleted: f.deleted }); }
        return m;
      });
    }
    const fresh = items.filter((m) => m.id > this.lastId);
    if (fresh.length) {
      changed = true;
      chat = chat.slice();
      const bot = this.botLogin();
      for (const m of fresh) {
        this.lastId = Math.max(this.lastId, m.id);
        if (bot && String(m.login).toLowerCase() === bot) {
          const k = chat.findIndex((x) => x.local && x.text === m.text);
          if (k >= 0) chat.splice(k, 1);
        }
        chat.push(m);
      }
      if (chat.length > CHAT_KEEP) chat = chat.slice(-CHAT_KEEP);
    }
    if (!changed) return;
    const first = !s.chatLoaded;
    const bottom = first || this.atBottom();
    this.setState({ chat, chatLoaded: true, chatErr: '', newCount: bottom ? 0 : s.newCount + fresh.length });
    if (bottom && (fresh.length || first)) this.scrollBottom();
  }

  async send(e) {
    if (e && e.preventDefault) e.preventDefault();
    const text = this.state.text.trim();
    if (!text || this.state.sending) return;
    this.setState({ sending: true, sendErr: '' });
    try {
      await StreAPI.post('chat.send', { text });
      const me = this.state.me;
      const name = (me && me.bot && me.bot.login) || 'Бот';
      const echo = { id: 'l' + (++this.localN), local: true, login: name, name, text, badges: [], deleted: false, at: Math.floor(Date.now() / 1000) };
      this.setState({ sending: false, text: '', chat: this.state.chat.concat([echo]), newCount: 0 });
      this.scrollBottom();
    } catch (err) {
      this.setState({ sending: false, sendErr: err.message });
    }
  }

  async mod(m, action) {
    const who = m.name || m.login;
    if (action === 'ban' && !confirm('Забанить ' + who + ' на канале навсегда? Снять бан можно в журнале модерации.')) return;
    this.setState({ busy: Object.assign({}, this.state.busy, { [m.id]: true }) });
    const body = { action, chatterId: m.chatterId, login: m.login, text: m.text };
    if (action === 'delete') body.msgId = m.msgId;
    if (action === 'timeout') body.duration = 600;
    try {
      await StreAPI.post('chat.mod', body);
      const patch = {};
      if (action === 'delete') {
        patch.chat = this.state.chat.map((x) => (x.id === m.id ? Object.assign({}, x, { deleted: true }) : x));
        StreAPI.toast('Сообщение ' + who + ' удалено');
      } else {
        patch.notes = Object.assign({}, this.state.notes, { [m.id]: action === 'ban' ? 'бан' : 'таймаут 10 мин' });
        StreAPI.toast(action === 'ban' ? who + ' — бан на канале' : who + ' — таймаут на 10 минут');
      }
      this.setState(patch);
      this.loadDash();
    } catch (err) {
      StreAPI.toast(err.message, 'error');
    } finally {
      const busy = Object.assign({}, this.state.busy);
      delete busy[m.id];
      this.setState({ busy });
    }
  }

  // ---------- бот ----------
  async testAlert() {
    if (this.state.testBusy) return;
    this.setState({ testBusy: true });
    try {
      await StreAPI.post('widget.test', { kind: 'follow' });
      StreAPI.toast('Тестовый алерт отправлен. Он появится в виджете «Алерты», если тот включён в OBS');
    } catch (e) { StreAPI.toast(e.message, 'error'); }
    this.setState({ testBusy: false });
  }
  async enableBot() {
    if (this.state.botBusy) return;
    this.setState({ botBusy: true, botErrors: [] });
    let errors = [];
    try {
      const r = await StreAPI.post('bot.enable', {});
      errors = r.errors || [];
      if (!errors.length) StreAPI.toast('Бот подключён к каналу');
    } catch (err) {
      errors = [err.message];
    }
    let me = this.state.me;
    try { const m = await StreAPI.refreshMe(); if (m && m.user) me = m; } catch (e) { /* оставим прежние данные */ }
    this.setState({ botBusy: false, botErrors: errors, me });
  }

  bannerView() {

    const base = { show: true, errs: errs.map((t) => ({ text: t })), hasErrs: errs.length > 0, errTitle: 'Что ответил сервер:', hasBtn: true, btnOff: s.botBusy };

        hasNote: !ready, note: 'Администратор StreOps ещё не подключил аккаунт бота. Пока его нет, бот не станет модератором канала и не будет отвечать на команды. Кнопка включится, когда администратор подключит бота.',

        hasNote: errs.length > 0, note: errs.length ? 'Ответ сервера: ' + errs.join('; ') : '',

      });

  // ---------- представления ----------
  chartView(d) {
    const W = 800, H = 220, N = 18;
    const b = d && d.chart && d.chart.buckets && d.chart.buckets.length === N ? d.chart.buckets : null;
    const from = d ? d.chart.from : 0;
    const max = b ? Math.max(0, ...b.map((x) => x.m)) : 0;
    const top = niceTop(max);
    const X = (i) => (i + 0.5) / N * W;
    const Y = (v) => H - Math.min(v, top) / top * H;
    const line = (k) => b.map((x, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x[k]).toFixed(1)).join(' ');
    const range = (i) => StreAPI.fmtTime(from + i * 600) + '–' + (i === N - 1 ? 'сейчас' : StreAPI.fmtTime(from + (i + 1) * 600));
    const h = b && this.state.hover >= 0 ? Math.min(this.state.hover, N - 1) : -1;
    const sumM = b ? b.reduce((a, x) => a + x.m, 0) : 0;
    const sumC = b ? b.reduce((a, x) => a + x.c, 0) : 0;
    const v = {
      ticks: [top, top * 3 / 4, top / 2, top / 4, 0].map((t) => ({ v: StreAPI.fmtNum(t) })),
      area: b ? line('m') + ' L' + X(N - 1).toFixed(1) + ' ' + H + ' L' + X(0).toFixed(1) + ' ' + H + 'Z' : 'M0 220',
      mPath: b ? line('m') : 'M0 220', cPath: b ? line('c') : 'M0 220',
      hasNote: !b || max === 0,
      note: !d ? (this.state.dashErr ? 'Не удалось загрузить: ' + this.state.dashErr : 'Загрузка…') : 'За последние 3 часа в чате не было сообщений. График оживёт, как только зрители начнут писать.',
      xs: [0, 1, 2, 3, 4, 5, 6].map((k) => ({ cls: k % 2 ? 'xo' : '', t: !d ? '' : k === 6 ? 'сейчас' : StreAPI.fmtTime(from + k * 1800) })),
      hits: b ? b.map((x, i) => ({ enter: () => { if (this.state.hover !== i) this.setState({ hover: i }); } })) : [],
      rows: b ? b.map((x, i) => ({ t: range(i), m: x.m, c: x.c })) : [],
      label: b ? 'График активности чата за 3 часа: ' + sumM + ' ' + plural(sumM, 'сообщение', 'сообщения', 'сообщений') + ', из них ' + sumC + ' ' + plural(sumC, 'команда', 'команды', 'команд') + '. Стрелки влево и вправо показывают значения по 10 минут.' : 'График активности чата загружается',
      key: (e) => {
        if (!b) return;
        const cur = this.state.hover < 0 ? N - 1 : this.state.hover;
        let n = cur;
        if (e.key === 'ArrowLeft') n = Math.max(0, cur - 1);
        else if (e.key === 'ArrowRight') n = Math.min(N - 1, cur + 1);
        else if (e.key === 'Home') n = 0;
        else if (e.key === 'End') n = N - 1;
        else if (e.key === 'Escape') n = -1;
        else return;
        e.preventDefault();
        this.setState({ hover: n });
      },
      focus: () => { if (b && this.state.hover < 0) this.setState({ hover: N - 1 }); },

      hasHover: h >= 0,

    if (h >= 0) {
      const pct = X(h) / W * 100;
      const my = Y(b[h].m);
      v.hx = pct.toFixed(2) + '%';
      v.hmy = my.toFixed(1) + 'px';
      v.hcy = Y(b[h].c).toFixed(1) + 'px';
      const ty = Math.max(0, Math.min(my - 24, H - 84));
      v.tipPos = (h < 11 ? 'left: calc(' + pct.toFixed(2) + '% + 14px)' : 'right: calc(' + (100 - pct).toFixed(2) + '% + 14px)') + '; top: ' + ty.toFixed(0) + 'px';
      v.tipTime = range(h);
      v.tipM = StreAPI.fmtNum(b[h].m);
      v.tipC = StreAPI.fmtNum(b[h].c);
    }
    return v;
  }

  eventView(e) {
    const d = e.data || {};
    const name = e.name || e.login || 'Аноним';
    let title = e.type, sub = '', icon = ICONS.star;

      case 'sub':
        title = 'новая подписка';
        sub = [tierLabel(d.tier), d.months > 1 ? 'сразу на ' + d.months + ' мес.' : ''].filter(Boolean).join(' · ');
        break;
      case 'resub':
        title = 'продление подписки';
        sub = [tierLabel(d.tier), d.months ? 'всего ' + d.months + ' ' + plural(d.months, 'месяц', 'месяца', 'месяцев') : ''].filter(Boolean).join(' · ');
        break;
      case 'gift':
        icon = ICONS.gift;
        title = d.total > 1 ? 'подарочные подписки' : 'подарочная подписка';

    return { name, title, sub, hasSub: !!sub, d: icon, time: when(e.at) };
  }

  actionView(a) {
    const me = this.state.me;
    const myLogin = me && me.user ? String(me.user.login).toLowerCase() : '';
    const L = { delete: ['сообщение удалено', ICONS.del, ''], warn: ['предупреждение', ICONS.warn, ''], timeout: ['таймаут', ICONS.timeout, 'border-style: dashed'],
      ban: ['бан', ICONS.ban, 'border: 2px solid var(--n-12)'], review: ['сообщение на проверке', ICONS.review, 'border-style: dashed'], unban: ['ограничение снято', ICONS.unban, ''] };
    const t = L[a.action] || [a.action, ICONS.warn, ''];
    const by = a.by === 'Бот' ? 'автомодерация' : String(a.by || '').toLowerCase() === myLogin ? '' : 'модератор ' + a.by;
    const parts = [by, a.reason, a.strikes ? 'нарушение ' + a.strikes : '', a.undone ? 'отменено' : ''].filter(Boolean);
    return {
      name: a.login || 'зритель', title: t[0] + (a.action === 'timeout' && a.duration ? ' на ' + humanDur(a.duration) : ''),
      sub: parts.join(' · ') || 'вручную', d: t[1], ring: t[2], time: when(a.at),
    };
  }

  msgView(m) {
    const s = this.state;
    const me = s.me;
    const myLogin = me && me.user ? String(me.user.login).toLowerCase() : '';
    const bot = this.botLogin();
    const login = String(m.login || '').toLowerCase();
    const isBot = !!m.local || (!!bot && login === bot);
    const badges = m.badges || [];
    const role = ROLES.find((r) => badges.indexOf(r[0]) >= 0) || (login && login === myLogin ? ROLES[0] : null);
    const isOwner = login === myLogin || badges.indexOf('broadcaster') >= 0;
    const name = m.name || m.login;
    const tags = [];
    if (m.local) tags.push('отправлено');
    if (m.deleted) tags.push('удалено');
    if (s.notes[m.id]) tags.push(s.notes[m.id]);
    const busy = !!s.busy[m.id];
    return {
      time: StreAPI.fmtTime(m.at), name, text: m.text,
      hasRole: !!role, roleTitle: role ? role[1] : '', roleD: role ? ICONS[role[2]] : '',
      nameColor: isBot ? 'var(--n-9)' : 'var(--n-11)',
      textStyle: m.deleted ? 'color: var(--n-8); text-decoration: line-through' : isBot ? 'color: var(--n-11)' : 'color: var(--n-12)',
      rowStyle: isBot ? 'background: rgb(var(--n-13-rgb) / 0.04)' : '',
      hasTag: tags.length > 0, tag: tags.join(' · '),
      sel: s.sel === m.id,
      select: () => { if (s.sel !== m.id) this.setState({ sel: m.id }); },
      canMod: !isBot && !isOwner && !!m.chatterId,
      canDelete: !m.deleted && !!m.msgId,
      busy,
      replyLabel: 'Ответить ' + name, delLabel: 'Удалить сообщение ' + name, toLabel: 'Таймаут 10 минут для ' + name, banLabel: 'Забанить ' + name,
      reply: () => {
        this.setState({ text: '@' + name + ' ' });
        requestAnimationFrame(() => { const el = document.getElementById('chat-in'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } });
      },
      del: () => this.mod(m, 'delete'),
      timeout: () => this.mod(m, 'timeout'),
      ban: () => this.mod(m, 'ban'),
    };
  }

  renderVals() {
    const s = this.state;
    const d = s.dash;
    const me = s.me;
    const st = d ? d.stream : null;
    const live = !!(st && st.live);
    const period = live ? 'за этот эфир' : 'за последние 24 часа';

    let sync = 'автообновление каждые 15 с';
    if (s.dashErr) sync = 'нет связи' + (this.lastOk ? ' · данные на ' + new Date(this.lastOk).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '');
    const info = !d ? '' : live
      ? ['с ' + StreAPI.fmtTime(st.startedAt), st.title ? '«' + st.title + '»' : '', st.game].filter(Boolean).join(' · ')
      : 'цифры ниже — за последние 24 часа';
    const head = { state: !d ? (s.dashErr ? 'Не удалось загрузить' : 'Загрузка…') : live ? 'В эфире' : 'Не в эфире', info, dot: live ? 'var(--accent)' : 'var(--n-8)', sync };

    const mt = d ? d.metrics : null;
    const val = (k) => (mt ? StreAPI.fmtNum(mt[k]) : '—');
    const metrics = [
      { label: 'Сообщений в чате', value: val('messages'), caption: period },
      { label: 'Зрителей в чате', value: val('chatters'), caption: 'писали в чат ' + period },
      { label: 'Новых фолловеров', value: val('follows'), caption: period },
      { label: 'Удалено и наказано', value: val('deleted'), caption: period, title: 'Удаления, предупреждения, таймауты и баны' },
    ];

    const events = d ? d.events.map((e) => this.eventView(e)) : [];
    const daHint = me && me.user && !me.user.daConnected ? ' Донаты появятся после подключения DonationAlerts в настройках.' : '';
    const actions = d ? d.actions.map((a) => this.actionView(a)) : [];
    const cmds = d ? d.topCommands.map((c) => {
      const n = c.prefix + c.name;
      const uses = c.uses ? 'вызвана ' + StreAPI.fmtNum(c.uses) + ' ' + plural(c.uses, 'раз', 'раза', 'раз') : 'ещё не вызывали';
      return { name: n, uses: uses + (c.enabled ? '' : ' · выключена'), color: c.enabled ? 'var(--n-12)' : 'var(--n-9)', aria: n + ', ' + uses + '. Открыть команды' };
    }) : [];

    // чат
    const msgs = s.chat.map((m) => this.msgView(m));
    const botOn = !!(me && me.user && me.user.botEnabled);
    const ready = !!(me && me.bot && me.bot.ready);
    let note = '';
    if (!s.chatLoaded) note = 'Загрузка чата…';
    else if (s.chatErr) note = 'Не удалось загрузить чат: ' + s.chatErr;
    else if (!msgs.length) note = !botOn ? 'Сообщения появятся здесь, когда бот будет подключён к каналу.' : !ready ? 'Сообщения появятся здесь, когда администратор подключит аккаунт бота.' : 'Сообщений пока нет. Как только кто-нибудь напишет в чат, сообщение появится здесь.';
    const lastB = d && d.chart && d.chart.buckets.length ? d.chart.buckets[d.chart.buckets.length - 1].m : null;
    const rate = lastB == null ? '—' : String(Math.round(lastB) / 10).replace('.', ',');
    const cantSend = s.sending || !s.text.trim();

    const tops = d && d.topChatters ? d.topChatters : [];
    const maxTop = tops.length ? tops[0].count : 1;
    const topChatters = tops.map((t) => ({ name: t.name, count: StreAPI.fmtNum(t.count), pct: Math.max(4, Math.round(t.count / maxTop * 100)) + '%' }));
    const hc = d && d.hourly ? d.hourly.counts : new Array(24).fill(0);
    const hFrom = d && d.hourly ? d.hourly.from : 0;
    const maxH = Math.max(1, ...hc);
    const hTime = (i) => new Date((hFrom + i * 3600) * 1000).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    const hours = hc.map((n, i) => ({ title: hTime(i) + ' · ' + n + ' ' + plural(n, 'сообщение', 'сообщения', 'сообщений'), height: n ? Math.max(4, Math.round(n / maxH * 100)) + '%' : '2px' }));
    const hourlyTotal = hc.reduce((a, b) => a + b, 0);
    const TYPE_RU = { follow: 'Фолловы', subscribe: 'Подписки', gift: 'Подарки', raid: 'Рейды', donation: 'Донаты', redemption: 'Награды баллами', tts: 'Озвучка', cheer: 'Биты', video: 'Видео', embedded: 'Встройки' };
    const MOD_RU = { delete: 'Удалено', warn: 'Предупреждения', timeout: 'Таймауты', ban: 'Баны', unban: 'Разбаны' };
    const pctOf = (v, max) => Math.max(4, Math.round(v / Math.max(1, max) * 100)) + '%';
    const etRaw = d && d.eventsByType ? d.eventsByType : [];
    const etMax = Math.max(1, ...etRaw.map((x) => x.c));
    const evTypes = etRaw.map((x) => ({ label: TYPE_RU[x.type] || x.type, count: StreAPI.fmtNum(x.c), pct: pctOf(x.c, etMax) }));
    const subsCount = etRaw.filter((x) => x.type === 'subscribe' || x.type === 'gift').reduce((a, x) => a + x.c, 0);
    const mrRaw = d && d.modByType ? d.modByType : [];
    const mrMax = Math.max(1, ...mrRaw.map((x) => x.c));
    const modTypes = mrRaw.map((x) => ({ label: MOD_RU[x.action] || x.action, count: StreAPI.fmtNum(x.c), pct: pctOf(x.c, mrMax) }));
    const delta = (cur, prev) => {
      if (cur == null || prev == null) return '';
      if (!prev && !cur) return 'как вчера';
      if (!prev) return 'новое за сутки';
      const r = Math.round((cur - prev) / prev * 100);
      return (r > 0 ? '▲ +' : r < 0 ? '▼ ' : '● ') + r + '% к прошлым суткам';
    };
    const ser = d && d.viewers ? d.viewers : [];
    const W = 600, H = 160, nowTs = Math.floor(Date.now() / 1000), t0 = nowTs - 3 * 3600;
    const vmax = Math.max(1, ...ser.map((x) => x.v));
    const pts = ser.map((x) => [((x.ts - t0) / (3 * 3600)) * W, H - (x.v / vmax) * (H - 8) - 4]);
    const vPath = pts.length > 1 ? 'M' + pts.map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L') : '';
    const vArea = pts.length > 1 ? vPath + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + H + ' L' + pts[0][0].toFixed(1) + ' ' + H + ' Z' : '';
    const mt2 = d ? d.metrics : null;
    const pv = d && d.prev ? d.prev : null;
    const mus = d && d.music ? d.music : { played: 0, requests: 0, queue: 0 };
    const durSec = st && st.live ? Math.max(0, nowTs - st.startedAt) : 0;
    const dur = durSec ? Math.floor(durSec / 3600) + ' ч ' + String(Math.floor(durSec % 3600 / 60)).padStart(2, '0') + ' мин' : '';
    const kpis = [
      { label: 'Зрители сейчас', value: st && st.live ? StreAPI.fmtNum(st.viewers) : '—', sub: st && st.live ? 'пик за эфир: ' + StreAPI.fmtNum(st.peak) : 'стрим не идёт', hint: '' },
      { label: 'Сообщений в чате', value: mt2 ? StreAPI.fmtNum(mt2.messages) : '—', sub: 'за 24 часа', hint: pv && mt2 ? delta(mt2.messages, pv.messages) : '' },
      { label: 'Писали в чат', value: mt2 ? StreAPI.fmtNum(mt2.chatters) : '—', sub: 'уникальных зрителей', hint: '' },
      { label: 'Новых фолловеров', value: mt2 ? StreAPI.fmtNum(mt2.follows) : '—', sub: 'за 24 часа', hint: pv && mt2 ? delta(mt2.follows, pv.follows) : '' },
      { label: 'Подписки и подарки', value: d ? StreAPI.fmtNum(subsCount) : '—', sub: 'за 24 часа', hint: '' },
      { label: 'Удалено и наказано', value: mt2 ? StreAPI.fmtNum(mt2.deleted) : '—', sub: 'за 24 часа', hint: '' },
    ];
    const musicLine = d ? 'сыграно ' + mus.played + ', заказов ' + mus.requests + ' · в очереди ' + mus.queue : '';
    const vNote = !d ? 'Загрузка…' : ser.length < 2 ? (st && st.live ? 'Собираем историю зрителей, график появится через пару минут.' : 'Стрим не идёт. График зрителей появится, когда начнётся эфир.') : '';
    const meU = me && me.user ? me.user : null;
    const stepBotOn = !!(meU && meU.botEnabled);
    const stepBotReady = !!(me && me.bot && me.bot.ready);
    const cmdN = d && d.topCommands ? d.topCommands.length : 0;
    const DONE = 'background: #5CD65C; border-color: #5CD65C; color: var(--n-1)';
    const stepList = [
      { title: 'Аккаунт Twitch', hint: 'Вход выполнен', done: true, mark: '✓', hasAction: false, actLabel: '', act: () => {}, actOff: false },
      { title: 'Тест алерта в OBS', hint: 'Проиграть тестовый алерт: он появится в виджете «Алерты», если тот добавлен в OBS', done: false, mark: '2', hasAction: true, actLabel: s.testBusy ? 'Отправляем…' : 'Проиграть', act: () => this.testAlert(), actOff: !!s.testBusy },
      { title: 'Бот в канале', hint: stepBotOn ? 'Бот отвечает на команды в чате' : stepBotReady ? 'Бот станет модератором канала и начнёт отвечать на команды' : 'Ждём, пока администратор подключит аккаунт бота', done: stepBotOn, mark: stepBotOn ? '✓' : '3', hasAction: !stepBotOn && stepBotReady, actLabel: s.botBusy ? 'Подключаем…' : 'Подключить', act: () => this.enableBot(), actOff: !!s.botBusy },
      { title: 'Первая команда', hint: cmdN ? 'Команд создано: ' + cmdN : 'Команды отвечают зрителям, например !аптайм', done: cmdN > 0, mark: cmdN ? '✓' : '4', hasAction: cmdN === 0, actLabel: 'Создать', act: () => { location.href = 'commands.html'; }, actOff: false },
    ].map((x) => Object.assign(x, { dotStyle: x.done ? DONE : '' }));
    const steps = stepList.map((x) => ({ title: x.title, hint: x.hint, mark: x.mark, dotStyle: x.dotStyle, hasAction: x.hasAction, actLabel: x.actLabel, act: x.act, actOff: x.actOff }));
    const stepsDone = stepList.filter((x) => x.done).length;
    const showSteps = !!me && !(stepBotOn && cmdN > 0);
    return {
      head,
      steps, stepsDone, showSteps, testBusy: !!s.testBusy,
      kpis, musicLine, dur, liveNow: !!(st && st.live), streamTitle: st && st.live ? (st.title || 'Без названия') : '', streamGame: st && st.live ? (st.game || 'Без категории') : '',
      vPath, vArea, vNote, vEmpty: !!vNote, vMax: StreAPI.fmtNum(vmax), vW: W, vH: H,
      evTypes, evTypesEmpty: !!d && !evTypes.length,
      modTypes, modTypesEmpty: !!d && !modTypes.length,
      subsCount: StreAPI.fmtNum(subsCount),
      topChatters, tcEmpty: !!d && !topChatters.length,
      hours, hourFirst: d && d.hourly ? hTime(0) : '',
      hourlyLabel: 'Сообщений за сутки: ' + StreAPI.fmtNum(hourlyTotal),
      banner: this.bannerView(),
      enableBot: () => this.enableBot(),
      botBusy: s.botBusy,
      metrics,
      chart: this.chartView(d),
      events, evLoading: !d, evEmpty: !!d && !events.length,
      evEmptyText: 'Событий пока нет. Здесь появятся фолловы, подписки, подарки, рейды и донаты — пока бот подключён к каналу.' + daHint,
      actions, acLoading: !d, acEmpty: !!d && !actions.length,
      cmds, cmdLoading: !d, cmdEmpty: !!d && !cmds.length,
      rate,
      chatHint: { show: !!me && botOn && !ready, text: 'Чтение чата ещё не настроено администратором. Отправить сообщение от имени бота можно уже сейчас.' },
      chatNote: { show: !!note, text: note },
      msgs,
      onLogScroll: () => { if (s.newCount && this.atBottom()) this.setState({ newCount: 0 }); },
      hasNew: s.newCount > 0,
      newLabel: s.newCount + ' ' + plural(s.newCount, 'новое', 'новых', 'новых'),
      toBottom: () => { this.setState({ newCount: 0 }); this.scrollBottom(); },
      text: s.text,
      setText: (e) => this.setState({ text: e.target.value, sendErr: '' }),
      send: (e) => this.send(e),
      cantSend,
      sendStyle: cantSend ? 'opacity: 0.5; cursor: default' : '',
      sendLabel: s.sending ? 'Отправляем…' : 'Отправить',
      hasSendErr: !!s.sendErr, sendErr: s.sendErr,
    };
  }
}
DCMount(Component);
</script>
</body>
</html>
