<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — музыка и заказы</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ov{font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9);margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--s-2);border:1px solid var(--n-5);border-radius:8px}
.nav-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10)}
.nav-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.tab{height:44px;padding:0;border:0;background:transparent;color:var(--n-9);font:500 14px/20px var(--font-sans),sans-serif;display:flex;gap:6px;align-items:center;cursor:pointer}
.tab:hover{color:var(--n-12)}
.sw{position:relative;width:40px;height:24px;border-radius:999px;border:1px solid var(--n-8);background:transparent;cursor:pointer;flex:none;padding:0}
.sw span{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:var(--n-9);transition:transform 180ms cubic-bezier(.2,0,0,1)}
.sw[aria-checked="true"]{background:var(--n-13);border-color:var(--n-13)}
.sw[aria-checked="true"] span{transform:translateX(16px);background:var(--n-1)}
.ib{width:36px;height:36px;border-radius:6px;border:0;background:transparent;color:var(--n-10);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ib:hover{background:rgb(var(--n-13-rgb) / .06);color:var(--n-12)}
.ib.d:hover{color:var(--accent-text)}
.pb{width:48px;height:48px;border-radius:999px;border:0;background:var(--n-13);color:var(--n-1);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.pb:hover{background:var(--n-11)}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) 110px 170px 52px 80px;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--n-4);font-size:14px;line-height:20px}
.row:hover{background:rgb(var(--n-13-rgb) / .03)}
.src{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;border:1px solid var(--n-6);font-size:12px;color:var(--n-11);white-space:nowrap}
.how{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--n-10);white-space:nowrap}
.meth{padding:18px;border-radius:8px;border:1px solid var(--n-5);background:var(--s-2);display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;line-height:18px;padding:8px 0;border-top:1px solid var(--n-4)}
.kv span:first-child{color:var(--n-9)}
.chk{display:flex;align-items:center;gap:12px;min-height:40px;font-size:14px;color:var(--n-11)}
.box{width:18px;height:18px;border-radius:4px;border:1px solid var(--n-8);box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;flex:none}
.box.on{background:var(--n-13);border-color:var(--n-13);color:var(--n-1)}
.bot{display:flex;gap:8px;font-size:13px;line-height:19px;padding:6px 0}
@media (max-width: 760px){.row{grid-template-columns:24px minmax(0,1fr) 80px}.row .hide{display:none}}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px; flex-wrap: wrap">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<div style="display: flex; align-items: center; gap: 8px">
<div role="status" aria-label="В эфире 2 часа 47 минут, 1284 зрителя" style="display: flex; align-items: center; height: 40px; border: 1px solid var(--n-5); border-radius: 6px">
<span style="display: inline-flex; align-items: center; gap: 8px; height: 100%; padding: 0 12px; border-right: 1px solid var(--n-5)"><span style="width: 8px; height: 8px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 4px rgb(var(--accent-rgb) / 0.25)"></span><span style="font-size: 11px; font-weight: 700; letter-spacing: .08em">В ЭФИРЕ</span></span>
<span class="mono" style="padding: 0 12px; border-right: 1px solid var(--n-5); font-size: 15px">02:47:13</span><span class="mono" style="padding: 0 12px; font-size: 15px">1 284</span>
</div>
<a href="settings.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; font-size: 14px; font-weight: 500"><span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, var(--n-10), var(--n-6)); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--n-1)">КС</span>kira_stream</a>
</div>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" class="sb">
<p class="sb-h">Эфир</p>
<a href="panel.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Обзор</a>
<a href="moderation.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<p class="sb-h">Бот</p>
<a href="commands.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды<span class="sb-n">24</span></a>
<a href="music.html" class="sb-i" aria-current="page"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Музыка</a>
<a href="widgets.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<span class="sb-i sb-off" aria-disabled="true"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 13l-7.5 7.5a2.1 2.1 0 0 1-3-3L11 10M16 16l6-6M8 8l6-6M9 7l8 8M21 11l-8-8"/></svg>Аукционы<span class="sb-tag">скоро</span></span>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
</nav>

<main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div><h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Музыка и заказы</h1><p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: var(--n-10); max-width: 640px">Зрители присылают ссылку или название трека командой в чате, за баллы канала или с донатом. Трек проверяется и встаёт в очередь.</p></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-radius: 8px; border: 1px solid var(--n-6)"><span style="font-size: 14px">Приём заказов</span><span style="font-size: 13px; color: var(--n-9); min-width: 64px">{{ openLabel }}</span><button type="button" role="switch" class="sw" aria-checked="{{ open }}" aria-label="Приём заказов" onClick="{{ toggleOpen }}"><span></span></button></div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px">
<section aria-label="Сейчас играет" style="flex: 2 1 560px; min-width: 0; padding: 24px; border-radius: 12px; background: rgb(var(--n-2-rgb) / 0.62); border: 1px solid rgb(var(--n-13-rgb) / 0.10); box-shadow: inset 0 1px 0 rgb(var(--n-13-rgb) / 0.08); display: flex; gap: 24px; align-items: center; flex-wrap: wrap">
<div aria-hidden="true" style="width: 120px; height: 120px; flex: none; border-radius: 8px; background: radial-gradient(60px 60px at 30% 30%, var(--n-9), transparent 70%), var(--n-4); display: flex; align-items: flex-end; gap: 4px; padding: 14px; box-sizing: border-box">
<span style="flex: 1; height: 40%; background: var(--n-12)"></span><span style="flex: 1; height: 75%; background: var(--n-12)"></span><span style="flex: 1; height: 55%; background: var(--n-12)"></span><span style="flex: 1; height: 90%; background: var(--n-12)"></span><span style="flex: 1; height: 35%; background: var(--n-12)"></span>
</div>
<div style="flex: 1 1 280px; min-width: 0">
<p class="ov">Сейчас играет</p>
<p style="margin: 8px 0 0; font-size: 24px; line-height: 30px; font-weight: 600; letter-spacing: -0.015em">{{ now.t }}</p>
<p style="margin: 2px 0 0; font-size: 15px; color: var(--n-10)">{{ now.a }}</p>
<p style="margin: 8px 0 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--n-9)"><span class="src">{{ now.src }}</span>заказал <b style="color: var(--n-11); font-weight: 500">{{ now.by }}</b> · {{ now.how }}</p>
<div style="margin-top: 16px; display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 10px; align-items: center"><span class="mono" style="font-size: 12px; color: var(--n-10)">1:12</span><div role="progressbar" aria-label="Прогресс трека" aria-valuenow="34" aria-valuemin="0" aria-valuemax="100" style="height: 4px; border-radius: 2px; background: var(--n-6)"><div style="width: 34%; height: 100%; border-radius: 2px; background: var(--n-12)"></div></div><span class="mono" style="font-size: 12px; color: var(--n-10)">{{ now.d }}</span></div>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" class="pb" aria-label="{{ playLabel }}" onClick="{{ togglePlay }}"><template data-if="playing"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1" fill="#0A0A0A" data-fill="1"></rect><rect x="14" y="4" width="4" height="16" rx="1" fill="#0A0A0A" data-fill="1"></rect></svg></template><template data-if="paused"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="#0A0A0A" data-fill="1"></path></svg></template></button>
<button type="button" class="ib" style="width: 44px; height: 44px; border: 1px solid var(--n-6)" aria-label="Пропустить трек" onClick="{{ skip }}"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l10 8-10 8z"></path><path d="M19 5v14"></path></svg></button>
<label style="display: flex; align-items: center; gap: 8px; margin-left: 8px; color: var(--n-9)"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Громкость</span><input type="range" min="0" max="100" value="{{ vol }}" onChange="{{ setVol }}" style="width: 96px; accent-color: var(--n-12)"><span class="mono" style="font-size: 12px; width: 28px">{{ vol }}</span></label>
</div>
</section>
<section class="card" aria-label="Сводка за стрим" style="flex: 1 1 280px; box-sizing: border-box; padding: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div><p style="margin: 0; font-size: 13px; color: var(--n-9)">Заказов за стрим</p><p class="mono" style="margin: 6px 0 0; font-size: 24px; font-weight: 500">38</p></div>
<div><p style="margin: 0; font-size: 13px; color: var(--n-9)">Отклонено</p><p class="mono" style="margin: 6px 0 0; font-size: 24px; font-weight: 500">5</p></div>
<div><p style="margin: 0; font-size: 13px; color: var(--n-9)">В очереди</p><p class="mono" style="margin: 6px 0 0; font-size: 24px; font-weight: 500">{{ qCount }}</p></div>
<div><p style="margin: 0; font-size: 13px; color: var(--n-9)">Длительность очереди</p><p class="mono" style="margin: 6px 0 0; font-size: 24px; font-weight: 500">{{ qTime }}</p></div>
</section>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section style="flex: 999 1 560px; min-width: 0" aria-label="Очередь заказов">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--n-5)">
<div role="tablist" aria-label="Заказы" style="display: flex; gap: 24px">
<template data-for="tabs" data-as="t"><button role="tab" type="button" class="tab" aria-selected="{{ t.sel }}" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}<span class="mono" style="font-size: 12px; color: var(--n-9)">{{ t.n }}</span></button></template>
</div>
<a href="#" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; margin-bottom: 4px; border-radius: 6px; border: 1px solid var(--n-6); font-size: 13px"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="14" rx="2"></rect><path d="M8 22h8M12 18v4"></path></svg>Плеер для OBS</a>
</div>

<template data-if="tabQueue">
<div role="table" aria-label="Очередь" style="margin-top: 8px">
<div role="row" class="row" style="border-top: 0; font-size: 12px; color: var(--n-9)"><span role="columnheader">#</span><span role="columnheader">Трек</span><span role="columnheader" class="hide">Источник</span><span role="columnheader" class="hide">Кто и как</span><span role="columnheader">Время</span><span role="columnheader"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Действия</span></span></div>
<template data-for="queue" data-as="q">
<div role="row" class="row" style="{{ q.rowStyle }}">
<span role="cell" class="mono" style="font-size: 13px; color: var(--n-9)">{{ q.n }}</span>
<span role="cell" style="min-width: 0"><span style="display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ q.t }}</span><span style="display: block; font-size: 13px; color: var(--n-9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ q.a }}</span></span>
<span role="cell" class="hide"><span class="src">{{ q.src }}</span></span>
<span role="cell" class="hide" style="min-width: 0"><span style="display: block; color: var(--n-11); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ q.by }}</span><span class="how">{{ q.how }}</span></span>
<span role="cell" class="mono" style="font-size: 13px">{{ q.d }}</span>
<span role="cell" style="display: flex; justify-content: flex-end"><button type="button" class="ib" aria-label="{{ q.upLabel }}" onClick="{{ q.up }}" disabled="{{ q.first }}"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button><button type="button" class="ib d" aria-label="{{ q.delLabel }}" onClick="{{ q.del }}"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></span>
</div>
</template>
<template data-if="empty"><div style="padding: 48px 16px; text-align: center; border-top: 1px solid var(--n-4)"><p style="margin: 0; font-size: 15px; font-weight: 500">Очередь пуста</p><p style="margin: 6px 0 0; font-size: 13px; color: var(--n-9)">Напомни зрителям: <span class="mono" style="color: var(--n-11)">!музыка ссылка или название</span></p></div></template>
</div>
</template>

<template data-if="tabPending">
<div style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0 0 4px; font-size: 13px; color: var(--n-9)">Включена ручная проверка: трек попадёт в очередь только после одобрения. Если отклонить заказ за баллы, баллы вернутся зрителю.</p>
<template data-for="pending" data-as="p">
<div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 14px 16px; border-radius: 8px; border: 1px dashed var(--n-9); background: repeating-linear-gradient(135deg, rgb(var(--n-13-rgb) / 0.03) 0 1px, transparent 1px 7px)">
<span style="flex: 1 1 240px; min-width: 0"><span style="display: block; font-weight: 500">{{ p.t }}</span><span style="display: block; font-size: 13px; color: var(--n-9)">{{ p.a }} · <span class="mono">{{ p.d }}</span> · {{ p.src }} · {{ p.by }}, {{ p.how }}</span><span style="display: block; margin-top: 4px; font-size: 12px; color: var(--n-11)">{{ p.note }}</span></span>
<span style="display: flex; gap: 8px"><button type="button" onClick="{{ p.reject }}" style="height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--n-6); background: transparent; color: var(--n-12); font: 500 13px/18px var(--font-sans), sans-serif; cursor: pointer">{{ p.rejectLabel }}</button><button type="button" onClick="{{ p.approve }}" style="height: 36px; padding: 0 12px; border-radius: 6px; border: 0; background: var(--n-13); color: var(--n-1); font: 500 13px/18px var(--font-sans), sans-serif; cursor: pointer">В очередь</button></span>
</div>
</template>
<template data-if="noPending"><p style="margin: 24px 0; text-align: center; font-size: 14px; color: var(--n-9)">Новых заказов на проверке нет</p></template>
</div>
</template>

<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      playing: true, vol: 70, open: true, tab: 0, manual: true,
      methods: [true, true, false],
      src: [true, true, true, false, true],
      now: { t: 'Выхода нет', a: 'Сплин', src: 'Яндекс Музыка', by: 'tixiy_bard', how: 'командой', d: '3:31' },
      queue: [
        { id: 1, t: 'Звезда по имени Солнце', a: 'Кино', src: 'YouTube', by: 'moroz_tv', how: '₽ Донат 300 ₽', d: '3:46', s: 226 },
        { id: 2, t: 'Тает лёд', a: 'Грибы', src: 'VK Музыка', by: 'nastya_k', how: '› Команда', d: '3:46', s: 226 },
        { id: 3, t: 'Районы-кварталы', a: 'Звери', src: 'Яндекс Музыка', by: 'gleb_1999', how: '◎ 500 баллов', d: '3:27', s: 207 },
        { id: 4, t: 'Я свободен', a: 'Кипелов', src: 'YouTube', by: 'polyana_live', how: '› Команда', d: '4:43', s: 283 },
        { id: 5, t: 'Владивосток 2000', a: 'Мумий Тролль', src: 'VK Музыка', by: 'sever_ops', how: '◎ 500 баллов', d: '2:38', s: 158 },
        { id: 6, t: 'Группа крови', a: 'Кино', src: 'YouTube', by: 'lenta_ln', how: '› Команда', d: '4:45', s: 285 }
      ],
      pending: [
        { id: 7, t: 'Lithium', a: 'Nirvana', src: 'YouTube', by: 'anon_user', how: 'за баллы', d: '4:17', s: 257, note: 'Первый заказ от этого зрителя', points: true },
        { id: 8, t: 'Опять метель', a: 'Ирина Аллегрова', src: 'Яндекс Музыка', by: 'gleb_1999', how: 'командой', d: '4:05', s: 245, note: 'Уже есть 1 трек в очереди от этого зрителя', points: false }
      ]
    };
  }
  renderVals() {
    const st = this.state;
    const q = st.queue;
    const total = q.reduce((a, x) => a + x.s, 0);
    const mm = Math.floor(total / 60), ss = total % 60;
    const tabsDef = [['Очередь', q.length], ['На проверке', st.pending.length], ['История', 33]];
    const srcDef = [
      ['YouTube', 'Ссылки и поиск по названию'],
      ['Яндекс Музыка', 'Играет через твой аккаунт с подпиской Плюс'],
      ['VK Музыка', 'Через твой аккаунт VK'],
      ['SoundCloud', 'Ссылки на публичные треки'],
      ['Поиск по названию', 'Если прислали текст, а не ссылку']
    ];
    const swapUp = (i) => { const n = q.slice(); const t = n[i - 1]; n[i - 1] = n[i]; n[i] = t; this.setState({ queue: n }); };
    return {
      qCount: q.length,
      qTime: mm + ':' + (ss < 10 ? '0' : '') + ss,
      now: st.now,
      playing: st.playing, paused: !st.playing,
      playLabel: st.playing ? 'Пауза' : 'Продолжить',
      togglePlay: () => this.setState({ playing: !st.playing }),
      skip: () => { if (!q.length) return; const nx = q[0]; this.setState({ now: { t: nx.t, a: nx.a, src: nx.src, by: nx.by, how: nx.how, d: nx.d }, queue: q.slice(1) }); },
      vol: st.vol,
      setVol: (e) => this.setState({ vol: Number(e.target.value) }),
      open: st.open ? 'true' : 'false',
      openLabel: st.open ? 'Открыт' : 'Закрыт',
      toggleOpen: () => this.setState({ open: !st.open }),
      tabs: tabsDef.map((t, i) => ({ label: t[0], n: t[1], sel: st.tab === i ? 'true' : 'false', style: st.tab === i ? 'color: var(--n-12); box-shadow: inset 0 -2px 0 var(--n-12)' : '', pick: () => this.setState({ tab: i }) })),
      tabQueue: st.tab === 0, tabPending: st.tab === 1, tabHistory: st.tab === 2,
      empty: q.length === 0,
      queue: q.map((x, i) => Object.assign({}, x, {
        n: i + 1, first: i === 0,
        rowStyle: x.how.indexOf('Донат') >= 0 ? 'box-shadow: inset 2px 0 0 var(--n-12)' : '',
        upLabel: 'Поднять «' + x.t + '»', delLabel: 'Убрать «' + x.t + '» из очереди',
        up: () => swapUp(i),
        del: () => this.setState({ queue: q.filter((y) => y.id !== x.id) })
      })),
      pending: st.pending.map((p) => Object.assign({}, p, {
        rejectLabel: p.points ? 'Отклонить и вернуть баллы' : 'Отклонить',
        reject: () => this.setState({ pending: st.pending.filter((y) => y.id !== p.id) }),
        approve: () => this.setState({ pending: st.pending.filter((y) => y.id !== p.id), queue: q.concat([{ id: p.id, t: p.t, a: p.a, src: p.src, by: p.by, how: p.points ? '◎ 500 баллов' : '› Команда', d: p.d, s: p.s }]) })
      })),
      noPending: st.pending.length === 0,
      m0: st.methods[0] ? 'true' : 'false', m1: st.methods[1] ? 'true' : 'false', m2: st.methods[2] ? 'true' : 'false',
      t0: () => this.setState({ methods: [!st.methods[0], st.methods[1], st.methods[2]] }),
      t1: () => this.setState({ methods: [st.methods[0], !st.methods[1], st.methods[2]] }),
      t2: () => this.setState({ methods: [st.methods[0], st.methods[1], !st.methods[2]] }),
      sources: srcDef.map((s, i) => ({
        name: s[0], note: s[1], on: st.src[i], sel: st.src[i] ? 'true' : 'false',
        boxCls: st.src[i] ? 'box on' : 'box',
        pick: () => { const n = st.src.slice(); n[i] = !n[i]; this.setState({ src: n }); }
      })),
      manual: st.manual ? 'true' : 'false',
      toggleManual: () => this.setState({ manual: !st.manual })
    };
  }
}
DCMount(Component);
</script>
