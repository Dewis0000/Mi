<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — музыка и заказы</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js?v=460ce522"></script>
<script src="assets/api.js?v=47744cb2"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
:focus-visible{outline:2px solid var(--n-12);outline-offset:2px}
[hidden]{display:none !important}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ov{font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9);margin:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--s-2);border:1px solid var(--n-5);border-radius:8px}
.tab{height:44px;padding:0;border:0;background:transparent;color:var(--n-9);font:500 14px/20px var(--font-sans),sans-serif;display:flex;gap:6px;align-items:center;cursor:pointer}
.tab:hover{color:var(--n-12)}
.sw{position:relative;width:40px;height:24px;border-radius:999px;border:1px solid var(--n-8);background:transparent;cursor:pointer;flex:none;padding:0}
.sw span{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:var(--n-9);transition:transform 180ms cubic-bezier(.2,0,0,1)}
.sw[aria-checked="true"]{background:var(--n-13);border-color:var(--n-13)}
.sw[aria-checked="true"] span{transform:translateX(16px);background:var(--n-1)}
.sw:disabled{opacity:.45;cursor:not-allowed}
.ib{width:36px;height:36px;border-radius:6px;border:0;background:transparent;color:var(--n-10);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ib:hover{background:rgb(var(--n-13-rgb) / .06);color:var(--n-12)}
.ib:disabled{opacity:.35;cursor:default;background:transparent;color:var(--n-10)}
.ib.d:hover{color:var(--accent-text)}
.pb{width:48px;height:48px;border-radius:999px;border:0;background:var(--n-13);color:var(--n-1);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.pb:hover{background:var(--n-11)}
.pb:disabled{opacity:.45;cursor:default}
.btn{height:40px;padding:0 16px;border-radius:6px;border:0;background:var(--n-13);color:var(--n-1);font:500 14px/20px var(--font-sans),sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;text-decoration:none;box-sizing:border-box}
.btn:hover{background:var(--n-11);color:var(--n-1)}
.btn:disabled{opacity:.5;cursor:default}
.btn2{height:40px;padding:0 14px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);font:500 14px/20px var(--font-sans),sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn2:hover{border-color:var(--n-9);background:rgb(var(--n-13-rgb) / .04)}
.btn2:disabled{opacity:.5;cursor:default}
.btn2.sm,.btn.sm{height:36px;font-size:13px;padding:0 12px}
.danger{color:var(--accent-text)}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) 190px 52px 80px;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--n-4);font-size:14px;line-height:20px}
.row:hover{background:rgb(var(--n-13-rgb) / .03)}
.hrow{display:grid;grid-template-columns:56px minmax(0,1fr) 170px 130px;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--n-4);font-size:14px;line-height:20px}
.src{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;border:1px solid var(--n-6);font-size:12px;color:var(--n-11);white-space:nowrap}
.how{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--n-10);white-space:nowrap}
.ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-l{font-size:13px;color:var(--n-9)}
.sub-l a{color:var(--n-9);text-decoration:underline;text-decoration-color:var(--n-6);text-underline-offset:3px}
.sub-l a:hover{color:var(--n-12)}
.mob{display:none}
.meth{padding:18px;border-radius:8px;border:1px solid var(--n-5);background:var(--s-2);display:flex;flex-direction:column;gap:12px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mt{display:inline-flex;gap:10px;align-items:center;font-weight:500}
.mp{margin:0;font-size:13px;line-height:18px;color:var(--n-10)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;line-height:18px;padding-top:12px;border-top:1px solid var(--n-4)}
.kv > label,.kv > span:first-child{color:var(--n-10)}
.fl{display:flex;flex-direction:column;gap:8px}
.fl > label,.lab{font-size:13px;line-height:18px;font-weight:500;color:var(--n-11)}
.inp{height:40px;box-sizing:border-box;padding:0 12px;border-radius:6px;background:var(--s-3);border:1px solid var(--n-8);color:var(--n-12);font:400 15px/22px var(--font-sans),sans-serif;width:100%}
.inp:hover{border-color:var(--n-9)}
.inp.sm{height:36px;font-size:14px;width:120px;text-align:right}
.unit{display:inline-flex;align-items:center;gap:8px;color:var(--n-9);font-size:13px}
.hint{font-size:12px;line-height:16px;color:var(--n-9);margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;border-radius:4px;background:var(--n-4);border:1px solid var(--n-6);font-size:13px}
.chip button{width:20px;height:20px;border:0;border-radius:3px;background:transparent;color:var(--n-9);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.chip button:hover{color:var(--n-12);background:rgb(var(--n-13-rgb) / .08)}
.alert{margin:0;padding:12px 14px;border:2px solid var(--n-12);border-radius:8px;font-size:14px;line-height:20px}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:8px;border:1px dashed var(--n-8);font-size:14px;line-height:20px;color:var(--n-11)}
.note .ic{flex:none;margin-top:2px}
.cover{position:relative;width:120px;height:120px;flex:none;border-radius:8px;overflow:hidden;background-color:var(--n-4);background-size:cover;background-position:center}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:4px;padding:14px;box-sizing:border-box;background:radial-gradient(60px 60px at 30% 30%, var(--n-9), transparent 70%), var(--n-4)}
.bars span{flex:1;background:var(--n-12)}
.cover[data-has] .bars{display:none}
.yt{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 200ms}
.yt iframe{position:absolute;top:0;left:50%;width:214px;height:120px;transform:translateX(-50%);border:0}
.cover[data-here] .yt{opacity:1}
.cover[data-blocked] .yt{pointer-events:auto}
.bar{height:4px;border-radius:2px;background:var(--n-6);overflow:hidden}
.bar div{height:100%;border-radius:2px;background:var(--n-12);transition:width 480ms linear}
.cmdl{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:4px 12px;font-size:13px;line-height:19px;margin:0}
.cmdl dt{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--n-11)}
.cmdl dd{margin:0;color:var(--n-10)}
.ok-l{margin:0;font-size:13px;line-height:18px;color:var(--n-11)}
.savebar{position:sticky;bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:8px;background:rgb(var(--n-1-rgb) / .86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--n-8);box-shadow:0 12px 32px -8px rgba(0,0,0,.6)}
#obs{scroll-margin-top:88px}
@media (max-width: 760px){
.row{grid-template-columns:22px minmax(0,1fr) 40px 76px;gap:8px;padding:10px 4px}.row .hide{display:none}.mob{display:inline}
.hrow{grid-template-columns:44px minmax(0,1fr) 92px;gap:8px;padding:10px 4px}.hrow .hide{display:none}
.cmdl{grid-template-columns:minmax(0,1fr)}.cmdl dd{margin-bottom:6px}
}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px; flex-wrap: wrap">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<div style="display: flex; align-items: center; gap: 8px">
<div role="status" data-dc-keep data-stre-live aria-label="Статус эфира" style="display: flex; align-items: center; height: 40px; border: 1px solid var(--n-5); border-radius: 6px">
<span style="display: inline-flex; align-items: center; gap: 8px; height: 100%; padding: 0 12px; border-right: 1px solid var(--n-5)"><span data-dot style="width: 8px; height: 8px; border-radius: 999px; background: var(--n-8)"></span><span data-label style="font-size: 11px; font-weight: 700; letter-spacing: .08em">НЕ В ЭФИРЕ</span></span>
<span class="mono" data-timer title="Длительность эфира" style="padding: 0 12px; border-right: 1px solid var(--n-5); font-size: 15px">—</span><span class="mono" data-viewers title="Зрителей сейчас" style="padding: 0 12px; font-size: 15px">—</span>
</div>
<a href="settings.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; font-size: 14px; font-weight: 500" aria-label="Профиль" data-dc-keep data-stre-user><span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, var(--n-10), var(--n-6)); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--n-1)" data-av></span><span data-name>Профиль</span></a>
</div>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" class="sb" data-dc-keep>
<p class="sb-h">Эфир</p>
<a href="panel.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Обзор</a>
<a href="moderation.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<p class="sb-h">Бот</p>
<a href="commands.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды</a>
<a href="music.html" class="sb-i" aria-current="page"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Музыка</a>
<a href="widgets.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<span class="sb-i sb-off" aria-disabled="true"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 13l-7.5 7.5a2.1 2.1 0 0 1-3-3L11 10M16 16l6-6M8 8l6-6M9 7l8 8M21 11l-8-8"/></svg>Аукционы<span class="sb-tag">скоро</span></span>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
</nav>

<main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 24px; padding-bottom: 48px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div><h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Музыка и заказы</h1><p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: var(--n-10); max-width: 680px">Зрители заказывают треки командой в чате, за баллы канала или донатом. Бот проверяет заказ и ставит его в очередь, а играет музыка в этой вкладке или в OBS.</p></div>
<div hidden="{{ hideOpen }}" style="display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-radius: 8px; border: 1px solid var(--n-6)"><span style="font-size: 14px" id="open-l">Приём заказов</span><span style="font-size: 13px; color: var(--n-9); min-width: 64px">{{ openLabel }}</span><button type="button" role="switch" class="sw" aria-checked="{{ openOn }}" aria-labelledby="open-l" onClick="{{ toggleOpen }}" disabled="{{ noCfg }}"><span></span></button></div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<template data-if="hasErr"><p role="alert" class="alert">Не получилось загрузить музыку: {{ err }} Попробуем ещё раз через несколько секунд.</p></template>
<template data-if="noYoutube"><div role="alert" class="note"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg><span><b style="font-weight: 600">Не задан ключ YouTube API.</b> Пока его нет, бот не может найти и проверить ни один трек — все заказы будут отклоняться. {{ ytFix }}</span></div></template>
<template data-if="noBot"><div class="note" style="align-items: center; flex-wrap: wrap"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8V4H8"></path><rect x="4" y="8" width="16" height="12" rx="2"></rect><path d="M2 14h2M20 14h2M15 13v2M9 13v2"></path></svg><span style="flex: 1 1 280px">Бот не подключён к чату — заказы командой и за баллы канала не придут. Плеер и ручное добавление работают и без него.</span><button type="button" class="btn2 sm" onClick="{{ enableBot }}" disabled="{{ botBusy }}">{{ botLabel }}</button></div></template>
<template data-if="hasBotErr"><div role="alert" class="note"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg><span>Бот подключён, но Twitch вернул ошибку: {{ botErr }}</span></div></template>
</div>

<div>
<template data-if="notAllowed">
<section aria-labelledby="plan-t" style="padding: 32px; border-radius: 12px; background: rgb(var(--n-2-rgb) / 0.62); border: 1px solid rgb(var(--n-13-rgb) / 0.10); box-shadow: inset 0 1px 0 rgb(var(--n-13-rgb) / 0.08); display: flex; gap: 24px; align-items: center; flex-wrap: wrap">
<div aria-hidden="true" style="width: 96px; height: 96px; flex: none; border-radius: 8px; background: var(--n-4); display: flex; align-items: center; justify-content: center; color: var(--n-9)"><svg class="ic" width="40" height="40" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></div>
<div style="flex: 1 1 320px; min-width: 0">
<h2 id="plan-t" style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600">Музыка доступна на тарифе «Про» и выше</h2>
<p style="margin: 8px 0 0; font-size: 15px; line-height: 22px; color: var(--n-10); max-width: 620px">Сейчас у тебя тариф «{{ planName }}». На «Про» зрители смогут заказывать треки командой в чате, за баллы канала и донатом, а играть они будут прямо в панели или в OBS.</p>
</div>
<a href="settings.html#billing" class="btn">Выбрать тариф</a>
</section>
</template>
</div>

<div hidden="{{ notAllowed }}" style="display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<section aria-label="Сейчас играет" style="flex: 2 1 560px; min-width: 0; box-sizing: border-box; padding: 24px; border-radius: 12px; background: rgb(var(--n-2-rgb) / 0.62); border: 1px solid rgb(var(--n-13-rgb) / 0.10); box-shadow: inset 0 1px 0 rgb(var(--n-13-rgb) / 0.08); display: flex; gap: 24px; align-items: center; flex-wrap: wrap">
<div class="cover" data-has="{{ coverHas }}" data-here="{{ here }}" data-blocked="{{ blocked }}" style="background-image: {{ coverBg }}"><div class="bars" aria-hidden="true"><span style="height: 40%"></span><span style="height: 75%"></span><span style="height: 55%"></span><span style="height: 90%"></span><span style="height: 35%"></span></div><div class="yt" data-dc-keep><div id="yt-player"></div></div></div>
<div style="flex: 1 1 280px; min-width: 0">
<p class="ov">{{ npLabel }}</p>
<p style="margin: 8px 0 0; font-size: 24px; line-height: 30px; font-weight: 600; letter-spacing: -0.015em; overflow-wrap: anywhere">{{ npTitle }}</p>
<p style="margin: 8px 0 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--n-9)"><template data-if="hasCur"><a class="src" href="{{ cur.url }}" target="_blank" rel="noopener" title="Открыть на YouTube">YouTube ↗</a>заказал <b style="color: var(--n-11); font-weight: 500">{{ cur.requester }}</b> · {{ cur.how }}</template><template data-if="noCur"><span>{{ npHint }}</span></template></p>
<div style="margin-top: 16px; min-height: 20px">
<template data-if="showProg"><div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 10px; align-items: center"><span class="mono" style="font-size: 12px; color: var(--n-10)">{{ posText }}</span><div class="bar" role="progressbar" aria-label="Прогресс трека" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ progPct }}" aria-valuetext="{{ progText }}"><div style="width: {{ progPct }}%"></div></div><span class="mono" style="font-size: 12px; color: var(--n-10); text-align: right">{{ lenText }}</span></div></template>
<template data-if="showLen"><p class="mono" style="margin: 0; font-size: 12px; color: var(--n-9)">{{ lenLine }}</p></template>
</div>
<p role="status" style="margin: 10px 0 0; font-size: 13px; line-height: 18px; color: var(--n-10)">{{ hereStatus }}</p>
<template data-if="hasYtErr"><p role="alert" class="alert" style="margin-top: 10px; font-size: 13px; line-height: 18px">{{ ytErr }}</p></template>
</div>
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<template data-if="showStart"><button type="button" class="btn" onClick="{{ startHere }}" disabled="{{ hereLoading }}"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="#0A0A0A" data-fill="1"></path></svg>{{ startLabel }}</button></template>
<template data-if="here"><button type="button" class="pb" aria-label="{{ pauseLabel }}" title="{{ pauseLabel }}" onClick="{{ togglePause }}" disabled="{{ noPlaying }}"><template data-if="showPauseIcon"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1" fill="#0A0A0A" data-fill="1"></rect><rect x="14" y="4" width="4" height="16" rx="1" fill="#0A0A0A" data-fill="1"></rect></svg></template><template data-if="showPlayIcon"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="#0A0A0A" data-fill="1"></path></svg></template></button><button type="button" class="ib" style="width: 44px; height: 44px; border: 1px solid var(--n-6)" aria-label="Выключить плеер в этой вкладке" title="Выключить плеер в этой вкладке" onClick="{{ stopHere }}"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"></rect></svg></button></template>
<button type="button" class="ib" style="width: 44px; height: 44px; border: 1px solid var(--n-6)" aria-label="{{ nextLabel }}" title="{{ nextLabel }}" onClick="{{ next }}" disabled="{{ nextDisabled }}"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l10 8-10 8z"></path><path d="M19 5v14"></path></svg></button>
<label style="display: flex; align-items: center; gap: 8px; margin-left: 8px; color: var(--n-9)" title="Громкость сохраняется и для плеера в OBS"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7"></path></svg><span class="vh">Громкость</span><input type="range" min="0" max="100" step="1" value="{{ vol }}" onChange="{{ setVol }}" disabled="{{ noCfg }}" style="width: 96px; accent-color: var(--n-12)"><span class="mono" style="font-size: 12px; width: 28px; color: var(--n-11)">{{ vol }}</span></label>
</div>
</section>
<section class="card" aria-labelledby="st-t" style="flex: 1 1 280px; box-sizing: border-box; padding: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-content: start">
<h2 id="st-t" class="ov" style="grid-column: 1 / -1">{{ statsTitle }}</h2>
<div><p style="margin: 0; font-size: 13px; color: var(--n-9)">Заказов</p><p class="mono" style="margin: 6px 0 0; font-size: 24px; font-weight: 500">{{ stOrdered }}</p></div>
<div><p style="margin: 0; font-size: 13px; color: var(--n-9)">Отклонено</p><p class="mono" style="margin: 6px 0 0; font-size: 24px; font-weight: 500">{{ stRejected }}</p></div>
<div><p style="margin: 0; font-size: 13px; color: var(--n-9)">В очереди</p><p class="mono" style="margin: 6px 0 0; font-size: 24px; font-weight: 500">{{ qCount }}</p></div>
<div><p style="margin: 0; font-size: 13px; color: var(--n-9)">Длительность очереди</p><p class="mono" style="margin: 6px 0 0; font-size: 24px; font-weight: 500">{{ qTime }}</p></div>
</section>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section style="flex: 999 1 560px; min-width: 0" aria-label="Заказы">
<form onSubmit="{{ addTrack }}" class="card" style="padding: 16px; display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: flex-end">
<div class="fl" style="flex: 1 1 280px; min-width: 0"><label for="addq">Добавить трек вручную</label><input id="addq" class="inp" value="{{ addQ }}" onChange="{{ setAddQ }}" placeholder="Ссылка или название: Кино — Группа крови" autocomplete="off" maxlength="300"></div>
<button type="submit" class="btn" disabled="{{ adding }}">{{ addLabel }}</button>
<p class="hint" style="flex-basis: 100%">Трек встанет в очередь от твоего имени и пройдёт те же проверки, что и заказы зрителей.</p>
<template data-if="hasAddMsg"><p role="status" class="ok-l" style="flex-basis: 100%">{{ addMsg }}</p></template>
<template data-if="hasAddErr"><p role="alert" class="alert" style="flex-basis: 100%; font-size: 13px; line-height: 18px; padding: 10px 12px">{{ addErr }}</p></template>
</form>

<div style="margin-top: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--n-5)">
<div role="tablist" aria-label="Заказы" style="display: flex; gap: 24px">
<template data-for="tabs" data-as="t"><button role="tab" type="button" class="tab" id="{{ t.id }}" aria-selected="{{ t.sel }}" aria-controls="tabpanel" tabindex="{{ t.tabindex }}" onClick="{{ t.pick }}" onKeyDown="{{ t.key }}" style="{{ t.style }}">{{ t.label }}<span class="mono" style="font-size: 12px; color: var(--n-9)">{{ t.n }}</span></button></template>
</div>
<a href="#obs" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; margin-bottom: 4px; border-radius: 6px; border: 1px solid var(--n-6); font-size: 13px"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="14" rx="2"></rect><path d="M8 22h8M12 18v4"></path></svg>Плеер для OBS</a>
</div>

<div id="tabpanel" role="tabpanel" aria-labelledby="{{ tabId }}">
<template data-if="tabQueue">
<div role="table" aria-label="Очередь" style="margin-top: 8px">
<div role="row" class="row" style="border-top: 0; font-size: 12px; color: var(--n-9)"><span role="columnheader">#</span><span role="columnheader">Трек</span><span role="columnheader" class="hide">Кто и как</span><span role="columnheader">Время</span><span role="columnheader"><span class="vh">Действия</span></span></div>
<template data-for="queue" data-as="q">
<div role="row" class="row" style="{{ q.rowStyle }}">
<span role="cell" class="mono" style="font-size: 13px; color: var(--n-9)">{{ q.n }}</span>
<span role="cell" style="min-width: 0"><span class="ell" style="font-weight: 500" title="{{ q.title }}">{{ q.title }}</span><span class="ell sub-l"><a href="{{ q.url }}" target="_blank" rel="noopener">{{ q.short }}</a><span class="mob"> · {{ q.requester }}</span></span></span>
<span role="cell" class="hide" style="min-width: 0"><span class="ell" style="color: var(--n-11)">{{ q.requester }}</span><span class="how">{{ q.how }}</span></span>
<span role="cell" class="mono" style="font-size: 13px">{{ q.len }}</span>
<span role="cell" style="display: flex; justify-content: flex-end"><button type="button" class="ib" aria-label="{{ q.upLabel }}" title="Поднять выше" onClick="{{ q.up }}" disabled="{{ q.upOff }}"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button><button type="button" class="ib d" aria-label="{{ q.delLabel }}" title="Убрать из очереди" onClick="{{ q.del }}" disabled="{{ q.busy }}"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></span>
</div>
</template>
<template data-if="qLoading"><p style="margin: 0; padding: 48px 16px; text-align: center; border-top: 1px solid var(--n-4); font-size: 14px; color: var(--n-9)">Загрузка очереди…</p></template>
<template data-if="qEmpty"><div style="padding: 48px 16px; text-align: center; border-top: 1px solid var(--n-4)"><p style="margin: 0; font-size: 15px; font-weight: 500">Очередь пуста</p><p style="margin: 6px 0 0; font-size: 13px; color: var(--n-9)">{{ emptyHint }}</p></div></template>
<template data-if="qHas"><div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px; border-top: 1px solid var(--n-4)"><span style="font-size: 13px; color: var(--n-9)">{{ qSummary }}</span><button type="button" class="btn2 sm danger" onClick="{{ clear }}" disabled="{{ clearBusy }}"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"></path></svg>Очистить очередь</button></div></template>
</div>
</template>

<template data-if="tabPending">
<div style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0 0 4px; font-size: 13px; line-height: 18px; color: var(--n-9)">{{ pendingNote }}</p>
<template data-for="pending" data-as="p">
<div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 14px 16px; border-radius: 8px; border: 1px dashed var(--n-9); background: repeating-linear-gradient(135deg, rgb(var(--n-13-rgb) / 0.03) 0 1px, transparent 1px 7px)">
<span style="flex: 1 1 240px; min-width: 0"><span style="display: block; font-weight: 500; overflow-wrap: anywhere">{{ p.title }}</span><span class="sub-l" style="display: block"><span class="mono">{{ p.len }}</span> · <a href="{{ p.url }}" target="_blank" rel="noopener">{{ p.short }}</a> · {{ p.requester }}, {{ p.how }}</span><template data-if="p.hasNote"><span style="display: block; margin-top: 4px; font-size: 12px; color: var(--n-11)">{{ p.note }}</span></template></span>
<span style="display: flex; gap: 8px; flex-wrap: wrap"><button type="button" class="btn2 sm" onClick="{{ p.reject }}" disabled="{{ p.busy }}">{{ p.rejectLabel }}</button><button type="button" class="btn sm" onClick="{{ p.approve }}" disabled="{{ p.busy }}">В очередь</button></span>
</div>
</template>
<template data-if="noPending"><p style="margin: 24px 0; text-align: center; font-size: 14px; color: var(--n-9)">Новых заказов на проверке нет</p></template>
</div>
</template>

<template data-if="tabHistory">
<div role="table" aria-label="История" style="margin-top: 8px">
<div role="row" class="hrow" style="border-top: 0; font-size: 12px; color: var(--n-9)"><span role="columnheader">Заказ</span><span role="columnheader">Трек</span><span role="columnheader" class="hide">Кто заказал</span><span role="columnheader">Итог</span></div>
<template data-for="history" data-as="h">
<div role="row" class="hrow"><span role="cell" class="mono" style="font-size: 12px; color: var(--n-9)">{{ h.time }}</span><span role="cell" style="min-width: 0"><a class="ell" href="{{ h.url }}" target="_blank" rel="noopener" title="{{ h.title }}">{{ h.title }}</a></span><span role="cell" class="hide ell" style="font-size: 13px; color: var(--n-10)">{{ h.requester }}</span><span role="cell" style="font-size: 13px; color: {{ h.color }}">{{ h.result }}</span></div>
</template>
<template data-if="noHistory"><p style="margin: 0; padding: 40px 16px; text-align: center; border-top: 1px solid var(--n-4); font-size: 14px; color: var(--n-9)">История пока пуста. Здесь появятся сыгранные, убранные и отклонённые треки.</p></template>
</div>
</template>
</div>

<section class="card" aria-labelledby="bot-t" style="margin-top: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<h2 id="bot-t" style="margin: 0; font-size: 17px; font-weight: 600">Что можно заказать</h2>
<ul style="margin: 0; padding: 0 0 0 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 20px; color: var(--n-11)">
<li><b style="font-weight: 500">Ссылку на YouTube или YouTube Music</b> — трек встанет в очередь как есть.</li>
<li><b style="font-weight: 500">Название трека</b> — бот возьмёт первое подходящее видео из поиска YouTube. {{ searchState }}</li>
<li><b style="font-weight: 500">Ссылку на Яндекс Музыку, Spotify, VK, SoundCloud, Apple Music, Deezer или Звук</b> — бот прочитает со страницы название трека и найдёт его на YouTube. Тоже работает только с поиском по названию; версия на YouTube может отличаться от оригинала.</li>
<li style="color: var(--n-10)">Играет всегда YouTube. Не примем прямые трансляции, видео с запретом на встраивание, треки длиннее лимита и со стоп-словами в названии.</li>
</ul>
<div style="padding-top: 16px; border-top: 1px solid var(--n-4)">
<h3 class="ov" style="margin-bottom: 10px">Команды в чате</h3>
<dl class="cmdl">
<dt>{{ cmdUsage }}</dt><dd>{{ cmdState }}</dd>
<dt>!трек · !song · !песня</dt><dd>Что сейчас играет и кто заказал</dd>
<dt>!очередь · !queue</dt><dd>Три ближайших трека</dd>
<dt>!скип · !skip · !пропустить</dt><dd>Пропустить трек — только ты и модераторы</dd>
</dl>
</div>
</section>
</section>

<aside style="flex: 1 1 340px; max-width: 440px; min-width: 0; display: flex; flex-direction: column; gap: 16px" aria-label="Плеер и настройки заказов">
<section id="obs" class="meth" aria-labelledby="obs-t">
<div class="mh"><h2 id="obs-t" class="mt" style="margin: 0; font-size: 16px"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="14" rx="2"></rect><path d="M8 22h8M12 18v4"></path></svg>Плеер для OBS</h2></div>
<p class="mp">Музыка играет прямо в OBS и попадает в эфир, даже если панель закрыта. В OBS добавь источник «Браузер», вставь ссылку и поставь галочку «Управлять звуком через OBS» — тогда громкость видна в микшере OBS.</p>
<div class="fl"><label for="obs-link">Ссылка на плеер</label>
<div style="display: flex; gap: 8px"><input id="obs-link" class="inp mono" readonly value="{{ obsUrl }}" onClick="{{ selectLink }}" style="font-size: 13px; min-width: 0; flex: 1"><button type="button" class="btn sm" onClick="{{ copyLink }}" disabled="{{ noToken }}" style="height: 40px">{{ copyLabel }}</button></div>
<p class="hint">Ссылка личная: по ней можно переключать треки. Не показывай её на стриме.</p>
</div>
<button type="button" role="checkbox" aria-checked="{{ obsChecked }}" onClick="{{ toggleObsUi }}" style="display: flex; gap: 12px; align-items: flex-start; padding: 0; border: 0; background: transparent; color: var(--n-11); font: 400 14px/20px var(--font-sans), sans-serif; text-align: left; cursor: pointer"><span style="{{ obsBox }}"><template data-if="obsUi"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="M20 6L9 17l-5-5"></path></svg></template></span><span>Показывать плашку с названием трека<span style="display: block; font-size: 12px; line-height: 16px; color: var(--n-9)">В левом нижнем углу источника. Размер источника — 1920×1080. Если у тебя уже есть виджет «Сейчас играет», плашку можно выключить.</span></span></button>
<p class="mp">Громкость плеера в OBS берётся из ползунка на этой странице.</p>
<div class="note" style="padding: 12px 14px; font-size: 13px; line-height: 18px"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg><span>Не включай плеер одновременно здесь и в OBS — трек зазвучит дважды. Выбери что-то одно.</span></div>
</section>

<h2 style="margin: 8px 0 0; font-size: 20px; line-height: 26px; font-weight: 600">Способы заказа</h2>

<div class="meth">
<div class="mh"><span class="mt" id="m-cmd"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"></path></svg>Команда в чате</span><button type="button" role="switch" class="sw" aria-checked="{{ cmdOn }}" aria-labelledby="m-cmd" onClick="{{ toggleCmd }}" disabled="{{ noCfg }}"><span></span></button></div>
<div class="fl"><label for="cmd-name">Команда</label><div style="display: flex; align-items: center; height: 40px; box-sizing: border-box; border-radius: 6px; background: var(--s-3); border: 1px solid var(--n-8); overflow: hidden"><span class="mono" style="padding: 0 0 0 12px; color: var(--n-9); font-size: 15px">!</span><input id="cmd-name" class="mono" value="{{ d.cmdName }}" onChange="{{ setCmdName }}" autocomplete="off" maxlength="30" placeholder="музыка" style="flex: 1; min-width: 0; height: 100%; padding: 0 12px 0 2px; border: 0; background: transparent; color: var(--n-12); font-size: 15px"></div><p class="hint">Зритель пишет: <span class="mono" style="color: var(--n-11)">{{ cmdUsage }}</span></p></div>
<div class="kv"><label for="cmd-acc">Кто может</label><select id="cmd-acc" class="inp" value="{{ d.cmdAccess }}" onChange="{{ setCmdAccess }}" style="width: auto; height: 36px; font-size: 14px"><option value="all">Все зрители</option><option value="followers">Фолловеры и выше</option><option value="subs">Подписчики и выше</option><option value="vip">VIP и модераторы</option><option value="mods">Только модераторы</option></select></div>
<div class="kv"><label for="cmd-cd">Кулдаун на зрителя</label><span class="unit"><input id="cmd-cd" class="inp sm mono" type="number" inputmode="numeric" min="0" max="3600" value="{{ d.cmdCooldown }}" onChange="{{ setCmdCd }}">сек</span></div>
<p class="hint">На модераторов и тебя кулдаун не действует.</p>
</div>

<div class="meth">
<div class="mh"><span class="mt" id="m-pts"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v10M8.5 10h5a2 2 0 0 1 0 4h-5"></path></svg>Баллы канала</span><button type="button" role="switch" class="sw" aria-checked="{{ ptsOn }}" aria-labelledby="m-pts" onClick="{{ togglePts }}" disabled="{{ ptsBusy }}"><span></span></button></div>
<p class="mp">Создадим на Twitch награду «Заказать трек»: зритель вводит ссылку или название в поле награды. Если трек не прошёл проверку или ты отклонил заказ, баллы вернутся. Баллы канала есть только у компаньонов и партнёров Twitch.</p>
<div class="kv"><label for="pts-cost">Стоимость</label><span class="unit"><input id="pts-cost" class="inp sm mono" type="number" inputmode="numeric" min="1" value="{{ d.pointsCost }}" onChange="{{ setPtsCost }}">баллов</span></div>
<template data-if="hasReward"><p class="hint">Награда создана на Twitch, стоимость меняется там же при сохранении.</p></template>
<template data-if="hasPtsMsg"><p role="alert" class="alert" style="font-size: 13px; line-height: 18px; padding: 10px 12px">{{ ptsMsg }}</p></template>
</div>

<div class="meth">
<div class="mh"><span class="mt" id="m-don"><span style="width: 18px; text-align: center; font-weight: 600" aria-hidden="true">₽</span>Донат с треком</span><button type="button" role="switch" class="sw" aria-checked="{{ donOn }}" aria-labelledby="m-don" onClick="{{ toggleDon }}" disabled="{{ donOff }}"><span></span></button></div>
<p class="mp">Ссылка на YouTube в сообщении к донату — трек встанет первым в очереди, без ручной проверки и лимита на зрителя. Названия и ссылки других сервисов в донатах не распознаются.</p>
<div class="kv"><label for="don-min">Минимальная сумма</label><span class="unit"><input id="don-min" class="inp sm mono" type="number" inputmode="numeric" min="1" value="{{ d.donateMin }}" onChange="{{ setDonMin }}">₽</span></div>
<p class="hint">{{ daState }}<template data-if="noDa"> <a href="settings.html#platforms" style="color: var(--n-11); text-decoration: underline">Подключить в настройках</a></template></p>
</div>

<div class="meth">
<span style="font-weight: 500">Проверка заказов</span>
<div class="kv" style="border-top: 0; padding-top: 0"><span id="m-search">Поиск по названию<span class="hint" style="display: block; margin-top: 2px">Нужен для названий и ссылок не с YouTube</span></span><button type="button" role="switch" class="sw" aria-checked="{{ searchOn }}" aria-labelledby="m-search" onClick="{{ toggleSearch }}" disabled="{{ noCfg }}"><span></span></button></div>
<div class="kv"><span id="m-manual">Ручная проверка<span class="hint" style="display: block; margin-top: 2px">Трек попадёт в очередь после твоего одобрения</span></span><button type="button" role="switch" class="sw" aria-checked="{{ manualOn }}" aria-labelledby="m-manual" onClick="{{ toggleManual }}" disabled="{{ noCfg }}"><span></span></button></div>
<div class="kv"><label for="max-len">Максимальная длина трека<span class="hint" style="display: block; margin-top: 2px">{{ maxLenHint }}</span></label><span class="unit"><input id="max-len" class="inp sm mono" type="number" inputmode="decimal" min="0" step="0.5" value="{{ d.maxLen }}" onChange="{{ setMaxLen }}">мин</span></div>
<div class="kv"><label for="per-user">Треков от зрителя в очереди<span class="hint" style="display: block; margin-top: 2px">0 — без ограничения</span></label><input id="per-user" class="inp sm mono" type="number" inputmode="numeric" min="0" value="{{ d.perUser }}" onChange="{{ setPerUser }}"></div>
<div class="kv"><label for="min-views">Минимум просмотров на YouTube<span class="hint" style="display: block; margin-top: 2px">0 — не проверять</span></label><input id="min-views" class="inp sm mono" type="number" inputmode="numeric" min="0" value="{{ d.minViews }}" onChange="{{ setMinViews }}"></div>
<div class="kv" style="flex-direction: column; align-items: stretch"><span id="stop-l">Стоп-слова в названии</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px" role="list" aria-labelledby="stop-l"><template data-for="stops" data-as="w"><span class="chip" role="listitem">{{ w.word }}<button type="button" aria-label="{{ w.label }}" onClick="{{ w.del }}"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></span></template><template data-if="noStops"><span class="hint">Стоп-слов нет</span></template></div>
<form onSubmit="{{ addStop }}" style="display: flex; gap: 8px"><label for="stop-in" class="vh">Новое стоп-слово</label><input id="stop-in" class="inp" value="{{ stopQ }}" onChange="{{ setStopQ }}" placeholder="Например: bass boosted" maxlength="60" autocomplete="off" style="height: 36px; font-size: 14px"><button type="submit" class="btn2 sm" disabled="{{ noCfg }}">Добавить</button></form>
<p class="hint">Регистр не важен, * — любые символы. Сохраняется сразу.</p>
</div>
</div>

<template data-if="dirty">
<div class="savebar"><span style="font-size: 13px; color: var(--n-11)">Есть несохранённые изменения</span><span style="display: flex; gap: 8px"><button type="button" class="btn2 sm" onClick="{{ resetDraft }}" disabled="{{ saving }}">Отменить</button><button type="button" class="btn sm" onClick="{{ saveDraft }}" disabled="{{ saving }}">{{ saveLabel }}</button></span>
<template data-if="hasFormErr"><p role="alert" style="flex-basis: 100%; margin: 0; font-size: 13px; line-height: 18px; color: var(--n-12)">{{ formErr }}</p></template>
</div>
</template>
</aside>
</div>
</div>
</main>
</div>
</div>
</template>
<script src="assets/dc-lite.js?v=5f8ce08a"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      loaded: false, err: '', allowed: true, youtube: true, config: null,
      current: null, queue: [], pending: [], history: [], stats: { ordered: 0, rejected: 0 },
      me: null, live: false, tab: 'queue', busy: {}, botBusy: false,
      draft: null, saving: false, formErr: '', ptsMsg: '', vol: 70,
      addQ: '', adding: false, addMsg: '', addErr: '', stopQ: '',
      here: false, hereLoading: false, paused: false, blocked: false, pos: 0, len: 0, ytErr: '',
      copied: false, obsUi: true,
    };
    try { this.state.obsUi = localStorage.getItem('stre.music.obsUi') !== '0'; } catch (e) { /* без хранилища */ }
    this.gen = 0; this.lastJson = ''; this.inflight = false; this.again = false;
    this.player = null; this.playingId = 0; this.advancing = false; this.errCount = 0; this.volTimer = null; this.blockTimer = null;
  }

  componentDidMount() {
    this.load();
    setInterval(() => this.load(), 4000);
    setInterval(() => this.tick(), 500);
  }

  // ---------- данные ----------
  async load() {
    if (this.inflight) { this.again = true; return; }
    this.inflight = true;
    const g = this.gen;
    try {
      const me = await StreAPI.me();
      const r = await StreAPI.get('music.state');
      if (g !== this.gen) return;
      const s = this.state;
      const meUser = me && me.user ? me.user : null;
      const live = !!(me && me.stream && me.stream.live);
      if (JSON.stringify(meUser) !== JSON.stringify(s.me) || live !== s.live) this.setState({ me: meUser, live });
      delete r.ok;
      const json = JSON.stringify(r);
      if (json !== this.lastJson || s.err || !s.loaded) {
        this.lastJson = json;
        const patch = { loaded: true, err: '', allowed: !!r.allowed, youtube: !!r.youtube, config: r.config, current: r.current, queue: r.queue || [], pending: r.pending || [], history: r.history || [], stats: r.stats || { ordered: 0, rejected: 0 } };
        if (!s.draft || !this.isDirty()) patch.draft = this.draftOf(r.config);
        if (!this.volTimer) patch.vol = Number(r.config.volume);
        if (s.tab === 'pending' && !r.config.manual && !(r.pending || []).length) patch.tab = 'queue';
        this.setState(patch);
      }
      this.sync(r);
    } catch (e) {
      if (g === this.gen && e.message !== this.state.err) this.setState({ loaded: true, err: e.message });
    } finally {
      this.inflight = false;
      if (this.again) { this.again = false; this.load(); }
    }
  }

  refresh() { this.gen++; this.lastJson = ''; this.load(); }

  draftOf(c) {
    const ml = Number(c.maxLen) || 0;
    return {
      cmdName: String(c.cmd.name || ''), cmdAccess: String(c.cmd.access || 'all'), cmdCooldown: String(c.cmd.cooldown),
      pointsCost: String(c.points.cost), donateMin: String(c.donate.min),
      maxLen: String(Math.round(ml / 30) / 2), perUser: String(c.perUser), minViews: String(c.minViews),
    };
  }
  isDirty() {
    const s = this.state;
    return !!(s.draft && s.config) && JSON.stringify(s.draft) !== JSON.stringify(this.draftOf(s.config));
  }
  setD(p) { this.setState({ draft: Object.assign({}, this.state.draft, p), formErr: '' }); }

  // настройки, которые меняются сразу (переключатели, стоп-слова)
  async saveCfg(patch) {
    const prev = this.state.config;
    const next = Object.assign({}, prev);
    Object.keys(patch).forEach((k) => { next[k] = patch[k] && typeof patch[k] === 'object' && !Array.isArray(patch[k]) ? Object.assign({}, prev[k], patch[k]) : patch[k]; });
    this.gen++;
    this.setState({ config: next });
    try {
      const r = await StreAPI.post('music.config', { config: patch });
      const p = { config: r.config };
      if (patch.points) p.ptsMsg = r.message || '';
      this.setState(p);
      if (r.message) StreAPI.toast(r.message, 'error');
      return true;
    } catch (e) {
      this.setState({ config: prev });
      StreAPI.toast('Не сохранилось: ' + e.message, 'error');
      return false;
    } finally { this.refresh(); }
  }

  async saveDraft() {
    const d = this.state.draft;
    const num = (v, min, max, label, frac) => {
      const t = String(v).trim().replace(',', '.');
      const n = Number(t);
      if (t === '' || !isFinite(n) || n < min || n > max || (!frac && Math.floor(n) !== n)) throw new Error(label + ': нужно ' + (frac ? 'число' : 'целое число') + ' от ' + min + ' до ' + StreAPI.fmtNum(max) + '.');
      return n;
    };
    let patch;
    try {
      const name = d.cmdName.trim().replace(/^!+/, '').replace(/\s+/g, '').toLowerCase();
      if (!name) throw new Error('Команда: впиши название, например «музыка».');
      patch = {
        cmd: { name, access: d.cmdAccess, cooldown: num(d.cmdCooldown, 0, 3600, 'Кулдаун') },
        points: { cost: num(d.pointsCost, 1, 1000000, 'Стоимость в баллах') },
        donate: { min: num(d.donateMin, 1, 1000000, 'Минимальная сумма доната') },
        maxLen: Math.round(num(d.maxLen, 0, 600, 'Максимальная длина', true) * 60),
        perUser: num(d.perUser, 0, 100, 'Треков от зрителя'),
        minViews: num(d.minViews, 0, 1000000000, 'Минимум просмотров'),
      };
    } catch (e) { this.setState({ formErr: e.message }); return; }
    this.setState({ saving: true, formErr: '' });
    this.gen++;
    try {
      const r = await StreAPI.post('music.config', { config: patch });
      this.setState({ config: r.config, draft: this.draftOf(r.config), saving: false, ptsMsg: r.message || '' });
      if (r.message) StreAPI.toast(r.message, 'error'); else StreAPI.toast('Настройки музыки сохранены');
    } catch (e) {
      this.setState({ saving: false, formErr: 'Не сохранилось: ' + e.message });
    } finally { this.refresh(); }
  }

  async saveVol(v) {
    try {
      const r = await StreAPI.post('music.config', { config: { volume: v } });
      if (this.state.vol === v) this.setState({ config: Object.assign({}, this.state.config, { volume: r.config.volume }) });
    } catch (e) { StreAPI.toast('Громкость не сохранилась: ' + e.message, 'error'); }
    finally { this.volTimer = null; this.lastJson = ''; }
  }

  // действия с очередью
  async act(action, song, okText) {
    const id = song ? song.id : 0;
    const key = action + ':' + id;
    if (this.state.busy[key]) return;
    const s = this.state;
    const prev = { queue: s.queue, pending: s.pending };
    const patch = { busy: Object.assign({}, s.busy, { [key]: true }) };
    if (action === 'remove') patch.queue = s.queue.filter((x) => x.id !== id);
    if (action === 'up') {
      const i = s.queue.findIndex((x) => x.id === id);
      if (i > 0) { const q = s.queue.slice(); q[i - 1] = s.queue[i]; q[i] = s.queue[i - 1]; patch.queue = q; }
    }
    if (action === 'approve') { patch.pending = s.pending.filter((x) => x.id !== id); patch.queue = s.queue.concat([Object.assign({}, song, { status: 'queued' })]); }
    if (action === 'reject') patch.pending = s.pending.filter((x) => x.id !== id);
    if (action === 'clear') patch.queue = [];
    this.gen++;
    this.setState(patch);
    try {
      await StreAPI.post('music.action', { action, id });
      if (okText) StreAPI.toast(okText);
    } catch (e) {
      this.setState(prev);
      StreAPI.toast(e.message, 'error');
    } finally {
      const b = Object.assign({}, this.state.busy); delete b[key];
      this.setState({ busy: b });
      this.refresh();
    }
  }

  async addTrack() {
    const q = this.state.addQ.trim();
    if (!q) { this.setState({ addErr: 'Вставь ссылку или напиши название трека.', addMsg: '' }); return; }
    this.setState({ adding: true, addErr: '', addMsg: '' });
    try {
      const r = await StreAPI.post('music.add', { query: q });
      this.setState({ adding: false, addQ: '', addMsg: this.cap(r.message || 'Трек добавлен') });
      this.refresh();
    } catch (e) { this.setState({ adding: false, addErr: this.cap(e.message) }); }
  }

  cap(t) { t = String(t || ''); return t.charAt(0).toUpperCase() + t.slice(1) + (/[.!?…]$/.test(t) ? '' : '.'); }

  // ---------- плеер в этой вкладке (YouTube IFrame API) ----------
  loadYT() {
    if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
    if (this.ytPromise) return this.ytPromise;
    this.ytPromise = new Promise((resolve, reject) => {
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if (typeof prev === 'function') { try { prev(); } catch (e) { /* чужой обработчик */ } } resolve(window.YT); };
      const sc = document.createElement('script');
      sc.src = 'https://www.youtube.com/iframe_api';
      sc.async = true;
      sc.onerror = () => reject(new Error('Не загрузился плеер YouTube. Проверь интернет или отключи блокировщик рекламы для этой страницы.'));
      document.head.appendChild(sc);
      setTimeout(() => reject(new Error('Плеер YouTube не загрузился за 20 секунд. Проверь интернет и попробуй ещё раз.')), 20000);
    });
    this.ytPromise.catch(() => { this.ytPromise = null; });
    return this.ytPromise;
  }

  makePlayer() {
    return new Promise((resolve, reject) => {
      const to = setTimeout(() => reject(new Error('Плеер YouTube не отвечает. Обнови страницу и попробуй ещё раз.')), 15000);
      const p = new window.YT.Player('yt-player', {
        width: '214', height: '120',
        playerVars: { autoplay: 0, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, playsinline: 1, rel: 0, origin: location.origin },
        events: {
          onReady: () => { clearTimeout(to); this.player = p; resolve(p); },
          onStateChange: (e) => this.onYt(e.data),
          onError: (e) => this.onYtErr(e.data),
          onAutoplayBlocked: () => this.setState({ blocked: true }),
        },
      });
    });
  }

  async startHere() {
    if (this.state.hereLoading) return;
    if (!this.token()) { StreAPI.toast('Не нашли ключ плеера — обнови страницу.', 'error'); return; }
    this.setState({ hereLoading: true, ytErr: '' });
    try {
      await this.loadYT();
      if (!this.player) await this.makePlayer();
      this.errCount = 0;
      this.setState({ here: true, hereLoading: false, paused: false, blocked: false });
      const s = this.state;
      if (s.current) this.play(s.current);
      else if (s.queue.length) this.advance(0);
    } catch (e) {
      this.setState({ hereLoading: false, ytErr: e.message });
    }
  }

  stopHere(msg) {
    this.playingId = 0;
    clearTimeout(this.blockTimer);
    try { if (this.player) this.player.stopVideo(); } catch (e) { /* плеер уже закрыт */ }
    this.setState({ here: false, paused: false, blocked: false, pos: 0, len: 0, ytErr: msg || '' });
  }

  play(song) {
    this.playingId = song.id;
    this.setState({ paused: false, blocked: false, pos: 0, len: song.duration || 0 });
    try {
      this.player.loadVideoById(song.videoId);
      this.player.unMute();
      this.player.setVolume(this.state.vol);
    } catch (e) { /* плеер ещё не готов */ }
    clearTimeout(this.blockTimer);
    this.blockTimer = setTimeout(() => {
      // браузер мог не дать запустить звук без клика
      if (!this.player || this.playingId !== song.id || !this.state.here || this.state.paused) return;
      const st = this.player.getPlayerState ? this.player.getPlayerState() : 1;
      if (st === -1 || st === 5) this.setState({ blocked: true });
    }, 7000);
  }

  idle() {
    this.playingId = 0;
    try { this.player.stopVideo(); } catch (e) { /* нет плеера */ }
    this.setState({ paused: false, blocked: false, pos: 0, len: 0 });
  }

  token() { return this.state.me && this.state.me.widgetToken; }

  // трек доиграл (или не играет): сервер переключит, только если finished — текущий трек
  async advance(finished) {
    if (this.advancing) return;
    this.advancing = true;
    this.gen++;
    try {
      const r = await StreAPI.post('player.next', { t: this.token(), finished });
      if (!this.state.here) return;
      if (r.current) this.play(r.current); else this.idle();
    } catch (e) {
      StreAPI.toast('Плеер не смог переключить трек: ' + e.message, 'error');
    } finally {
      this.advancing = false;
      this.refresh();
    }
  }

  // сверяем плеер с сервером: трек могли переключить в панели, командой !скип или в OBS
  sync(r) {
    if (!this.state.here || !this.player || this.advancing) return;
    const cur = r.current;
    if (cur && cur.id !== this.playingId) this.play(cur);
    else if (!cur && this.playingId) this.idle();
    else if (!cur && !this.playingId && r.allowed && (r.queue || []).length) this.advance(0);
  }

  onYt(st) {
    // -1 не начат, 0 закончился, 1 играет, 2 пауза, 3 буферизация, 5 загружен
    if (st === 0) { if (this.playingId) this.advance(this.playingId); return; }
    if (st === 1) { this.errCount = 0; if (this.state.paused || this.state.blocked) this.setState({ paused: false, blocked: false }); return; }
    if (st === 2 && !this.state.paused) this.setState({ paused: true });
  }

  onYtErr(code) {
    const id = this.playingId;
    if (!id) return;
    const why = { 2: 'неверная ссылка', 5: 'браузер не может воспроизвести видео', 100: 'видео удалено или скрыто', 101: 'автор запретил проигрывать видео на других сайтах', 150: 'автор запретил проигрывать видео на других сайтах' }[code] || 'ошибка ' + code;
    const cur = this.state.current;
    const name = cur && cur.id === id ? '«' + cur.title + '»' : 'Трек';
    this.errCount++;
    if (this.errCount >= 3) { this.stopHere('Три трека подряд не проиграли (' + why + '). Плеер остановлен, чтобы не пролистать всю очередь. Проверь интернет и нажми «Играть здесь».'); return; }
    StreAPI.toast(name + ' не проигрывается: ' + why + '. Включаю следующий.', 'error');
    this.advance(id);
  }

  tick() {
    const p = this.player;
    if (!this.state.here || !p || !this.playingId || typeof p.getCurrentTime !== 'function') return;
    const pos = Math.floor(p.getCurrentTime() || 0);
    const len = Math.floor(p.getDuration() || 0) || this.state.len;
    if (pos !== this.state.pos || len !== this.state.len) this.setState({ pos, len });
  }

  // ---------- отрисовка ----------
  renderVals() {
    const s = this.state;
    const c = s.config;
    const d = s.draft || {};
    const me = s.me || {};
    const fmt = (sec) => {
      sec = Math.max(0, Math.round(Number(sec) || 0));
      const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), x = sec % 60;
      return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
    };
    const HOW = { command: '› командой', points: '◎ за баллы', donate: '₽ донатом', manual: 'вручную' };
    const short = (x) => 'youtu.be/' + x.videoId;
    const busy = (k) => !!s.busy[k];
    const ready = s.loaded && !!c;
    const cur = s.current;
    const qTotal = s.queue.reduce((a, x) => a + (Number(x.duration) || 0), 0);
    const nQ = s.queue.length;
    const plural = (n, a, b, cc) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : cc; };
    const cmdName = c ? '!' + c.cmd.name : '!музыка';
    const showPending = !!(c && c.manual) || s.pending.length > 0;
    const tabDefs = [['queue', 'Очередь', nQ]].concat(showPending ? [['pending', 'На проверке', s.pending.length]] : []).concat([['history', 'История', s.history.length]]);
    const tab = tabDefs.some((t) => t[0] === s.tab) ? s.tab : 'queue';
    const pickTab = (k) => this.setState({ tab: k });
    const queuedBy = {};
    s.queue.forEach((x) => { queuedBy[x.requester] = (queuedBy[x.requester] || 0) + 1; });

    // плеер
    const playingHere = s.here && !!this.playingId;
    let hereStatus = 'Нажми «Играть здесь», чтобы музыка звучала в этой вкладке, или запусти плеер в OBS.';
    if (s.hereLoading) hereStatus = 'Загружаем плеер YouTube…';
    else if (s.here && s.blocked) hereStatus = 'Браузер не дал включить звук без клика. Нажми ▶ или прямо на видео слева.';
    else if (s.here && !this.playingId) hereStatus = 'Плеер включён и ждёт трек: как только в очереди что-то появится, он заиграет здесь.';
    else if (s.here && s.paused) hereStatus = 'Пауза в этой вкладке.';
    else if (s.here) hereStatus = 'Играет в этой вкладке. Не закрывай её, пока нужна музыка.';
    else if (!ready) hereStatus = '';
    const pct = s.len ? Math.min(100, Math.round(s.pos / s.len * 100)) : 0;

    const stopList = c && Array.isArray(c.stop) ? c.stop : [];
    const obsUrl = me.widgetToken ? location.origin + '/w/player.php?t=' + me.widgetToken + (s.obsUi ? '' : '&ui=0') : 'Загрузка…';

    return {
      hideOpen: !ready || !s.allowed,
      noCfg: !ready,
      openOn: !!(c && c.open), openLabel: !c ? '…' : c.open ? 'Открыт' : 'Закрыт',
      toggleOpen: () => { if (c) this.saveCfg({ open: !c.open }); },

      hasErr: !!s.err, err: /[.!?]$/.test(s.err) ? s.err : s.err + '.',
      noYoutube: ready && s.allowed && !s.youtube,
      ytFix: me.isAdmin ? 'Добавь YOUTUBE_API_KEY в файл .env на сервере.' : 'Ключ добавляет администратор сервиса — напиши в поддержку StreOps.',
      noBot: ready && s.allowed && !!s.me && !me.botEnabled,
      botBusy: s.botBusy, botLabel: s.botBusy ? 'Подключаем…' : 'Подключить бота',
      enableBot: async () => {
        this.setState({ botBusy: true });
        try {
          const r = await StreAPI.post('bot.enable');
          const m = await StreAPI.refreshMe();
          this.setState({ botBusy: false, me: m.user || s.me });
          if (r.errors && r.errors.length) StreAPI.toast('Бот подключён, но есть ошибки: ' + r.errors.join('; '), 'error'); else StreAPI.toast('Бот подключён к чату');
        } catch (e) { this.setState({ botBusy: false }); StreAPI.toast(e.message, 'error'); }
      },
      hasBotErr: ready && s.allowed && !!me.botEnabled && !!me.botError, botErr: me.botError || '',

      notAllowed: ready && !s.allowed,
      planName: me.planName || 'Бесплатный',

      // сейчас играет
      coverHas: !!cur, here: s.here, blocked: s.here && s.blocked,
      coverBg: cur ? "url('https://i.ytimg.com/vi/" + cur.videoId + "/mqdefault.jpg')" : 'none',
      npLabel: !ready ? 'Загрузка…' : 'Сейчас играет',
      npTitle: !ready ? '…' : cur ? cur.title : 'Сейчас ничего не играет',
      hasCur: !!cur, noCur: !cur,
      cur: cur ? { url: cur.url, requester: cur.requester || 'зритель', how: (HOW[cur.method] || cur.method).replace(/^[›◎₽] /, '') } : {},
      npHint: !ready ? '' : nQ ? 'В очереди ' + nQ + ' ' + plural(nQ, 'трек', 'трека', 'треков') + ' — запусти плеер здесь или в OBS, или нажми «Следующий трек».' : 'Очередь пуста — добавь трек вручную или дождись заказов зрителей.',
      showProg: playingHere, showLen: !playingHere && !!cur,
      posText: fmt(s.pos), lenText: fmt(s.len), progPct: pct, progText: fmt(s.pos) + ' из ' + fmt(s.len),
      lenLine: cur ? 'Длительность ' + fmt(cur.duration) + ' · прогресс виден, когда трек играет в этой вкладке' : '',
      hereStatus,
      hasYtErr: !!s.ytErr, ytErr: s.ytErr,
      showStart: !s.here, hereLoading: s.hereLoading || !ready,
      startLabel: s.hereLoading ? 'Загружаем…' : 'Играть здесь',
      startHere: () => this.startHere(),
      stopHere: () => this.stopHere(),
      noPlaying: !this.playingId,
      showPauseIcon: s.here && !s.paused && !s.blocked, showPlayIcon: s.here && (s.paused || s.blocked),
      pauseLabel: s.paused || s.blocked ? 'Продолжить' : 'Пауза',
      togglePause: () => {
        if (!this.player) return;
        if (s.paused || s.blocked) { this.player.playVideo(); this.setState({ paused: false }); } else { this.player.pauseVideo(); this.setState({ paused: true }); }
      },
      nextLabel: cur ? 'Следующий трек' : 'Запустить очередь',
      nextDisabled: !ready || busy('next:0') || (!cur && !nQ),
      next: () => this.act('next', null),
      vol: s.vol,
      setVol: (e) => {
        const v = Math.max(0, Math.min(100, Number(e.target.value) || 0));
        this.setState({ vol: v });
        try { if (this.player && s.here) this.player.setVolume(v); } catch (err) { /* нет плеера */ }
        clearTimeout(this.volTimer);
        this.volTimer = setTimeout(() => this.saveVol(v), 600);
      },

      statsTitle: s.live ? 'За этот стрим' : 'За последние 24 часа',
      stOrdered: StreAPI.fmtNum(s.stats.ordered), stRejected: StreAPI.fmtNum(s.stats.rejected),
      qCount: ready ? StreAPI.fmtNum(nQ) : '—', qTime: ready ? fmt(qTotal) : '—',

      // добавление
      addQ: s.addQ, setAddQ: (e) => this.setState({ addQ: e.target.value, addErr: '' }),
      addTrack: () => this.addTrack(), adding: s.adding || !ready, addLabel: s.adding ? 'Ищем трек…' : 'Добавить',
      hasAddMsg: !!s.addMsg, addMsg: s.addMsg, hasAddErr: !!s.addErr, addErr: s.addErr,

      // вкладки
      tabs: tabDefs.map((t, i) => ({
        id: 'tab-' + t[0], label: t[1], n: t[2], sel: tab === t[0] ? 'true' : 'false', tabindex: tab === t[0] ? '0' : '-1',
        style: tab === t[0] ? 'color: var(--n-12); box-shadow: inset 0 -2px 0 var(--n-12)' : '',
        pick: () => pickTab(t[0]),
        key: (e) => {
          if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
          const j = (i + (e.key === 'ArrowRight' ? 1 : tabDefs.length - 1)) % tabDefs.length;
          pickTab(tabDefs[j][0]);
          setTimeout(() => { const b = document.getElementById('tab-' + tabDefs[j][0]); if (b) b.focus(); }, 0);
        },
      })),
      tabId: 'tab-' + tab,
      tabQueue: tab === 'queue', tabPending: tab === 'pending', tabHistory: tab === 'history',

      queue: s.queue.map((x, i) => ({
        n: i + 1, title: x.title, url: x.url, short: short(x), requester: x.requester || 'зритель', how: HOW[x.method] || x.method, len: fmt(x.duration),
        rowStyle: x.method === 'donate' ? 'box-shadow: inset 2px 0 0 var(--n-12)' : '',
        upLabel: 'Поднять «' + x.title + '» выше', delLabel: 'Убрать «' + x.title + '» из очереди',
        upOff: i === 0 || busy('up:' + x.id), busy: busy('remove:' + x.id),
        up: () => this.act('up', x),
        del: () => {
          if ((x.method === 'points' || x.method === 'donate') && !confirm('«' + x.title + '» заказан ' + (x.method === 'points' ? 'за баллы канала' : 'донатом') + '. Убрать из очереди? Баллы и деньги при этом не возвращаются.')) return;
          this.act('remove', x);
        },
      })),
      qLoading: !ready, qEmpty: ready && !nQ, qHas: ready && nQ > 0,
      emptyHint: c && c.open ? (c.cmd.on ? 'Напомни зрителям: ' + cmdName + ' и ссылка или название трека.' : 'Добавь трек вручную или включи заказ командой.') : 'Приём заказов закрыт — включи его вверху страницы.',
      qSummary: nQ + ' ' + plural(nQ, 'трек', 'трека', 'треков') + ' · ' + fmt(qTotal),
      clearBusy: busy('clear:0'),
      clear: () => { if (confirm('Очистить очередь? Уберём ' + nQ + ' ' + plural(nQ, 'трек', 'трека', 'треков') + ', вернуть их будет нельзя. Баллы за эти заказы не возвращаются.')) this.act('clear', null, 'Очередь очищена'); },

      pendingNote: c && c.manual ? 'Включена ручная проверка: трек попадёт в очередь только после одобрения. Если отклонить заказ за баллы, баллы вернутся зрителю.' : 'Ручная проверка уже выключена, но эти заказы ещё ждут решения.',
      pending: s.pending.map((p) => {
        const k = queuedBy[p.requester] || 0;
        return {
          title: p.title, url: p.url, short: short(p), requester: p.requester || 'зритель', how: (HOW[p.method] || p.method).replace(/^[›◎₽] /, ''), len: fmt(p.duration),
          hasNote: k > 0, note: 'От этого зрителя уже ' + k + ' ' + plural(k, 'трек', 'трека', 'треков') + ' в очереди',
          busy: busy('approve:' + p.id) || busy('reject:' + p.id),
          rejectLabel: p.method === 'points' ? 'Отклонить и вернуть баллы' : 'Отклонить',
          reject: () => this.act('reject', p, p.method === 'points' ? 'Заказ отклонён, баллы возвращены' : 'Заказ отклонён'),
          approve: () => this.act('approve', p, 'Трек добавлен в очередь'),
        };
      }),
      noPending: !s.pending.length,

      history: s.history.map((h) => ({
        time: StreAPI.fmtTime(h.at), title: h.title, url: h.url, requester: (h.requester || 'зритель') + ' · ' + (HOW[h.method] || h.method).replace(/^[›◎₽] /, ''),
        result: { played: 'Играл', skipped: 'Убран из очереди', rejected: 'Отклонён' }[h.status] || h.status,
        color: h.status === 'played' ? 'var(--n-10)' : 'var(--n-9)',
      })),
      noHistory: ready && !s.history.length,

      searchState: c && !c.search ? 'Сейчас поиск по названию выключен — принимаются только ссылки на YouTube.' : '',
      cmdUsage: cmdName + ' <ссылка или название>',
      cmdState: c && !c.cmd.on ? 'Заказать трек — сейчас выключено' : 'Заказать трек',

      // плеер для OBS
      obsUrl, noToken: !me.widgetToken,
      copyLabel: s.copied ? 'Скопировано' : 'Скопировать',
      selectLink: (e) => { try { e.target.select(); } catch (err) { /* нечего выделять */ } },
      copyLink: async () => {
        let ok = false;
        try { await navigator.clipboard.writeText(obsUrl); ok = true; } catch (e) {
          const inp = document.getElementById('obs-link');
          try { inp.focus(); inp.select(); ok = document.execCommand('copy'); } catch (err) { ok = false; }
        }
        if (ok) { this.setState({ copied: true }); clearTimeout(this.copyTimer); this.copyTimer = setTimeout(() => this.setState({ copied: false }), 2000); }
        else StreAPI.toast('Не получилось скопировать — выдели ссылку и нажми Ctrl+C', 'error');
      },
      obsUi: s.obsUi, obsChecked: s.obsUi ? 'true' : 'false',
      obsBox: 'width: 18px; height: 18px; margin-top: 1px; border-radius: 4px; box-sizing: border-box; flex: none; display: inline-flex; align-items: center; justify-content: center; ' + (s.obsUi ? 'background: var(--n-13); border: 1px solid var(--n-13); color: var(--n-1)' : 'border: 1px solid var(--n-8)'),
      toggleObsUi: () => { const v = !s.obsUi; this.setState({ obsUi: v, copied: false }); try { localStorage.setItem('stre.music.obsUi', v ? '1' : '0'); } catch (e) { /* без хранилища */ } },

      // способы заказа
      d,
      cmdOn: c && c.cmd.on ? 'true' : 'false',
      toggleCmd: () => { if (c) this.saveCfg({ cmd: { on: !c.cmd.on } }); },
      setCmdName: (e) => this.setD({ cmdName: e.target.value.replace(/\s+/g, '').replace(/^!+/, '') }),
      setCmdAccess: (e) => this.setD({ cmdAccess: e.target.value }),
      setCmdCd: (e) => this.setD({ cmdCooldown: e.target.value }),

      ptsOn: c && c.points.on ? 'true' : 'false', ptsBusy: !ready,
      togglePts: () => { if (c) this.saveCfg({ points: { on: !c.points.on } }); },
      setPtsCost: (e) => this.setD({ pointsCost: e.target.value }),
      hasReward: !!(c && c.points.on && c.points.rewardId),
      hasPtsMsg: !!s.ptsMsg, ptsMsg: s.ptsMsg,

      donOn: c && c.donate.on ? 'true' : 'false',
      donOff: !ready || (!me.daConnected && !(c && c.donate.on)),
      toggleDon: () => { if (c) this.saveCfg({ donate: { on: !c.donate.on } }); },
      setDonMin: (e) => this.setD({ donateMin: e.target.value }),
      noDa: !!s.me && !me.daConnected,
      daState: !s.me ? '' : me.daConnected ? 'DonationAlerts подключён' + (me.daName ? ': ' + me.daName : '') + '.' : 'Нужен подключённый DonationAlerts.',

      searchOn: c && c.search ? 'true' : 'false',
      toggleSearch: () => { if (c) this.saveCfg({ search: !c.search }); },
      manualOn: c && c.manual ? 'true' : 'false',
      toggleManual: () => { if (c) this.saveCfg({ manual: !c.manual }); },
      setMaxLen: (e) => this.setD({ maxLen: e.target.value }),
      maxLenHint: (() => { const n = Number(String(d.maxLen || '').replace(',', '.')); return !d.maxLen || !isFinite(n) ? 'В минутах, 0 — без ограничения' : n <= 0 ? 'Без ограничения' : 'До ' + fmt(n * 60) + ', 0 — без ограничения'; })(),
      setPerUser: (e) => this.setD({ perUser: e.target.value }),
      setMinViews: (e) => this.setD({ minViews: e.target.value }),

      stops: stopList.map((w) => ({ word: w, label: 'Удалить стоп-слово «' + w + '»', del: () => this.saveCfg({ stop: stopList.filter((x) => x !== w) }) })),
      noStops: ready && !stopList.length,
      stopQ: s.stopQ, setStopQ: (e) => this.setState({ stopQ: e.target.value }),
      addStop: () => {
        const w = s.stopQ.trim().toLowerCase().replace(/\s+/g, ' ');
        if (!w || !c) return;
        if (stopList.indexOf(w) >= 0) { StreAPI.toast('Такое стоп-слово уже есть'); return; }
        this.setState({ stopQ: '' });
        this.saveCfg({ stop: stopList.concat([w]) });
      },

      dirty: ready && this.isDirty(), saving: s.saving, saveLabel: s.saving ? 'Сохраняем…' : 'Сохранить',
      saveDraft: () => this.saveDraft(),
      resetDraft: () => this.setState({ draft: this.draftOf(c), formErr: '' }),
      hasFormErr: !!s.formErr, formErr: s.formErr,
    };
  }
}
DCMount(Component);
</script>
</body>
</html>
