<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — розыгрыши</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js?v=460ce522"></script>
<script src="assets/api.js?v=47744cb2"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--n-12);outline-offset:2px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ov{font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9);margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sec{padding:20px;border-radius:8px;border:1px solid var(--n-5);background:var(--s-2);display:flex;flex-direction:column;gap:14px}
.sec h2{margin:0;font-size:17px;line-height:24px;font-weight:600}
.lab{font-size:13px;line-height:18px;font-weight:500;color:var(--n-11)}
.inp{height:40px;box-sizing:border-box;padding:0 12px;border-radius:6px;background:var(--s-3);border:1px solid var(--n-8);color:var(--n-12);font:400 15px/22px var(--font-sans),sans-serif;width:100%}
.inp:disabled{border-color:var(--n-5);color:var(--n-9)}
.inp[aria-invalid="true"]{border:2px solid var(--n-12)}
.hint{font-size:12px;line-height:16px;color:var(--n-9);margin:0}
.seg{height:34px;padding:0 12px;border:0;border-radius:4px;background:transparent;color:var(--n-10);font:500 13px/18px var(--font-sans),sans-serif;cursor:pointer;white-space:nowrap}
.seg:hover{color:var(--n-12)}
.seg:disabled{cursor:not-allowed}
.sw{position:relative;width:40px;height:24px;border-radius:999px;border:1px solid var(--n-8);background:transparent;cursor:pointer;flex:none;padding:0}
.sw:disabled{cursor:not-allowed;opacity:.55}
.sw span{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:var(--n-9);transition:transform 180ms cubic-bezier(.2,0,0,1)}
.sw[aria-checked="true"]{background:var(--n-13);border-color:var(--n-13)}
.sw[aria-checked="true"] span{transform:translateX(16px);background:var(--n-1)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:40px;padding:6px 0;font-size:14px;border-top:1px solid var(--n-4)}
.mode{flex:1 1 120px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:8px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);font-family:var(--font-sans),sans-serif;cursor:pointer;text-align:left}
.mode:hover{border-color:var(--n-9)}
.mode:disabled{cursor:not-allowed;color:var(--n-9)}
.bp{height:44px;padding:0 18px;border-radius:6px;border:0;background:var(--n-13);color:var(--n-1);font:500 15px/20px var(--font-sans),sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.bp:hover{background:var(--n-11)}
.bp:disabled{background:var(--n-5);color:var(--n-8);cursor:not-allowed}
.bs{height:44px;padding:0 16px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);font:500 14px/20px var(--font-sans),sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.bs:hover{background:rgb(var(--n-13-rgb) / .04);border-color:var(--n-8)}
.bs:disabled{color:var(--n-7);border-color:var(--n-5);cursor:not-allowed}
.bd{color:var(--accent-text)}
.sm{height:30px;padding:0 10px;border-radius:4px;font-size:12px}
.card{flex:none;width:120px;height:148px;box-sizing:border-box;border-radius:8px;background:var(--s-3);border:1px solid var(--n-6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;position:relative;overflow:hidden}
.av{border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;color:var(--n-1);flex:none}
.pr{display:grid;grid-template-columns:28px minmax(0,1fr) 84px 64px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--n-4);font-size:13px}
.step{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--n-9)}
.step b{width:22px;height:22px;border-radius:999px;border:1px solid var(--n-6);display:inline-flex;align-items:center;justify-content:center;font:500 11px/1 'JetBrains Mono',monospace}
.note{margin:0;display:flex;gap:8px;padding:10px 12px;border:1px dashed var(--n-9);border-radius:6px;font-size:13px;line-height:18px;color:var(--n-11)}
.alert{margin:0;padding:10px 12px;border:2px solid var(--n-12);border-radius:6px;font-size:13px;line-height:18px}
@media (max-width: 480px){.pr{grid-template-columns:28px minmax(0,1fr) 40px 64px}}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px; flex-wrap: wrap">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<div style="display: flex; align-items: center; gap: 8px">
<div role="status" data-dc-keep data-stre-live aria-label="Статус эфира" style="display: flex; align-items: center; height: 40px; border: 1px solid var(--n-5); border-radius: 6px">
<span style="display: inline-flex; align-items: center; gap: 8px; height: 100%; padding: 0 12px; border-right: 1px solid var(--n-5)"><span data-dot style="width: 8px; height: 8px; border-radius: 999px; background: var(--n-8)"></span><span data-label style="font-size: 11px; font-weight: 700; letter-spacing: .08em">НЕ В ЭФИРЕ</span></span>
<span class="mono" data-timer title="Длительность эфира" style="padding: 0 12px; border-right: 1px solid var(--n-5); font-size: 15px">—</span><span class="mono" data-viewers title="Зрителей сейчас" style="padding: 0 12px; font-size: 15px">—</span>
</div>
<a href="settings.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; font-size: 14px; font-weight: 500" aria-label="Профиль" data-dc-keep data-stre-user><span class="av" style="width: 32px; height: 32px; font-size: 12px; background: linear-gradient(135deg, var(--n-10), var(--n-6))" data-av></span><span data-name>Профиль</span></a>
</div>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" class="sb" data-dc-keep>
<p class="sb-h">Эфир</p>
<a href="panel.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Обзор</a>
<a href="moderation.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<p class="sb-h">Бот</p>
<a href="commands.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды</a>
<a href="music.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Музыка</a>
<a href="widgets.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i" aria-current="page"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<span class="sb-i sb-off" aria-disabled="true"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 13l-7.5 7.5a2.1 2.1 0 0 1-3-3L11 10M16 16l6-6M8 8l6-6M9 7l8 8M21 11l-8-8"/></svg>Аукционы<span class="sb-tag">скоро</span></span>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
</nav>

<main style="flex: 999 1 720px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div><h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Розыгрыши</h1><p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: var(--n-10); max-width: 640px">Зрители входят ключевым словом в чате или просто активностью. Победителя выбирает сервер по заранее объявленному seed, рулетка показывает результат, а итог можно проверить.</p></div>
<ol aria-label="Этапы розыгрыша" style="list-style: none; margin: 0; padding: 0; display: flex; gap: 16px; flex-wrap: wrap">
<template data-for="steps" data-as="s"><li class="step" style="{{ s.style }}" aria-current="{{ s.cur }}"><b style="{{ s.dot }}">{{ s.n }}</b>{{ s.label }}</li></template>
</ol>
</div>

<div>
<template data-if="botOff"><div role="alert" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border: 1px dashed var(--n-10); border-radius: 8px; font-size: 14px; line-height: 20px"><span>{{ botOffText }}</span><button type="button" class="bs" style="height: 36px" onClick="{{ enableBot }}" disabled="{{ botBusy }}">{{ botBtnLabel }}</button></div></template>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<!-- ===== НАСТРОЙКА ===== -->
<form aria-label="Настройки розыгрыша" style="flex: 1 1 380px; max-width: 460px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div>
<template data-if="locked"><p class="note"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; margin-top: 1px"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Пока идёт розыгрыш, условия менять нельзя: так честнее для участников. Здесь показаны условия текущего розыгрыша.</p></template>
</div>

<section class="sec" aria-labelledby="pz">
<h2 id="pz">Приз</h2>
<div style="display: flex; flex-direction: column; gap: 8px"><label class="lab" for="prize">Что разыгрываем</label><input id="prize" class="inp" maxlength="200" autocomplete="off" placeholder="Например, ключ игры в Steam" value="{{ f.prize }}" onChange="{{ setPrize }}" disabled="{{ locked }}" aria-invalid="{{ prizeInvalid }}"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span class="lab" id="wn">Победителей</span><span role="radiogroup" aria-labelledby="wn" style="display: inline-flex; align-self: flex-start; padding: 2px; border: 1px solid var(--n-6); border-radius: 6px"><template data-for="winnersOpt" data-as="o"><button type="button" role="radio" class="seg mono" aria-checked="{{ o.sel }}" onClick="{{ o.pick }}" disabled="{{ locked }}" style="{{ o.style }}">{{ o.label }}</button></template></span><p class="hint">Победителей выбирают по одному: после первого появится кнопка «Следующий победитель».</p></div>
</section>

<section class="sec" aria-labelledby="hw">
<h2 id="hw">Как участвовать</h2>
<div role="radiogroup" aria-label="Способ участия" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<template data-for="entryOpt" data-as="o"><button type="button" role="radio" class="mode" aria-checked="{{ o.sel }}" onClick="{{ o.pick }}" disabled="{{ locked }}" style="{{ o.style }}"><span style="font-size: 14px; font-weight: 500">{{ o.label }}</span><span class="hint">{{ o.note }}</span></button></template>
</div>
<div>
<template data-if="entryWord"><div style="display: flex; flex-direction: column; gap: 8px"><label class="lab" for="kw">Слово для участия</label><input id="kw" class="inp mono" maxlength="40" autocomplete="off" value="{{ f.keyword }}" onChange="{{ setKeyword }}" disabled="{{ locked }}"><p class="hint">Сообщение должно целиком совпадать со словом, регистр не важен. Повторы не дают лишних шансов, а сообщения, удалённые модерацией, не считаются.</p></div></template>
<template data-if="entryActive"><p class="hint">Слово писать не нужно: участником становится каждый, кто напишет в чат что угодно, пока идёт сбор.</p></template>
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><span class="lab" id="tmr">Сбор участников</span><span role="radiogroup" aria-labelledby="tmr" style="display: inline-flex; align-self: flex-start; padding: 2px; border: 1px solid var(--n-6); border-radius: 6px"><template data-for="timerOpt" data-as="o"><button type="button" role="radio" class="seg" aria-checked="{{ o.sel }}" onClick="{{ o.pick }}" disabled="{{ locked }}" style="{{ o.style }}">{{ o.label }}</button></template></span><p class="hint">{{ timerHint }}</p></div>
</section>

<section class="sec" aria-labelledby="rl">
<h2 id="rl">Правила и защита от накрутки</h2>
<div>
<template data-for="rules" data-as="r"><div class="row"><span><span style="display: block">{{ r.label }}</span><span class="hint">{{ r.note }}</span></span><button type="button" role="switch" class="sw" aria-checked="{{ r.on }}" aria-label="{{ r.label }}" onClick="{{ r.toggle }}" disabled="{{ locked }}"><span></span></button></div></template>
</div>
<p class="hint">Правила проверяются в момент входа. Известные боты (Nightbot, StreamElements и другие) не участвуют никогда.</p>
</section>

<section class="sec" aria-labelledby="an">
<h2 id="an">Как выбрать победителя</h2>
<div role="radiogroup" aria-label="Анимация выбора" style="display: flex; gap: 8px; flex-wrap: wrap">
<template data-for="modeOpt" data-as="o"><button type="button" role="radio" class="mode" aria-checked="{{ o.sel }}" onClick="{{ o.pick }}" disabled="{{ spinningNow }}" style="{{ o.style }}"><span style="font-size: 14px; font-weight: 500">{{ o.label }}</span><span class="hint">{{ o.note }}</span></button></template>
</div>
<p class="hint">Анимация только показывает результат: победителя заранее выбирает сервер. В OBS-оверлее всегда лента-рулетка.</p>
<div class="row"><span><span style="display: block">Победитель подтверждает участие</span><span class="hint">При объявлении бот попросит написать в чат за 60 секунд. Ответ отметится на сцене, без ответа — перевыбери</span></span><button type="button" role="switch" class="sw" aria-checked="{{ confirmOn }}" aria-label="Победитель подтверждает участие" onClick="{{ toggleConfirm }}" disabled="{{ locked }}"><span></span></button></div>
</section>
</form>

<!-- ===== СЦЕНА ===== -->
<section aria-label="Ход розыгрыша" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

<div role="region" aria-label="Сцена розыгрыша" data-gw-stage style="{{ stageStyle }}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--n-5); flex-wrap: wrap">
<div style="min-width: 0"><p class="ov">{{ phaseLabel }}</p><p style="margin: 4px 0 0; font-size: 20px; line-height: 26px; font-weight: 600; overflow-wrap: anywhere">{{ stageTitle }}</p></div>
<div style="display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap">
<span><span class="mono" style="font-size: 24px; font-weight: 500">{{ countNum }}</span> <span style="font-size: 13px; color: var(--n-9)">{{ countWord }}</span></span>
<span><template data-if="showTimer"><span class="mono" style="font-size: 24px; font-weight: 500">{{ timerLabel }}</span> <span style="font-size: 13px; color: var(--n-9)">{{ timerNote }}</span></template></span>
<button type="button" onClick="{{ toggleFs }}" aria-pressed="{{ fsPressed }}" style="align-self: center; height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--n-6); background: rgb(var(--n-1-rgb) / 0.6); color: var(--n-12); font: 500 13px/18px var(--font-sans), sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 8px"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ fsIcon }}"></path></svg>{{ fsLabel }}</button>
</div>
</div>

<div style="position: relative; {{ arenaH }}; display: flex; align-items: center; justify-content: center">

<template data-if="isLoading"><p style="margin: 0; font-size: 14px; color: var(--n-9)">{{ loadingText }}</p></template>

<template data-if="isSetup"><div style="text-align: center; max-width: 420px; padding: 24px"><svg class="ic" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--n-9)"><rect x="3" y="8" width="18" height="13" rx="1"></rect><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"></path></svg><p style="margin: 16px 0 0; font-size: 20px; font-weight: 600">Розыгрыш ещё не начат</p><p style="margin: 8px 0 0; font-size: 14px; line-height: 20px; color: var(--n-10)">Проверь условия слева и запусти сбор. Бот сам напишет в чат, как участвовать.</p></div></template>

<template data-if="collectEmpty"><div style="text-align: center; max-width: 420px; padding: 24px"><p style="margin: 0; font-size: 20px; font-weight: 600">Ждём участников</p><p style="margin: 8px 0 0; font-size: 14px; line-height: 20px; color: var(--n-10)">{{ collectEmptyText }}</p></div></template>

<template data-if="showRoulette">
<div style="position: absolute; inset: 0; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform: scale({{ scale }})">

<ol style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px"><li>При старте бот пишет в чат начало sha256-хэша секретного seed. Подменить seed потом незаметно нельзя.</li><li>После завершения бот публикует сам seed. Кнопка «Проверить» считает sha256(seed) прямо в браузере и сравнивает с хэшем, объявленным заранее.</li><li>Победитель раунда r (0 — первый выбор, каждый следующий выбор или перевыбор +1): первые 12 hex-символов sha256(«seed:r») → число, остаток от деления на сумму весов оставшихся участников в порядке входа, отсчёт по весам. Вес — 2, с «удачей» у подписчика 4, у VIP 3.</li></ol>

<script src="assets/dc-lite.js?v=5f8ce08a"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const DEF = { prize: '', keyword: '!участвую', winners: 1, duration: 120, entry: 'word', rules: { followers: false, noNew: true, noMods: true, luck: true, noRecent: true, confirm: true } };
    const saved = this.lsGet('stre.gw.form', null);
    const form = Object.assign({}, DEF, saved || {}, { rules: Object.assign({}, DEF.rules, (saved && saved.rules) || {}) });
    const mode = this.lsGet('stre.gw.mode', 'roulette');
    this.state = {
      loaded: false, loadErr: '', cur: null, history: [], me: null,
      form, prizeInvalid: false, mode: ['roulette', 'wheel', 'instant'].indexOf(mode) >= 0 ? mode : 'roulette',
      busy: '', actErr: '', botBusy: false, tokenBusy: false,
      spinning: false, spin: null, stripX: this.restX(), stripAnim: false, wheelDeg: 0, wheelAnim: false,
      ann: this.lsGet('stre.gw.ann', {}),
      fs: false, fsFallback: false, scale: 1,
      obsShow: false, obsCopied: false, obsBg: [0, 1, 2].indexOf(this.lsGet('stre.gw.obsBg', 0)) >= 0 ? this.lsGet('stre.gw.obsBg', 0) : 0,
      open: {}, calc: {}, skew: 0, tick: 0,
    };
    this.reqId = 0; this.appliedId = 0; this.lastJson = '';
  }
  // ---------- утилиты ----------
  lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* без хранилища */ } }
  restX() { return -(6 * 128 + 60); }
  ini(n) { return (String(n || '?').replace(/[^A-Za-zА-Яа-яЁё0-9]/g, '').slice(0, 2) || '?').toUpperCase(); }
  shade(login) { let h = 0; const s = String(login || ''); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return 'linear-gradient(135deg, ' + ['var(--n-12)', 'var(--n-11)', 'var(--n-10)', 'var(--n-9)'][h % 4] + ', var(--n-5))'; }
  plural(n, f) { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b > 1 && b < 5 ? f[1] : b === 1 ? f[0] : f[2]; }
  hdur(s) { if (s >= 3600 && s % 3600 === 0) return (s / 3600) + ' ч'; if (s >= 60) return Math.floor(s / 60) + ' мин'; return s + ' с'; }
  mmss(sec) { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
  pct(x) { return String(Math.round((Number(x) || 0) * 100) / 100).replace('.', ',') + '%'; }
  nowS() { return Date.now() / 1000 + this.state.skew; }
  wkey(w) { return w ? w.id + ':' + w.round : ''; }
  short(h) { return h ? h.slice(0, 4) + '…' + h.slice(-4) : ''; }
  barStyle(role) { return role === 'подписчик' ? 'background: var(--n-12)' : (role === 'VIP' ? 'background: repeating-linear-gradient(90deg, var(--n-12) 0 6px, transparent 6px 10px)' : 'background: var(--n-6)'); }

  // ---------- загрузка и опрос ----------
  componentDidMount() {
    this.init();
    this.pollT = setInterval(() => { if (!document.hidden) this.poll(); }, 2000);
    this.tickT = setInterval(() => { if (!document.hidden && this.needTick()) this.setState({ tick: Date.now() }); }, 1000);
    const onFs = () => { const on = !!(document.fullscreenElement || document.webkitFullscreenElement); this.setState({ fs: on, scale: on ? this.calcScale() : (this.state.fsFallback ? this.calcScale() : 1) }); };
    document.addEventListener('fullscreenchange', onFs);
    document.addEventListener('webkitfullscreenchange', onFs);
    window.addEventListener('resize', () => { if (this.state.fs || this.state.fsFallback) this.setState({ scale: this.calcScale() }); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && this.state.fsFallback) this.setState({ fsFallback: false, scale: 1 }); });
  }
  async init() {
    const me = await StreAPI.me();
    this.setState({ me });
    await this.poll();
    const tok = me && me.user && me.user.widgetToken;
    if (tok) { // разница часов с сервером — для точного таймера
      try { const t0 = Date.now(); const r = await StreAPI.get('widget.data', { t: tok, w: 'giveaway' }); if (r.now) this.setState({ skew: r.now - (t0 + Date.now()) / 2000 }); } catch (e) { /* таймер по часам браузера */ }
    }
  }
  async poll() {
    const id = ++this.reqId;
    try {
      const r = await StreAPI.get('gw.state');
      if (id < this.appliedId) return;
      this.appliedId = id;
      const j = JSON.stringify([r.current, r.history]);
      if (j !== this.lastJson || !this.state.loaded || this.state.loadErr) {
        this.lastJson = j;
        this.setState({ cur: r.current || null, history: r.history || [], loaded: true, loadErr: '' });
      }
    } catch (e) {
      if (e.message !== this.state.loadErr) this.setState({ loadErr: e.message });
    }
  }
  needTick() {
    const c = this.state.cur;
    if (!c) return false;
    if ((c.status === 'collecting' || c.status === 'closed') && c.endsAt > 0 && c.endsAt > this.nowS() - 2) return true;
    const w = c.winners && c.winners[c.winners.length - 1];
    const at = w && this.state.ann[c.id + ':' + this.wkey(w)];
    return !!(at && Date.now() - at < 62000 && !c.lastReplied);
  }
  calcScale() { return Math.max(1, Math.min(2.4, Math.min(window.innerWidth / 1000, (window.innerHeight - 170) / 430))); }

  // ---------- действия ----------
  setF(p) { if (!this.state.cur) this.setState({ form: Object.assign({}, this.state.form, p), prizeInvalid: false, actErr: '' }); }
  async start() {
    const f = this.state.form;
    const prize = f.prize.trim();
    if (!prize) {
      this.setState({ prizeInvalid: true, actErr: 'Напиши, что разыгрываем: без приза сбор не начать.' });
      const el = document.getElementById('prize'); if (el) el.focus();
      return;
    }
    if (f.entry === 'word' && !f.keyword.trim()) { this.setState({ actErr: 'Укажи слово, которым зрители будут входить в розыгрыш.' }); return; }
    this.setState({ busy: 'start', actErr: '' });
    try {
      const r = f.rules;
      await StreAPI.post('gw.start', { prize, keyword: f.keyword.trim(), winners: f.winners, duration: f.duration, entry: f.entry,
        rules: { followers: !!r.followers, noNew: !!r.noNew, noMods: !!r.noMods, luck: !!r.luck, noRecent: !!r.noRecent, confirm: !!r.confirm } });
      this.lsSet('stre.gw.form', Object.assign({}, f, { prize }));
      StreAPI.toast('Сбор начался — бот написал в чат, как участвовать');
      this.setState({ busy: '', spin: null, stripX: this.restX(), stripAnim: false });
      await this.poll();
    } catch (e) { this.setState({ busy: '', actErr: e.message }); StreAPI.toast(e.message, 'error'); }
  }
  async cancel() {
    const c = this.state.cur;
    if (!c || !confirm('Отменить розыгрыш «' + c.prize + '»? Победителя не будет, в историю он попадёт как отменённый. В чат бот ничего не напишет.')) return;
    this.setState({ busy: 'cancel', actErr: '' });
    try { await StreAPI.post('gw.cancel'); StreAPI.toast('Розыгрыш отменён'); this.setState({ busy: '', spin: null }); await this.poll(); }
    catch (e) { this.setState({ busy: '', actErr: e.message }); StreAPI.toast(e.message, 'error'); }
  }
  async draw(reroll) {
    const s = this.state;
    if (s.busy || s.spinning || !s.cur) return;
    this.setState({ busy: reroll ? 'reroll' : 'draw', actErr: '' });
    let r;
    try { r = await StreAPI.post('gw.draw', reroll ? { reroll: true } : {}); }
    catch (e) { this.setState({ busy: '', actErr: e.message }); StreAPI.toast(e.message, 'error'); return; }
    const c = this.state.cur;
    const winners = (reroll ? c.winners.slice(0, -1) : c.winners.slice()).concat([r.winner]);
    this.setState({ busy: '', cur: Object.assign({}, c, { status: 'drawing', winners, lastReplied: false }) });
    this.animate(r);
  }
  animate(r) {
    const s = this.state, w = r.winner;
    const gid = s.cur ? s.cur.id : 0;
    const pool = r.pool && r.pool.length ? r.pool : [{ login: w.login, name: w.name, role: w.role }];
    const base = { gid, wkey: this.wkey(w) };
    clearTimeout(this.t1); clearTimeout(this.t2);
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (s.mode === 'instant' || reduce) { this.setState({ spinning: false, spin: Object.assign(base, { kind: 'instant' }) }); this.poll(); return; }
    const pickOther = () => { const o = pool.filter((p) => p.login !== w.login); return o.length ? o[Math.floor(Math.random() * o.length)] : w; };
    if (s.mode === 'wheel') {
      const wi = Math.floor(Math.random() * 12);
      const labels = []; for (let i = 0; i < 12; i++) labels.push(i === wi ? w : pickOther());
      const from = ((s.wheelDeg % 360) + 360) % 360;
      const target = ((-(wi * 30 + 15) + Math.round((Math.random() - 0.5) * 20)) % 360 + 360) % 360;
      const final = from + 360 * 6 + ((target - from) % 360 + 360) % 360;
      this.setState({ spinning: true, spin: Object.assign(base, { kind: 'wheel', labels }), wheelAnim: false, wheelDeg: from });
      this.t1 = setTimeout(() => { void document.body.offsetHeight; this.setState({ wheelAnim: true, wheelDeg: final }); }, 60);
      this.t2 = setTimeout(() => this.endSpin(), 5700);
    } else {
      const cards = []; for (let k = 0; k < 60; k++) cards.push(k === 52 ? w : (k > 48 && k < 56 ? pickOther() : pool[Math.floor(Math.random() * pool.length)]));
      const jitter = Math.round((Math.random() - 0.5) * 96);
      this.setState({ spinning: true, spin: Object.assign(base, { kind: 'roulette', cards }), stripAnim: false, stripX: this.restX() });
      this.t1 = setTimeout(() => { void document.body.offsetHeight; this.setState({ stripAnim: true, stripX: -(52 * 128 + 60 + jitter) }); }, 60);
      this.t2 = setTimeout(() => this.endSpin(), 6300);
    }
  }
  endSpin() { this.setState({ spinning: false, stripAnim: false, wheelAnim: false }); this.poll(); }
  async announce() {
    const c = this.state.cur; if (!c) return;
    const w = c.winners[c.winners.length - 1];
    this.setState({ busy: 'announce', actErr: '' });
    try {
      await StreAPI.post('gw.announce');
      const ann = Object.assign({}, this.state.ann, { [c.id + ':' + this.wkey(w)]: Date.now() });
      const keys = Object.keys(ann); if (keys.length > 30) keys.slice(0, keys.length - 30).forEach((k) => delete ann[k]);
      this.lsSet('stre.gw.ann', ann);
      this.setState({ busy: '', ann });
      StreAPI.toast('Бот объявил победителя в чате');
    } catch (e) { this.setState({ busy: '', actErr: e.message }); StreAPI.toast(e.message, 'error'); }
  }
  async finish() {
    const c = this.state.cur; if (!c) return;
    if (c.winners.length < c.winnersCount && !confirm('Выбрано ' + c.winners.length + ' из ' + c.winnersCount + ' победителей. Завершить розыгрыш сейчас?')) return;
    this.setState({ busy: 'finish', actErr: '' });
    try {
      await StreAPI.post('gw.finish');
      StreAPI.toast(c.winners.length ? 'Розыгрыш завершён — бот написал итоги и seed в чат' : 'Розыгрыш завершён');
      this.setState({ busy: '', spin: null });
      await this.poll();
    } catch (e) { this.setState({ busy: '', actErr: e.message }); StreAPI.toast(e.message, 'error'); }
  }
  toggleFs() {
    const el = document.querySelector('[data-gw-stage]');
    if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    if (this.state.fsFallback) { this.setState({ fsFallback: false, scale: 1 }); return; }
    const fallback = () => this.setState({ fsFallback: true, scale: this.calcScale() });
    const req = el && (el.requestFullscreen || el.webkitRequestFullscreen);
    if (!req) { fallback(); return; }
    try { const p = req.call(el); if (p && p.catch) p.catch(fallback); } catch (e) { fallback(); }
  }
  async enableBot() {
    this.setState({ botBusy: true });
    try {
      const r = await StreAPI.post('bot.enable');
      const me = await StreAPI.refreshMe();
      this.setState({ me });
      if (r.errors && r.errors.length) StreAPI.toast('Бот подключён, но есть ошибки: ' + r.errors.join('; '), 'error');
      else StreAPI.toast('Бот подключён к чату');
    } catch (e) { StreAPI.toast(e.message, 'error'); }
    this.setState({ botBusy: false });
  }
  obsUrl(masked) {
    const me = this.state.me;
    const tok = me && me.user && me.user.widgetToken;
    if (!tok) return '';
    return location.origin + '/w/giveaway.php?t=' + (masked ? '••••••••••••' : encodeURIComponent(tok)) + ['', '&bg=dark', '&bg=green'][this.state.obsBg];
  }
  async copyObs() {
    const url = this.obsUrl(false);
    if (!url) return;
    let ok = false;
    try { await navigator.clipboard.writeText(url); ok = true; } catch (e) {
      try { const t = document.createElement('textarea'); t.value = url; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); ok = document.execCommand('copy'); t.remove(); } catch (e2) { ok = false; }
    }
    if (!ok) { this.setState({ obsShow: true }); StreAPI.toast('Не получилось скопировать — выдели ссылку и скопируй вручную', 'error'); return; }
    this.setState({ obsCopied: true });
    clearTimeout(this.copyT); this.copyT = setTimeout(() => this.setState({ obsCopied: false }), 2000);
  }
  async resetToken() {
    if (!confirm('Создать новую ссылку? Старые ссылки на все виджеты StreOps (розыгрыш, алерты, чат и другие) перестанут работать — их нужно будет заменить в OBS.')) return;
    this.setState({ tokenBusy: true });
    try { await StreAPI.post('account.widgetToken'); const me = await StreAPI.refreshMe(); this.setState({ me }); StreAPI.toast('Новая ссылка готова. Обнови источники в OBS'); }
    catch (e) { StreAPI.toast(e.message, 'error'); }
    this.setState({ tokenBusy: false });
  }
  async check(h) {
    const open = Object.assign({}, this.state.open, { [h.id]: !this.state.open[h.id] });
    this.setState({ open });
    if (!open[h.id] || this.state.calc[h.id] || !h.seed) return;
    let calc = '';
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(h.seed));
      calc = Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
    } catch (e) { calc = '-'; }
    this.setState({ calc: Object.assign({}, this.state.calc, { [h.id]: calc }) });
  }

  // ---------- отрисовка ----------
  renderVals() {
    const s = this.state;
    const c = s.cur;
    const me = s.me && s.me.user;
    const winners = c ? (c.winners || []) : [];
    const lastW = winners[winners.length - 1] || null;
    let phase = 'setup';
    if (s.spinning) phase = 'spinning';
    else if (c && c.status === 'drawing' && lastW) phase = 'winner';
    else if (c) phase = 'collecting';
    const pi = ['setup', 'collecting', 'spinning', 'winner'].indexOf(phase);
    const locked = !!c;
    const seg = (on) => on ? 'background: var(--n-12); color: var(--n-1)' : '';
    const card = (on) => on ? 'border: 2px solid var(--n-12); padding: 11px; background: rgb(var(--n-13-rgb) / 0.04)' : '';

    // условия: свои (до старта) или текущего розыгрыша
    const f = c ? { prize: c.prize, keyword: c.keyword, winners: c.winnersCount, entry: (c.rules && c.rules.entry) || 'word', duration: c.endsAt ? c.endsAt - c.createdAt : 0, rules: c.rules || {} } : s.form;
    const opts = (list, v) => (list.indexOf(v) >= 0 ? list : list.concat([v]).sort((a, b) => (a || 1e9) - (b || 1e9)));
    const RU = [
      ['followers', 'Только фолловеры', 'Подписчики, VIP и модераторы проходят без проверки'],
      ['noNew', 'Без новых аккаунтов', 'Аккаунтам моложе 7 дней участие закрыто'],
      ['noMods', 'Без модераторов', 'Модераторы и ты сам не участвуете'],
      ['luck', 'Удача подписчиков', 'Подписчикам шанс ×2, VIP ×1,5'],
      ['noRecent', 'Без недавних победителей', 'Кто выигрывал у тебя за 7 дней, не участвует'],
    ];
    const EN = [['word', 'Слово в чат', 'Пишут ключевое слово'], ['active', 'Все, кто пишет', 'Любое сообщение во время сбора']];
    const MO = [['roulette', 'Рулетка', 'Лента карточек, как при открытии кейса'], ['wheel', 'Колесо', 'Барабан с никами'], ['instant', 'Мгновенно', 'Без анимации']];

    // таймер сбора
    const now = this.nowS();
    const ended = !!(c && (c.status === 'closed' || (c.endsAt > 0 && c.endsAt <= now)));
    const showTimer = phase === 'collecting' && !!c && c.endsAt > 0;
    const count = c ? c.count : 0;
    const entries = c ? (c.entries || []) : [];
    const revealed = s.spinning && s.spin ? winners.filter((w) => this.wkey(w) !== s.spin.wkey) : winners;
    const winLogins = revealed.map((w) => w.login);

    // лента и колесо
    const asCard = (p, hl) => ({ nick: p.name, ini: this.ini(p.name), bg: this.shade(p.login), role: p.role, bar: this.barStyle(p.role), style: hl ? 'border: 2px solid var(--n-12); background: var(--n-4)' : '' });
    const spinOn = !!(s.spin && c && s.spin.gid === c.id && (s.spinning || (lastW && this.wkey(lastW) === s.spin.wkey)));
    let strip = [], stripX = this.restX(), stripT = 'none';
    if (spinOn && s.spin.kind === 'roulette') {
      strip = s.spin.cards.map((p, k) => asCard(p, k === 52 && phase === 'winner'));
      stripX = s.stripX; stripT = s.stripAnim ? 'transform 6s cubic-bezier(.08,.62,.12,1)' : 'none';
    } else if (entries.length) {
      for (let k = 0; k < 16; k++) strip.push(k === 6 && phase === 'winner' ? asCard(lastW, true) : asCard(entries[k % entries.length], false));
    }
    let wheelNames = [], wheelDeg = 0, wheelT = 'none';
    if (spinOn && s.spin.kind === 'wheel') { wheelNames = s.spin.labels; wheelDeg = s.wheelDeg; wheelT = s.wheelAnim ? 'transform 5.4s cubic-bezier(.1,.7,.12,1)' : 'none'; }
    else if (entries.length) { for (let i = 0; i < 12; i++) wheelNames.push(i === 0 && phase === 'winner' ? lastW : entries[i % entries.length]); wheelDeg = phase === 'winner' ? 345 : 0; }
    const wheel = wheelNames.map((p, i) => ({ nick: p.name, rot: i * 30 + 15 - 90 }));
    const hasArenaPeople = entries.length > 0 || spinOn;

    // победитель
    const confirmOn = !!(c && c.rules && c.rules.confirm);
    const annAt = c && lastW ? s.ann[c.id + ':' + this.wkey(lastW)] : 0;
    const replied = confirmOn && !!(c && c.lastReplied);
    const left = annAt ? 60 - (Date.now() - annAt) / 1000 : 0;
    const mult = lastW && c && c.rules && c.rules.luck && lastW.weight > 2 ? ' · удача ×' + String(lastW.weight / 2).replace('.', ',') : '';

    // участники
    const maxCh = entries.reduce((m, e) => Math.max(m, e.chance), 0) || 1;
    const people = entries.map((e) => {
      const won = winLogins.indexOf(e.login) >= 0;
      return { ini: this.ini(e.name), bg: this.shade(e.login), nick: e.name, role: won ? e.role + ' · победитель' : e.role, chance: this.pct(e.chance), bar: Math.round(e.chance / maxCh * 100) + '%', rowStyle: won ? 'background: rgb(var(--n-13-rgb) / 0.06)' : '' };
    });
    let peopleText = '';
    if (!s.loaded) peopleText = 'Загрузка…';
    else if (!c) peopleText = 'Список появится после старта сбора';
    else if (!entries.length) peopleText = f.entry === 'active' ? 'Пока никого. Участником станет каждый, кто напишет в чат.' : 'Пока никого. Бот уже написал в чат, что нужно отправить ' + f.keyword + '.';

    // сообщения бота (как в api.php)
    const prizeT = f.prize || 'Приз';
    const how = f.entry === 'active' ? 'Участвуют все, кто пишет в чат' : 'Пиши ' + (f.keyword || '!участвую');
    const hash12 = c ? c.seedHash.slice(0, 12) : '<хэш seed>';
    const wName = lastW ? lastW.name : 'ник';
    const botMsgs = [
      { when: 'При старте', text: 'Розыгрыш: ' + prizeT + '! ' + how + (f.duration ? ', сбор ' + this.hdur(f.duration) : '') + '. Проверка честности: sha256 ' + hash12 + '…' },
      { when: 'По кнопке «Объявить в чате»', text: '@' + wName + ', ты выиграл «' + prizeT + '»!' + (f.rules && f.rules.confirm ? ' Напиши что-нибудь в чат за 60 секунд, чтобы забрать приз.' : '') },
      { when: 'При завершении', text: 'Розыгрыш «' + prizeT + '» завершён. Победители: ' + (winners.length ? winners.map((w) => w.name).join(', ') : 'ники победителей') + '. Seed для проверки: <seed>' },
    ];

    // история
    const ST = { done: ['Завершён', 'border: 1px solid var(--n-8); color: var(--n-12)'], none: ['Без победителя', 'border: 1px dashed var(--n-8); color: var(--n-10)'], cancelled: ['Отменён', 'border: 1px dotted var(--n-8); color: var(--n-9)'] };
    const history = s.history.map((h) => {
      const st = h.status === 'cancelled' ? ST.cancelled : (h.winners.length ? ST.done : ST.none);
      const calc = s.calc[h.id] || '';
      const d = new Date(h.createdAt * 1000);
      return {
        d: d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) + ' ' + StreAPI.fmtTime(h.createdAt),
        p: h.prize, n: StreAPI.fmtNum(h.count), w: h.winners.length ? h.winners.map((w) => w.name).join(', ') : '—', s: st[0], style: st[1],
        hash: this.short(h.seedHash), open: !!s.open[h.id], openAttr: s.open[h.id] ? 'true' : 'false', checkLabel: s.open[h.id] ? 'Скрыть' : 'Проверить',
        seed: h.seed || 'скрыт', seedHash: h.seedHash, calc: calc === '-' ? 'браузер не умеет считать sha256 на этой странице' : (calc || 'считаем…'),
        verdict: !h.seed ? 'Seed ещё не раскрыт.' : (!calc ? '' : calc === h.seedHash ? 'Совпадает: seed не меняли после старта.' : (calc === '-' ? 'Проверь вручную любым калькулятором sha256.' : 'Не совпадает! Напиши в поддержку.')),
        check: () => this.check(h),
      };
    });

    const busy = s.busy;
    const obsBgs = ['repeating-conic-gradient(var(--n-4) 0 25%, var(--s-3) 0 50%) 0 0 / 16px 16px', 'var(--n-1)', '#00B140'];
    const stageBase = 'background: radial-gradient(900px 360px at 50% 0%, rgb(var(--n-13-rgb) / 0.08), transparent 70%), var(--n-1); overflow: hidden; ';
    const fsOn = s.fs || s.fsFallback;
    const remaining = count - winners.length;

    return {
      steps: ['Настройка', 'Сбор', 'Выбор', 'Победитель'].map((n, i) => ({ n: i + 1, label: n, cur: i === pi ? 'step' : 'false', style: i <= pi ? 'color: var(--n-12)' : '', dot: i < pi ? 'background: var(--n-12); color: var(--n-1); border-color: var(--n-12)' : (i === pi ? 'border-color: var(--n-12); color: var(--n-12)' : '') })),
      botOff: !!me && (!me.botEnabled || !!me.botError),
      botOffText: me && me.botEnabled ? 'Бот подключён с ошибкой: ' + me.botError + '. Зрители могут не попасть в розыгрыш.' : 'Бот не подключён к чату: без него зрители не смогут войти в розыгрыш, а итоги не попадут в чат.',
      botBtnLabel: s.botBusy ? 'Подключаем…' : (me && me.botEnabled ? 'Переподключить бота' : 'Подключить бота'),
      enableBot: () => this.enableBot(), botBusy: s.botBusy,

      locked, f, prizeInvalid: s.prizeInvalid ? 'true' : 'false',
      setPrize: (e) => this.setF({ prize: e.target.value }),
      setKeyword: (e) => this.setF({ keyword: e.target.value }),
      winnersOpt: opts([1, 2, 3, 5], f.winners).map((n) => ({ label: String(n), sel: f.winners === n ? 'true' : 'false', style: seg(f.winners === n), pick: () => this.setF({ winners: n }) })),
      entryOpt: EN.map((e) => ({ label: e[1], note: e[2], sel: f.entry === e[0] ? 'true' : 'false', style: card(f.entry === e[0]), pick: () => this.setF({ entry: e[0] }) })),
      entryWord: f.entry !== 'active', entryActive: f.entry === 'active',
      timerOpt: opts([60, 120, 300, 0], f.duration).map((d) => ({ label: d ? this.hdur(d) : 'Вручную', sel: f.duration === d ? 'true' : 'false', style: seg(f.duration === d), pick: () => this.setF({ duration: d }) })),
      timerHint: f.duration ? 'Через ' + this.hdur(f.duration) + ' бот перестанет принимать участников, а выбрать победителя можно в любой момент.' : 'Сбор идёт, пока не нажмёшь «Завершить сбор и выбрать».',
      rules: RU.map((r) => ({ label: r[1], note: r[2], on: f.rules[r[0]] ? 'true' : 'false', toggle: () => this.setF({ rules: Object.assign({}, s.form.rules, { [r[0]]: !s.form.rules[r[0]] }) }) })),
      modeOpt: MO.map((m) => ({ label: m[1], note: m[2], sel: s.mode === m[0] ? 'true' : 'false', style: card(s.mode === m[0]), pick: () => { this.lsSet('stre.gw.mode', m[0]); this.setState({ mode: m[0] }); } })),
      confirmOn: f.rules.confirm ? 'true' : 'false',
      toggleConfirm: () => this.setF({ rules: Object.assign({}, s.form.rules, { confirm: !s.form.rules.confirm }) }),

      stageStyle: fsOn
        ? stageBase + (s.fsFallback ? 'position: fixed; inset: 0; z-index: 600; ' : 'position: relative; ') + 'display: flex; flex-direction: column; width: 100%; height: 100%; box-sizing: border-box; border-radius: 0; border: 0'
        : stageBase + 'position: relative; border-radius: 12px; border: 1px solid rgb(var(--n-13-rgb) / 0.10); box-shadow: inset 0 1px 0 rgb(var(--n-13-rgb) / 0.08)',
      arenaH: fsOn ? 'flex: 1; min-height: 0' : 'height: 340px',
      scale: s.scale, glow: Math.round(320 * s.scale) + 'px ' + Math.round(200 * s.scale) + 'px',
      fsPressed: fsOn ? 'true' : 'false', fsLabel: fsOn ? 'Свернуть (Esc)' : 'На весь экран',
      fsIcon: fsOn ? 'M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6' : 'M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6',
      toggleFs: () => this.toggleFs(),
      phaseLabel: !s.loaded ? 'Загрузка' : ({ setup: 'Подготовка', collecting: ended ? 'Сбор окончен — пора выбирать' : 'Идёт сбор участников', spinning: 'Выбираем победителя', winner: c && c.winnersCount > 1 ? 'Победители: ' + winners.length + ' из ' + c.winnersCount : 'Победитель выбран' })[phase],
      stageTitle: c ? c.prize : (s.form.prize.trim() || 'Новый розыгрыш'),
      countNum: StreAPI.fmtNum(count), countWord: this.plural(count, ['участник', 'участника', 'участников']),
      showTimer, timerLabel: c && c.endsAt ? this.mmss(c.endsAt - now) : '', timerNote: ended ? 'сбор закрыт' : 'до конца сбора',

      isLoading: !s.loaded, loadingText: s.loadErr ? 'Не удалось загрузить розыгрыш: ' + s.loadErr + ' Повторим через пару секунд.' : 'Загрузка…',
      isSetup: s.loaded && phase === 'setup',
      collectEmpty: phase === 'collecting' && !entries.length,
      collectEmptyText: f.entry === 'active' ? 'Участником станет каждый, кто напишет в чат во время сбора.' : 'Зрители входят, когда пишут в чат ' + f.keyword + '. Список обновляется сам.',
      showRoulette: s.mode === 'roulette' && pi > 0 && hasArenaPeople,
      showWheel: s.mode === 'wheel' && pi > 0 && hasArenaPeople,
      showInstant: s.mode === 'instant' && phase === 'collecting' && entries.length > 0,
      strip, stripX, stripT, wheel, wheelDeg, wheelT,
      isWinner: phase === 'winner', spinningNow: phase === 'spinning', collecting: phase === 'collecting',
      winnerTitle: c && c.winnersCount > 1 ? 'Победитель ' + winners.length + ' из ' + c.winnersCount : 'Победитель',
      winner: lastW ? { name: lastW.name, ini: this.ini(lastW.name), bg: this.shade(lastW.login), role: lastW.role, chance: this.pct(lastW.chance), mult } : { name: '', ini: '', bg: 'var(--n-6)', role: '', chance: '', mult: '' },
      confirmWait: confirmOn && !replied && !!annAt && left > 0, confirmLeft: this.mmss(left), confirmPct: Math.max(0, Math.min(100, left / 60 * 100)).toFixed(1) + '%',
      confirmHint: confirmOn && !replied && !annAt, confirmMissed: confirmOn && !replied && !!annAt && left <= 0, replied,
      hasPrev: winners.length > 1, prevWinners: winners.slice(0, -1).map((w) => w.name).join(', '),

      hasActErr: !!s.actErr, actErr: s.actErr,
      seedLine: c ? 'seed sha256: ' + this.short(c.seedHash) : 'хэш seed появится при старте',
      isSetupBtn: s.loaded && phase === 'setup',
      cantStart: !!busy, startLabel: busy === 'start' ? 'Запускаем…' : 'Начать сбор участников', start: () => this.start(),
      busyAny: !!busy,
      cancelLabel: busy === 'cancel' ? 'Отменяем…' : 'Отменить', cancel: () => this.cancel(),
      cantDraw: !!busy || count === 0, drawLabel: busy === 'draw' ? 'Выбираем…' : (ended ? 'Выбрать победителя' : 'Завершить сбор и выбрать'), drawFirst: () => this.draw(false),
      cantReroll: !!busy || remaining < 1, rerollLabel: busy === 'reroll' ? 'Выбираем…' : 'Перевыбрать', reroll: () => this.draw(true),
      announceLabel: busy === 'announce' ? 'Пишем в чат…' : (annAt ? 'Напомнить в чате' : 'Объявить в чате'), announce: () => this.announce(),
      needMore: !!c && winners.length < c.winnersCount, cantNext: !!busy || remaining < 1, nextLabel: busy === 'draw' ? 'Выбираем…' : 'Следующий победитель', drawNext: () => this.draw(false),
      finishLabel: busy === 'finish' ? 'Завершаем…' : 'Завершить розыгрыш', finish: () => this.finish(),

      obsUrl: this.obsUrl(false) || '#', obsUrlShown: me ? this.obsUrl(!s.obsShow) : 'Загрузка…', noToken: !me,
      obsShowPressed: s.obsShow ? 'true' : 'false', obsShowLabel: s.obsShow ? 'Скрыть ссылку' : 'Показать ссылку',
      toggleObsShow: () => this.setState({ obsShow: !s.obsShow }),
      obsCopyLabel: s.obsCopied ? 'Скопировано' : 'Скопировать', copyObs: () => this.copyObs(),
      obsPreviewBg: obsBgs[s.obsBg],
      obsBgOpt: ['Прозрачный', 'Тёмный', 'Хромакей'].map((l, i) => ({ label: l, sel: s.obsBg === i ? 'true' : 'false', style: seg(s.obsBg === i), pick: () => { this.lsSet('stre.gw.obsBg', i); this.setState({ obsBg: i }); } })),
      resetToken: () => this.resetToken(), tokenBusy: s.tokenBusy,

      peopleHint: c && c.rules && c.rules.luck ? 'шанс с учётом удачи' : 'шанс выиграть',
      peopleMsg: !!peopleText, peopleText, hasPeople: entries.length > 0, people,
      hasMore: count > entries.length, moreText: 'Показаны последние ' + entries.length + ' · и ещё ' + StreAPI.fmtNum(count - entries.length) + ' ' + this.plural(count - entries.length, ['участник', 'участника', 'участников']),
      botMsgs, botName: (s.me && s.me.bot && s.me.bot.login) || 'StreOps',

      histMsg: !s.loaded || !s.history.length, histText: !s.loaded ? 'Загрузка…' : 'Розыгрышей ещё не было. Итоги с seed для проверки появятся здесь.',
      hasHist: s.history.length > 0, history,
    };
  }
}
DCMount(Component);
</script>
