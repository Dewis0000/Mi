<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — розыгрыши</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ov{font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9);margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10)}
.nav-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sec{padding:20px;border-radius:8px;border:1px solid var(--n-5);background:var(--s-2);display:flex;flex-direction:column;gap:14px}
.sec h2{margin:0;font-size:17px;line-height:24px;font-weight:600}
.lab{font-size:13px;line-height:18px;font-weight:500;color:var(--n-11)}
.inp{height:40px;box-sizing:border-box;padding:0 12px;border-radius:6px;background:var(--s-3);border:1px solid var(--n-8);color:var(--n-12);font:400 15px/22px var(--font-sans),sans-serif;width:100%}
.inp:disabled{border-color:var(--n-5);color:var(--n-9)}
.hint{font-size:12px;line-height:16px;color:var(--n-9);margin:0}
.seg{height:34px;padding:0 12px;border:0;border-radius:4px;background:transparent;color:var(--n-10);font:500 13px/18px var(--font-sans),sans-serif;cursor:pointer;white-space:nowrap}
.seg:hover{color:var(--n-12)}
.seg:disabled{cursor:not-allowed}
.sw{position:relative;width:40px;height:24px;border-radius:999px;border:1px solid var(--n-8);background:transparent;cursor:pointer;flex:none;padding:0}
.sw span{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:var(--n-9);transition:transform 180ms cubic-bezier(.2,0,0,1)}
.sw[aria-checked="true"]{background:var(--n-13);border-color:var(--n-13)}
.sw[aria-checked="true"] span{transform:translateX(16px);background:var(--n-1)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:40px;font-size:14px;border-top:1px solid var(--n-4)}
.mode{flex:1 1 120px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:8px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);font-family:var(--font-sans),sans-serif;cursor:pointer;text-align:left}
.mode:hover{border-color:var(--n-9)}
.bp{height:44px;padding:0 18px;border-radius:6px;border:0;background:var(--n-13);color:var(--n-1);font:500 15px/20px var(--font-sans),sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.bp:hover{background:var(--n-11)}
.bp:disabled{background:var(--n-5);color:var(--n-8);cursor:not-allowed}
.bs{height:44px;padding:0 16px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);font:500 14px/20px var(--font-sans),sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.bs:hover{background:rgb(var(--n-13-rgb) / .04);border-color:var(--n-8)}
.bs:disabled{color:var(--n-7);border-color:var(--n-5);cursor:not-allowed}
.card{flex:none;width:120px;height:148px;box-sizing:border-box;border-radius:8px;background:var(--s-3);border:1px solid var(--n-6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;position:relative;overflow:hidden}
.av{border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;color:var(--n-1);flex:none}
.pr{display:grid;grid-template-columns:28px minmax(0,1fr) 84px 56px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--n-4);font-size:13px}
.step{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--n-9)}
.step b{width:22px;height:22px;border-radius:999px;border:1px solid var(--n-6);display:inline-flex;align-items:center;justify-content:center;font:500 11px/1 'JetBrains Mono',monospace}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px; flex-wrap: wrap">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<div style="display: flex; align-items: center; gap: 8px">
<div role="status" aria-label="В эфире 2 часа 47 минут, 1284 зрителя" style="display: flex; align-items: center; height: 40px; border: 1px solid var(--n-5); border-radius: 6px">
<span style="display: inline-flex; align-items: center; gap: 8px; height: 100%; padding: 0 12px; border-right: 1px solid var(--n-5)"><span style="width: 8px; height: 8px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 4px rgb(var(--accent-rgb) / 0.25)"></span><span style="font-size: 11px; font-weight: 700; letter-spacing: .08em">В ЭФИРЕ</span></span>
<span class="mono" style="padding: 0 12px; border-right: 1px solid var(--n-5); font-size: 15px">02:47:13</span><span class="mono" style="padding: 0 12px; font-size: 15px">1 284</span>
</div>
<a href="settings.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; font-size: 14px; font-weight: 500"><span class="av" style="width: 32px; height: 32px; font-size: 12px; background: linear-gradient(135deg, var(--n-10), var(--n-6))">КС</span>kira_stream</a>
</div>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" class="sb">
<p class="sb-h">Эфир</p>
<a href="panel.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Обзор</a>
<a href="moderation.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<p class="sb-h">Бот</p>
<a href="commands.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды<span class="sb-n">24</span></a>
<a href="music.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Музыка</a>
<a href="widgets.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i" aria-current="page"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<span class="sb-i sb-off" aria-disabled="true"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 13l-7.5 7.5a2.1 2.1 0 0 1-3-3L11 10M16 16l6-6M8 8l6-6M9 7l8 8M21 11l-8-8"/></svg>Аукционы<span class="sb-tag">скоро</span></span>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
</nav>

<main style="flex: 999 1 720px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div><h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Розыгрыши</h1><p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: var(--n-10); max-width: 640px">Зрители участвуют словом в чате, за баллы канала или просто за активность. Победителя выбирает рулетка прямо на стриме, а результат можно проверить.</p></div>
<ol aria-label="Этапы розыгрыша" style="list-style: none; margin: 0; padding: 0; display: flex; gap: 16px; flex-wrap: wrap">
<template data-for="steps" data-as="s"><li class="step" style="{{ s.style }}" aria-current="{{ s.cur }}"><b style="{{ s.dot }}">{{ s.n }}</b>{{ s.label }}</li></template>
</ol>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<!-- ===== НАСТРОЙКА ===== -->
<form aria-label="Настройки розыгрыша" style="flex: 1 1 380px; max-width: 460px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<template data-if="locked"><p style="margin: 0; display: flex; gap: 8px; padding: 10px 12px; border: 1px dashed var(--n-9); border-radius: 6px; font-size: 13px; color: var(--n-11)"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Пока идёт розыгрыш, условия менять нельзя: так честнее для участников.</p></template>

<section class="sec" aria-labelledby="pz">
<h2 id="pz">Приз</h2>
<div style="display: flex; flex-direction: column; gap: 8px"><label class="lab" for="prize">Что разыгрываем</label><input id="prize" class="inp" value="Ключ Cyberpunk 2077 · Steam" disabled="{{ locked }}"></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 8px"><span class="lab" id="wn">Победителей</span><span role="radiogroup" aria-labelledby="wn" style="display: inline-flex; align-self: flex-start; padding: 2px; border: 1px solid var(--n-6); border-radius: 6px"><template data-for="winnersOpt" data-as="o"><button type="button" role="radio" class="seg mono" aria-checked="{{ o.sel }}" onClick="{{ o.pick }}" disabled="{{ locked }}" style="{{ o.style }}">{{ o.label }}</button></template></span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label class="lab" for="dl">Как выдать приз</label><select id="dl" class="inp" disabled="{{ locked }}" style="font-size: 14px"><option>Личным сообщением</option><option>Код в ЛС на Twitch</option><option>Сам свяжусь</option></select></div>
</div>
</section>

<section class="sec" aria-labelledby="hw">
<h2 id="hw">Как участвовать</h2>
<div role="radiogroup" aria-label="Способ участия" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<template data-for="entryOpt" data-as="o"><button type="button" role="radio" class="mode" aria-checked="{{ o.sel }}" onClick="{{ o.pick }}" disabled="{{ locked }}" style="{{ o.style }}"><span style="font-size: 14px; font-weight: 500">{{ o.label }}</span><span class="hint">{{ o.note }}</span></button></template>
</div>
<template data-if="entryWord"><div style="display: flex; flex-direction: column; gap: 8px"><label class="lab" for="kw">Слово для участия</label><input id="kw" class="inp mono" value="!участвую" disabled="{{ locked }}"><p class="hint">Регистр и лишние пробелы не важны. Повторные сообщения не дают лишних шансов.</p></div></template>
<template data-if="entryPoints"><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><div style="display: flex; flex-direction: column; gap: 8px"><label class="lab" for="tp">Цена билета</label><input id="tp" class="inp mono" value="1 000 баллов" disabled="{{ locked }}"></div><div style="display: flex; flex-direction: column; gap: 8px"><label class="lab" for="tm">Билетов на зрителя</label><input id="tm" class="inp mono" value="до 5" disabled="{{ locked }}"></div><p class="hint" style="grid-column: span 2">Если розыгрыш отменят, баллы за билеты вернутся автоматически.</p></div></template>
<template data-if="entryActive"><div style="display: flex; flex-direction: column; gap: 8px"><label class="lab" for="am">Писали в чат за последние</label><select id="am" class="inp" disabled="{{ locked }}"><option>10 минут</option><option selected="">30 минут</option><option>Весь стрим</option></select><p class="hint">Слово писать не нужно, участвуют все, кто был активен.</p></div></template>
<template data-if="entryList"><div style="display: flex; flex-direction: column; gap: 8px"><label class="lab" for="ls">Ники через запятую или с новой строки</label><textarea id="ls" rows="3" class="inp" style="height: auto; padding: 10px 12px; resize: vertical" disabled="{{ locked }}">moroz_tv, lenta_ln, tixiy_bard, polyana_live</textarea></div></template>
<div style="display: flex; flex-direction: column; gap: 8px"><span class="lab" id="tmr">Сбор участников</span><span role="radiogroup" aria-labelledby="tmr" style="display: inline-flex; align-self: flex-start; padding: 2px; border: 1px solid var(--n-6); border-radius: 6px"><template data-for="timerOpt" data-as="o"><button type="button" role="radio" class="seg" aria-checked="{{ o.sel }}" onClick="{{ o.pick }}" disabled="{{ locked }}" style="{{ o.style }}">{{ o.label }}</button></template></span></div>
</section>

<section class="sec" aria-labelledby="rl">
<h2 id="rl">Правила и защита от накрутки</h2>
<div>
<template data-for="rules" data-as="r"><div class="row"><span><span style="display: block">{{ r.label }}</span><span class="hint">{{ r.note }}</span></span><button type="button" role="switch" class="sw" aria-checked="{{ r.on }}" aria-label="{{ r.label }}" onClick="{{ r.toggle }}" disabled="{{ locked }}"><span></span></button></div></template>
</div>
</section>

<section class="sec" aria-labelledby="an">
<h2 id="an">Как выбрать победителя</h2>
<div role="radiogroup" aria-label="Анимация выбора" style="display: flex; gap: 8px; flex-wrap: wrap">
<template data-for="modeOpt" data-as="o"><button type="button" role="radio" class="mode" aria-checked="{{ o.sel }}" onClick="{{ o.pick }}" disabled="{{ spinningNow }}" style="{{ o.style }}"><span style="font-size: 14px; font-weight: 500">{{ o.label }}</span><span class="hint">{{ o.note }}</span></button></template>
</div>
<div class="row" style="border-top: 0"><span><span style="display: block">Победитель подтверждает участие</span><span class="hint">Должен написать в чат за 60 секунд, иначе перевыбор</span></span><button type="button" role="switch" class="sw" aria-checked="{{ confirmOn }}" aria-label="Подтверждение победителем" onClick="{{ toggleConfirm }}"><span></span></button></div>
<div class="row"><span><span style="display: block">Показывать на стриме</span><span class="hint">Виджет «Розыгрыш» в OBS: сбор, рулетка, победитель</span></span><button type="button" role="switch" class="sw" aria-checked="true" aria-label="Показывать на стриме"><span></span></button></div>
</section>
</form>

<!-- ===== СЦЕНА ===== -->
<section aria-label="Ход розыгрыша" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

<div role="region" aria-label="Сцена розыгрыша" style="{{ stageStyle }}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--n-5); flex-wrap: wrap">
<div><p class="ov">{{ phaseLabel }}</p><p style="margin: 4px 0 0; font-size: 20px; line-height: 26px; font-weight: 600">Ключ Cyberpunk 2077 · Steam</p></div>
<div style="display: flex; gap: 20px; align-items: baseline">
<span><span class="mono" style="font-size: 24px; font-weight: 500">{{ count }}</span> <span style="font-size: 13px; color: var(--n-9)">участников</span></span>
<template data-if="collecting"><span><span class="mono" style="font-size: 24px; font-weight: 500">1:24</span> <span style="font-size: 13px; color: var(--n-9)">до конца сбора</span></span></template>
<button type="button" onClick="{{ toggleFs }}" aria-pressed="{{ fsPressed }}" style="align-self: center; height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--n-6); background: rgb(var(--n-1-rgb) / 0.6); color: var(--n-12); font: 500 13px/18px var(--font-sans), sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 8px"><template data-if="fsOff"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"></path></svg></template><template data-if="fs"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6"></path></svg></template>{{ fsLabel }}</button>
</div>
</div>

<div style="position: relative; {{ arenaH }}; display: flex; align-items: center; justify-content: center">

<template data-if="isSetup"><div style="text-align: center; max-width: 420px; padding: 24px"><svg class="ic" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--n-9)"><rect x="3" y="8" width="18" height="13" rx="1"></rect><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"></path></svg><p style="margin: 16px 0 0; font-size: 20px; font-weight: 600">Розыгрыш ещё не начат</p><p style="margin: 8px 0 0; font-size: 14px; line-height: 20px; color: var(--n-10)">Проверь условия слева и запусти сбор. Бот напишет в чат, как участвовать.</p></div></template>

<template data-if="showRoulette">
<div style="position: absolute; inset: 0; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 50%; height: 148px; margin-top: -74px; background: linear-gradient(90deg, var(--n-2) 0%, transparent 18%, transparent 82%, var(--n-2) 100%); z-index: 2; pointer-events: none"></div>
<div aria-hidden="true" style="position: absolute; left: 50%; top: 40px; bottom: 40px; width: 2px; margin-left: -1px; background: var(--n-12); z-index: 3; box-shadow: 0 0 0 1px var(--n-2)"></div>

<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      phase: 'setup', mode: 0, entry: 0, winners: 0, timer: 1, confirmOn: true,
      rules: [true, true, true, true, true, false],
      winIdx: -1, excluded: [], stripX: -444, anim: false, wheelDeg: 0, wheelAnim: false,
      confirmed: false, drawn: [], history: null,
      fs: false, obsShow: false, obsCopied: false, obsBg: 0, obsWhen: 1, obsSound: true
    };
  }
  people() {
    const P = [
      ['moroz_tv', 'подписчик', 1], ['lenta_ln', 'фолловер', 1], ['tixiy_bard', 'подписчик', 1], ['polyana_live', 'VIP', 1],
      ['gleb_1999', 'фолловер', 1], ['nastya_k', 'фолловер', 1], ['sever_ops', 'подписчик', 1], ['dasha_draws', 'фолловер', 1],
      ['ivan_gg', 'фолловер', 1], ['katya_meow', 'подписчик', 1], ['artem_cs', 'фолловер', 1], ['rina_vibe', 'VIP', 1]
    ];
    const luck = this.state.rules[3];
    const mult = (r) => luck ? (r === 'подписчик' ? 2 : (r === 'VIP' ? 1.5 : 1)) : 1;
    const shades = ['var(--n-12)', 'var(--n-11)', 'var(--n-10)', 'var(--n-9)'];
    const total = P.reduce((a, p) => a + p[2] * mult(p[1]), 0) + 196;
    return P.map((p, i) => ({
      nick: p[0], role: p[1], tickets: p[2], w: p[2] * mult(p[1]),
      ini: p[0].slice(0, 2).toUpperCase(),
      bg: 'linear-gradient(135deg, ' + shades[i % 4] + ', var(--n-5))',
      chance: ((p[2] * mult(p[1])) / total * 100).toFixed(2).replace('.', ',') + '%'
    }));
  }
  pick(ppl) {
    const pool = ppl.map((p, i) => i).filter((i) => this.state.excluded.indexOf(i) < 0 && this.state.drawn.indexOf(i) < 0);
    if (!pool.length) return -1;
    const sum = pool.reduce((a, i) => a + ppl[i].w, 0);
    let r = Math.random() * sum;
    for (const i of pool) { r -= ppl[i].w; if (r <= 0) return i; }
    return pool[pool.length - 1];
  }
  runSpin(extraExclude) {
    const ppl = this.people();
    const excluded = this.state.excluded.concat(extraExclude || []);
    this.state.excluded = excluded;
    const idx = this.pick(ppl);
    if (idx < 0) return;
    const reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const mode = this.state.mode;
    if (mode === 2 || reduce) {
      this.setState({ excluded, winIdx: idx, phase: 'winner', confirmed: false });
      return;
    }
    if (mode === 0) {
      const target = 52;
      const jitter = Math.round((Math.random() - 0.5) * 80);
      this.setState({ excluded, winIdx: idx, phase: 'spinning', anim: false, stripX: -(3 * 128 + 60), confirmed: false });
      setTimeout(() => this.setState({ anim: true, stripX: -(target * 128 + 60 + jitter) }), 60);
      setTimeout(() => this.setState({ phase: 'winner' }), 6200);
    } else {
      const seg = 30;
      const pos = idx % 12;
      const base = this.state.wheelDeg - (this.state.wheelDeg % 360);
      const final = base + 360 * 6 + (360 - (pos * seg + seg / 2)) - 90 + Math.round((Math.random() - 0.5) * 16);
      this.setState({ excluded, winIdx: idx, phase: 'spinning', wheelAnim: true, wheelDeg: final, confirmed: false });
      setTimeout(() => this.setState({ phase: 'winner' }), 5600);
    }
  }
  renderVals() {
    const s = this.state;
    const ppl = this.people();
    const phases = ['setup', 'collecting', 'spinning', 'winner'];
    const pi = phases.indexOf(s.phase);
    const stepNames = ['Настройка', 'Сбор', 'Выбор', 'Победитель'];
    const seg = (cur, i) => cur === i ? 'background: var(--n-12); color: var(--n-1)' : '';
    const card = (cur, i) => cur === i ? 'border: 2px solid var(--n-12); padding: 11px; background: rgb(var(--n-13-rgb) / 0.04)' : '';
    const locked = pi > 0;
    const EN = [['Слово в чат', 'Пишут !участвую'], ['Баллы канала', 'Билеты за баллы, можно несколько'], ['Активные зрители', 'Все, кто писал в чат'], ['Список ников', 'Вставь вручную']];
    const MO = [['Рулетка', 'Лента карточек, как при открытии кейса'], ['Колесо', 'Барабан с никами'], ['Мгновенно', 'Без анимации']];
    const RU = [
      ['Только фолловеры', 'Фолловят канал не меньше 24 часов'],
      ['Без новых аккаунтов', 'Аккаунтам меньше 7 дней участие закрыто'],
      ['Без модераторов и ботов', 'Модераторы, Nightbot, StreamElements не участвуют'],
      ['Удача подписчиков', 'Подписчикам шанс ×2, VIP ×1,5'],
      ['Без недавних победителей', 'Кто выигрывал за 7 дней, не участвует'],
      ['Только присутствующие', 'Победитель должен быть в чате в момент выбора']
    ];
    const strip = [];
    const win = s.winIdx >= 0 ? ppl[s.winIdx] : null;
    for (let k = 0; k < 60; k++) {
      const p = (k === 52 && win) ? win : ppl[(k * 7 + 3) % ppl.length];
      const isW = k === 52 && s.phase === 'winner';
      strip.push({
        nick: p.nick, ini: p.ini, bg: p.bg, role: p.role,
        bar: p.role === 'подписчик' ? 'background: var(--n-12)' : (p.role === 'VIP' ? 'background: repeating-linear-gradient(90deg, var(--n-12) 0 6px, transparent 6px 10px)' : 'background: var(--n-6)'),
        style: isW ? 'border: 2px solid var(--n-12); background: var(--n-4)' : ''
      });
    }
    const wheel = ppl.map((p, i) => ({ nick: p.nick, rot: i * 30 + 15 - 90 }));
    const nDrawn = s.drawn.length;
    const needW = s.winners + 1;
    const H0 = [
      { d: '07.10', p: 'Скин AK-47 | Redline', n: '318', w: 'sever_ops', s: 'Выдан', style: 'border: 1px solid var(--n-8); color: var(--n-12)' },
      { d: '03.10', p: '500 ₽ на Steam', n: '264', w: 'nastya_k', s: 'Перевыбран 1 раз', style: 'border: 1px dashed var(--n-10); color: var(--n-11)' },
      { d: '29.09', p: 'Подписка Twitch ×3', n: '187', w: 'gleb_1999, ivan_gg, rina_vibe', s: 'Выдан', style: 'border: 1px solid var(--n-8); color: var(--n-12)' },
      { d: '24.09', p: 'Ключ Hades II', n: '402', w: '—', s: 'Отменён', style: 'border: 1px dotted var(--n-8); color: var(--n-9)' }
    ];
    const history = s.history || H0;
    const stageBase = 'background: radial-gradient(900px 360px at 50% 0%, rgb(var(--n-13-rgb) / 0.08), transparent 70%), var(--n-2); overflow: hidden; ';
    const obsBgs = ['repeating-conic-gradient(var(--n-4) 0 25%, var(--s-3) 0 50%) 0 0 / 16px 16px', 'var(--n-2)', '#00B140'];
    return {
      stageStyle: s.fs
        ? stageBase + 'position: fixed; inset: 0; z-index: 600; display: flex; flex-direction: column; border-radius: 0'
        : stageBase + 'position: relative; border-radius: 12px; border: 1px solid rgb(var(--n-13-rgb) / 0.10); box-shadow: inset 0 1px 0 rgb(var(--n-13-rgb) / 0.08)',
      arenaH: s.fs ? 'flex: 1; min-height: 360px' : 'height: 340px',
      fs: s.fs, fsOff: !s.fs, fsPressed: s.fs ? 'true' : 'false',
      fsLabel: s.fs ? 'Свернуть' : 'На весь экран',
      toggleFs: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ fs: !s.fs }); },
      obsUrl: s.obsShow ? 'https://streops.ru/w/giveaway/3c81e0f7a2d4' : 'https://streops.ru/w/giveaway/••••••••••••',
      obsShowLabel: s.obsShow ? 'Скрыть ссылку' : 'Показать ссылку',
      toggleObsShow: () => this.setState({ obsShow: !s.obsShow }),
      obsCopyLabel: s.obsCopied ? 'Скопировано' : 'Скопировать',
      copyObs: () => this.setState({ obsCopied: true }),
      obsPreviewBg: obsBgs[s.obsBg],
      obsBgOpt: ['Прозрачный', 'Тёмный', 'Хромакей'].map((l, i) => ({ label: l, sel: s.obsBg === i ? 'true' : 'false', style: seg(s.obsBg, i), pick: () => this.setState({ obsBg: i }) })),
      obsWhenOpt: ['Всегда', 'Только во время розыгрыша'].map((l, i) => ({ label: l, sel: s.obsWhen === i ? 'true' : 'false', style: seg(s.obsWhen, i), pick: () => this.setState({ obsWhen: i }) })),
      obsSound: s.obsSound ? 'true' : 'false',
      toggleObsSound: () => this.setState({ obsSound: !s.obsSound }),
      steps: stepNames.map((n, i) => ({ n: i + 1, label: n, cur: i === pi ? 'step' : 'false', style: i <= pi ? 'color: var(--n-12)' : '', dot: i < pi ? 'background: var(--n-12); color: var(--n-1); border-color: var(--n-12)' : (i === pi ? 'border-color: var(--n-12); color: var(--n-12)' : '') })),
      locked, isLive: pi > 0,
      winnersOpt: ['1', '2', '3', '5'].map((l, i) => ({ label: l, sel: s.winners === i ? 'true' : 'false', style: seg(s.winners, i), pick: () => this.setState({ winners: i }) })),
      entryOpt: EN.map((e, i) => ({ label: e[0], note: e[1], sel: s.entry === i ? 'true' : 'false', style: card(s.entry, i), pick: () => this.setState({ entry: i }) })),
      entryWord: s.entry === 0, entryPoints: s.entry === 1, entryActive: s.entry === 2, entryList: s.entry === 3,
      timerOpt: ['1 мин', '2 мин', '5 мин', 'Вручную'].map((l, i) => ({ label: l, sel: s.timer === i ? 'true' : 'false', style: seg(s.timer, i), pick: () => this.setState({ timer: i }) })),
      rules: RU.map((r, i) => ({ label: r[0], note: r[1], on: s.rules[i] ? 'true' : 'false', toggle: () => { const n = s.rules.slice(); n[i] = !n[i]; this.setState({ rules: n }); } })),
      modeOpt: MO.map((m, i) => ({ label: m[0], note: m[1], sel: s.mode === i ? 'true' : 'false', style: card(s.mode, i), pick: () => this.setState({ mode: i, anim: false, stripX: -(3 * 128 + 60) }) })),
      confirmOn: s.confirmOn ? 'true' : 'false', toggleConfirm: () => this.setState({ confirmOn: !s.confirmOn }),
      phaseLabel: ['Подготовка', 'Идёт сбор участников', 'Выбираем победителя', 'Победитель'][pi],
      count: pi === 0 ? '0' : '208',
      isSetup: pi === 0, collecting: pi === 1, spinningNow: pi === 2, isWinner: pi === 3,
      showRoulette: pi > 0 && s.mode === 0, showWheel: pi > 0 && s.mode === 1, showInstant: pi > 0 && pi < 3 && s.mode === 2,
      instantGlyph: '? ? ?',
      strip, stripX: s.stripX, stripT: s.anim ? 'transform 6s cubic-bezier(.08,.62,.12,1)' : 'none',
      wheel, wheelDeg: s.wheelDeg, wheelT: s.wheelAnim ? 'transform 5.4s cubic-bezier(.1,.7,.12,1)' : 'none',
      winner: win || { nick: '', ini: '', bg: 'var(--n-6)', role: '', chance: '', tickets: '' },
      winnerTitle: needW > 1 ? 'Победитель ' + (nDrawn + 1) + ' из ' + needW : 'Победитель',
      waitConfirm: s.confirmOn && !s.confirmed, confirmed: s.confirmOn && s.confirmed,
      noReroll: ppl.length - s.excluded.length - s.drawn.length <= 1,
      hasPeople: pi > 0,
      people: ppl.map((p, i) => Object.assign({}, p, {
        bar: Math.min(100, p.w * 50) + '%',
        rowStyle: (s.excluded.indexOf(i) >= 0) ? 'opacity: .4; text-decoration: line-through' : ((i === s.winIdx && pi === 3) || s.drawn.indexOf(i) >= 0 ? 'background: rgb(var(--n-13-rgb) / 0.06)' : '')
      })),
      spinLabel: ['Крутить рулетку', 'Крутить колесо', 'Выбрать победителя'][s.mode],
      start: () => this.setState({ phase: 'collecting', excluded: [], drawn: [], winIdx: -1, anim: false, stripX: -(3 * 128 + 60) }),
      cancel: () => this.setState({ phase: 'setup', winIdx: -1 }),
      spin: () => this.runSpin([]),
      reroll: () => this.runSpin([s.winIdx]),
      confirm: () => this.setState({ confirmed: true }),
      finishLabel: nDrawn + 1 < needW ? 'Следующий победитель' : 'Завершить розыгрыш',
      finish: () => {
        const drawn = s.drawn.concat([s.winIdx]);
        if (drawn.length < needW) { this.state.drawn = drawn; this.setState({ drawn }); this.runSpin([]); return; }
        const names = drawn.map((i) => ppl[i].nick).join(', ');
        this.setState({ phase: 'setup', drawn: [], excluded: [], winIdx: -1, anim: false, stripX: -(3 * 128 + 60),
          history: [{ d: '10.10', p: 'Ключ Cyberpunk 2077', n: '208', w: names, s: 'Выдан', style: 'border: 1px solid var(--n-8); color: var(--n-12)' }].concat(history) });
      },
      history
    };
  }
}
DCMount(Component);
</script>
