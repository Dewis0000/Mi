<div style="width: 1440px; min-height: 2900px; box-sizing: border-box; padding: 72px 96px 96px; background: #0A0A0A; color: #F2F2F2; font-family: 'Onest', system-ui, sans-serif">
<p class="ov">01 · Цвет</p>
<h1 style="margin: 16px 0 0; font-size: 56px; line-height: 60px; letter-spacing: -0.03em; font-weight: 500">Нейтральная шкала N0–N13</h1>
<p class="lead">В шкале 14 ступеней без цветового оттенка: от чистого чёрного до чистого белого. Шаг между ступенями неравный. Внизу шкалы шаги мелкие, потому что там живут фоны и глаз различает 3–5 единиц яркости. В середине шаги крупные, чтобы текстовые уровни уверенно расходились по контрасту.</p>

<div style="margin-top: 40px; display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); border: 1px solid #2A2A2A; border-radius: 8px; overflow: hidden">
<div class="tile" style="background: #000000; color: #B4B4B4"><span class="mono" style="font-size: 12px">N0</span><span class="mono" style="font-size: 11px">#000000<br>void</span></div>
<div class="tile" style="background: #0A0A0A; color: #B4B4B4; border-left: 1px solid #1F1F1F"><span class="mono" style="font-size: 12px">N1</span><span class="mono" style="font-size: 11px">#0A0A0A<br>page</span></div>
<div class="tile" style="background: #111111; color: #B4B4B4"><span class="mono" style="font-size: 12px">N2</span><span class="mono" style="font-size: 11px">#111111<br>surface</span></div>
<div class="tile" style="background: #171717; color: #B4B4B4"><span class="mono" style="font-size: 12px">N3</span><span class="mono" style="font-size: 11px">#171717<br>raised</span></div>
<div class="tile" style="background: #1F1F1F; color: #B4B4B4"><span class="mono" style="font-size: 12px">N4</span><span class="mono" style="font-size: 11px">#1F1F1F<br>overlay</span></div>
<div class="tile" style="background: #2A2A2A; color: #DCDCDC"><span class="mono" style="font-size: 12px">N5</span><span class="mono" style="font-size: 11px">#2A2A2A<br>divider</span></div>
<div class="tile" style="background: #3A3A3A; color: #DCDCDC"><span class="mono" style="font-size: 12px">N6</span><span class="mono" style="font-size: 11px">#3A3A3A<br>border</span></div>
<div class="tile" style="background: #525252; color: #F2F2F2"><span class="mono" style="font-size: 12px">N7</span><span class="mono" style="font-size: 11px">#525252<br>disabled</span></div>
<div class="tile" style="background: #6E6E6E; color: #FFFFFF"><span class="mono" style="font-size: 12px">N8</span><span class="mono" style="font-size: 11px">#6E6E6E<br>control</span></div>
<div class="tile" style="background: #8F8F8F; color: #0A0A0A"><span class="mono" style="font-size: 12px">N9</span><span class="mono" style="font-size: 11px">#8F8F8F<br>muted</span></div>
<div class="tile" style="background: #B4B4B4; color: #0A0A0A"><span class="mono" style="font-size: 12px">N10</span><span class="mono" style="font-size: 11px">#B4B4B4<br>secondary</span></div>
<div class="tile" style="background: #DCDCDC; color: #0A0A0A"><span class="mono" style="font-size: 12px">N11</span><span class="mono" style="font-size: 11px">#DCDCDC<br>hover inv.</span></div>
<div class="tile" style="background: #F2F2F2; color: #0A0A0A"><span class="mono" style="font-size: 12px">N12</span><span class="mono" style="font-size: 11px">#F2F2F2<br>text</span></div>
<div class="tile" style="background: #FFFFFF; color: #0A0A0A"><span class="mono" style="font-size: 12px">N13</span><span class="mono" style="font-size: 11px">#FFFFFF<br>focus</span></div>
</div>
<div style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); margin-top: 8px" class="mono">
<span style="font-size: 11px; color: #6E6E6E; padding: 0 10px">—</span><span style="font-size: 11px; color: #6E6E6E; padding: 0 10px">—</span><span style="font-size: 11px; color: #6E6E6E; padding: 0 10px">—</span><span style="font-size: 11px; color: #6E6E6E; padding: 0 10px">—</span><span style="font-size: 11px; color: #6E6E6E; padding: 0 10px">—</span><span style="font-size: 11px; color: #6E6E6E; padding: 0 10px">—</span>
<span style="font-size: 11px; color: #8F8F8F; padding: 0 10px">1.74</span><span style="font-size: 11px; color: #8F8F8F; padding: 0 10px">2.53</span><span style="font-size: 11px; color: #B4B4B4; padding: 0 10px">3.88</span><span style="font-size: 11px; color: #DCDCDC; padding: 0 10px">6.12</span><span style="font-size: 11px; color: #DCDCDC; padding: 0 10px">9.55</span><span style="font-size: 11px; color: #DCDCDC; padding: 0 10px">14.44</span><span style="font-size: 11px; color: #DCDCDC; padding: 0 10px">17.68</span><span style="font-size: 11px; color: #DCDCDC; padding: 0 10px">19.80</span>
</div>
<p class="why" style="margin-top: 8px">Нижняя строка — контраст ступени к фону страницы N1. Из шкалы следует: N9 — самый тёмный цвет для текста (≥ 4.5:1), а N8 — самая тёмная граница интерактивного элемента (≥ 3:1).</p>

<h2 class="h2">Роли ступеней</h2>

<section style="margin-top: 80px">
<p class="ov">Семантика без цвета</p>
<h2 class="h2">Статус = яркость + иконка + рисунок границы</h2>
<p class="lead">Четыре семантических статуса различаются тремя признаками сразу. Если пропадёт один из них (серый плохо виден на ярком мониторе, пользователь не различает оттенки), два оставшихся всё равно передадут смысл.</p>
<div style="margin-top: 32px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">

<div style="display: flex; flex-direction: column; gap: 12px">
<div role="status" style="display: flex; gap: 12px; padding: 14px 16px; background: rgba(255,255,255,0.04); border: 1px solid #6E6E6E; border-radius: 8px">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="10" fill="#F2F2F2"></circle><path d="M8 12.5l2.5 2.5L16 9.5" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Twitch подключён</p><p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: #B4B4B4">Чат-бот видит сообщения канала.</p></div>
</div>
<table class="t"><tbody>
<tr><td class="mono">--status-success</td><td>Сплошная 1 px N8, иконка с заливкой, фон 4%</td></tr>
</tbody></table>
<p class="why"><b>Почему:</b> заливка иконки и спокойная рамка означают «готово», и при этом не перетягивают внимание.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<div role="status" style="display: flex; gap: 12px; padding: 14px 16px; background: repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 7px); border: 1px dashed #B4B4B4; border-radius: 8px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F2F2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M10.3 3.9L2.4 17.5a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></svg>
<div><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Токен YouTube истекает через 3 дня</p><p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: #B4B4B4">Переподключи платформу, чтобы бот не остановился.</p></div>
</div>
<table class="t"><tbody>
<tr><td class="mono">--status-warning</td><td>Пунктир 1 px N10, треугольник, штриховка 5%</td></tr>
</tbody></table>
<p class="why"><b>Почему:</b> пунктир читается как «пока не сломано, но внимание», а штриховка заметна даже в отрыве от иконки.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<div role="alert" style="display: flex; gap: 12px; padding: 13px 15px; background: repeating-linear-gradient(135deg, rgba(255,255,255,0.09) 0 2px, transparent 2px 6px); border: 2px solid #F2F2F2; border-radius: 8px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F2F2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M7.9 2h8.2L22 7.9v8.2L16.1 22H7.9L2 16.1V7.9z"></path><path d="M15 9l-6 6M9 9l6 6"></path></svg>
<div><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 600">Не удалось сохранить команду</p><p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: #DCDCDC">Команда «!дс» уже существует. Выбери другое название.</p></div>
</div>
<table class="t"><tbody>
<tr><td class="mono">--status-error</td><td>Сплошная 2 px N12, восьмиугольник, плотная штриховка, жирный заголовок</td></tr>
</tbody></table>
<p class="why"><b>Почему:</b> ошибка — самый яркий и самый толстый элемент на экране. Красный не нужен, потому что это не необратимое действие.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<div role="status" style="display: flex; gap: 12px; padding: 14px 16px; background: transparent; border: 1px solid #3A3A3A; border-radius: 8px">

<div><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500; color: #DCDCDC">Статистика обновляется раз в минуту</p><p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: #8F8F8F">Данные за последние 60 секунд появятся позже.</p></div>
</div>
<table class="t"><tbody>
<tr><td class="mono">--status-info</td><td>Сплошная 1 px N6, контурная «i», без фона, текст N10</td></tr>
</tbody></table>
<p class="why"><b>Почему:</b> справка — самый тихий уровень и не должна конкурировать с данными.</p>
</div>
</div>
</section>

<section style="margin-top: 80px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px">
<div style="grid-column: span 5">
<p class="ov">Единственный акцент</p>
<h2 class="h2">«Живой» красный</h2>
<p class="lead">Тон один, у него четыре роли. Заливку #D92D20 подобрали так, чтобы белая подпись на ней давала 4.83:1 и проходила AA для мелкого текста. Для красного текста на тёмном фоне есть отдельный, более светлый тон.</p>
<p class="why" style="margin-top: 12px"><b>Почему:</b> один и тот же красный не может быть и фоном под белым текстом, и текстом на чёрном. Поэтому роль одна, а тонов два.</p>
