<dl class="spec" style="margin: 22px 0 0">
<dt>Назначение</dt><dd>Опознать продукт, войти или открыть свой профиль. На стрим-панели — дополнительно постоянно видеть статус эфира.</dd>
<dt>Анатомия</dt><dd>Знак 24 + «StreOps» (ссылка на главную) · справа: кнопка «Начать» либо триггер профиля (аватар 32 + ник + шеврон) · в stream-варианте перед аватаром идёт группа метрик: «В ЭФИРЕ», таймер, зрители.</dd>
<dt>Варианты</dt><dd><span class="mono">guest · user · stream</span>. Если эфира нет, stream-вариант выглядит как user, а на месте метрик стоит «Не в эфире» (N9).</dd>
<dt>Состояния</dt><dd>Триггер профиля: hover 4% · open 8% и шеврон вверх · focus — двойное кольцо. При скролле больше 8 px хедер получает стекло raised, до этого он прозрачный.</dd>
<dt>Размеры</dt><dd>Высота 64 (моб. 56), поля 24 (моб. 16), группа метрик 40, цель профиля 44. Липкий, <span class="mono">z-header 200</span>.</dd>
<dt>Адаптив</dt><dd>&lt; 640: ник скрывается, остаётся аватар; метрики сжимаются до точки, таймера и числа без иконок; «В ЭФИРЕ» передаёт красная точка и <span class="mono">aria-label</span>.</dd>
<dt>Доступность</dt><dd><span class="mono">&lt;header role="banner"&gt;</span>; триггер — <span class="mono">button aria-haspopup="menu" aria-expanded</span>; метрики — <span class="mono">role="status" aria-live="off"</span> (таймер не зачитывается каждую секунду), число зрителей объявляется только при запросе; первым идёт skip-link «К содержимому».</dd>
<dt>Не делать</dt><dd class="no">Не ставить больше одной CTA для гостя. Не анимировать счётчик зрителей. Не красить таймер в красный: красная только точка.</dd>
</dl>

<dt>Поведение</dt><dd>Открывается по клику, Enter, Space и ↓. Стрелки двигают фокус, Home/End — к краям, Esc закрывает и возвращает фокус на триггер. Клик снаружи тоже закрывает.</dd>
<dt>ARIA</dt><dd><span class="mono">role="menu"</span>, пункты <span class="mono">menuitem</span>, разделитель <span class="mono">separator</span>. Текущая страница помечается <span class="mono">aria-current="page"</span> и фоном 4%.</dd>
<dt>Не делать</dt><dd class="no">Не прятать «Выйти» в подменю и не красить его в красный: выход обратим.</dd>
</dl>
<p class="why"><b>Почему метрики в хедере, а не в панели:</b> длительность и зрители — единственное, что стример проверяет каждые несколько минут на любом экране. Хедер — единственное место, которое видно всегда. <b>Почему точка эфира дублируется на аватаре:</b> на мобильном группа метрик сжимается, а точка на аватаре остаётся.</p>

<dt>Состояния</dt><dd>hover 4% и текст N12 · current: фон 10%, линия 2 px слева, текст N12 · focus — двойное кольцо · locked (нет в тарифе): текст N7 и бейдж тарифа, клик открывает поповер «Доступно в “Про”».</dd>
<dt>Размеры</dt><dd>Пункт 40 (свёрнуто 44×44), отступ 12, gap иконки 12, группы разделены 16. Анимация ширины — <span class="mono">dur-slow</span>, layout.</dd>
<dt>Адаптив</dt><dd>≥ 1024 раскрыто · 640–1023 свёрнуто · &lt; 640 меню уходит в drawer слева, открывается кнопкой в хедере, ширина 280.</dd>
<dt>Доступность</dt><dd><span class="mono">&lt;nav aria-label&gt;</span>, <span class="mono">aria-current="page"</span>. В свёрнутом виде у каждой иконки есть <span class="mono">aria-label</span> и тултип при фокусе и hover. «Свернуть» — <span class="mono">aria-expanded</span>.</dd>
<dt>Не делать</dt><dd class="no">Не отмечать текущий пункт только фоном: линия слева обязательна. Не вкладывать подменю глубже одного уровня. Не прятать заблокированные пункты, пусть показывают, что есть в тарифе.</dd>
</dl>
<p class="why" style="margin-top: 12px"><b>Почему стекло ambient:</b> меню — второстепенная плоскость. Оно должно пропускать пользовательский фон и не спорить с контентом. Состав разделов — <span class="prop">Предложение</span></p>
