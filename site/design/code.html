<p class="ov">07 · Код</p>
<h1 style="margin: 16px 0 0; font-size: 56px; line-height: 60px; letter-spacing: -0.03em; font-weight: 500">CSS-переменные → Tailwind → JSON</h1>
<p style="margin: 12px 0 0; font-size: 15px; line-height: 22px; color: #B4B4B4; max-width: 820px">Источник правды — CSS-переменные. Tailwind только ссылается на них через <span class="mono">var()</span>, поэтому смена темы и пользовательские <span class="mono">--user-*</span> применяются в рантайме без пересборки. JSON в формате W3C Design Tokens нужен для Figma, документации и проверок контраста в CI. Полные файлы лежат в репозитории: <span class="mono">design-system/tokens.css</span>, <span class="mono">tailwind.config.ts</span>, <span class="mono">tokens.json</span>.</p>
<p class="why" style="margin-top: 10px"><b>Почему без alpha-модификаторов Tailwind (bg-fg/50):</b> они требуют хранить цвета как RGB-каналы. Вместо этого полупрозрачности заданы отдельными токенами <span class="mono">--state-*</span> и <span class="mono">--glass-*</span>, чтобы прозрачность была решением системы, а не случайной цифрой в разметке.</p>

<pre><span class="c">/* Тёмная тема — основная */</span>
:root, [data-theme="dark"] {
  color-scheme: dark;
  <span class="c">/* Нейтральная шкала N0–N13 */</span>
  --n-0: #000000;  --n-1: #0A0A0A;  --n-2: #111111;
  --n-3: #171717;  --n-4: #1F1F1F;  --n-5: #2A2A2A;
  --n-6: #3A3A3A;  --n-7: #525252;  --n-8: #6E6E6E;
  --n-9: #8F8F8F;  --n-10: #B4B4B4; --n-11: #DCDCDC;
  --n-12: #F2F2F2; --n-13: #FFFFFF;

  --bg-void: var(--n-0);
  --bg-page: var(--n-1);
  --bg-surface: var(--n-2);
  --bg-raised: var(--n-3);
  --bg-overlay: var(--n-4);

  --state-hover: rgba(255,255,255,.04);
  --state-active: rgba(255,255,255,.08);
  --state-selected: rgba(255,255,255,.10);

  --border-subtle: var(--n-5);
  --border-default: var(--n-6);
  --border-strong: var(--n-8);   <span class="c">/* ≥ 3:1 */</span>

  --text-primary: var(--n-12);   <span class="c">/* 17.68:1 */</span>
  --text-secondary: var(--n-10); <span class="c">/*  9.55:1 */</span>
  --text-muted: var(--n-9);      <span class="c">/*  6.12:1 */</span>
  --text-disabled: var(--n-7);
  --text-on-inverse: var(--n-1);

  --fill-inverse: var(--n-13);
  --fill-inverse-hover: var(--n-11);
  --fill-inverse-active: var(--n-10);

  --focus-color: var(--n-13);
  --focus-gap: var(--n-1);
  --focus-ring: 0 0 0 2px var(--focus-gap),
                0 0 0 4px var(--focus-color);

  <span class="c">/* Единственный акцент */</span>
  --live: #D92D20;        <span class="c">/* белый текст 4.83:1 */</span>
  --live-hover: #C42B1C;
  --live-text: #FF6369;   <span class="c">/* на N1 6.83:1 */</span>
  --live-border: rgba(255,99,105,.40);
  --live-on: #FFFFFF;

  <span class="c">/* Семантика: рисунок + иконка */</span>
  --status-success-border: 1px solid var(--n-8);
  --status-success-bg: rgba(255,255,255,.04);
  --status-warning-border: 1px dashed var(--n-10);
  --status-warning-bg: repeating-linear-gradient(
    135deg, rgba(255,255,255,.05) 0 1px,
    transparent 1px 7px);
  --status-error-border: 2px solid var(--n-12);
  --status-error-bg: repeating-linear-gradient(
    135deg, rgba(255,255,255,.09) 0 2px,
    transparent 2px 6px);
  --status-info-border: 1px solid var(--n-6);
  --status-info-bg: transparent;

  <span class="c">/* Стекло */</span>
  --glass-ambient-bg: rgba(255,255,255,.03);
  --glass-ambient-blur: 12px;
  --glass-ambient-border: rgba(255,255,255,.06);
  --glass-ambient-highlight: inset 0 1px 0 rgba(255,255,255,.04);
  --glass-raised-bg: rgba(18,18,18,
    calc(.62 + var(--user-glass-boost)));
  --glass-raised-blur: 24px;
  --glass-raised-border: rgba(255,255,255,.10);
  --glass-raised-highlight: inset 0 1px 0 rgba(255,255,255,.08);
  --glass-overlay-bg: rgba(14,14,14,
    calc(.84 + var(--user-glass-boost)));
  --glass-overlay-blur: 40px;
  --glass-overlay-border: rgba(255,255,255,.14);
  --glass-overlay-highlight: inset 0 1px 0 rgba(255,255,255,.12);

  --shadow-1: 0 1px 2px rgba(0,0,0,.50);
  --shadow-2: 0 4px 12px -2px rgba(0,0,0,.50);
  --shadow-3: 0 12px 32px -8px rgba(0,0,0,.60);
  --shadow-4: 0 32px 80px -16px rgba(0,0,0,.75);
  --scrim: rgba(0,0,0,.64);
  --grain-opacity: .04;

  <span class="c">/* ===== Пользовательский слой ===== */</span>
  --user-bg-color: var(--n-1);
  --user-bg-image: none;
  --user-bg-blur: 0px;
  --user-bg-dim: 0;
  --user-bg-dim-min: 0;
  --user-gradient: none;
  --user-tint: transparent;
  --user-effect: none;
  --user-glass-boost: 0;
}</pre>

const v = (n: string) => `var(--${n})`;

export default {

  darkMode: ['selector', '[data-theme="dark"]'],
  theme: {
    screens: { sm: '640px', lg: '1024px',
               xl: '1280px', '2xl': '1536px' },
    colors: {
      transparent: 'transparent',
      current: 'currentColor',
      n: Object.fromEntries(Array.from(
        { length: 14 }, (_, i) => [i, v(`n-${i}`)])),
      bg: { void: v('bg-void'), page: v('bg-page'),
        surface: v('bg-surface'), raised: v('bg-raised'),
        overlay: v('bg-overlay') },
      state: { hover: v('state-hover'),
        active: v('state-active'),
        selected: v('state-selected') },
      line: { subtle: v('border-subtle'),
        DEFAULT: v('border-default'),
        strong: v('border-strong') },
      fg: { DEFAULT: v('text-primary'),
        secondary: v('text-secondary'),
        muted: v('text-muted'),
        disabled: v('text-disabled'),
        'on-inverse': v('text-on-inverse') },
      inverse: { DEFAULT: v('fill-inverse'),
        hover: v('fill-inverse-hover'),
        active: v('fill-inverse-active') },
      live: { DEFAULT: v('live'), hover: v('live-hover'),

      2: '8px', 3: '12px', 4: '16px', 5: '20px',
      6: '24px', 8: '32px', 10: '40px', 12: '48px',
      16: '64px', 20: '80px', 24: '96px', 32: '128px',

    borderRadius: { none: v('radius-0'),
      xs: v('radius-xs'), sm: v('radius-sm'),
      DEFAULT: v('radius-md'), md: v('radius-md'),

      full: v('radius-full') },
    boxShadow: { none: 'none', 1: v('shadow-1'),

    zIndex: { decor: v('z-decor'), base: v('z-base'),

      drawer: v('z-drawer'), modal: v('z-modal'),

<div style="padding: 20px; border: 1px solid #2A2A2A; border-radius: 8px"><p class="ov">Именование</p><p class="why" style="margin-top: 10px"><span class="mono">--{категория}-{роль}-{вариант}</span>: <span class="mono">--text-muted</span>, <span class="mono">--glass-raised-blur</span>. Ступени шкалы <span class="mono">--n-*</span> в компонентах напрямую не используются, только через роли. <b>Почему:</b> светлая тема переназначает роли, а не компоненты.</p></div>
<div style="padding: 20px; border: 1px solid #2A2A2A; border-radius: 8px"><p class="ov">Проверка в CI</p><p class="why" style="margin-top: 10px">Скрипт читает <span class="mono">tokens.json</span>, проходит пары «текст × фон» из таблицы на артборде 21 и роняет сборку, если любая пара ниже 4.5:1 (текст) или 3:1 (контролы). <b>Почему:</b> контраст ломается тихо, при правке одного hex. <span style="display: inline-flex; font-size: 11px; padding: 2px 6px; border: 1px dashed #6E6E6E; border-radius: 4px; color: #B4B4B4">Предложение</span></p></div>
