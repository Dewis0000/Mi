<div style="display: flex; flex-direction: column; gap: 10px">
<p class="why"><b>Одна толщина.</b> Используем <span class="mono">strokeWidth={1.5}</span> и <span class="mono">absoluteStrokeWidth</span>, чтобы на 40 px штрих оставался 1.5 px и иконки разных размеров выглядели одним набором.</p>
<p class="why"><b>Цвет.</b> Иконка всегда берёт <span class="mono">currentColor</span> и наследует яркость текста рядом. Заливку получает только иконка статуса «успех».</p>
<p class="why"><b>Доступность.</b> Если рядом есть подпись, иконка декоративная (<span class="mono">aria-hidden</span>). Если иконка одна, <span class="mono">aria-label</span> ставится на кнопку, а не на svg.</p>
<p class="why"><b>Нельзя:</b> смешивать с другими наборами, использовать залитые версии ради «акцента», эмодзи, логотипы платформ в цвете (только монохромный знак 16 px) <span class="prop">Предложение</span>.</p>
</div>

<section style="margin-top: 72px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px">
<div style="grid-column: span 5">
<p class="ov">Уровни · z-index</p>
<h2 class="h2">Одна лестница на весь продукт</h2>
<p class="lead">Значения идут с шагом 100, чтобы внутри уровня было место для локальных +1…+9, не перепрыгивая соседа. Произвольные числа вроде 9999 запрещены.</p>
<p class="why" style="margin-top: 12px"><b>Почему тосты выше модалок:</b> после действия в модалке («Команда сохранена») подтверждение должно быть видно, даже если модалка ещё закрывается. <b>Почему тултип выше всех:</b> он может появиться внутри модалки и внутри тоста.</p>
</div>
<div style="grid-column: 7 / span 6; display: flex; flex-direction: column-reverse; gap: 4px">
