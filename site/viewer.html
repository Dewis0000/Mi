<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — зритель-панель</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js?v=460ce522"></script>
<script src="assets/api.js?v=05dec39a"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
.card{border-radius:12px;border:1px solid rgb(var(--n-13-rgb) / .10);background:rgb(var(--n-2-rgb) / .62);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.st{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;border:1px solid var(--n-6);color:var(--n-9);white-space:nowrap}
.st-ok{border-color:var(--n-12);color:var(--n-12);font-weight:500}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:8px;border:1px solid var(--n-5)}
.btn{height:36px;padding:0 14px;border-radius:6px;border:0;background:var(--n-13);color:var(--n-1);font:500 14px/20px var(--font-sans),sans-serif;cursor:pointer;display:inline-flex;align-items:center}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">
<header style="position: sticky; top: 0; z-index: 20; height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 24px; box-sizing: border-box; background: rgb(var(--n-1-rgb) / .72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / .08)">
<div style="display: flex; align-items: center; gap: 16px; min-width: 0">
<a href="choose.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<span style="font-size: 14px; color: var(--n-9)">Зритель-панель</span>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<span style="font-size: 14px; font-weight: 500">{{ login }}</span>
<a href="/auth/logout.php" style="height: 32px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 999px; border: 1px solid var(--n-6); font-size: 13px; color: var(--n-11)">Выйти / сменить</a>
</div>
</header>

<main style="max-width: 880px; margin: 0 auto; padding: 32px 24px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
<div>
<h1 style="margin: 0; font-size: 28px; line-height: 34px; letter-spacing: -0.02em; font-weight: 600">Мои предложения</h1>
<p style="margin: 6px 0 0; font-size: 14px; color: var(--n-10)">Видео, которые ты предложил на сайтах стримеров. Стример одобряет или отклоняет их.</p>
</div>
<template data-if="loggedOut"><div class="card" style="padding: 20px; font-size: 14px; color: var(--n-10)">Войди через Twitch, чтобы увидеть свои предложения. <a href="/auth/login.php?next=/viewer.html" style="text-decoration: underline">Войти</a></div></template>
<template data-if="empty"><div class="card" style="padding: 20px; font-size: 14px; color: var(--n-10)">Пока ничего не предлагал. Открой сайт стримера и нажми «Предложить видео».</div></template>
<section class="card" style="padding: 20px"><ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px"><template data-for="items" data-as="s"><li class="row"><div style="min-width: 0"><p style="margin: 0; font-size: 15px; font-weight: 500; overflow-wrap: anywhere">{{ s.title }}</p><p style="margin: 4px 0 0; font-size: 13px; color: var(--n-9)">{{ s.streamerName }} · {{ s.sectionLabel }} · {{ s.date }}</p></div><span class="{{ s.stClass }}">{{ s.statusLabel }}</span></li></template></ul></section>
<section class="card" style="padding: 20px"><p style="margin: 0; font-size: 16px; font-weight: 600">Сайты стримеров</p><p style="margin: 4px 0 14px; font-size: 13px; color: var(--n-9)">Сайты, куда ты предлагал видео.</p><ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px"><template data-for="sites" data-as="x"><li class="row"><a href="{{ x.href }}" style="font-size: 15px; font-weight: 500">{{ x.name }}</a><span style="font-size: 13px; color: var(--n-9)">{{ x.count }}</span></li></template></ul></section>
</main>
</div>
</template>
<script src="assets/dc-lite.js?v=5f8ce08a"></script>
<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { user: null, items: [], loaded: false };
}
componentDidMount() {
this.load();
}
async load() {
try {
const r = await StreAPI.get('viewer.me');
this.setState({ user: r.user, items: r.suggestions, loaded: true });
} catch (e) {
this.setState({ loaded: true });
}
}
renderVals() {
const s = this.state;
const labels = { pending: 'ждёт', approved: 'одобрено', rejected: 'отклонено' };
const items = s.items.map((x) => ({
title: x.title,
streamerName: x.streamerName,
sectionLabel: x.section === 'stream' ? 'Стрим' : 'Не стрим',
date: new Date(x.at * 1000).toLocaleDateString('ru-RU'),
statusLabel: labels[x.status] || x.status,
stClass: x.status === 'approved' ? 'st st-ok' : 'st',
}));
const seen = {};
s.items.forEach((x) => { seen[x.streamer] = seen[x.streamer] || { name: x.streamerName, count: 0 }; seen[x.streamer].count++; });
const sites = Object.keys(seen).map((login) => ({
href: 'site.html?c=' + encodeURIComponent(login),
name: seen[login].name,
count: seen[login].count + ' предлож.',
}));
return {
login: s.user ? s.user.login : '',
loggedOut: s.loaded && !s.user,
empty: s.loaded && !!s.user && !items.length,
items,
sites,
};
}
}
DCMount(Component);
</script>
</body>
</html>
