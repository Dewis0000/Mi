<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">
<header style="height: 64px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid var(--n-4)">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
</header>
<main style="max-width: 760px; margin: 0 auto; padding: 48px 24px 96px; font-size: 16px; line-height: 26px; color: var(--n-11)">
<h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600; color: var(--n-12)">Тестовая оплата</h1>
<p style="margin: 12px 0 0">Страница для проверки приёма платежей. Вход не нужен. Тестовый платёж на 10 ₽ ни на что не влияет: тариф не включается, баланс и данные аккаунтов не меняются.</p>

<section style="margin-top: 32px; padding: 24px; border-radius: 8px; border: 1px solid var(--n-5); background: var(--s-2)">
<p style="margin: 0; font-size: 13px; color: var(--n-9)">Тестовый платёж</p>
<p style="margin: 6px 0 0; font-size: 24px; line-height: 30px; font-weight: 600; color: var(--n-12)">10 ₽</p>
<p style="margin: 8px 0 0; font-size: 14px; color: var(--n-10)">Оплата картой или через СБП. Платёж проводит ЮKassa, форма откроется поверх этой страницы.</p>
<button id="demo-btn" type="button" style="margin-top: 16px; height: 44px; padding: 0 20px; border-radius: 6px; border: 0; background: var(--n-13); color: var(--n-1); font: 500 15px/22px var(--font-sans), system-ui, sans-serif; cursor: pointer">Оплатить 10 ₽</button>
<p id="demo-msg" role="status" style="margin: 12px 0 0; font-size: 14px; line-height: 20px; color: var(--n-10)"></p>
</section>

<section style="margin-top: 40px">
<h2 style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 600; color: var(--n-12)">Что продаётся</h2>
<p style="margin: 12px 0 0">StreOps — сервис для стримеров Twitch: чат-бот, модерация, виджеты для OBS, заказ музыки и розыгрыши. Тарифы продаются как подписка на 30 дней:</p>
<ul style="margin: 12px 0 0; padding-left: 20px; display: grid; gap: 6px">
<li>Продвинутая — 299 ₽ за 30 дней</li>
<li>Про — 499 ₽ за 30 дней</li>
<li>Максимум — 967 ₽ за 30 дней</li>
</ul>
<p style="margin: 16px 0 0">Реквизиты, оферта и политика конфиденциальности — на странице <a href="legal.html" style="color: var(--n-12); text-decoration: underline">streops.ru/legal.html</a>.</p>
</section>

</div>

<script src="assets/dc-lite.js?v=5f8ce08a"></script>
<script>
// Виджет ЮKassa: скрипт грузим один раз; оплата открывается поверх экрана, чтобы страница не уходила от пользователя
function loadYooWidget() {
  if (window.YooMoneyCheckoutWidget) return Promise.resolve();
  return new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = 'https://yookassa.ru/checkout-widget/v1/checkout-widget.js';
    s.onload = () => ok();
    s.onerror = () => no(new Error('Не загрузилась платёжная форма. Проверь интернет или отключи блокировщик рекламы'));
    document.head.appendChild(s);
  });
}
function openYooPay(token, returnUrl, cb) {
  const ov = document.createElement('div');
  ov.setAttribute('role', 'dialog');
  ov.setAttribute('aria-modal', 'true');
  ov.setAttribute('aria-label', 'Оплата');
  ov.style.cssText = 'position: fixed; inset: 0; z-index: 10000; background: var(--n-1); overflow: auto; display: flex; flex-direction: column';
  ov.innerHTML = '<div style="flex: none; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--n-4)"><span style="font: 600 16px/22px var(--font-sans), system-ui, sans-serif; color: var(--n-12)">Оплата</span><button type="button" style="height: 40px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--n-6); background: transparent; color: var(--n-12); font: 500 14px/20px var(--font-sans), system-ui, sans-serif; cursor: pointer">Закрыть</button></div><div id="yoo-host" style="flex: 1; display: flex; justify-content: center; padding: 24px; box-sizing: border-box"></div>';
  document.body.appendChild(ov);
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  ov.querySelector('button').onclick = close;
  const w = new window.YooMoneyCheckoutWidget({
    confirmation_token: token,
    return_url: returnUrl,
    error_callback: () => { close(); cb.fail(); },
  });
  w.on('success', () => { close(); cb.ok(); });
  w.render('yoo-host');
}

class Component extends DCLogic {
  componentDidMount() {
    const btn = document.getElementById('demo-btn');
    const msg = document.getElementById('demo-msg');
    const say = (t) => { msg.textContent = t; };
    if (/[?&]pay=return/.test(location.search)) say('Вернулись с оплаты. Статус тестового платежа смотри в ЮKassa.');
    btn.onclick = async () => {
      btn.disabled = true;
      say('Открываем форму оплаты…');
      try {
        const r = await fetch('api/index.php?r=pay.demo', { method: 'POST', headers: { 'X-Requested-With': 'StreOps', 'Content-Type': 'application/json' }, body: '{}' }).then((x) => x.json());
        if (!r.ok) throw new Error(r.error || 'Не получилось создать платёж');
        await loadYooWidget();
        say('');
        openYooPay(r.token, r.returnUrl, {
          ok: () => say('Платёж отправлен. Статус смотри в ЮKassa, на сайте ничего не меняется.'),
          fail: () => say('Оплата не прошла. Попробуй ещё раз или выбери другой способ.'),
        });
      } catch (e) { say(e.message); }
      btn.disabled = false;
    };
  }
  renderVals() { return {}; }
}
DCMount(Component);
</script>
</body>
</html>
