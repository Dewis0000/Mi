      setDur: (e) => upd({ dur: Number(e.target.value) || 600 }, 250),
      setSens: (e) => upd({ sens: Number(e.target.value) || 2 }, 500),
    };
  }

  renderVals() {
    const s = this.state;
    const cfg = s.cfg;
    const me = s.me || {};
    const user = me.user;
    const modes = s.modes || {};
    const qGone = s.qGone;
    const queue = (s.queue || []).filter((x) => !qGone[x.id]);

    // ----- шапка -----
    const shieldOn = !!modes.shield;
    const modesReady = !!s.modes && s.modesAvail;
    const out = {
      subtitle: user ? 'Чат twitch.tv/' + user.login + '. Бот ' + ((me.bot && me.bot.login) || 'StreOps') + ' проверяет сообщения и наказывает нарушителей как модератор канала.' : 'Фильтры чата Twitch, наказания, очередь на проверку и журнал действий.',
      noCfg: !cfg, autoOn: cfg && cfg.auto ? 'true' : 'false',
      toggleAuto: () => this.edit((c) => { c.auto = !c.auto; }, 0),
      autoOff: !!cfg && !cfg.auto,
      botOff: !!user && !user.botEnabled, botWarn: !!user && user.botEnabled && !!user.botError, botError: user ? String(user.botError || '').replace(/\.$/, '') + '.' : '',
      botBusy: s.botBusy, botBtn: s.botBusy ? 'Включаем…' : 'Включить бота', botRetryBtn: s.botBusy ? 'Проверяем…' : 'Проверить снова',
      enableBot: () => this.enableBot(),
      shieldOn, shieldPressed: shieldOn ? 'true' : 'false', shieldDisabled: !modesReady || !!s.modeBusy.shield,
      shieldLabel: shieldOn ? 'Выключить режим щита' : 'Режим щита',
      shieldTitle: modesReady ? 'Режим щита Twitch: защита от атак на чат' : 'Недоступно: бот должен быть подключён и быть модератором канала',
      shieldStyle: 'height: 40px; padding: 0 14px; border-radius: 6px; font: 500 14px/20px var(--font-sans), sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; ' + (shieldOn ? 'background: var(--n-12); color: var(--n-1); border: 0' : 'background: transparent; color: var(--n-12); border: 1px solid var(--n-8)') + (modesReady ? '' : '; opacity: 0.5; cursor: not-allowed'),
      toggleShield: () => this.setMode('shield', !shieldOn),
      saveFailed: s.save === 'error', saveErr: s.saveErr,
      revert: () => this.revert(), retrySave: () => { this.retryN = 0; this.flush(); },
      saveOk: !!cfg && s.save === 'saved',
      saveLabel: !cfg ? '' : ({ saved: 'Все изменения сохранены', dirty: 'Сохраним через секунду…', saving: 'Сохраняем…', error: 'Не сохранено' })[s.save],
      saveColor: s.save === 'error' ? 'var(--n-12)' : 'var(--n-9)',
      tA: s.tab === 0, tF: s.tab === 1, tJ: s.tab === 2, tL: s.tab === 3,
      hasCfg: !!cfg, cfgLoading: !cfg && !s.cfgErr, cfgFailed: !cfg && !!s.cfgErr, cfgErr: s.cfgErr, reloadCfg: () => this.loadCfg(),
    };
    out.tabs = MOD_TABS.map((t, i) => {
      const n = i === 2 ? queue.length : 0;
      return {
        id: 'tab-' + t[0], panel: 'panel-' + t[0], label: t[1], n, hasN: n > 0,
        sel: s.tab === i ? 'true' : 'false', ti: s.tab === i ? '0' : '-1',
        style: s.tab === i ? 'color: var(--n-12); box-shadow: inset 0 -2px 0 var(--n-12)' : '',
        pick: () => this.pickTab(i),
        key: (e) => {
          const last = MOD_TABS.length - 1;
          const j = { ArrowRight: i === last ? 0 : i + 1, ArrowLeft: i === 0 ? last : i - 1, Home: 0, End: last }[e.key];
          if (j === undefined) return;
          e.preventDefault();
          this.pickTab(j);
          setTimeout(() => { const el = document.getElementById('tab-' + MOD_TABS[j][0]); if (el) el.focus(); }, 0);
        },
      };
    });

    // ----- аналитика -----
    const st = s.stats;
    const live = me.stream && me.stream.live;
    out.periodLabel = (live ? 'Текущий стрим · с ' + StreAPI.fmtTime(me.stream.startedAt) : 'Последние 24 часа — сейчас не в эфире') + ' · обновляется каждые 10 секунд';
    out.statsFailed = !!s.statsErr;
    out.statsErr = String(s.statsErr || '').replace(/\.$/, '');
    const A = st && st.actions && !Array.isArray(st.actions) ? st.actions : {};
    const num = (v) => (st ? StreAPI.fmtNum(v || 0) : '—');
    out.statCards = [
      { k: 'Сообщений', v: num(st && st.messages), sub: st ? StreAPI.fmtNum(st.chatters) + ' ' + modPl(st.chatters, 'автор', 'автора', 'авторов') : 'Загрузка…' },
      { k: 'Удалено', v: num(A.delete), sub: 'сообщений без мута и бана' },
      { k: 'Предупреждений', v: num(A.warn), sub: 'бот удалил сообщение и написал в чат' },
      { k: 'Муты / баны', v: st ? StreAPI.fmtNum(A.timeout || 0) + ' / ' + StreAPI.fmtNum(A.ban || 0) : '—', sub: 'от бота и вручную' },
      { k: 'На проверку', v: num(A.review), sub: queue.length ? queue.length + ' ' + modPl(queue.length, 'ждёт', 'ждут', 'ждут') + ' решения' : 'очередь пуста' },
    ];
    const tox = st ? Math.max(0, Math.min(100, st.toxIndex || 0)) : 0;
    out.toxV = st ? String(tox) : '—';
    out.toxLevel = st ? 'из 100 · ' + (tox <= 25 ? 'низкий' : tox <= 50 ? 'заметный' : tox <= 75 ? 'высокий' : 'критический') : 'из 100';
    out.toxSegs = [0, 1, 2, 3].map((i) => ({ w: Math.max(0, Math.min(1, (tox - i * 25) / 25)) * 100 + '%' }));
    const buckets = st && st.chart && Array.isArray(st.chart.buckets) ? st.chart.buckets : [];
    const from = st && st.chart ? st.chart.from : Math.floor(Date.now() / 1000) - 3 * 3600;
    const peak = Math.max(1, ...buckets.map((b) => Math.max(b.m, b.v)));
    let totM = 0, totV = 0, peakV = -1, peakAt = 0;
    out.bars = buckets.map((b, i) => {
      totM += b.m; totV += b.v;
      if (b.v > peakV) { peakV = b.v; peakAt = from + i * 600; }
      const t0 = StreAPI.fmtTime(from + i * 600);
      return {
        v: b.v ? 'max(2px, ' + (b.v / peak * 100).toFixed(1) + '%)' : '0',
        m: (Math.max(0, b.m - b.v) / peak * 100).toFixed(1) + '%',
        title: t0 + ' — ' + b.m + ' ' + modPl(b.m, 'сообщение', 'сообщения', 'сообщений') + ', ' + b.v + ' ' + modPl(b.v, 'нарушение', 'нарушения', 'нарушений'),
      };
    });
    out.chartEmpty = !st || (totM === 0 && totV === 0);
    out.chartEmptyText = st ? 'За последние 3 часа в чате не было сообщений' : 'Загрузка…';
    out.chartAria = 'Сообщения и нарушения по 10 минут за 3 часа: всего ' + totM + ' ' + modPl(totM, 'сообщение', 'сообщения', 'сообщений') + ', ' + totV + ' ' + modPl(totV, 'нарушение', 'нарушения', 'нарушений') + (totV > 0 ? ', больше всего нарушений в ' + StreAPI.fmtTime(peakAt) : '');
    out.ticks = [0, 1, 2, 3].map((i) => ({ t: i === 3 ? 'сейчас' : StreAPI.fmtTime(from + i * 3600) }));
    const rs = {};
    ((st && st.reasons) || []).forEach((r) => {
      const fk = MOD_REASON[r.reason];
      const name = fk ? MOD_FMETA[fk].name : (r.reason || 'Без причины');
      rs[name] = rs[name] || { name, n: 0, title: [] };
      rs[name].n += Number(r.c) || 0;
      rs[name].title.push(r.reason);
    });
    const rl = Object.keys(rs).map((k) => rs[k]).sort((a, b) => b.n - a.n);
    const rmax = Math.max(1, ...rl.map((r) => r.n));
    out.reasons = rl.map((r) => ({ name: r.name, n: r.n, w: Math.round(r.n / rmax * 100) + '%', title: 'Причина в журнале: ' + r.title.join(', ') }));
    out.reasonsEmpty = rl.length === 0;
    out.reasonsEmptyText = st ? 'Бот пока никого не наказал за этот период. Когда сработают фильтры, здесь появится разбивка по причинам.' : 'Загрузка…';
    const L = cfg ? cfg.ladder.length : 0;
    out.watch = ((st && st.watch) || []).map((w) => {
      const nick = w.login || 'id ' + w.chatter_id;
      const cnt = Number(w.cnt) || 0;
      return {
        nick, strikes: L ? (cnt >= L ? cnt + ' · последняя' : cnt + ' из ' + L) : String(cnt),
        note: cnt + ' ' + modPl(cnt, 'нарушение', 'нарушения', 'нарушений') + ' · последнее ' + modWhen(Number(w.last_at)),
        busy: !!s.watchBusy[w.chatter_id], muteAria: 'Мут 10 минут: ' + nick, banAria: 'Забанить ' + nick,
        mute: () => this.watchAct(w, 'timeout'), ban: () => this.watchAct(w, 'ban'),
      };
    });
    out.watchEmpty = out.watch.length === 0;
    out.watchEmptyText = st ? 'Никого. Сюда попадают зрители, которых за последние 7 дней наказывали фильтры с наказанием «По лестнице».' : 'Загрузка…';
    out.top = ((st && st.top) || []).map((r) => ({ login: r.chatter_login, c: StreAPI.fmtNum(r.c), v: r.violations, vStyle: r.violations > 0 ? 'color: var(--n-12); font-weight: 500' : 'color: var(--n-9)' }));
    out.topHas = out.top.length > 0;
    out.topEmpty = !out.topHas;
    out.topEmptyText = st ? 'В чате пока никто не писал за этот период. Статистика появится, когда бот увидит сообщения.' : 'Загрузка…';

    // ----- лестница -----
    const ACT = { warn: 'предупреждение', delete: 'удаление', timeout: 'мут', ban: 'бан' };
    let ladderText = '';
    if (cfg) {
      const Ld = cfg.ladder;
      const warnN = Ld.filter((x) => x.a === 'warn').length;
      const stepTxt = (x) => (x.a === 'timeout' ? 'мут ' + modHuman(modSec(x.d)) : ACT[x.a]);
      if (Ld.length === 1) ladderText = Ld[0].a === 'ban' ? 'бан с первого нарушения' : 'каждое нарушение — ' + stepTxt(Ld[0]);
      else if (Ld[Ld.length - 1].a === 'ban' && warnN === Ld.length - 1) ladderText = 'бан после ' + warnN + ' ' + modPl(warnN, 'предупреждения', 'предупреждений', 'предупреждений');
      else ladderText = Ld.map((x, i) => (i + 1) + (i === Ld.length - 1 ? '+' : '') + ' → ' + stepTxt(x)).join(' · ');
      const users = MOD_FKEYS.filter((k) => cfg.filters[k].on && cfg.filters[k].action === 'ladder').map((k) => MOD_FMETA[k].name);
      out.ladderUsers = users.length ? 'Сейчас по лестнице: ' + users.join(', ') + '.' : 'Сейчас ни один включённый фильтр не использует лестницу.';
      const sig = (L2) => JSON.stringify(L2.map((x) => (x.a === 'timeout' ? 'timeout' : x.a)));
      const cur = JSON.stringify(Ld);
      out.presets = MOD_PRESETS.map((p, i) => {
        const sel = i === 3 ? sig(Ld) === sig(p[1]) : cur === JSON.stringify(p[1]);
        return {
          label: p[0], sel: sel ? 'true' : 'false',
          style: sel ? 'background: var(--n-12); color: var(--n-1); border-color: var(--n-12)' : '',
          pick: () => this.edit((c) => { c.ladder = JSON.parse(JSON.stringify(p[1])); }, 250),
        };
      });
      const setL = (fn) => this.edit((c) => { fn(c.ladder); }, 250);
      out.ladder = Ld.map((x, i) => {
        const isBan = x.a === 'ban';
        const sec = x.a === 'timeout' ? modSec(x.d) : 600;
        return {
          title: (i + 1) + '-е нарушение' + (i === Ld.length - 1 && Ld.length > 1 ? ' и далее' : (Ld.length === 1 ? ' и каждое' : '')),
          a: x.a, d: modCanon(sec), isTimeout: x.a === 'timeout', lone: Ld.length < 2,
          durOpts: modDurOpts(sec).map((o) => ({ v: modCanon(o.s), label: o.label })),
          note: { warn: 'Сообщение удаляется, бот пишет предупреждение', delete: 'Сообщение удаляется молча', timeout: 'Зритель молчит ' + modHuman(sec) + (cfg.announce ? ', бот сообщит в чат' : ''), ban: 'Бан навсегда: снять можно в журнале или по запросу на разбан' }[x.a],
          noteColor: isBan ? 'var(--accent-text)' : 'var(--n-9)', style: isBan ? 'border-color: rgb(var(--accent-text-rgb) / 0.55)' : '',
          actLabel: 'Действие на ступени ' + (i + 1), durLabel: 'Длительность мута на ступени ' + (i + 1), delLabel: 'Убрать ступень ' + (i + 1),
          setA: (e) => { const a = e.target.value; setL((l) => { l[i] = a === 'timeout' ? { a, d: '10 мин' } : { a }; }); },
          setD: (e) => { const d = e.target.value; setL((l) => { l[i] = { a: 'timeout', d }; }); },
          del: () => { if (Ld.length > 1) setL((l) => { l.splice(i, 1); }); },
        };
      });
      out.ladderFull = Ld.length >= 6;
      out.addStepTitle = Ld.length >= 6 ? 'Не больше 6 ступеней' : 'Добавить ступень в конец';
      out.addStep = () => setL((l) => { if (l.length < 6) l.push({ a: 'timeout', d: '10 мин' }); });
      out.ladderSummary = 'Итог: ' + ladderText + '.';
      const rd = cfg.resetDays;
      const RO = [[1, 'через 1 день'], [3, 'через 3 дня'], [7, 'через 7 дней'], [30, 'через 30 дней'], [0, 'никогда']];
      if (!RO.some((o) => o[0] === rd)) RO.push([rd, 'через ' + rd + ' ' + modPl(rd, 'день', 'дня', 'дней')]);
      out.resetOpts = RO.map((o) => ({ v: String(o[0]), label: o[1] }));
      out.resetDays = String(rd);
      out.setReset = (e) => this.edit((c) => { c.resetDays = Number(e.target.value) || 0; }, 250);
      const wHas = 'warnText' in s.drafts;
      const wt = wHas ? s.drafts.warnText : cfg.warnText;
      out.warnText = wt;
      out.warnBad = wHas && !wt.trim();
      out.setWarn = (e) => { const v = e.target.value; this.setDraft('warnText', v); if (v.trim()) this.edit((c) => { c.warnText = v; }, 800); };
      out.blurWarn = () => this.dropDraft('warnText');
      out.warnTags = [['{user}', 'Ник нарушителя'], ['{reason}', 'Причина: «без капса, пожалуйста», «оскорбления»…'], ['{n}', 'Номер предупреждения'], ['{max}', 'Сколько предупреждений на лестнице']].map((t) => ({
        tag: t[0], title: t[1],
        pick: () => { const v = (wt && !/\s$/.test(wt) ? wt + ' ' : wt) + t[0]; this.dropDraft('warnText'); this.edit((c) => { c.warnText = v; }, 400); setTimeout(() => { const el = document.getElementById('wt'); if (el) el.focus(); }, 0); },
      }));
      out.warnPreview = (wt.trim() ? wt : cfg.warnText).replace(/\{user\}/g, 'ник').replace(/\{reason\}/g, 'без капса, пожалуйста').replace(/\{n\}/g, '1').replace(/\{max\}/g, String(Math.max(1, warnN)));
      out.announceOn = cfg.announce ? 'true' : 'false';
      out.toggleAnnounce = () => this.edit((c) => { c.announce = !c.announce; }, 250);

      // ----- фильтры -----
      const lt = 'Лестница: ' + ladderText;
      out.filters = MOD_FKEYS.map((k) => this.vmFilter(k, cfg, lt));
      out.fOn = MOD_FKEYS.filter((k) => cfg.filters[k].on).length;
      out.fTotal = MOD_FKEYS.length;
      const ex = ['стримера'];
      if (cfg.exempt.mods) ex.push('модераторов');
      if (cfg.exempt.vip) ex.push('VIP');
      if (cfg.exempt.subs) ex.push('подписчиков');
      ex.push('известных ботов');
      out.exemptText = ex.slice(0, -1).join(', ') + ' и ' + ex[ex.length - 1];
      out.goLists = () => this.pickTab(3);

      // ----- списки -----
      out.wf = out.filters.find((f) => f.key === 'words');
      out.lf = out.filters.find((f) => f.key === 'links');
      out.words = cfg.words.map((w, i) => ({ text: w, label: 'Убрать «' + w + '»', del: () => this.edit((c) => { c.words.splice(i, 1); }, 250) }));
      out.wordsN = cfg.words.length;
      out.wordsEmpty = cfg.words.length === 0;
      out.domains = cfg.domains.map((d, i) => ({ text: d, label: 'Убрать ' + d, del: () => this.edit((c) => { c.domains.splice(i, 1); }, 250) }));
      out.domainsN = cfg.domains.length;
      out.domainsEmpty = cfg.domains.length === 0;
      out.subsLinksOn = cfg.subsLinks ? 'true' : 'false';
      out.toggleSubsLinks = () => this.edit((c) => { c.subsLinks = !c.subsLinks; }, 250);
      out.permitOn = cfg.permit ? 'true' : 'false';
      out.togglePermit = () => this.edit((c) => { c.permit = !c.permit; }, 250);
      out.exempt = [['mods', 'Модераторы', 'Модераторов канала фильтры не проверяют'], ['vip', 'VIP', 'Зрители со значком VIP'], ['subs', 'Подписчики', 'Все платные подписчики канала']].map((x) => ({
        id: 'ex-' + x[0], name: x[1], note: x[2], on: cfg.exempt[x[0]] ? 'true' : 'false',
        toggle: () => this.edit((c) => { c.exempt[x[0]] = !c.exempt[x[0]]; }, 250),
      }));
    } else {
      Object.assign(out, { presets: [], ladder: [], filters: [], words: [], domains: [], exempt: [], resetOpts: [], warnTags: [], wf: {}, lf: {} });
    }
    out.wordDraft = s.wordDraft;
    out.setWordDraft = (e) => this.setState({ wordDraft: e.target.value, wordErr: '' });
    out.addWord = () => this.addWord();
    out.wordBad = !!s.wordErr;
    out.wordErr = s.wordErr;
    out.domDraft = s.domDraft;
    out.setDomDraft = (e) => this.setState({ domDraft: e.target.value, domErr: '' });
    out.addDomain = () => this.addDomain();
    out.domBad = !!s.domErr;
    out.domErr = s.domErr;

    // ----- режимы чата -----
    out.modesLoading = !s.modes;
    out.modesNA = !!s.modes && !s.modesAvail && !s.modesErr;
    out.modesNAText = 'Twitch не отдаёт настройки чата. Бот должен быть подключён и быть модератором канала' + (user && !user.botEnabled ? ' — включи бота кнопкой вверху страницы.' : '. Если бот только что включён, проверь снова через минуту.');
    out.modesFailed = !!s.modesErr;
    out.modesErr = s.modesErr;
    out.reloadModes = () => this.loadModes();
    out.modes = s.modes ? MOD_MODES.map((m) => ({
      id: 'md-' + m[0], name: m[1], note: m[2], on: modes[m[0]] ? 'true' : 'false',
      disabled: !s.modesAvail || !!s.modeBusy[m[0]],
      toggle: () => this.setMode(m[0], !modes[m[0]]),
    })) : [];

    // ----- очередь -----
    out.queue = queue.map((h) => {
      const shown = !!s.revealed[h.id];
      const fk = MOD_REASON[h.reason];
      return {
        login: h.login, reason: fk ? MOD_FMETA[fk].name.toLowerCase() : h.reason, time: modWhen(h.at), text: h.text,
        shown: shown ? 'true' : 'false', blur: shown ? 'none' : 'blur(5px)', revealLabel: shown ? 'Скрыть' : 'Показать',
        reveal: () => this.setState({ revealed: Object.assign({}, s.revealed, { [h.id]: !shown }) }),
        allowAria: 'Разрешить сообщение ' + h.login, denyAria: 'Удалить сообщение ' + h.login, muteAria: 'Мут 10 минут: ' + h.login, banAria: 'Забанить ' + h.login,
        allow: () => this.review(h, 'allow'), deny: () => this.review(h, 'deny'), timeout: () => this.review(h, 'timeout'), ban: () => this.review(h, 'ban'),
      };
    });
    out.queueN = queue.length;
    out.queueLoading = s.queue === null;
    out.queueEmpty = s.queue !== null && queue.length === 0;
    const reviewers = cfg ? MOD_FKEYS.filter((k) => cfg.filters[k].on && cfg.filters[k].action === 'review').map((k) => '«' + MOD_FMETA[k].name + '»') : [];
    out.queueEmptyText = 'Очередь пуста. ' + (reviewers.length ? 'На проверку отправляют: ' + reviewers.join(', ') + '.' : 'Ни один включённый фильтр не отправляет сообщения на проверку — выбери «На проверку модератору» в карточке фильтра.');

    // ----- журнал -----
    const BADGE = { ban: 'border: 2px solid var(--accent-text); color: var(--accent-text)', timeout: 'border: 1px dashed var(--n-10); color: var(--n-12)', warn: 'border: 1px solid var(--n-8); color: var(--n-11)', delete: 'border: 1px dotted var(--n-8); color: var(--n-10)', review: 'border: 1px dashed var(--n-8); color: var(--n-10)' };
    const LF = [['', 'Все'], ['ban', 'Баны'], ['timeout', 'Муты'], ['warn', 'Предупреждения'], ['delete', 'Удаления'], ['review', 'На проверку']];
    out.logF = LF.map((l) => ({ label: l[1], sel: s.jType === l[0] ? 'true' : 'false', style: s.jType === l[0] ? 'background: var(--n-12); color: var(--n-1); border-color: var(--n-12)' : '', pick: () => this.setJType(l[0]) }));
    const nowS = Date.now() / 1000;
    out.log = (s.journal || []).map((r) => {
      const und = r.undone || !!s.undoneLocal[r.id];
      const expired = r.action === 'timeout' && r.duration > 0 && r.at + r.duration < nowS;
      const undoable = ['ban', 'timeout', 'warn'].indexOf(r.action) >= 0;
      const fk = MOD_REASON[r.reason];
      const actLabel = { ban: 'Бан', timeout: 'Мут ' + modHuman(r.duration || 600), warn: 'Предупреждение', delete: 'Удалено', review: 'На проверку' }[r.action] || r.action;
      const msg = r.message || '';
      return {
        time: modWhen(r.at), nick: r.login, strikes: r.strikes ? 'ступень ' + r.strikes : '',
        action: actLabel, badge: BADGE[r.action] || BADGE.delete,
        reason: fk ? MOD_FMETA[fk].name : (r.reason === 'вручную из панели' ? 'Вручную' : r.reason),
        message: msg, msgShort: msg ? '«' + (msg.length > 120 ? msg.slice(0, 120) + '…' : msg) + '»' : '',
        by: r.by === 'Бот' ? 'Бот' : r.by,
        canUndo: undoable && !und && !expired, busy: !!s.undoBusy[r.id],
        hasState: undoable && (und || expired), stateLabel: und ? 'Отменено' : 'Мут истёк',
        undoLabel: s.undoBusy[r.id] ? 'Отменяем…' : 'Отменить',
        undoAria: 'Отменить: ' + actLabel.toLowerCase() + ', ' + r.login,
        undoTitle: { ban: 'Разбанить в Twitch', timeout: 'Снять мут в Twitch', warn: 'Снять предупреждение' }[r.action] + ' и обнулить счётчик нарушений зрителя',
        rowStyle: und ? 'opacity: 0.55' : '',
        undo: () => this.undo(r),
      };
    });
    out.logLoading = s.journal === null;
    out.logEmpty = s.journal !== null && s.journal.length === 0;
    out.logEmptyText = s.jErr ? 'Не удалось загрузить журнал: ' + s.jErr : (s.jType ? 'Таких действий пока не было.' : 'Журнал пуст. Здесь появятся действия бота и решения модераторов: удаления, предупреждения, муты и баны.');

    // ----- разбан -----
    const ub = s.unban || [];
    out.unban = ub.map((u) => ({
      login: u.login, when: 'запрос от ' + modWhen(u.at), text: u.text ? '«' + u.text + '»' : 'Без текста',
      busy: !!s.unbanBusy[u.id], denyAria: 'Отказать в разбане ' + u.login, approveAria: 'Разбанить ' + u.login,
      deny: () => this.unbanAct(u, false), approve: () => this.unbanAct(u, true),
    }));
    out.unbanN = ub.length;
    out.unbanLoading = s.unbanLoading;
    out.unbanLoadingFirst = s.unban === null;
    out.unbanEmpty = s.unban !== null && ub.length === 0;
    out.unbanEmptyText = user && !user.botEnabled ? 'Запросы видит только подключённый бот — включи его кнопкой вверху страницы.' : 'Запросов нет. Если забаненный зритель попросит разбан на Twitch, запрос появится здесь.';
    out.reloadUnban = () => this.loadUnban();
    return out;
  }
}
DCMount(Component);
</script>
</body>
</html>
