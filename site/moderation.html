<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — модерация</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js?v=460ce522"></script>
<script src="assets/api.js?v=47744cb2"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--n-12);outline-offset:2px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ov{font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9);margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card{background:var(--s-2);border:1px solid var(--n-5);border-radius:8px}
.tab{height:44px;padding:0;border:0;background:transparent;color:var(--n-9);font:500 14px/20px var(--font-sans),sans-serif;display:flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--n-12)}
.sw{position:relative;width:40px;height:24px;border-radius:999px;border:1px solid var(--n-8);background:transparent;cursor:pointer;flex:none;padding:0}
.sw span{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:var(--n-9);transition:transform 180ms cubic-bezier(.2,0,0,1)}
.sw[aria-checked="true"]{background:var(--n-13);border-color:var(--n-13)}
.sw[aria-checked="true"] span{transform:translateX(16px);background:var(--n-1)}
.sw:disabled{opacity:.45;cursor:not-allowed}
.sel{height:36px;box-sizing:border-box;padding:0 30px 0 10px;border-radius:6px;background:var(--s-3);border:1px solid var(--n-8);color:var(--n-12);font:400 13px/18px var(--font-sans),sans-serif;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--n-10) 50%),linear-gradient(135deg,var(--n-10) 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer;min-width:0}
.sel:hover{border-color:var(--n-9)}
.sel:disabled{border-color:var(--n-5);color:var(--n-7);cursor:not-allowed}
.inp{height:36px;box-sizing:border-box;padding:0 10px;border-radius:6px;background:var(--s-3);border:1px solid var(--n-8);color:var(--n-12);font:400 14px/20px var(--font-sans),sans-serif;min-width:0}
.inp:hover{border-color:var(--n-9)}
.inp:disabled{border-color:var(--n-5);color:var(--n-7)}
.inp[aria-invalid="true"]{border:2px solid var(--n-12)}
.bs{height:36px;padding:0 12px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);font:500 13px/18px var(--font-sans),sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.bs:hover{background:rgb(var(--n-13-rgb) / .04);border-color:var(--n-8)}
.bp{height:36px;padding:0 12px;border-radius:6px;border:0;background:var(--n-13);color:var(--n-1);font:500 13px/18px var(--font-sans),sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.bp:hover{background:var(--n-11)}
.bs:disabled,.bp:disabled{opacity:.5;cursor:not-allowed}
.danger{color:var(--accent-text)}
.flt{padding:18px 20px;border-radius:8px;border:1px solid var(--n-5);background:var(--s-2);display:flex;flex-direction:column;gap:14px;min-width:0}
.k{font-size:13px;color:var(--n-9);margin:0}
.big{margin:8px 0 0;font-size:28px;line-height:32px;font-weight:500;letter-spacing:-.02em}
.hb{display:grid;grid-template-columns:170px minmax(0,1fr) 48px;gap:12px;align-items:center;font-size:13px;padding:6px 0}
.tr{display:grid;grid-template-columns:84px 150px 140px minmax(0,1fr) 110px 110px;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--n-4);font-size:13px;line-height:18px}
.tr:hover{background:rgb(var(--n-13-rgb) / .03)}
.mob{display:none}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;font-size:12px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;border-radius:4px;background:var(--n-4);border:1px solid var(--n-6);font-size:13px;max-width:100%}
.chip button{width:20px;height:20px;border:0;border-radius:3px;background:transparent;color:var(--n-9);cursor:pointer;flex:none}
.chip button:hover{color:var(--n-12);background:rgb(var(--n-13-rgb) / .08)}
.step{flex:1 1 150px;min-width:150px;padding:14px;border-radius:8px;border:1px solid var(--n-6);background:var(--s-3);display:flex;flex-direction:column;gap:10px;position:relative}
.mode{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--n-4)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--n-10);min-width:0}
.err{font-size:12px;line-height:16px;color:var(--n-12);font-weight:500}
.note{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:12px 16px;border:1px solid var(--n-6);border-radius:8px;font-size:14px;line-height:20px;color:var(--n-11)}
.alert{padding:12px 16px;border:2px solid var(--n-12);border-radius:8px;font-size:14px;line-height:20px}
.empty{margin:0;padding:24px;text-align:center;border:1px solid var(--n-5);border-radius:8px;color:var(--n-9);font-size:14px;line-height:20px}
.held{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:8px;border:1px dashed var(--n-9);background:repeating-linear-gradient(135deg,rgb(var(--n-13-rgb) / .03) 0 1px,transparent 1px 7px)}
.tag{height:26px;padding:0 8px;border-radius:4px;border:1px solid var(--n-6);background:transparent;color:var(--n-11);font:400 12px/16px 'JetBrains Mono',monospace;cursor:pointer}
.tag:hover{border-color:var(--n-9);background:rgb(var(--n-13-rgb) / .04)}
@media (max-width: 900px){.tr{grid-template-columns:52px minmax(0,1fr) auto}.tr .hide{display:none}.mob{display:block}.hb{grid-template-columns:120px minmax(0,1fr) 40px}}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px; flex-wrap: wrap">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<div style="display: flex; align-items: center; gap: 8px">
<div role="status" data-dc-keep data-stre-live aria-label="Статус эфира" style="display: flex; align-items: center; height: 40px; border: 1px solid var(--n-5); border-radius: 6px">
<span style="display: inline-flex; align-items: center; gap: 8px; height: 100%; padding: 0 12px; border-right: 1px solid var(--n-5)"><span data-dot style="width: 8px; height: 8px; border-radius: 999px; background: var(--n-8)"></span><span data-label style="font-size: 11px; font-weight: 700; letter-spacing: .08em">НЕ В ЭФИРЕ</span></span>
<span class="mono" data-timer title="Длительность эфира" style="padding: 0 12px; border-right: 1px solid var(--n-5); font-size: 15px">—</span><span class="mono" data-viewers title="Зрителей сейчас" style="padding: 0 12px; font-size: 15px">—</span>
</div>
<a href="settings.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; font-size: 14px; font-weight: 500" aria-label="Профиль" data-dc-keep data-stre-user><span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, var(--n-10), var(--n-6)); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--n-1)" data-av></span><span data-name>Профиль</span></a>
</div>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" class="sb" data-dc-keep>
<p class="sb-h">Эфир</p>
<a href="panel.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Обзор</a>
<a href="moderation.html" class="sb-i" aria-current="page"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<p class="sb-h">Бот</p>
<a href="commands.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды</a>
<a href="music.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Музыка</a>
<a href="widgets.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<span class="sb-i sb-off" aria-disabled="true"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 13l-7.5 7.5a2.1 2.1 0 0 1-3-3L11 10M16 16l6-6M8 8l6-6M9 7l8 8M21 11l-8-8"/></svg>Аукционы<span class="sb-tag">скоро</span></span>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
</nav>

<main style="flex: 999 1 680px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div style="min-width: 0"><h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Модерация</h1><p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: var(--n-10); max-width: 640px">{{ subtitle }}</p></div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 12px; padding: 6px 6px 6px 14px; border-radius: 8px; border: 1px solid var(--n-6)"><span id="auto-l" style="font-size: 14px">Автомодерация</span><button type="button" role="switch" class="sw" aria-checked="{{ autoOn }}" aria-labelledby="auto-l" onClick="{{ toggleAuto }}" disabled="{{ noCfg }}"><span></span></button></div>
<button type="button" onClick="{{ toggleShield }}" aria-pressed="{{ shieldPressed }}" disabled="{{ shieldDisabled }}" title="{{ shieldTitle }}" style="{{ shieldStyle }}"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>{{ shieldLabel }}</button>
</div>
</div>

<template data-if="botOff">
<div class="note"><span style="flex: 1 1 320px"><b style="font-weight: 600">Бот выключен.</b> Фильтры не проверяют чат, очередь и журнал не пополняются. Включи бота — он станет модератором канала и начнёт следить за сообщениями.</span><button type="button" class="bp" onClick="{{ enableBot }}" disabled="{{ botBusy }}">{{ botBtn }}</button></div>
</template>
<template data-if="botWarn">
<div class="note"><span style="flex: 1 1 320px"><b style="font-weight: 600">Бот включён, но Twitch сообщил о проблеме:</b> {{ botError }}</span><button type="button" class="bs" onClick="{{ enableBot }}" disabled="{{ botBusy }}">{{ botRetryBtn }}</button></div>
</template>
<template data-if="autoOff">
<div class="note"><span style="flex: 1 1 320px"><b style="font-weight: 600">Автомодерация выключена.</b> Бот не проверяет сообщения фильтрами. Режимы чата, очередь, журнал и ручные действия работают.</span><button type="button" class="bs" onClick="{{ toggleAuto }}">Включить</button></div>
</template>
<template data-if="shieldOn">
<div role="status" style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 2px solid var(--n-12); border-radius: 8px; background: repeating-linear-gradient(135deg, rgb(var(--n-13-rgb) / 0.08) 0 2px, transparent 2px 6px)"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg><div><p style="margin: 0; font-weight: 600">Режим щита включён</p><p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--n-11)">Twitch применяет ограничения щита, которые настроены в панели автора на Twitch: например, писать могут только проверенные аккаунты. Выключи, когда атака закончится.</p></div></div>
</template>
<template data-if="saveFailed">
<div role="alert" class="alert" style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between"><span style="flex: 1 1 320px"><b style="font-weight: 600">Настройки не сохранились:</b> {{ saveErr }}. Повторим автоматически, изменения на странице не потеряются.</span><span style="display: flex; gap: 6px; flex-wrap: wrap"><button type="button" class="bs" onClick="{{ revert }}">Вернуть сохранённое</button><button type="button" class="bp" onClick="{{ retrySave }}">Повторить сейчас</button></span></div>
</template>

<div style="display: flex; justify-content: space-between; align-items: center; gap: 4px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--n-5)">
<div role="tablist" aria-label="Разделы модерации" style="display: flex; gap: 28px; overflow-x: auto; max-width: 100%">
<template data-for="tabs" data-as="t"><button role="tab" type="button" class="tab" id="{{ t.id }}" aria-controls="{{ t.panel }}" aria-selected="{{ t.sel }}" tabindex="{{ t.ti }}" onClick="{{ t.pick }}" onKeyDown="{{ t.key }}" style="{{ t.style }}">{{ t.label }}<template data-if="t.hasN"><span class="mono" style="font-size: 12px; padding: 1px 6px; border: 1px solid var(--n-8); border-radius: 4px; color: var(--n-12)">{{ t.n }}</span></template></button></template>
</div>
<span role="status" aria-live="polite" style="display: inline-flex; align-items: center; gap: 6px; min-height: 32px; font-size: 12px; color: {{ saveColor }}"><template data-if="saveOk"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg></template>{{ saveLabel }}</span>
</div>

<!-- ============ АНАЛИТИКА ============ -->
<template data-if="tA">
<div role="tabpanel" id="panel-analytics" aria-labelledby="tab-analytics" style="display: flex; flex-direction: column; gap: 24px">
<p style="margin: 0; font-size: 14px; color: var(--n-10)">{{ periodLabel }}</p>
<template data-if="statsFailed"><p role="alert" class="alert" style="margin: 0">Не удалось загрузить статистику: {{ statsErr }}. Пробуем снова каждые 10 секунд.</p></template>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px">
<template data-for="statCards" data-as="c"><div class="card" style="padding: 18px"><p class="k">{{ c.k }}</p><p class="mono big">{{ c.v }}</p><p style="margin: 6px 0 0; font-size: 12px; line-height: 16px; color: var(--n-10)">{{ c.sub }}</p></div></template>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px">
<section class="card" aria-labelledby="tox-t" style="flex: 1 1 280px; padding: 20px; box-sizing: border-box">
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap"><h2 id="tox-t" style="margin: 0; font-size: 17px; font-weight: 600">Индекс токсичности</h2><span style="font-size: 11px; padding: 1px 6px; border: 1px solid var(--n-8); border-radius: 4px; color: var(--n-11)">по словарю, не ИИ</span></div>
<p style="margin: 12px 0 0; display: flex; align-items: baseline; gap: 8px"><span class="mono" style="font-size: 44px; line-height: 48px; font-weight: 500">{{ toxV }}</span><span style="font-size: 14px; color: var(--n-9)">{{ toxLevel }}</span></p>
<div aria-hidden="true" style="margin-top: 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; height: 10px"><template data-for="toxSegs" data-as="g"><span style="background: var(--n-4); display: block; height: 100%"><span style="display: block; height: 100%; width: {{ g.w }}; background: var(--n-12)"></span></span></template></div>
<div class="mono" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 6px; font-size: 11px; color: var(--n-9)"><span>0–25</span><span>26–50</span><span>51–75</span><span>76–100</span></div>
<p style="margin: 14px 0 0; font-size: 13px; line-height: 18px; color: var(--n-10)">Сколько сообщений из каждой тысячи бот наказал за оскорбления и угрозы. Считается по словарям фильтров «Оскорбления» и «Угрозы» — смысл фраз бот не понимает. 100 — каждое десятое сообщение.</p>
</section>

<section class="card" aria-labelledby="act-t" style="flex: 3 1 480px; min-width: 0; padding: 20px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap"><h2 id="act-t" style="margin: 0; font-size: 17px; font-weight: 600">Активность и нарушения за 3 часа</h2><div style="display: flex; gap: 16px; font-size: 12px; color: var(--n-10)"><span style="display: inline-flex; gap: 6px; align-items: center"><span style="width: 12px; height: 12px; background: var(--n-6)"></span>Сообщения</span><span style="display: inline-flex; gap: 6px; align-items: center"><span style="width: 12px; height: 12px; background: repeating-linear-gradient(135deg, var(--n-12) 0 2px, var(--n-1) 2px 4px)"></span>Нарушения</span></div></div>
<div role="img" aria-label="{{ chartAria }}" style="position: relative; margin-top: 16px; height: 180px; display: flex; align-items: flex-end; gap: 4px; border-bottom: 1px solid var(--n-6)">
<template data-for="bars" data-as="b"><span title="{{ b.title }}" style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%"><span style="height: {{ b.v }}; background: repeating-linear-gradient(135deg, var(--n-12) 0 2px, var(--n-1) 2px 4px)"></span><span style="height: {{ b.m }}; background: var(--n-6)"></span></span></template>
<template data-if="chartEmpty"><span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 16px; font-size: 13px; color: var(--n-9)">{{ chartEmptyText }}</span></template>
</div>
<div class="mono" style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--n-9)"><template data-for="ticks" data-as="x"><span>{{ x.t }}</span></template></div>
</section>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px">
<section class="card" aria-labelledby="cat-t" style="flex: 1 1 360px; min-width: 0; padding: 20px; box-sizing: border-box">
<h2 id="cat-t" style="margin: 0; font-size: 17px; font-weight: 600">Причины нарушений</h2>
<p style="margin: 4px 0 10px; font-size: 13px; color: var(--n-9)">Что ловил бот за период: по фильтрам</p>
<template data-for="reasons" data-as="c"><div class="hb"><span style="color: var(--n-11); overflow: hidden; text-overflow: ellipsis; white-space: nowrap" title="{{ c.title }}">{{ c.name }}</span><span style="height: 8px; background: var(--n-4)"><span style="display: block; height: 100%; width: {{ c.w }}; background: var(--n-12)"></span></span><span class="mono" style="text-align: right">{{ c.n }}</span></div></template>
<template data-if="reasonsEmpty"><p style="margin: 8px 0 0; font-size: 13px; line-height: 18px; color: var(--n-9)">{{ reasonsEmptyText }}</p></template>
</section>
<section class="card" aria-labelledby="watch-t" style="flex: 1 1 360px; min-width: 0; padding: 20px; box-sizing: border-box">
<h2 id="watch-t" style="margin: 0; font-size: 17px; font-weight: 600">Под наблюдением</h2>
<p style="margin: 4px 0 10px; font-size: 13px; color: var(--n-9)">Зрители со страйками лестницы наказаний за 7 дней</p>
<template data-for="watch" data-as="w"><div style="display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--n-4)"><span style="min-width: 0"><span style="display: block; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis">{{ w.nick }}</span><span style="display: block; font-size: 12px; color: var(--n-9)">{{ w.note }}</span></span><span class="mono" title="Ступень лестницы" style="font-size: 12px; padding: 2px 8px; border: 1px dashed var(--n-9); border-radius: 4px; white-space: nowrap">{{ w.strikes }}</span><span style="display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end"><button type="button" class="bs" style="height: 32px" onClick="{{ w.mute }}" disabled="{{ w.busy }}" aria-label="{{ w.muteAria }}">Мут 10 мин</button><button type="button" class="bs danger" style="height: 32px" onClick="{{ w.ban }}" disabled="{{ w.busy }}" aria-label="{{ w.banAria }}">Бан</button></span></div></template>
<template data-if="watchEmpty"><p style="margin: 8px 0 0; font-size: 13px; line-height: 18px; color: var(--n-9)">{{ watchEmptyText }}</p></template>
</section>
</div>

<section class="card" aria-labelledby="top-t" style="padding: 20px">
<h2 id="top-t" style="margin: 0; font-size: 17px; font-weight: 600">Самые активные в чате</h2>
<p style="margin: 4px 0 10px; font-size: 13px; color: var(--n-9)">Шесть зрителей с наибольшим числом сообщений и сколько раз их наказывали</p>
<template data-if="topHas">
<div style="overflow-x: auto"><table style="width: 100%; min-width: 320px; border-collapse: collapse; font-size: 13px">
<thead><tr style="color: var(--n-9); text-align: left"><th scope="col" style="font-weight: 500; padding: 8px 12px 8px 0">Зритель</th><th scope="col" style="font-weight: 500; padding: 8px 12px; text-align: right">Сообщений</th><th scope="col" style="font-weight: 500; padding: 8px 0 8px 12px; text-align: right">Нарушений</th></tr></thead>
<tbody>
<template data-for="top" data-as="r"><tr style="border-top: 1px solid var(--n-4)"><td style="padding: 10px 12px 10px 0; font-weight: 500">{{ r.login }}</td><td class="mono" style="padding: 10px 12px; text-align: right">{{ r.c }}</td><td class="mono" style="padding: 10px 0 10px 12px; text-align: right; {{ r.vStyle }}">{{ r.v }}</td></tr></template>
</tbody></table></div>
</template>
<template data-if="topEmpty"><p style="margin: 8px 0 0; font-size: 13px; line-height: 18px; color: var(--n-9)">{{ topEmptyText }}</p></template>
</section>
</div>
</template>

<!-- ============ ФИЛЬТРЫ И НАКАЗАНИЯ ============ -->
<template data-if="tF">
<div role="tabpanel" id="panel-filters" aria-labelledby="tab-filters" style="display: flex; flex-direction: column; gap: 24px">
<template data-if="cfgLoading"><p class="empty">Загрузка настроек…</p></template>
<template data-if="cfgFailed"><div role="alert" class="alert" style="display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap"><span>Не удалось загрузить настройки: {{ cfgErr }}</span><button type="button" class="bp" onClick="{{ reloadCfg }}">Повторить</button></div></template>
<template data-if="hasCfg">

<section class="card" aria-labelledby="lad-t" style="padding: 24px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap">
<div style="flex: 1 1 320px; min-width: 0"><h2 id="lad-t" style="margin: 0; font-size: 20px; font-weight: 600">Лестница наказаний</h2><p style="margin: 4px 0 0; font-size: 14px; line-height: 20px; color: var(--n-10); max-width: 600px">Для фильтров с наказанием «По лестнице». Каждое нарушение поднимает зрителя на ступень выше, последняя ступень повторяется. {{ ladderUsers }}</p></div>
</div>
<div role="group" aria-label="Готовые варианты лестницы" style="margin-top: 16px; display: flex; gap: 6px; flex-wrap: wrap"><template data-for="presets" data-as="p"><button type="button" class="bs" aria-pressed="{{ p.sel }}" onClick="{{ p.pick }}" style="{{ p.style }}">{{ p.label }}</button></template></div>
<ol aria-label="Ступени" style="list-style: none; margin: 16px 0 0; padding: 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch">
<template data-for="ladder" data-as="s">
<li class="step" style="{{ s.style }}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><span class="mono" style="font-size: 12px; color: var(--n-9)">{{ s.title }}</span><button type="button" aria-label="{{ s.delLabel }}" onClick="{{ s.del }}" disabled="{{ s.lone }}" style="width: 28px; height: 28px; border: 0; border-radius: 4px; background: transparent; color: var(--n-9); cursor: pointer"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></div>
<select class="sel" aria-label="{{ s.actLabel }}" value="{{ s.a }}" onChange="{{ s.setA }}"><option value="warn">Предупреждение</option><option value="delete">Удалить молча</option><option value="timeout">Мут на время</option><option value="ban">Бан навсегда</option></select>
<template data-if="s.isTimeout"><select class="sel" aria-label="{{ s.durLabel }}" value="{{ s.d }}" onChange="{{ s.setD }}"><template data-for="s.durOpts" data-as="o"><option value="{{ o.v }}">{{ o.label }}</option></template></select></template>
<span style="font-size: 12px; line-height: 16px; color: {{ s.noteColor }}">{{ s.note }}</span>
</li>
</template>
<li style="flex: 0 0 auto; display: flex"><button type="button" onClick="{{ addStep }}" disabled="{{ ladderFull }}" title="{{ addStepTitle }}" style="min-width: 120px; min-height: 44px; border-radius: 8px; border: 1px dashed var(--n-8); background: transparent; color: var(--n-10); font: 500 13px/18px var(--font-sans), sans-serif; cursor: pointer">+ Ступень</button></li>
</ol>
<p style="margin: 14px 0 0; font-size: 14px; color: var(--n-11)">{{ ladderSummary }}</p>
<div style="margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; align-items: start">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 500; color: var(--n-11)">Обнулять счётчик, если зритель не нарушал<select class="sel" value="{{ resetDays }}" onChange="{{ setReset }}"><template data-for="resetOpts" data-as="o"><option value="{{ o.v }}">{{ o.label }}</option></template></select><span style="font-size: 12px; font-weight: 400; color: var(--n-9)">После этого он снова начнёт с первой ступени</span></label>
<div style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 500; color: var(--n-11)"><label for="wt">Текст предупреждения в чате</label><input id="wt" class="inp mono" maxlength="300" value="{{ warnText }}" onChange="{{ setWarn }}" onBlur="{{ blurWarn }}" aria-invalid="{{ warnBad }}" aria-describedby="wt-h" style="font-size: 12px"><span style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center"><span style="font-size: 12px; font-weight: 400; color: var(--n-9)">Вставить:</span><template data-for="warnTags" data-as="t"><button type="button" class="tag" title="{{ t.title }}" onClick="{{ t.pick }}">{{ t.tag }}</button></template></span><template data-if="warnBad"><span role="alert" class="err">Текст не может быть пустым — сохраняем прежний</span></template><span id="wt-h" style="font-size: 12px; font-weight: 400; line-height: 16px; color: var(--n-9)">Пример: <span style="color: var(--n-11)">{{ warnPreview }}</span>. {n} и {max} — номер предупреждения и сколько их на лестнице.</span></div>
<div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--n-11)"><span style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><span id="ann-l">Сообщать о муте в чат</span><button type="button" role="switch" class="sw" aria-checked="{{ announceOn }}" aria-labelledby="ann-l" onClick="{{ toggleAnnounce }}"><span></span></button></span><span style="font-size: 12px; line-height: 16px; color: var(--n-9)">Бот пишет: «@ник — мут на 10 мин: причина». Работает для любого мута от фильтров.</span></div>
</div>
</section>

<section aria-labelledby="flt-t">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap"><div style="min-width: 0"><h2 id="flt-t" style="margin: 0; font-size: 20px; font-weight: 600">Фильтры</h2><p style="margin: 4px 0 0; font-size: 14px; line-height: 20px; color: var(--n-10)">Включено <span class="mono">{{ fOn }}</span> из <span class="mono">{{ fTotal }}</span>. Бот проверяет фильтры сверху вниз и наказывает по первому сработавшему.</p></div><p style="margin: 0; font-size: 13px; color: var(--n-9)">Не действуют на {{ exemptText }} · <button type="button" onClick="{{ goLists }}" style="padding: 0; border: 0; background: none; color: var(--n-12); font: inherit; text-decoration: underline; cursor: pointer">изменить</button></p></div>
<div style="margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 12px">
<template data-for="filters" data-as="f">
<div class="flt" style="{{ f.cardStyle }}">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px"><span style="min-width: 0"><span style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 15px; font-weight: 500"><span id="{{ f.nameId }}">{{ f.name }}</span><template data-if="f.dict"><span style="font-size: 11px; padding: 1px 6px; border: 1px solid var(--n-8); border-radius: 4px; color: var(--n-11); font-weight: 400">словарь</span></template></span><span style="display: block; margin-top: 2px; font-size: 13px; line-height: 18px; color: var(--n-9)">{{ f.desc }}</span></span><button type="button" role="switch" class="sw" aria-checked="{{ f.on }}" aria-label="{{ f.swLabel }}" onClick="{{ f.toggle }}"><span></span></button></div>
<template data-if="f.hasSens"><div style="display: flex; flex-direction: column; gap: 6px"><span style="display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--n-10)"><span>Чувствительность</span><span style="color: var(--n-12)">{{ f.sensLabel }}</span></span><input type="range" min="1" max="4" step="1" value="{{ f.sens }}" onChange="{{ f.setSens }}" aria-label="{{ f.sensAria }}" aria-valuetext="{{ f.sensLabel }}" disabled="{{ f.off }}" style="accent-color: var(--n-12)"><span style="font-size: 12px; line-height: 16px; color: var(--n-9)">{{ f.sensNote }}</span></div></template>
<template data-if="f.hasParams"><div style="display: flex; gap: 12px; flex-wrap: wrap"><template data-for="f.params" data-as="p"><label class="lbl" style="flex: 1 1 140px"><span>{{ p.label }}</span><input class="inp mono" type="number" inputmode="numeric" min="{{ p.min }}" max="{{ p.max }}" step="1" value="{{ p.value }}" onChange="{{ p.set }}" onBlur="{{ p.blur }}" aria-invalid="{{ p.bad }}" disabled="{{ f.off }}" style="width: 100%"><template data-if="p.bad"><span role="alert" class="err">{{ p.err }}</span></template></label></template></div></template>
<div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center"><span style="font-size: 12px; color: var(--n-9); width: 100%">Наказание</span>
<select class="sel" aria-label="{{ f.actAria }}" value="{{ f.action }}" onChange="{{ f.setAction }}" disabled="{{ f.off }}" style="flex: 1 1 200px"><option value="ladder">По лестнице наказаний</option><option value="review">На проверку модератору</option><option value="delete">Удалить сообщение</option><option value="warn">Удалить и предупредить</option><option value="timeout">Мут на время</option><option value="ban">Бан сразу</option></select>
<template data-if="f.isTimeout"><select class="sel" aria-label="{{ f.durAria }}" value="{{ f.dur }}" onChange="{{ f.setDur }}" disabled="{{ f.off }}" style="flex: 0 0 120px"><template data-for="f.durOpts" data-as="o"><option value="{{ o.v }}">{{ o.label }}</option></template></select></template>
</div>
<span style="font-size: 12px; line-height: 16px; {{ f.hintStyle }}">{{ f.hint }}</span>
</div>
</template>
</div>
</section>
</template>

<section class="card" aria-labelledby="modes-t" style="padding: 24px">
<h2 id="modes-t" style="margin: 0; font-size: 20px; font-weight: 600">Режимы чата Twitch</h2>
<p style="margin: 4px 0 8px; font-size: 14px; line-height: 20px; color: var(--n-10)">Меняются сразу на канале от имени бота — то же делают команды /slow, /followers и другие. Состояние обновляется само раз в полминуты.</p>
<template data-if="modesLoading"><p style="margin: 8px 0; font-size: 13px; color: var(--n-9)">Загрузка…</p></template>
<template data-if="modesNA"><div class="note" style="margin: 8px 0"><span style="flex: 1 1 320px">{{ modesNAText }}</span><button type="button" class="bs" onClick="{{ reloadModes }}">Проверить снова</button></div></template>
<template data-if="modesFailed"><p role="alert" class="alert" style="margin: 8px 0">{{ modesErr }}</p></template>
<template data-for="modes" data-as="m"><div class="mode"><span style="min-width: 0"><span id="{{ m.id }}" style="display: block; font-size: 14px">{{ m.name }}</span><span style="display: block; font-size: 12px; color: var(--n-9)">{{ m.note }}</span></span><button type="button" role="switch" class="sw" aria-checked="{{ m.on }}" aria-labelledby="{{ m.id }}" onClick="{{ m.toggle }}" disabled="{{ m.disabled }}"><span></span></button></div></template>
</section>
</div>
</template>

<!-- ============ ОЧЕРЕДЬ И ЖУРНАЛ ============ -->
<template data-if="tJ">
<div role="tabpanel" id="panel-queue" aria-labelledby="tab-queue" style="display: flex; flex-direction: column; gap: 24px">
<section aria-labelledby="held-t">
<h2 id="held-t" style="margin: 0; font-size: 20px; font-weight: 600">На проверке <span class="mono" style="font-size: 15px; color: var(--n-9)">{{ queueN }}</span></h2>
<p style="margin: 4px 0 12px; font-size: 14px; line-height: 20px; color: var(--n-10)">Сюда попадают сообщения фильтров с наказанием «На проверку модератору». Бот их не трогает: сообщение остаётся в чате, пока ты не решишь.</p>
<div style="display: flex; flex-direction: column; gap: 8px">
<template data-for="queue" data-as="h">
<div class="held">
<span style="flex: 1 1 320px; min-width: 0"><span style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px"><b style="font-weight: 600">{{ h.login }}</b><span style="color: var(--n-9)">{{ h.reason }}</span><span class="mono" style="color: var(--n-9)">{{ h.time }}</span></span><span style="display: block; margin-top: 4px; font-size: 14px; line-height: 20px; color: var(--n-11); overflow-wrap: anywhere; filter: {{ h.blur }}">{{ h.text }}</span></span>
<span style="display: flex; gap: 6px; flex-wrap: wrap"><button type="button" class="bs" aria-pressed="{{ h.shown }}" onClick="{{ h.reveal }}">{{ h.revealLabel }}</button><button type="button" class="bp" onClick="{{ h.allow }}" aria-label="{{ h.allowAria }}">Разрешить</button><button type="button" class="bs" onClick="{{ h.deny }}" aria-label="{{ h.denyAria }}">Удалить</button><button type="button" class="bs" onClick="{{ h.timeout }}" aria-label="{{ h.muteAria }}">Мут 10 мин</button><button type="button" class="bs danger" onClick="{{ h.ban }}" aria-label="{{ h.banAria }}">Бан</button></span>
</div>
</template>
<template data-if="queueLoading"><p class="empty">Загрузка…</p></template>
<template data-if="queueEmpty"><p class="empty">{{ queueEmptyText }}</p></template>
</div>
</section>

<section aria-labelledby="log-t">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap"><h2 id="log-t" style="margin: 0; font-size: 20px; font-weight: 600">Журнал действий</h2>
<div role="group" aria-label="Тип действия" style="display: flex; gap: 6px; flex-wrap: wrap"><template data-for="logF" data-as="l"><button type="button" class="bs" style="height: 32px; {{ l.style }}" aria-pressed="{{ l.sel }}" onClick="{{ l.pick }}">{{ l.label }}</button></template></div></div>
<p style="margin: 4px 0 0; font-size: 13px; line-height: 18px; color: var(--n-9)">Последние 100 действий бота и модераторов. «Отменить» снимает бан или мут в Twitch и обнуляет счётчик нарушений зрителя.</p>
<div style="margin-top: 12px">
<div class="tr" aria-hidden="true" style="border-top: 0; color: var(--n-9); font-size: 12px"><span>Время</span><span>Зритель</span><span class="hide">Действие</span><span class="hide">Причина и сообщение</span><span class="hide">Кто</span><span></span></div>
<template data-for="log" data-as="r">
<div class="tr" style="{{ r.rowStyle }}">
<span class="mono" style="color: var(--n-9); font-size: 12px">{{ r.time }}</span>
<span style="min-width: 0"><span style="display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis">{{ r.nick }}</span><span class="mono" style="display: block; font-size: 11px; color: var(--n-9)">{{ r.strikes }}</span><span class="mob" style="margin-top: 4px"><span class="badge" style="{{ r.badge }}">{{ r.action }}</span> <span style="color: var(--n-10)">{{ r.reason }}</span></span></span>
<span class="hide"><span class="badge" style="{{ r.badge }}">{{ r.action }}</span></span>
<span class="hide" style="min-width: 0"><span style="display: block; color: var(--n-11)">{{ r.reason }}</span><span title="{{ r.message }}" style="display: block; font-size: 12px; color: var(--n-9); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ r.msgShort }}</span></span>
<span class="hide" style="color: var(--n-10); overflow: hidden; text-overflow: ellipsis">{{ r.by }}</span>
<span style="text-align: right"><template data-if="r.canUndo"><button type="button" class="bs" style="height: 30px" aria-label="{{ r.undoAria }}" title="{{ r.undoTitle }}" onClick="{{ r.undo }}" disabled="{{ r.busy }}">{{ r.undoLabel }}</button></template><template data-if="r.hasState"><span style="font-size: 12px; color: var(--n-9)">{{ r.stateLabel }}</span></template></span>
</div>
</template>
<template data-if="logLoading"><p class="empty" style="margin-top: 8px">Загрузка…</p></template>
<template data-if="logEmpty"><p class="empty" style="margin-top: 8px">{{ logEmptyText }}</p></template>
</div>
</section>

<section class="card" aria-labelledby="unban-t" style="padding: 20px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap"><h2 id="unban-t" style="margin: 0; font-size: 17px; font-weight: 600">Запросы на разбан <span class="mono" style="font-size: 14px; color: var(--n-9)">{{ unbanN }}</span></h2><button type="button" class="bs" style="height: 32px" onClick="{{ reloadUnban }}" disabled="{{ unbanLoading }}">Обновить</button></div>

<script src="assets/dc-lite.js?v=5f8ce08a"></script>
<script>
// Модерация: настройки бота (mod.config), очередь (mod.review), журнал (mod.journal / mod.undo),
// аналитика (mod.stats), режимы чата Twitch (mod.chat), запросы на разбан (mod.unban).
// Настройки сохраняются автоматически через полсекунды после изменения.
const MOD_TABS = [['analytics', 'Аналитика'], ['filters', 'Фильтры и наказания'], ['queue', 'Очередь и журнал'], ['lists', 'Списки и исключения']];
// Порядок — как в moderate() на сервере: срабатывает первый подходящий фильтр.
const MOD_FKEYS = ['threat', 'tox', 'words', 'bots', 'links', 'promo', 'personal', 'zalgo', 'caps', 'flood', 'mentions', 'long', 'spam', 'newacc'];
const MOD_FMETA = {
  threat: { name: 'Угрозы', dict: true, sens: ['прямые угрозы: «убью тебя», «kys»', '«сдохни», «тебе конец»', '«знаю, где ты живёшь»', '«ответишь за это»'] },
  tox: { name: 'Оскорбления', dict: true, sens: ['самые грубые оскорбления', '«дебил», «урод», «мразь»', '«тупой», «лох», «клоун»', '«удали игру», «позорище»'] },
  words: { name: 'Запрещённые слова' },
  bots: { name: 'Реклама накрутки' },
  links: { name: 'Ссылки' },
  promo: { name: 'Самопиар' },
  personal: { name: 'Личные данные' },
  zalgo: { name: 'Юникод-мусор' },
  caps: { name: 'Капс', params: [['min', 'Сообщение от, букв', 1, 500], ['pct', 'Заглавных от, %', 10, 100]] },
  flood: { name: 'Флуд', params: [['emotes', 'Эмоутов больше', 1, 100], ['chars', 'Символ подряд, раз', 4, 100]] },
  mentions: { name: 'Массовые упоминания', params: [['max', 'Упоминаний больше', 1, 50]] },
  long: { name: 'Длинные сообщения', params: [['max', 'Символов больше', 20, 500]] },
  spam: { name: 'Повторы', params: [['repeats', 'Одинаковых сообщений', 2, 20], ['window', 'За сколько секунд', 5, 600]] },
  newacc: { name: 'Новые аккаунты', params: [['days', 'Аккаунт моложе, дней', 1, 365]] },
};
// Причины из журнала → название фильтра
const MOD_REASON = { 'угрозы в чате': 'threat', 'оскорбления': 'tox', 'запрещённое слово': 'words', 'спам-бот': 'bots', 'ссылки без разрешения': 'links', 'самопиар': 'promo', 'личные данные': 'personal',
  'мусорные символы': 'zalgo', 'без капса, пожалуйста': 'caps', 'флуд': 'flood', 'массовые упоминания': 'mentions', 'слишком длинное сообщение': 'long', 'спам повторами': 'spam', 'новый аккаунт': 'newacc', 'вручную из панели': null };
const MOD_ACTS = ['ladder', 'review', 'delete', 'warn', 'timeout', 'ban'];
const MOD_STEP_ACTS = ['warn', 'delete', 'timeout', 'ban'];
const MOD_DURS = [[30, '30 с'], [60, '1 мин'], [300, '5 мин'], [600, '10 мин'], [1800, '30 мин'], [3600, '1 ч'], [86400, '24 ч'], [604800, '7 дней'], [1209600, '14 дней']];
// Подписи, которые понимает parse_dur() на сервере; остальные длительности пишем числом секунд
const MOD_BACK = { 30: '30 с', 60: '1 мин', 300: '5 мин', 600: '10 мин', 3600: '1 ч', 86400: '24 ч', 604800: '7 дней' };
const MOD_PRESETS = [
  ['Бан сразу', [{ a: 'ban' }]],
  ['Только предупреждения', [{ a: 'warn' }]],
  ['Бан после 3 предупреждений', [{ a: 'warn' }, { a: 'warn' }, { a: 'warn' }, { a: 'ban' }]],
  ['Мут на время', [{ a: 'timeout', d: '10 мин' }]],
  ['Постепенно', [{ a: 'warn' }, { a: 'timeout', d: '10 мин' }, { a: 'timeout', d: '24 ч' }, { a: 'ban' }]],
];
const MOD_MODES = [
  ['slow', 'Медленный режим', 'Одно сообщение раз в 5 секунд'],
  ['followers', 'Только фолловеры', 'Писать могут фолловеры от 10 минут'],
  ['subs', 'Только подписчики', 'Остальные читают, но не пишут'],
  ['emote', 'Только эмоуты', 'Сообщения без текста'],
  ['unique', 'Уникальный чат', 'Нельзя повторять одно и то же сообщение'],
  ['shield', 'Режим щита', 'Защита Twitch от атак с настройками из панели автора'],
];

function modPl(n, a, b, c) { n = Math.abs(n) % 100; const d = n % 10; return n > 10 && n < 20 ? c : d === 1 ? a : d >= 2 && d <= 4 ? b : c; }
function modSec(d) { const back = Object.keys(MOD_BACK).find((k) => MOD_BACK[k] === d); return back ? Number(back) : Math.max(1, parseInt(d, 10) || 1); }
function modCanon(sec) { return MOD_BACK[sec] || String(sec); }
function modHuman(sec) {
  const k = MOD_DURS.find((x) => x[0] === sec);
  if (k) return k[1];
  if (sec >= 86400 && sec % 86400 === 0) { const n = sec / 86400; return n + ' ' + modPl(n, 'день', 'дня', 'дней'); }
  if (sec >= 3600 && sec % 3600 === 0) return sec / 3600 + ' ч';
  if (sec >= 60 && sec % 60 === 0) return sec / 60 + ' мин';
  return sec + ' с';
}
function modWhen(ts) {
  const d = new Date(ts * 1000);
  if (d.toDateString() === new Date().toDateString()) return StreAPI.fmtTime(ts);
  return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) + ' ' + StreAPI.fmtTime(ts);
}
function modNorm(c) {
  c = c || {};
  const f = c.filters || {};
  const ex = c.exempt || {};
  let ladder = (Array.isArray(c.ladder) ? c.ladder : []).filter((s) => s && MOD_STEP_ACTS.indexOf(s.a) >= 0).slice(0, 6)
    .map((s) => (s.a === 'timeout' ? { a: 'timeout', d: modCanon(modSec(String(s.d == null ? '10 мин' : s.d))) } : { a: s.a }));
  if (!ladder.length) ladder = [{ a: 'warn' }];
  const out = {
    auto: !!c.auto, exempt: { mods: !!ex.mods, vip: !!ex.vip, subs: !!ex.subs }, ladder,
    resetDays: Math.max(0, parseInt(c.resetDays, 10) || 0), warnText: String(c.warnText == null ? '' : c.warnText), announce: !!c.announce,
    filters: {}, words: (Array.isArray(c.words) ? c.words : []).map(String), domains: (Array.isArray(c.domains) ? c.domains : []).map(String),
    subsLinks: !!c.subsLinks, permit: !!c.permit,
  };
  MOD_FKEYS.forEach((k) => {
    const x = f[k] || {};
    const o = { on: !!x.on, action: MOD_ACTS.indexOf(x.action) >= 0 ? x.action : 'delete', dur: Math.max(0, parseInt(x.dur, 10) || 0) };
    if (MOD_FMETA[k].sens) o.sens = Math.min(4, Math.max(1, parseInt(x.sens, 10) || 2));
    (MOD_FMETA[k].params || []).forEach((p) => { o[p[0]] = parseInt(x[p[0]], 10) || p[2]; });
    out.filters[k] = o;
  });
  return out;
}
function modDurOpts(sec) {
  const list = MOD_DURS.map((x) => ({ s: x[0], label: x[1] }));
  if (!list.some((x) => x.s === sec)) { list.push({ s: sec, label: modHuman(sec) }); list.sort((a, b) => a.s - b.s); }
  return list;
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    const h = location.hash.replace('#', '');
    const tab = Math.max(0, MOD_TABS.findIndex((t) => t[0] === h));
    this.state = {
      tab, me: null, cfg: null, cfgErr: '', save: 'saved', saveErr: '', drafts: {},
      wordDraft: '', wordErr: '', domDraft: '', domErr: '',
      modes: null, modesAvail: true, modesErr: '', modeBusy: {},
      queue: null, qGone: {}, revealed: {},
      journal: null, jType: '', jErr: '', undoBusy: {}, undoneLocal: {},
      stats: null, statsErr: '',
      unban: null, unbanBusy: {}, unbanLoading: false,
      watchBusy: {}, botBusy: false,
    };
    this.savedJson = '';
    this.saving = false;
    this.again = false;
    this.saveTimer = 0;
    this.retryN = 0;
    this.seen = {};
    this.jSeq = 0;
    this.ticks = 0;
  }

  componentDidMount() {
    this.loadMe();
    this.loadCfg();
    this.loadModes();
    this.loadQueue();
    this.loadUnban();
    this.loadTab(this.state.tab);
    this.timer = setInterval(() => this.tick(), 10000);
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.flush(); else this.tick(); });
    window.addEventListener('beforeunload', (e) => {
      if (this.state.save === 'saved') return;
      this.flush();
      e.preventDefault();
      e.returnValue = '';
    });
  }

  // ---------- опрос ----------
  tick() {
    if (document.hidden) return;
    this.ticks++;
    this.loadQueue();
    if (this.state.tab === 0) this.loadStats();
    if (this.state.tab === 2) { this.loadJournal(); if (this.ticks % 6 === 0) this.loadUnban(); }
    if (this.ticks % 3 === 0) { this.loadModes(); this.loadMe(); }
  }
  loadTab(i) {
    if (i === 0) this.loadStats();
    if (i === 1) this.loadModes();
    if (i === 2) { this.loadQueue(); this.loadJournal(); this.loadUnban(); }
  }
  // Перерисовываем, только если данные изменились
  put(key, val, extra) {
    const j = JSON.stringify(val);
    if (this.seen[key] === j && !extra) return;
    this.seen[key] = j;
    this.setState(Object.assign({ [key]: val }, extra || {}));
  }
  pickTab(i) {
    if (i === this.state.tab) return;
    this.setState({ tab: i });
    try { history.replaceState(null, '', '#' + MOD_TABS[i][0]); } catch (e) { /* без адреса */ }
    this.loadTab(i);
  }

  async loadMe() {
    try { const me = await StreAPI.me(); this.put('me', me); } catch (e) { /* шапка покажет вход */ }
  }
  async enableBot() {
    this.setState({ botBusy: true });
    try {
      const r = await StreAPI.post('bot.enable');
      const me = await StreAPI.refreshMe();
      this.put('me', me);
      StreAPI.toast(r.errors && r.errors.length ? 'Бот включён, но есть проблемы: ' + r.errors.join('; ') : 'Бот включён и следит за чатом');
      this.loadModes();
      this.loadUnban();
    } catch (e) { StreAPI.toast(e.message, 'error'); }
    this.setState({ botBusy: false });
  }

  // ---------- настройки: автосохранение ----------
  async loadCfg() {
    this.setState({ cfgErr: '' });
    try {
      const r = await StreAPI.get('mod.config');
      const cfg = modNorm(r.config);
      this.savedJson = JSON.stringify(cfg);
      this.setState({ cfg, save: 'saved' });
    } catch (e) { this.setState({ cfgErr: e.message }); }
  }
  edit(fn, delay) {
    if (!this.state.cfg) return;
    const cfg = JSON.parse(JSON.stringify(this.state.cfg));
    fn(cfg);
    this.setState({ cfg, save: JSON.stringify(cfg) === this.savedJson ? 'saved' : 'dirty' });
    this.retryN = 0;
    clearTimeout(this.saveTimer);
    this.saveTimer = setTimeout(() => this.flush(), delay == null ? 400 : delay);
  }
  async flush() {
    clearTimeout(this.saveTimer);
    const cfg = this.state.cfg;
    if (!cfg) return;
    const snap = JSON.stringify(cfg);
    if (snap === this.savedJson) { if (this.state.save !== 'saved') this.setState({ save: 'saved', saveErr: '' }); return; }
    if (this.saving) { this.again = true; return; }
    this.saving = true;
    this.again = false;
    this.setState({ save: 'saving' });
    let failed = false;
    try {
      const r = await StreAPI.post('mod.config', { config: cfg });
      const srv = modNorm(r.config);
      this.savedJson = JSON.stringify(srv);
      this.retryN = 0;
      if (JSON.stringify(this.state.cfg) === snap) this.setState({ cfg: srv, save: 'saved', saveErr: '' });
      else this.again = true;
    } catch (e) {
      failed = true;
      this.setState({ save: 'error', saveErr: e.message.replace(/\.$/, '') });
      if (this.retryN < 3) {
        const wait = [4000, 10000, 30000][this.retryN++];
        this.saveTimer = setTimeout(() => this.flush(), wait);
      }
    }
    this.saving = false;
    if (this.again && !failed) { this.again = false; this.saveTimer = setTimeout(() => this.flush(), 150); }
  }
  revert() {
    clearTimeout(this.saveTimer);
    this.retryN = 0;
    this.setState({ cfg: JSON.parse(this.savedJson), save: 'saved', saveErr: '', drafts: {} });
  }
  setDraft(key, val) { this.setState({ drafts: Object.assign({}, this.state.drafts, { [key]: val }) }); }
  dropDraft(key) { if (key in this.state.drafts) { const d = Object.assign({}, this.state.drafts); delete d[key]; this.setState({ drafts: d }); } }

  // ---------- режимы чата ----------
  async loadModes() {
    if (this.modesBusy || Object.keys(this.state.modeBusy).some((k) => this.state.modeBusy[k])) return;
    this.modesBusy = true;
    try {
      const r = await StreAPI.get('mod.chat');
      this.put('modes', r.modes || {});
      if (this.state.modesAvail !== !!r.available || this.state.modesErr) this.setState({ modesAvail: !!r.available, modesErr: '' });
    } catch (e) { if (!this.state.modes) this.setState({ modes: {}, modesAvail: false, modesErr: e.message }); }
    this.modesBusy = false;
  }
  async setMode(mode, on) {
    const busy = (v) => this.setState({ modeBusy: Object.assign({}, this.state.modeBusy, { [mode]: v }) });
    this.setState({ modes: Object.assign({}, this.state.modes, { [mode]: on }), modesErr: '' });
    busy(true);
    try {
      const r = await StreAPI.post('mod.chat', { mode, on });
      this.seen.modes = JSON.stringify(r.modes);
      this.setState({ modes: r.modes, modesAvail: !!r.available });
      const name = (MOD_MODES.find((m) => m[0] === mode) || [0, 'Режим'])[1];
      StreAPI.toast(name + (on ? ' включён' : ' выключен'));
    } catch (e) {
      this.setState({ modes: Object.assign({}, this.state.modes, { [mode]: !on }), modesErr: e.message });
      StreAPI.toast(e.message, 'error');
    }
    busy(false);
  }

  // ---------- очередь ----------
  async loadQueue() {
    if (this.qBusy) return;
    this.qBusy = true;
    try { const r = await StreAPI.get('mod.review'); this.put('queue', r.items || []); }
    catch (e) { if (this.state.queue === null) this.setState({ queue: [] }); }
    this.qBusy = false;
  }
  async review(h, action) {
    if (action === 'ban' && !confirm('Забанить ' + h.login + ' навсегда? Снять бан можно будет в журнале.')) return;
    this.setState({ qGone: Object.assign({}, this.state.qGone, { [h.id]: true }) });
    try {
      const r = await StreAPI.post('mod.review', { id: h.id, action });
      this.seen.queue = JSON.stringify(r.items || []);
      this.setState({ queue: r.items || [] });
      StreAPI.toast({ allow: 'Сообщение разрешено', deny: 'Сообщение удалено', timeout: h.login + ' в муте на 10 минут', ban: h.login + ' забанен' }[action]);
      if (this.state.tab === 2) this.loadJournal();
    } catch (e) {
      const g = Object.assign({}, this.state.qGone);
      delete g[h.id];
      this.setState({ qGone: g });
      StreAPI.toast(e.message, 'error');
      this.loadQueue();
    }
  }

  // ---------- журнал ----------
  async loadJournal() {
    const seq = ++this.jSeq;
    const type = this.state.jType;
    try {
      const r = await StreAPI.get('mod.journal', type ? { type } : null);
      if (seq !== this.jSeq) return;
      this.put('journal', r.items || [], this.state.jErr ? { jErr: '' } : null);
    } catch (e) { if (seq === this.jSeq && this.state.journal === null) this.setState({ journal: [], jErr: e.message }); }
  }
  setJType(t) {
    if (t === this.state.jType) return;
    this.seen.journal = '';
    this.setState({ jType: t, journal: null });
    setTimeout(() => this.loadJournal(), 0);
  }
  async undo(row) {
    this.setState({ undoBusy: Object.assign({}, this.state.undoBusy, { [row.id]: true }) });
    try {
      await StreAPI.post('mod.undo', { id: row.id });
      this.setState({ undoneLocal: Object.assign({}, this.state.undoneLocal, { [row.id]: true }) });
      StreAPI.toast({ ban: row.login + ' разбанен', timeout: 'Мут для ' + row.login + ' снят', warn: 'Предупреждение для ' + row.login + ' снято' }[row.action] + ', счётчик нарушений обнулён');
      this.loadJournal();
      this.loadStats();
    } catch (e) { StreAPI.toast(e.message, 'error'); }
    this.setState({ undoBusy: Object.assign({}, this.state.undoBusy, { [row.id]: false }) });
  }

  // ---------- аналитика ----------
  async loadStats() {
    if (this.sBusy) return;
    this.sBusy = true;
    try {
      const r = await StreAPI.get('mod.stats');
      delete r.ok;
      this.put('stats', r, this.state.statsErr ? { statsErr: '' } : null);
    } catch (e) { if (this.state.statsErr !== e.message) this.setState({ statsErr: e.message }); }
    this.sBusy = false;
  }
  async watchAct(w, action) {
    const login = w.login || w.chatter_id;
    if (action === 'ban' && !confirm('Забанить ' + login + ' навсегда? Снять бан можно будет в журнале.')) return;
    this.setState({ watchBusy: Object.assign({}, this.state.watchBusy, { [w.chatter_id]: true }) });
    try {
      await StreAPI.post('chat.mod', { action, chatterId: w.chatter_id, login, duration: 600 });
      StreAPI.toast(action === 'ban' ? login + ' забанен' : login + ' в муте на 10 минут');
      this.loadStats();
    } catch (e) { StreAPI.toast(e.message, 'error'); }
    this.setState({ watchBusy: Object.assign({}, this.state.watchBusy, { [w.chatter_id]: false }) });
  }

  // ---------- разбан ----------
  async loadUnban() {
    if (this.state.unbanLoading) return;
    this.setState({ unbanLoading: true });
    try { const r = await StreAPI.get('mod.unban'); this.put('unban', r.items || []); }
    catch (e) { if (this.state.unban === null) this.setState({ unban: [] }); StreAPI.toast('Запросы на разбан: ' + e.message, 'error'); }
    this.setState({ unbanLoading: false });
  }
  async unbanAct(u, approve) {
    this.setState({ unbanBusy: Object.assign({}, this.state.unbanBusy, { [u.id]: true }) });
    try {
      const r = await StreAPI.post('mod.unban', { id: u.id, approve });
      this.put('unban', r.items || []);
      StreAPI.toast(approve ? u.login + ' разбанен' : 'Запрос ' + u.login + ' отклонён');
    } catch (e) { StreAPI.toast(e.message, 'error'); }
    this.setState({ unbanBusy: Object.assign({}, this.state.unbanBusy, { [u.id]: false }) });
  }

  // ---------- списки ----------
  addWord() {
    const parts = this.state.wordDraft.split(/[,\n]/).map((s) => s.trim().replace(/\s+/g, ' ')).filter(Boolean);
    if (!parts.length) { this.setState({ wordErr: 'Напиши слово или фразу' }); return; }
    const have = this.state.cfg.words.map((w) => w.toLowerCase());
    const add = [];
    parts.forEach((p) => { const l = p.toLowerCase(); if (have.indexOf(l) < 0 && add.map((x) => x.toLowerCase()).indexOf(l) < 0) add.push(p.slice(0, 100)); });
    if (!add.length) { this.setState({ wordErr: parts.length > 1 ? 'Все эти слова уже в списке' : '«' + parts[0] + '» уже в списке' }); return; }
    this.edit((c) => { c.words = c.words.concat(add); }, 200);
    this.setState({ wordDraft: '', wordErr: '' });
  }
  addDomain() {
    let d = this.state.domDraft.trim().toLowerCase().replace(/^[a-z]+:\/\//, '').replace(/^www\./, '').replace(/[/?#:].*$/, '').replace(/\.$/, '');
    if (!d) { this.setState({ domErr: 'Напиши адрес сайта, например youtube.com' }); return; }
    if (!/^[a-zа-яё0-9-]+(\.[a-zа-яё0-9-]+)+$/i.test(d)) { this.setState({ domErr: 'Не похоже на адрес сайта: нужно что-то вроде youtube.com' }); return; }
    if (this.state.cfg.domains.map((x) => x.toLowerCase()).indexOf(d) >= 0) { this.setState({ domErr: d + ' уже в списке' }); return; }
    this.edit((c) => { c.domains = c.domains.concat([d]); }, 200);
    this.setState({ domDraft: '', domErr: '' });
  }

  // ---------- модели для разметки ----------

    const m = MOD_FMETA[k];
    const c = cfg.filters[k];

    const descs = {
      threat: 'Словарь угроз: «убью тебя», «сдохни», «знаю, где ты живёшь». Чем строже, тем шире список.',
      tox: 'Словарь оскорблений с поиском обхода: «д е б и л», «т.у.п.о.й», латиница вместо кириллицы. Смысл фразы бот не понимает.',
      words: 'Твой список на вкладке «Списки»: ' + cfg.words.length + ' ' + modPl(cfg.words.length, 'слово', 'слова', 'слов') + '. Ловит замену букв, пробелы и точки между буквами.',
      bots: 'Типичная реклама накрутки от спам-ботов: «cheap viewers», «dogehype», «бесплатные зрители».',

      promo: '«Заходите ко мне», «подпишись на мой канал», «мой канал», «follow me».',
      personal: 'Номера телефонов и банковских карт.',
      zalgo: 'Зальго-текст и невидимые символы.',
      caps: 'Сообщение от ' + c.min + ' ' + modPl(c.min, 'буквы', 'букв', 'букв') + ', где заглавных ' + c.pct + '% и больше.',
      flood: 'Больше ' + c.emotes + ' эмоутов или один символ ' + c.chars + ' раз подряд.',
      mentions: 'Больше ' + c.max + ' @упоминаний в одном сообщении.',
      long: 'Сообщения длиннее ' + c.max + ' ' + modPl(c.max, 'символа', 'символов', 'символов') + '.',
      spam: c.repeats + '-е одинаковое сообщение от одного зрителя за ' + c.window + ' с.',
      newacc: 'Аккаунты Twitch младше ' + c.days + ' ' + modPl(c.days, 'дня', 'дней', 'дней') + '. Возраст аккаунта бот узнаёт у Twitch.',
    };
    const durSec = c.dur > 0 ? c.dur : 600;
    const hints = {
      ladder: [ladderText, 'color: var(--n-11)'],
      review: ['Сообщение остаётся в чате и попадает в очередь — решаешь ты', 'color: var(--n-11); border: 1px dashed var(--n-8); border-radius: 4px; padding: 4px 8px; align-self: flex-start'],
      delete: ['Сообщение удаляется, зритель не наказывается', 'color: var(--n-9)'],
      warn: ['Удаляем сообщение и пишем в чат предупреждение', 'color: var(--n-9)'],
      timeout: ['Мут на ' + modHuman(durSec) + (cfg.announce ? ', бот сообщит об этом в чат' : ''), 'color: var(--n-10)'],
      ban: ['Бан без предупреждения. Снять можно в журнале', 'color: var(--accent-text)'],
    };
    const h = hints[c.action];
    const SENS = ['Мягко', 'Средне', 'Строго', 'Максимум'];
    const params = (m.params || []).map((p) => {
      const key = k + '.' + p[0];
      const has = key in s.drafts;
      const raw = has ? s.drafts[key] : String(c[p[0]]);
      const n = Number(raw);
      const bad = has && !(raw !== '' && Number.isInteger(n) && n >= p[2] && n <= p[3]);
      return {
        label: p[1], min: p[2], max: p[3], value: raw, bad, err: 'Целое число от ' + p[2] + ' до ' + p[3],
        set: (e) => {
          const v = e.target.value;
          this.setDraft(key, v);
          const x = Number(v);
          if (v !== '' && Number.isInteger(x) && x >= p[2] && x <= p[3]) upd({ [p[0]]: x }, 800);
        },
        blur: () => this.dropDraft(key),
      };
    });
    return {
      key: k, name: m.name, nameId: 'fn-' + k, dict: !!m.dict, desc: descs[k],
      hasSens: !!m.sens, sens: c.sens || 2, sensLabel: SENS[(c.sens || 2) - 1], sensNote: m.sens ? 'Ловит ' + m.sens[(c.sens || 2) - 1] + ((c.sens || 2) > 1 ? ' и всё, что ловят мягкие уровни' : '') : '', sensAria: 'Чувствительность фильтра «' + m.name + '»',
      hasParams: params.length > 0, params,
      on: c.on ? 'true' : 'false', off: !c.on, swLabel: 'Фильтр «' + m.name + '»', stateLabel: c.on ? 'включён' : 'выключен',
