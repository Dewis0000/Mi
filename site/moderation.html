<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — модерация</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ov{font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9);margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--s-2);border:1px solid var(--n-5);border-radius:8px}
.nav-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10)}
.nav-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.tab{height:44px;padding:0;border:0;background:transparent;color:var(--n-9);font:500 14px/20px var(--font-sans),sans-serif;display:flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--n-12)}
.sw{position:relative;width:40px;height:24px;border-radius:999px;border:1px solid var(--n-8);background:transparent;cursor:pointer;flex:none;padding:0}
.sw span{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:var(--n-9);transition:transform 180ms cubic-bezier(.2,0,0,1)}
.sw[aria-checked="true"]{background:var(--n-13);border-color:var(--n-13)}
.sw[aria-checked="true"] span{transform:translateX(16px);background:var(--n-1)}
.sel{height:36px;box-sizing:border-box;padding:0 30px 0 10px;border-radius:6px;background:var(--s-3);border:1px solid var(--n-8);color:var(--n-12);font:400 13px/18px var(--font-sans),sans-serif;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--n-10) 50%),linear-gradient(135deg,var(--n-10) 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.sel:hover{border-color:var(--n-9)}
.sel:disabled{border-color:var(--n-5);color:var(--n-7);cursor:not-allowed}
.bs{height:36px;padding:0 12px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);font:500 13px/18px var(--font-sans),sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.bs:hover{background:rgb(var(--n-13-rgb) / .04);border-color:var(--n-8)}
.bp{height:36px;padding:0 12px;border-radius:6px;border:0;background:var(--n-13);color:var(--n-1);font:500 13px/18px var(--font-sans),sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.bp:hover{background:var(--n-11)}
.flt{padding:18px 20px;border-radius:8px;border:1px solid var(--n-5);background:var(--s-2);display:flex;flex-direction:column;gap:14px}
.k{font-size:13px;color:var(--n-9);margin:0}
.big{margin:8px 0 0;font-size:28px;line-height:32px;font-weight:500;letter-spacing:-.02em}
.hb{display:grid;grid-template-columns:150px minmax(0,1fr) 48px;gap:12px;align-items:center;font-size:13px;padding:6px 0}
.tr{display:grid;grid-template-columns:60px 150px 150px minmax(0,1fr) 120px 110px;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--n-4);font-size:13px;line-height:18px}
.tr:hover{background:rgb(var(--n-13-rgb) / .03)}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;font-size:12px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;border-radius:4px;background:var(--n-4);border:1px solid var(--n-6);font-size:13px}
.chip button{width:20px;height:20px;border:0;border-radius:3px;background:transparent;color:var(--n-9);cursor:pointer}
.step{flex:1 1 150px;min-width:150px;padding:14px;border-radius:8px;border:1px solid var(--n-6);background:var(--s-3);display:flex;flex-direction:column;gap:10px;position:relative}
.mode{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--n-4)}
@media (max-width: 900px){.tr{grid-template-columns:52px minmax(0,1fr) 110px}.tr .hide{display:none}}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px; flex-wrap: wrap">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<div style="display: flex; align-items: center; gap: 8px">
<div role="status" aria-label="В эфире 2 часа 47 минут, 1284 зрителя" style="display: flex; align-items: center; height: 40px; border: 1px solid var(--n-5); border-radius: 6px">
<span style="display: inline-flex; align-items: center; gap: 8px; height: 100%; padding: 0 12px; border-right: 1px solid var(--n-5)"><span style="width: 8px; height: 8px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 4px rgb(var(--accent-rgb) / 0.25)"></span><span style="font-size: 11px; font-weight: 700; letter-spacing: .08em">В ЭФИРЕ</span></span>
<span class="mono" style="padding: 0 12px; border-right: 1px solid var(--n-5); font-size: 15px">02:47:13</span><span class="mono" style="padding: 0 12px; font-size: 15px">1 284</span>
</div>
<a href="settings.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; font-size: 14px; font-weight: 500"><span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, var(--n-10), var(--n-6)); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--n-1)">КС</span>kira_stream</a>
</div>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" class="sb">
<p class="sb-h">Эфир</p>
<a href="panel.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Обзор</a>
<a href="moderation.html" class="sb-i" aria-current="page"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<p class="sb-h">Бот</p>
<a href="commands.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды<span class="sb-n">24</span></a>
<a href="music.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Музыка</a>
<a href="widgets.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<span class="sb-i sb-off" aria-disabled="true"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 13l-7.5 7.5a2.1 2.1 0 0 1-3-3L11 10M16 16l6-6M8 8l6-6M9 7l8 8M21 11l-8-8"/></svg>Аукционы<span class="sb-tag">скоро</span></span>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
</nav>

<main style="flex: 999 1 680px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div><h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Модерация</h1><p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: var(--n-10); max-width: 640px">Чат Twitch · twitch.tv/kira_stream. Бот действует от имени аккаунта StreOps с правами модератора канала.</p></div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 12px; padding: 6px 6px 6px 14px; border-radius: 8px; border: 1px solid var(--n-6)"><span style="font-size: 14px">Автомодерация</span><button type="button" role="switch" class="sw" aria-checked="{{ autoOn }}" aria-label="Автомодерация" onClick="{{ toggleAuto }}"><span></span></button></div>
<button type="button" onClick="{{ toggleShield }}" aria-pressed="{{ shieldPressed }}" style="{{ shieldStyle }}"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>{{ shieldLabel }}</button>
</div>
</div>

<template data-if="shield">
<div role="alert" style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 2px solid var(--n-12); border-radius: 8px; background: repeating-linear-gradient(135deg, rgb(var(--n-13-rgb) / 0.08) 0 2px, transparent 2px 6px)"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg><div><p style="margin: 0; font-weight: 600">Режим щита включён</p><p style="margin: 2px 0 0; font-size: 13px; color: var(--n-11)">Писать могут только фолловеры старше 10 минут, медленный режим 10 с, новые аккаунты младше 7 дней молчат, чувствительность фильтров максимальная. Выключи, когда атака закончится.</p></div></div>
</template>

<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--n-5); overflow-x: auto">
<div role="tablist" aria-label="Разделы модерации" style="display: flex; gap: 28px">
<template data-for="tabs" data-as="t"><button role="tab" type="button" class="tab" aria-selected="{{ t.sel }}" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}<template data-if="t.hasN"><span class="mono" style="font-size: 12px; color: var(--n-9)">{{ t.n }}</span></template></button></template>
</div>
</div>

<!-- ============ АНАЛИТИКА ============ -->
<template data-if="tA">
<div style="display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center"><p style="margin: 0; font-size: 14px; color: var(--n-10)">Текущий стрим · с 20:06 · обновляется каждые 10 секунд</p><span style="display: inline-flex; padding: 2px; border: 1px solid var(--n-6); border-radius: 6px"><button type="button" class="mono" style="height: 30px; padding: 0 12px; border: 0; border-radius: 4px; background: var(--n-12); color: var(--n-1); font-size: 12px">Стрим</button><button type="button" class="mono" style="height: 30px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: var(--n-9); font-size: 12px">7 д</button><button type="button" class="mono" style="height: 30px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: var(--n-9); font-size: 12px">30 д</button></span></div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px">
<div class="card" style="padding: 18px"><p class="k">Сообщений</p><p class="mono big">3 912</p><p class="mono" style="margin: 6px 0 0; font-size: 12px; color: var(--n-10)">641 уникальный автор</p></div>
<div class="card" style="padding: 18px"><p class="k">Удалено</p><p class="mono big">37</p><p class="mono" style="margin: 6px 0 0; font-size: 12px; color: var(--n-10)">0,9% · 31 ботом, 6 вручную</p></div>
<div class="card" style="padding: 18px"><p class="k">Предупреждений</p><p class="mono big">24</p><p class="mono" style="margin: 6px 0 0; font-size: 12px; color: var(--n-10)">у 19 зрителей</p></div>
<div class="card" style="padding: 18px"><p class="k">Муты / баны</p><p class="mono big">12 / 3</p><p class="mono" style="margin: 6px 0 0; font-size: 12px; color: var(--n-10)">2 бана — боты-спамеры</p></div>
<div class="card" style="padding: 18px"><p class="k">Реакция модераторов</p><p class="mono big">14 с</p><p class="mono" style="margin: 6px 0 0; font-size: 12px; color: var(--n-10)">медиана до действия</p></div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px">
<section class="card" aria-labelledby="tox-t" style="flex: 1 1 280px; padding: 20px; box-sizing: border-box">
<h2 id="tox-t" style="margin: 0; font-size: 17px; font-weight: 600">Индекс токсичности</h2>
<p style="margin: 12px 0 0; display: flex; align-items: baseline; gap: 8px"><span class="mono" style="font-size: 44px; line-height: 48px; font-weight: 500">7</span><span style="font-size: 14px; color: var(--n-9)">из 100 · низкий</span></p>
<div aria-hidden="true" style="margin-top: 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; height: 10px"><span style="background: var(--n-12)"></span><span style="background: repeating-linear-gradient(90deg, var(--n-8) 0 2px, transparent 2px 4px)"></span><span style="background: repeating-linear-gradient(90deg, var(--n-8) 0 1px, transparent 1px 5px)"></span><span style="border: 1px solid var(--n-6); box-sizing: border-box"></span></div>
<div class="mono" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 6px; font-size: 11px; color: var(--n-9)"><span>0–25</span><span>26–50</span><span>51–75</span><span>76–100</span></div>
<p style="margin: 14px 0 0; font-size: 13px; line-height: 18px; color: var(--n-10)">Доля сообщений, которые ИИ-анализ счёл оскорбительными, взвешенная по тяжести. Пик <span class="mono" style="color: var(--n-12)">23</span> — в 22:31, во время рейда.</p>
</section>

<section class="card" aria-labelledby="act-t" style="flex: 3 1 480px; min-width: 0; padding: 20px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap"><h2 id="act-t" style="margin: 0; font-size: 17px; font-weight: 600">Активность и нарушения</h2><div style="display: flex; gap: 16px; font-size: 12px; color: var(--n-10)"><span style="display: inline-flex; gap: 6px; align-items: center"><span style="width: 12px; height: 12px; background: var(--n-6)"></span>Сообщения</span><span style="display: inline-flex; gap: 6px; align-items: center"><span style="width: 12px; height: 12px; background: repeating-linear-gradient(135deg, var(--n-12) 0 2px, var(--n-1) 2px 4px)"></span>Нарушения</span></div></div>
<div role="img" aria-label="Сообщения и нарушения по 10 минут: пик нарушений в 22:30 во время рейда" style="position: relative; margin-top: 16px; height: 180px; display: flex; align-items: flex-end; gap: 4px; border-bottom: 1px solid var(--n-6)">
<template data-for="bars" data-as="b"><span style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%"><span style="height: {{ b.v }}; background: repeating-linear-gradient(135deg, var(--n-12) 0 2px, var(--n-1) 2px 4px)"></span><span style="height: {{ b.m }}; background: var(--n-6)"></span></span></template>
<span style="position: absolute; left: 76%; top: 0; bottom: 0; border-left: 1px dashed var(--n-9)"></span><span style="position: absolute; left: calc(76% + 6px); top: 0; font-size: 11px; color: var(--n-11)">Рейд sever_ops · 212</span>
</div>
<div class="mono" style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--n-9)"><span>20:10</span><span>21:00</span><span>21:50</span><span>22:40</span></div>
</section>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px">
<section class="card" aria-labelledby="cat-t" style="flex: 1 1 360px; padding: 20px; box-sizing: border-box">
<h2 id="cat-t" style="margin: 0 0 10px; font-size: 17px; font-weight: 600">Нарушения по типам</h2>
<template data-for="cats" data-as="c"><div class="hb"><span style="color: var(--n-11)">{{ c.name }}</span><span style="height: 8px; background: var(--n-4)"><span style="display: block; height: 100%; width: {{ c.w }}; background: var(--n-12)"></span></span><span class="mono" style="text-align: right">{{ c.n }}</span></div></template>
</section>
<section class="card" aria-labelledby="watch-t" style="flex: 1 1 360px; padding: 20px; box-sizing: border-box">
<h2 id="watch-t" style="margin: 0; font-size: 17px; font-weight: 600">На заметке</h2>
<p style="margin: 4px 0 10px; font-size: 13px; color: var(--n-9)">Зрители, у которых растёт число нарушений</p>
<template data-for="watch" data-as="w"><div style="display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--n-4)"><span style="min-width: 0"><span style="display: block; font-size: 14px; font-weight: 500">{{ w.nick }}</span><span style="display: block; font-size: 12px; color: var(--n-9)">{{ w.note }}</span></span><span class="mono" style="font-size: 12px; padding: 2px 8px; border: 1px dashed var(--n-9); border-radius: 4px">{{ w.strikes }}</span><span style="display: flex; gap: 4px"><button type="button" class="bs" style="height: 32px">Мут 10 мин</button><button type="button" class="bs" style="height: 32px; color: var(--accent-text)">Бан</button></span></div></template>
</section>
</div>

<section class="card" aria-labelledby="top-t" style="padding: 20px">

<p style="margin: 10px 0 0; font-size: 12px; color: var(--n-9)">Доступ модераторов к панели StreOps — тариф «Максимум». Права модератора в самом Twitch-чате не меняются.</p>

<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tab: 1, auto: true, shield: false, preset: 1,
      ladder: [{ a: 'warn', d: '' }, { a: 'warn', d: '' }, { a: 'warn', d: '' }, { a: 'ban', d: '' }],
      f: {
        tox: { on: true, sens: 2, action: 'review', dur: '10 мин' },
        caps: { on: true, action: 'ladder', dur: '1 мин' },
        links: { on: true, action: 'warn', dur: '1 мин' },
        spam: { on: true, action: 'timeout', dur: '5 мин' },
        flood: { on: true, action: 'delete', dur: '1 мин' },
        words: { on: true, action: 'ladder', dur: '10 мин' },
        threat: { on: true, sens: 3, action: 'ban', dur: '24 ч' },
        bots: { on: true, action: 'ban', dur: '24 ч' },
        promo: { on: true, action: 'timeout', dur: '10 мин' },
        personal: { on: true, action: 'delete', dur: '1 мин' },
        mentions: { on: false, action: 'timeout', dur: '1 мин' },
        long: { on: false, action: 'delete', dur: '1 мин' },
        zalgo: { on: true, action: 'delete', dur: '1 мин' },
        newacc: { on: false, action: 'review', dur: '1 мин' }
      },
      modes: [true, false, false, false, false],
      held: [
        { id: 1, nick: 'anon_4421', reason: 'ИИ: оскорбление · уверенность 86%', time: '22:57', text: 'ты играешь как ****, удаляй игру', shown: false },
        { id: 2, nick: 'new_acc_77', reason: 'Новый аккаунт, 2 дня', time: '22:58', text: 'заходите ко мне на канал, раздача скинов', shown: false },
        { id: 3, nick: 'gleb_1999', reason: 'ИИ: возможна травля · уверенность 61%', time: '22:58', text: 'опять этот vasya со своим капсом, уйди уже', shown: false }
      ],
      logFilter: 'Все', undone: {}, words: ['к*зёл', 'дебил', 'скины бесплатно', 'free followers', 'п*д*р'], draft: ''
    };
  }
  renderVals() {
    const s = this.state;
    const ACT = { warn: 'Предупреждение', delete: 'Только удалить', timeout: 'Мут', ban: 'Бан' };
    const tabs = [['Аналитика', null], ['Фильтры и наказания', null], ['Очередь и журнал', s.held.length], ['Списки и команда', null]];
    const PRE = [
      ['Мягко', [{ a: 'delete', d: '' }, { a: 'warn', d: '' }, { a: 'timeout', d: '1 мин' }, { a: 'timeout', d: '10 мин' }]],
      ['Стандарт', [{ a: 'warn', d: '' }, { a: 'warn', d: '' }, { a: 'warn', d: '' }, { a: 'ban', d: '' }]],
      ['Строго', [{ a: 'warn', d: '' }, { a: 'timeout', d: '10 мин' }, { a: 'timeout', d: '24 ч' }, { a: 'ban', d: '' }]],
      ['Ноль терпимости', [{ a: 'ban', d: '' }]]
    ];
    const setLadder = (n) => this.setState({ ladder: n, preset: -1 });
    const L = s.ladder;
    const ladder = L.map((st, i) => {
      const isBan = st.a === 'ban';
      return {
        title: (i + 1) + '-е нарушение' + (i === L.length - 1 ? ' и далее' : ''),
        a: st.a, d: st.d || '10 мин', isTimeout: st.a === 'timeout',
        note: isBan ? 'Необратимо: разбан только вручную или по запросу' : (st.a === 'warn' ? 'Сообщение удаляется, бот пишет предупреждение' : (st.a === 'timeout' ? 'Сообщение удаляется, зритель молчит' : 'Сообщение удаляется без ответа')),
        noteColor: isBan ? 'var(--accent-text)' : 'var(--n-9)',
        style: isBan ? 'border-color: rgb(var(--accent-text-rgb) / 0.55)' : '',
        actLabel: 'Действие на ступени ' + (i + 1), durLabel: 'Длительность мута на ступени ' + (i + 1), delLabel: 'Убрать ступень ' + (i + 1),
        setA: (e) => { const n = L.slice(); n[i] = { a: e.target.value, d: e.target.value === 'timeout' ? (st.d || '10 мин') : '' }; setLadder(n); },
        setD: (e) => { const n = L.slice(); n[i] = { a: st.a, d: e.target.value }; setLadder(n); },
        del: () => { if (L.length > 1) setLadder(L.filter((_, j) => j !== i)); }
      };
    });
    const warnsBeforeBan = L.findIndex((x) => x.a === 'ban');
    const nWarn = L.filter((x) => x.a === 'warn').length;
    let summary = 'Итог: ';
    summary += L.map((x, i) => (i + 1) + ' → ' + (x.a === 'timeout' ? 'мут ' + (x.d || '10 мин') : ACT[x.a].toLowerCase())).join(' · ');
    if (warnsBeforeBan === L.length - 1 && nWarn === L.length - 1 && nWarn > 0) summary = 'Итог: бан после ' + nWarn + ' предупреждений';
    if (L.length === 1 && L[0].a === 'ban') summary = 'Итог: бан с первого нарушения';

    const FD = [
      ['tox', 'Токсичность и оскорбления', 'ИИ-анализ смысла сообщения: оскорбления, травля, унижение. Работает на русском и английском', true, null],
      ['threat', 'Угрозы и дискриминация', 'Угрозы, призывы к насилию, ненависть по признаку национальности, пола, ориентации', true, null],
      ['caps', 'Капс', null, false, 'больше 70% заглавных · сообщение от 12 символов'],
      ['links', 'Ссылки', 'Любые ссылки, кроме разрешённого списка', false, null],
      ['spam', 'Спам и повторы', null, false, '3 одинаковых сообщения за 30 с · похожесть от 90%'],
      ['flood', 'Флуд символами и эмоутами', null, false, 'больше 8 эмоутов · символ повторяется 10+ раз'],
      ['words', 'Запрещённые слова', 'Свой список, с поиском обхода: «к0з3л», «д е б и л»', false, null],
      ['bots', 'Боты-спамеры', 'Известные спам-боты и аккаунты из списка подозрительных Twitch', false, null],
      ['promo', 'Самопиар', '«Заходите на мой канал», продажа фолловеров и скинов', true, null],
      ['personal', 'Личные данные', 'Номера телефонов, адреса, номера карт — в том числе стримера', false, null],
      ['zalgo', 'Юникод-мусор', 'Зальго, невидимые символы, перевёрнутый текст', false, null],
      ['mentions', 'Массовые упоминания', null, false, 'больше 5 @упоминаний в сообщении'],
      ['long', 'Длинные сообщения', null, false, 'больше 400 символов'],
      ['newacc', 'Новые аккаунты', 'Аккаунты младше 7 дней пишут только через проверку', false, null]
    ];
    const SENS = ['Мягко', 'Средне', 'Строго', 'Максимум'];
    const hintFor = (a, d) => ({
      delete: ['Сообщение удаляется, зритель не наказывается', 'color: var(--n-9)'],
      warn: ['Удаляем и пишем в чат предупреждение', 'color: var(--n-9)'],
      timeout: ['Удаляем и выдаём мут на ' + d, 'color: var(--n-10)'],
      ladder: [summary.replace('Итог: ', 'Лестница: '), 'color: var(--n-11)'],
      review: ['Сообщение задерживается до решения модератора', 'color: var(--n-11); border: 1px dashed var(--n-8); border-radius: 4px; padding: 4px 8px; align-self: flex-start'],
      ban: ['Бан без предупреждения. Используй для угроз и ботов', 'color: var(--accent-text)']
    })[a];
    const upd = (id, patch) => this.setState({ f: Object.assign({}, s.f, { [id]: Object.assign({}, s.f[id], patch) }) });
    const filters = FD.map((x) => {
      const c = s.f[x[0]];
      const h = hintFor(c.action, c.dur);
      return {
        name: x[1], desc: x[2] || '', ai: x[3], hasParam: !!x[4], param: x[4] || '',
        hasSens: c.sens !== undefined, sens: c.sens || 2, sensLabel: SENS[(c.sens || 2) - 1], sensAria: 'Чувствительность: ' + x[1],
        on: c.on ? 'true' : 'false', off: !c.on,
        action: c.action, dur: c.dur, isTimeout: c.action === 'timeout',
        actAria: 'Наказание: ' + x[1], durAria: 'Длительность мута: ' + x[1],
        hint: c.on ? h[0] : 'Фильтр выключен', hintStyle: c.on ? h[1] : 'color: var(--n-7)',
        cardStyle: c.on ? (c.action === 'ban' ? 'border-color: rgb(var(--accent-text-rgb) / 0.45)' : 'border-color: var(--n-6)') : 'background: transparent',
        toggle: () => upd(x[0], { on: !c.on }),
        setAction: (e) => upd(x[0], { action: e.target.value }),
        setDur: (e) => upd(x[0], { dur: e.target.value }),
        setSens: (e) => upd(x[0], { sens: Number(e.target.value) })
      };
    });
    const MD = [['Медленный режим', 'Одно сообщение раз в 5 секунд'], ['Только фолловеры', 'Фолловеры не меньше 10 минут'], ['Только подписчики', 'Остальные видят чат, но не пишут'], ['Только эмоуты', 'Сообщения без текста'], ['Уникальный чат', 'Запрет повторять одно сообщение дважды']];
    const LOG = [
      ['22:58', 'spam_bot_77', 'ban', 'Бот-спамер', 'Бот', ''],
      ['22:51', 'KAPSLOCK_VASYA', 'ban', 'Капс · 4-е нарушение', 'Бот · лестница', '4 из 4'],
      ['22:48', 'KAPSLOCK_VASYA', 'warn', 'Капс', 'Бот · лестница', '3 из 4'],
      ['22:44', 'new_acc_12', 'timeout', 'Самопиар · мут 10 мин', 'Бот', ''],
      ['22:40', 'gleb_1999', 'warn', 'Токсичность', 'lenta_ln', '1 из 4'],
      ['22:31', 'raid_guest_5', 'delete', 'Флуд эмоутами', 'Бот', ''],
      ['22:29', 'anon_1180', 'timeout', 'Ссылка · мут 1 мин', 'moroz_tv', '']
    ];
    const BADGE = { ban: 'border: 2px solid var(--accent-text); color: var(--accent-text)', timeout: 'border: 1px dashed var(--n-10); color: var(--n-12)', warn: 'border: 1px solid var(--n-8); color: var(--n-11)', delete: 'border: 1px dotted var(--n-8); color: var(--n-10)' };
    const ALBL = { ban: 'Бан', timeout: 'Мут', warn: 'Предупреждение', delete: 'Удалено' };
    const LF = [['Все', null], ['Баны', 'ban'], ['Муты', 'timeout'], ['Предупреждения', 'warn'], ['Удаления', 'delete']];
    const curLF = LF.find((x) => x[0] === s.logFilter)[1];
    const log = LOG.filter((r) => !curLF || r[2] === curLF).map((r, i) => {
      const key = r[0] + r[1];
      const und = !!s.undone[key];
      return {
        time: r[0], nick: r[1], action: ALBL[r[2]], badge: BADGE[r[2]], reason: r[3], by: r[4],
        strikes: r[5] ? 'нарушений: ' + r[5] : '',
        canUndo: !und && r[2] !== 'delete', undone: und,
        undoLabel: r[2] === 'ban' ? 'Разбанить' : (r[2] === 'timeout' ? 'Снять мут' : 'Снять'),
        rowStyle: und ? 'opacity: 0.55' : '',
        undo: () => this.setState({ undone: Object.assign({}, s.undone, { [key]: true }) })
      };
    });
    const drop = (id) => this.setState({ held: s.held.filter((h) => h.id !== id) });
    const bars = [[30, 1], [38, 1], [35, 0], [44, 2], [52, 1], [48, 1], [60, 2], [58, 1], [66, 3], [62, 2], [70, 2], [74, 3], [72, 2], [96, 12], [88, 7], [80, 3], [76, 2]];
    const CATS = [['Капс', 11], ['Спам и повторы', 9], ['Ссылки', 7], ['Токсичность', 6], ['Самопиар', 5], ['Флуд эмоутами', 4], ['Запрещённые слова', 3], ['Угрозы', 0]];
    return {
      tabs: tabs.map((t, i) => ({ label: t[0], n: t[1], hasN: t[1] !== null && t[1] > 0, sel: s.tab === i ? 'true' : 'false', style: s.tab === i ? 'color: var(--n-12); box-shadow: inset 0 -2px 0 var(--n-12)' : '', pick: () => this.setState({ tab: i }) })),
      tA: s.tab === 0, tF: s.tab === 1, tJ: s.tab === 2, tL: s.tab === 3,
      autoOn: s.auto ? 'true' : 'false', toggleAuto: () => this.setState({ auto: !s.auto }),
      shield: s.shield, shieldPressed: s.shield ? 'true' : 'false',
      shieldLabel: s.shield ? 'Выключить режим щита' : 'Режим щита',
      shieldStyle: 'height: 40px; padding: 0 14px; border-radius: 6px; font: 500 14px/20px var(--font-sans), sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; ' + (s.shield ? 'background: var(--n-12); color: var(--n-1); border: 0' : 'background: transparent; color: var(--n-12); border: 1px solid var(--n-8)'),
      toggleShield: () => this.setState({ shield: !s.shield }),
      heldCount: s.held.length, noHeld: s.held.length === 0,
      bars: bars.map((b) => ({ m: (b[0] - b[1] * 2) + '%', v: (b[1] * 2) + '%' })),
      cats: CATS.map((c) => ({ name: c[0], n: c[1], w: Math.round(c[1] / 11 * 100) + '%' })),
      watch: [
        { nick: 'KAPSLOCK_VASYA', note: 'капс · 3 предупреждения за 20 минут', strikes: '3 из 4' },
        { nick: 'gleb_1999', note: 'токсичность растёт: 0% → 3,2%', strikes: '1 из 4' },
        { nick: 'anon_4421', note: 'аккаунту 11 дней, сообщение на проверке', strikes: '0 из 4' }
      ],
      presets: PRE.map((p, i) => ({ label: p[0], sel: s.preset === i ? 'true' : 'false', style: s.preset === i ? 'background: var(--n-12); color: var(--n-1); border-color: var(--n-12)' : '', pick: () => this.setState({ ladder: p[1], preset: i }) })),
      ladder, ladderSummary: summary, ladderFull: L.length >= 6,
      addStep: () => { if (L.length < 6) setLadder(L.concat([{ a: 'timeout', d: '24 ч' }])); },
      filters, fOn: FD.filter((x) => s.f[x[0]].on).length, fTotal: FD.length,
      modes: MD.map((m, i) => ({ name: m[0], note: m[1], on: s.modes[i] ? 'true' : 'false', toggle: () => { const n = s.modes.slice(); n[i] = !n[i]; this.setState({ modes: n }); } })),
      held: s.held.map((h) => ({
        nick: h.nick, reason: h.reason, time: h.time, text: h.text,
        blur: h.shown ? 'none' : 'blur(5px)', revealLabel: h.shown ? 'Скрыть' : 'Показать',
        reveal: () => this.setState({ held: s.held.map((x) => x.id === h.id ? Object.assign({}, x, { shown: !x.shown }) : x) }),
        deny: () => drop(h.id), timeout: () => drop(h.id), allow: () => drop(h.id)
      })),
      logF: LF.map((l) => ({ label: l[0], sel: s.logFilter === l[0] ? 'true' : 'false', style: s.logFilter === l[0] ? 'background: var(--n-12); color: var(--n-1); border-color: var(--n-12)' : '', pick: () => this.setState({ logFilter: l[0] }) })),
      log,
      words: s.words.map((w) => ({ text: w, label: 'Убрать «' + w + '»', del: () => this.setState({ words: s.words.filter((x) => x !== w) }) })),
      wordsN: s.words.length,
      draft: s.draft, setDraft: (e) => this.setState({ draft: e.target.value }),
      addWord: () => { const t = s.draft.trim(); if (t && s.words.indexOf(t) < 0) this.setState({ words: s.words.concat([t]), draft: '' }); }
    };
  }
}
DCMount(Component);
</script>
