<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — команды чат-бота</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ov{font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9);margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tab{height:44px;padding:0;border:0;background:transparent;color:var(--n-9);font:500 14px/20px var(--font-sans),sans-serif;display:flex;gap:6px;align-items:center;cursor:pointer}
.tab:hover{color:var(--n-12)}
.cmd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 20px;border-radius:8px;border:1px solid var(--n-5);background:var(--s-2)}
.cmd:hover{border-color:var(--n-6)}
.sw{position:relative;width:40px;height:24px;border-radius:999px;border:1px solid var(--n-8);background:transparent;cursor:pointer;flex:none;padding:0}
.sw span{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:var(--n-9);transition:transform 180ms cubic-bezier(.2,0,0,1)}
.sw[aria-checked="true"]{background:var(--n-13);border-color:var(--n-13)}
.sw[aria-checked="true"] span{transform:translateX(16px);background:var(--n-1)}
.ib{width:36px;height:36px;border-radius:6px;border:0;background:transparent;color:var(--n-10);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ib:hover{background:rgb(var(--n-13-rgb) / .06);color:var(--n-12)}
.fl{display:flex;flex-direction:column;gap:8px}
.fl > label,.lab{font-size:13px;line-height:18px;font-weight:500;color:var(--n-11)}
.inp{height:40px;box-sizing:border-box;padding:0 12px;border-radius:6px;background:var(--s-3);border:1px solid var(--n-8);color:var(--n-12);font:400 15px/22px var(--font-sans),sans-serif;width:100%}
.inp:hover{border-color:var(--n-9)}
.hint{font-size:12px;line-height:16px;color:var(--n-9);margin:0}
.seg{height:36px;padding:0 14px;border:0;border-radius:4px;background:transparent;color:var(--n-10);font:500 14px/20px var(--font-sans),sans-serif;cursor:pointer}
.seg:hover{color:var(--n-12)}
.tag{height:28px;padding:0 10px;border-radius:4px;border:1px solid var(--n-6);background:transparent;color:var(--n-11);font:400 12px/16px 'JetBrains Mono',monospace;cursor:pointer}
.tag:hover{border-color:var(--n-9);background:rgb(var(--n-13-rgb) / .04)}
.rad{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-11);cursor:pointer;border:0;background:transparent;width:100%;text-align:left;font-family:var(--font-sans),sans-serif}
.rad:hover{background:rgb(var(--n-13-rgb) / .04)}
.dot{width:18px;height:18px;border-radius:999px;border:1px solid var(--n-8);box-sizing:border-box;flex:none;display:inline-flex;align-items:center;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;border-radius:4px;background:var(--n-4);border:1px solid var(--n-6);font-size:13px}
.chip button{width:20px;height:20px;border:0;border-radius:3px;background:transparent;color:var(--n-9);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.chip button:hover{color:var(--n-12);background:rgb(var(--n-13-rgb) / .08)}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<a href="settings.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; border-radius: 6px; font-size: 14px; font-weight: 500"><span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, var(--n-10), var(--n-6)); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--n-1)">КС</span>kira_stream<svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" class="sb">
<p class="sb-h">Эфир</p>
<a href="panel.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Обзор</a>
<a href="moderation.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<p class="sb-h">Бот</p>
<a href="commands.html" class="sb-i" aria-current="page"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды<span class="sb-n">24</span></a>
<a href="music.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Музыка</a>
<a href="widgets.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<span class="sb-i sb-off" aria-disabled="true"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 13l-7.5 7.5a2.1 2.1 0 0 1-3-3L11 10M16 16l6-6M8 8l6-6M9 7l8 8M21 11l-8-8"/></svg>Аукционы<span class="sb-tag">скоро</span></span>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
</nav>
<div style="flex: 999 1 640px; min-width: 0">
<nav aria-label="Хлебные крошки"><ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px"><li><a href="panel.html" style="color: var(--n-9)">Стрим-панель</a></li><li aria-hidden="true" style="color: var(--n-7)">/</li><li><a href="#" style="color: var(--n-9)">Чат-бот</a></li><li aria-hidden="true" style="color: var(--n-7)">/</li><li aria-current="page" style="color: var(--n-12)">Команды</li></ol></nav>
<div style="margin-top: 16px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div><h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Команды чат-бота</h1><p style="margin: 6px 0 0; font-size: 15px; color: var(--n-10)">Бот отвечает на них во всех подключённых чатах.</p></div>
<button type="button" style="height: 40px; padding: 0 16px; border-radius: 6px; border: 0; background: var(--n-13); color: var(--n-1); font: 500 14px/20px var(--font-sans), sans-serif; display: inline-flex; align-items: center; gap: 8px; cursor: pointer"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Создать команду</button>
</div>

<div style="margin-top: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section style="flex: 999 1 520px; min-width: 0" aria-label="Список команд">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--n-5)">
<div role="tablist" aria-label="Фильтр команд" style="display: flex; gap: 24px">
<template data-for="tabs" data-as="t"><button role="tab" type="button" class="tab" aria-selected="{{ t.sel }}" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}<span class="mono" style="font-size: 12px; color: var(--n-9)">{{ t.n }}</span></button></template>
</div>
<label style="position: relative; display: block; width: 240px; margin-bottom: 8px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Поиск по командам</span><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 12px; top: 12px; color: var(--n-9)"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.3-4.3"></path></svg><input type="search" class="inp" placeholder="Найти команду" style="padding-left: 36px"></label>
</div>
<ul style="list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<template data-for="shown" data-as="c">
<li class="cmd" style="{{ c.rowStyle }}">
<div style="min-width: 0">
<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap"><span class="mono" style="font-size: 15px; font-weight: 500; color: {{ c.nameColor }}">{{ c.name }}</span><span style="font-size: 12px; line-height: 16px; padding: 2px 8px; border: 1px solid var(--n-6); border-radius: 4px; color: var(--n-10)">{{ c.access }}</span><span class="mono" style="font-size: 12px; color: var(--n-9)">кулдаун {{ c.cd }}</span></div>
<p style="margin: 4px 0 0; font-size: 13px; line-height: 18px; color: var(--n-9)">{{ c.desc }}</p>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 12px; color: var(--n-9); min-width: 64px; text-align: right">{{ c.stateLabel }}</span>
<button type="button" role="switch" class="sw" aria-checked="{{ c.on }}" aria-label="{{ c.swLabel }}" onClick="{{ c.toggle }}"><span></span></button>
<button type="button" class="ib" aria-label="{{ c.editLabel }}" onClick="{{ c.edit }}"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg></button>
</div>
</li>
</template>
</ul>
</section>

<section aria-labelledby="ed-t" style="flex: 1 1 420px; max-width: 520px; min-width: 0; border-radius: 12px; background: rgb(var(--n-2-rgb) / 0.62); border: 1px solid rgb(var(--n-13-rgb) / 0.10); box-shadow: inset 0 1px 0 rgb(var(--n-13-rgb) / 0.08)">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid var(--n-5)"><h2 id="ed-t" style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 600">Редактор: <span class="mono">{{ editing }}</span></h2><button type="button" class="ib" aria-label="Закрыть редактор"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></div>
<form style="padding: 24px; display: flex; flex-direction: column; gap: 24px">

<div class="fl"><span class="lab" id="pf">Префикс</span>
<div role="radiogroup" aria-labelledby="pf" style="display: inline-flex; align-self: flex-start; padding: 2px; border: 1px solid var(--n-6); border-radius: 6px">
<template data-for="prefixes" data-as="p"><button type="button" role="radio" class="seg" aria-checked="{{ p.sel }}" onClick="{{ p.pick }}" style="{{ p.style }}">{{ p.label }}</button></template>
</div>
<p class="hint">Без префикса бот реагирует, если сообщение целиком совпадает с названием.</p>
</div>

<div class="fl"><label for="cn">Название</label>
<div style="display: flex; align-items: center; height: 40px; border-radius: 6px; background: var(--s-3); border: 1px solid var(--n-8); overflow: hidden"><span class="mono" style="padding: 0 0 0 12px; color: var(--n-9); font-size: 15px">{{ prefixShown }}</span><input id="cn" value="дс" class="mono" style="flex: 1; min-width: 0; height: 100%; padding: 0 12px 0 2px; border: 0; background: transparent; color: var(--n-12); font-size: 15px"></div>
</div>

<div class="fl"><label for="rp">Ответ бота</label>
<textarea id="rp" rows="3" style="box-sizing: border-box; width: 100%; padding: 10px 12px; border-radius: 6px; background: var(--s-3); border: 1px solid var(--n-8); color: var(--n-12); font: 400 15px/22px var(--font-sans), sans-serif; resize: vertical">Сервер: discord.gg/kira · заходи, {user}. Команду вызвали {count} раз</textarea>
<div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center"><span class="hint" style="margin-right: 4px">Вставить:</span><button type="button" class="tag" title="Ник того, кто вызвал команду">{user}</button><button type="button" class="tag" title="Сколько раз вызвана команда">{count}</button><button type="button" class="tag" title="Сколько идёт стрим">{uptime}</button><button type="button" class="tag" title="Текущее время по Москве">{time}</button><button type="button" class="tag" title="Число зрителей сейчас">{viewers}</button></div>
<div style="margin-top: 4px; padding: 12px; border-radius: 6px; border: 1px dashed var(--n-6)">
<p class="ov" style="margin-bottom: 6px">Предпросмотр</p>
<p style="margin: 0; font-size: 13px; line-height: 19px"><span class="mono" style="font-size: 11px; color: var(--n-8)">22:54</span> <span style="font-weight: 500; color: var(--n-9)">StreOps</span> <span style="color: var(--n-11)">Сервер: discord.gg/kira · заходи, <b style="font-weight: 500; color: var(--n-12)">moroz_tv</b>. Команду вызвали <span class="mono" style="color: var(--n-12)">185</span> раз</span></p>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div class="fl"><label for="cd1">Кулдаун для всех</label><div style="position: relative"><input id="cd1" class="inp mono" value="30" inputmode="numeric" style="padding-right: 40px"><span style="position: absolute; right: 12px; top: 10px; font-size: 13px; color: var(--n-9)">сек</span></div></div>
<div class="fl"><label for="cd2">Для одного зрителя</label><div style="position: relative"><input id="cd2" class="inp mono" value="120" inputmode="numeric" style="padding-right: 40px"><span style="position: absolute; right: 12px; top: 10px; font-size: 13px; color: var(--n-9)">сек</span></div></div>
</div>

<div class="fl"><span class="lab" id="ac">Кто может вызвать</span>
<div role="radiogroup" aria-labelledby="ac" style="display: flex; flex-direction: column; margin: 0 -12px">
<template data-for="access" data-as="a"><button type="button" role="radio" class="rad" aria-checked="{{ a.sel }}" onClick="{{ a.pick }}"><span class="dot" style="{{ a.ring }}"><template data-if="a.on"><span style="width: 8px; height: 8px; border-radius: 999px; background: var(--n-1)"></span></template></span>{{ a.label }}</button></template>
</div>
<template data-if="showNicks">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 6px; background: var(--s-3); border: 1px solid var(--n-8)">
<div style="display: flex; flex-wrap: wrap; gap: 6px"><span class="chip">moroz_tv<button type="button" aria-label="Убрать moroz_tv"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></span><span class="chip">lenta_ln<button type="button" aria-label="Убрать lenta_ln"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></span></div>
<label for="nk" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Добавить ник</label>
<input id="nk" role="combobox" aria-expanded="true" aria-controls="nk-l" value="tix" style="height: 32px; border: 0; background: transparent; color: var(--n-12); font: 400 14px/20px var(--font-sans), sans-serif; padding: 0">
<ul id="nk-l" role="listbox" style="list-style: none; margin: 0; padding: 4px; border-radius: 6px; background: var(--n-4); border: 1px solid rgb(var(--n-13-rgb) / 0.14)">
<li role="option" aria-selected="true" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px; border-radius: 4px; background: rgb(var(--n-13-rgb) / 0.08); font-size: 14px"><span style="width: 20px; height: 20px; border-radius: 999px; background: linear-gradient(135deg, var(--n-9), var(--n-4))"></span><span><b style="font-weight: 600">tix</b>iy_bard</span><span style="margin-left: auto; font-size: 12px; color: var(--n-9)">подписчик</span></li>
<li role="option" aria-selected="false" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px; border-radius: 4px; font-size: 14px; color: var(--n-11)"><span style="width: 20px; height: 20px; border-radius: 999px; background: linear-gradient(135deg, var(--n-10), var(--n-6))"></span><span><b style="font-weight: 600">tix</b>on_play</span><span style="margin-left: auto; font-size: 12px; color: var(--n-9)">фолловер</span></li>
</ul>
</div>
</template>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 20px; border-top: 1px solid var(--n-5)">
<button type="button" style="height: 40px; padding: 0 12px; border-radius: 6px; border: 0; background: transparent; color: var(--accent-text); font: 500 14px/20px var(--font-sans), sans-serif; display: inline-flex; align-items: center; gap: 8px; cursor: pointer"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"></path></svg>Удалить команду</button>
<span style="display: flex; gap: 8px"><button type="button" style="height: 40px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--n-6); background: transparent; color: var(--n-12); font: 500 14px/20px var(--font-sans), sans-serif; cursor: pointer">Отменить</button><button type="submit" style="height: 40px; padding: 0 16px; border-radius: 6px; border: 0; background: var(--n-13); color: var(--n-1); font: 500 14px/20px var(--font-sans), sans-serif; cursor: pointer">Сохранить команду</button></span>

</template>
<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tab: 0, prefix: 0, access: 5, editing: '!дс',
      on: { '!дс': true, '!тг': true, '!музыка': true, '!аптайм': true, '!прицел': true, '!кубик': false, 'привет': false, '!шаутаут': true }
    };
  }
  renderVals() {
    const cmds = [
      ['!дс', 'Ссылка на Discord-сервер', 'Конкретные ники', '30 с'],
      ['!тг', 'Ссылка на Telegram-канал', 'Все', '30 с'],
      ['!музыка', 'Заказать трек в очередь', 'Подписчики', '60 с'],
      ['!аптайм', 'Сколько идёт стрим', 'Все', '10 с'],
      ['!прицел', 'Код настроек прицела', 'Все', '30 с'],
      ['!кубик', 'Случайное число от 1 до 6', 'Фолловеры', '15 с'],
      ['привет', 'Ответ на приветствие, без префикса', 'Все', '120 с'],
      ['!шаутаут', 'Рекомендовать канал другого стримера', 'Модераторы', '0 с']
    ];
    const on = this.state.on;
    const all = cmds.map((c) => {
      const isOn = !!on[c[0]];
      const active = this.state.editing === c[0];
      return {
        name: c[0], desc: c[1], access: c[2], cd: c[3], isOn,
        on: isOn ? 'true' : 'false',
        stateLabel: isOn ? 'Включена' : 'Выключена',
        nameColor: isOn ? 'var(--n-12)' : 'var(--n-9)',
        rowStyle: active ? 'border-color: var(--n-12); box-shadow: inset 2px 0 0 var(--n-12)' : '',
        swLabel: 'Команда ' + c[0],
        editLabel: 'Настроить ' + c[0],
        toggle: () => this.setState({ on: Object.assign({}, on, { [c[0]]: !isOn }) }),
        edit: () => this.setState({ editing: c[0] })
      };
    });
    const nOn = all.filter((c) => c.isOn).length;
    const tabDefs = [['Все', all.length], ['Включённые', nOn], ['Выключенные', all.length - nOn]];
    const shown = this.state.tab === 0 ? all : all.filter((c) => (this.state.tab === 1 ? c.isOn : !c.isOn));
    const pre = ['!', 'Без префикса', 'Свой'];
    const acc = ['Все', 'Фолловеры', 'Подписчики', 'VIP', 'Модераторы', 'Конкретные ники'];
    return {
      shown,
      editing: this.state.editing,
      tabs: tabDefs.map((t, i) => ({
        label: t[0], n: t[1], sel: this.state.tab === i ? 'true' : 'false',
        style: this.state.tab === i ? 'color: var(--n-12); box-shadow: inset 0 -2px 0 var(--n-12)' : '',
        pick: () => this.setState({ tab: i })
      })),
      prefixes: pre.map((l, i) => ({
        label: l, sel: this.state.prefix === i ? 'true' : 'false',
        style: this.state.prefix === i ? 'background: var(--n-12); color: var(--n-1)' : '',
        pick: () => this.setState({ prefix: i })
      })),
      prefixShown: this.state.prefix === 0 ? '!' : (this.state.prefix === 2 ? '?' : ''),
      access: acc.map((l, i) => ({
        label: l, on: this.state.access === i, sel: this.state.access === i ? 'true' : 'false',
        ring: this.state.access === i ? 'background: var(--n-13); border-color: var(--n-13)' : '',
        pick: () => this.setState({ access: i })
      })),
      showNicks: this.state.access === 5
    };
  }
}
DCMount(Component);
</script>
</body>
</html>
