<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — команды чат-бота</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js?v=460ce522"></script>
<script src="assets/api.js?v=05dec39a"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ov{font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9);margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.card{background:rgb(var(--n-2-rgb) / .62);border:1px solid rgb(var(--n-13-rgb) / .10);border-radius:12px}
.tab{height:44px;padding:0;border:0;background:transparent;color:var(--n-9);font:500 14px/20px var(--font-sans),sans-serif;display:flex;gap:6px;align-items:center;cursor:pointer}
.tab:hover{color:var(--n-12)}
.cmd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 20px;border-radius:8px;border:1px solid var(--n-5);background:var(--s-2)}
.cmd:hover{border-color:var(--n-6)}
.sw{position:relative;width:40px;height:24px;border-radius:999px;border:1px solid var(--n-8);background:transparent;cursor:pointer;flex:none;padding:0}
.sw:disabled{opacity:.5;cursor:default}
.sw span{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:var(--n-9);transition:transform 180ms cubic-bezier(.2,0,0,1)}
.sw[aria-checked="true"]{background:var(--n-13);border-color:var(--n-13)}
.sw[aria-checked="true"] span{transform:translateX(16px);background:var(--n-1)}
.ib{width:36px;height:36px;border-radius:6px;border:0;background:transparent;color:var(--n-10);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ib:hover{background:rgb(var(--n-13-rgb) / .06);color:var(--n-12)}
.fl{display:flex;flex-direction:column;gap:8px}
.fl > label,.lab{font-size:13px;line-height:18px;font-weight:500;color:var(--n-11)}
.inp{height:40px;box-sizing:border-box;padding:0 12px;border-radius:6px;background:var(--s-3);border:1px solid var(--n-8);color:var(--n-12);font:400 15px/22px var(--font-sans),sans-serif;width:100%}
.inp:hover{border-color:var(--n-9)}
.hint{font-size:13px;line-height:18px;color:var(--n-9);margin:0}
.seg{height:36px;padding:0 14px;border:0;border-radius:4px;background:transparent;color:var(--n-10);font:500 14px/20px var(--font-sans),sans-serif;cursor:pointer}
.seg:hover{color:var(--n-12)}
.rad{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-11);cursor:pointer;border:0;background:transparent;width:100%;text-align:left;font-family:var(--font-sans),sans-serif}
.rad:hover{background:rgb(var(--n-13-rgb) / .04)}
.dot{width:18px;height:18px;border-radius:999px;border:1px solid var(--n-8);box-sizing:border-box;flex:none;display:inline-flex;align-items:center;justify-content:center}
.bp{height:40px;padding:0 16px;border-radius:6px;border:0;background:var(--n-13);color:var(--n-1);font:500 14px/20px var(--font-sans),sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;flex:none;text-decoration:none}
.bp:disabled{opacity:.6;cursor:default}
.bs{height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);font:500 14px/20px var(--font-sans),sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;flex:none;text-decoration:none}
.bs:hover{border-color:var(--n-9)}
.bs:disabled{opacity:.6;cursor:default}
.bs.sm{height:32px;padding:0 10px;font-size:13px;line-height:18px}
.bd{height:40px;padding:0 12px;border-radius:6px;border:0;background:transparent;color:var(--accent);font:500 14px/20px var(--font-sans),sans-serif;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.bar{height:6px;border-radius:999px;background:var(--n-5);overflow:hidden}
.bar > span{display:block;height:100%;background:var(--n-13);border-radius:999px}
.errbox{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--n-6);border-radius:8px;background:var(--s-2)}
.empty{margin:16px 0 4px;padding:20px 16px;border:1px dashed var(--n-5);border-radius:8px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;font-size:14px;line-height:20px;color:var(--n-10)}
.chev{transition:transform 180ms cubic-bezier(.2,0,0,1)}
@media (max-width: 700px){.wrap-pad{padding:16px!important}}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none;white-space:nowrap;overflow:hidden}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
.sb-search{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;margin:0 0 8px;border:1px solid var(--n-6);border-radius:8px;background:rgb(var(--n-13-rgb) / .03);color:var(--n-9)}
.sb-search:focus-within{border-color:var(--n-12)}
.sb-search input{flex:1;min-width:0;min-width:0;border:0;outline:0;background:transparent;color:var(--n-12);font:400 14px/20px 'Onest',sans-serif;padding:0}
.sb-search input::placeholder{color:var(--n-9)}
.sb-search input::-webkit-search-cancel-button{display:none}
.sb-search kbd{font:400 10px/1 'JetBrains Mono',monospace;margin-left:auto;color:var(--n-9);border:1px solid var(--n-6);border-radius:4px;padding:2px 5px;white-space:nowrap}
.sb-empty{margin:8px 12px;font-size:13px;color:var(--n-9)}
.sb-hide{display:none!important}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var nav = document.querySelector('nav.sb'), box = nav && nav.querySelector('[data-sb-search]');
  if (!box) return;
  var empty = nav.querySelector('[data-sb-empty]');
  function apply() {
    var q = box.value.trim().toLowerCase(), any = false, group = null, groupHit = false;
    var rows = Array.prototype.slice.call(nav.children).filter(function (el) { return el.matches('a.sb-i, span.sb-i, p.sb-h, div.sb-sep'); });
    rows.forEach(function (el) {
      if (el.matches('p.sb-h')) { if (group) group.classList.toggle('sb-hide', !groupHit && !!q); group = el; groupHit = false; el.classList.remove('sb-hide'); return; }
      if (el.matches('div.sb-sep')) { el.classList.toggle('sb-hide', !!q); return; }
      var hit = !q || (el.textContent + ' ' + (el.getAttribute('data-kw') || '')).toLowerCase().indexOf(q) !== -1;
      el.classList.toggle('sb-hide', !hit);
      if (hit) { groupHit = true; any = true; }
    });
    if (group) group.classList.toggle('sb-hide', !!q && !groupHit);
    if (empty) empty.hidden = any || !q;
  }
  box.addEventListener('input', apply);
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var first = nav.querySelector('a.sb-i:not(.sb-hide)'); if (first) location.href = first.getAttribute('href'); }
    if (e.key === 'Escape') { box.value = ''; apply(); box.blur(); }
  });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); box.focus(); box.select(); }
  });
});
</script>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<a href="settings.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; border-radius: 6px; font-size: 14px; font-weight: 500" aria-label="Профиль" data-dc-keep data-stre-user><span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, var(--n-10), var(--n-6)); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--n-1)" data-av></span><span data-name>Профиль</span><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" class="sb" data-dc-keep>
<label class="sb-search"><svg class="sb-ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" data-sb-search placeholder="Поиск" aria-label="Найти раздел" autocomplete="off"><kbd>Ctrl K</kbd></label><p class="sb-empty" data-sb-empty hidden>Такого раздела нет</p>
<p class="sb-h">Сегодня</p>
<a href="panel.html" class="sb-i" data-kw="главная статистика эфир статус"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Старт</a>
<p class="sb-h">Чат</p>
<a href="moderation.html" class="sb-i" data-kw="фильтр чат удалить бан таймаут проверка"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<a href="mods.html" class="sb-i" data-kw="мод модераторы помощник права журнал"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Помощники</a>
<a href="commands.html" class="sb-i" aria-current="page" data-kw="команда ответ чат кулдаун"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды</a>
<a href="timers.html" class="sb-i" data-kw="таймер сообщение напоминание"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6M12 2v3"/></svg>Таймеры</a>
<p class="sb-h">Музыка</p>
<a href="music.html" class="sb-i" data-kw="музыка трек плеер заказ очередь песня"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Очередь и заказы</a>
<a href="manage.html" class="sb-i" data-kw="помощник канал трек музыка добавить"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Управлять каналом</a>
<p class="sb-h">Эфир и сайт</p>
<a href="widgets.html" class="sb-i" data-kw="виджет obs браузер ссылка чат розыгрыш"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты для OBS</a>
<a href="site-settings.html" class="sb-i" data-kw="сайт подписчики видео значок галочка модератор"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Мой сайт</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i" data-kw="розыгрыш приз участники победитель"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<a href="clips.html" class="sb-i" data-kw="нарезка клип момент видео"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 9-12 9z"/><path d="M3 3v18"/></svg>Нарезки</a>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i" data-kw="тариф оплата аккаунт email промокод"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
<a href="support.html" class="sb-i" data-kw="помощь вопрос обращение"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Поддержка</a>
</nav>
<div style="flex: 999 1 640px; min-width: 0">
<nav aria-label="Хлебные крошки"><ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px"><li><a href="panel.html" style="color: var(--n-9)">Старт</a></li><li aria-hidden="true" style="color: var(--n-7)">/</li><li><span style="color: var(--n-9)">Чат-бот</span></li><li aria-hidden="true" style="color: var(--n-7)">/</li><li aria-current="page" style="color: var(--n-12)">Команды</li></ol></nav>

<div style="margin-top: 16px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div style="min-width: 0; flex: 1 1 420px"><h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Команды чат-бота</h1><p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: var(--n-10)">Команда — это слово в чате и ответ бота на него. Зритель пишет <span class="mono" style="color: var(--n-12)">!аптайм</span>, а бот отвечает, сколько идёт эфир.</p></div>
<button type="button" class="{{ createCls }}" onClick="{{ create }}"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Создать команду</button>
</div>

<section aria-label="Как настроить команду" class="card" style="margin-top: 20px; padding: 16px 20px; box-sizing: border-box">
<p class="ov" style="margin: 0 0 12px">Как настроить за три шага</p>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
<li style="display: flex; gap: 12px; align-items: flex-start; min-width: 0"><span class="mono" style="flex: none; width: 24px; height: 24px; border-radius: 999px; border: 1px solid var(--n-6); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; color: var(--n-11)">1</span><div style="min-width: 0"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Создай команду</p><p class="hint" style="margin-top: 2px">Нажми «Создать команду» и придумай слово, например <span class="mono">!дс</span>.</p></div></li>
<li style="display: flex; gap: 12px; align-items: flex-start; min-width: 0"><span class="mono" style="flex: none; width: 24px; height: 24px; border-radius: 999px; border: 1px solid var(--n-6); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; color: var(--n-11)">2</span><div style="min-width: 0"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Напиши ответ</p><p class="hint" style="margin-top: 2px">Что бот ответит в чате. Можно вставить переменные, например <span class="mono">{uptime}</span>.</p></div></li>
<li style="display: flex; gap: 12px; align-items: flex-start; min-width: 0"><span class="mono" style="flex: none; width: 24px; height: 24px; border-radius: 999px; border: 1px solid var(--n-6); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; color: var(--n-11)">3</span><div style="min-width: 0"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Сохрани</p><p class="hint" style="margin-top: 2px">После сохранения команда работает в чате, если бот подключён к каналу.</p></div></li>
</ol>
</section>

<section role="status" aria-label="Лимит команд" class="card" style="margin-top: 16px; padding: 16px 20px; box-sizing: border-box; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap">
<div style="min-width: 0; flex: 1 1 320px">
<p style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 500">{{ countLabel }}</p>
<div class="bar" aria-hidden="true" style="margin-top: 10px"><span style="width: {{ usedPct }}%"></span></div>
<p class="hint" style="margin-top: 8px">{{ planLine }}</p>
<template data-if="limitShow"><p style="margin: 6px 0 0; font-size: 13px; line-height: 18px; color: var(--n-12)">{{ limitNote }}</p></template>
<template data-if="upsellShow"><p class="hint" style="margin-top: 6px; color: var(--n-10)">{{ upsell }}</p></template>
</div>
<a href="settings.html#billing" class="bs">Тарифы и оплата</a>
</section>

<template data-if="notBot"><section role="status" class="card" style="margin-top: 16px; padding: 14px 16px; box-sizing: border-box"><p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--n-11)">Бот ещё не подключён к каналу, поэтому команды пока не отвечают в чате. Подключить его можно на странице «Старт», кнопкой «Подключить бота». Если кнопка неактивна, бота ещё настраивает администратор.</p></section></template>

<div style="margin-top: 20px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section aria-label="Список команд" class="card" style="flex: 999 1 520px; min-width: 0; box-sizing: border-box; overflow: hidden">
<div style="padding: 16px 20px 0; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--n-5)">
<div role="tablist" aria-label="Фильтр команд" style="display: flex; gap: 24px; flex-wrap: wrap">
<template data-for="tabs" data-as="t"><button role="tab" type="button" class="tab" aria-selected="{{ t.sel }}" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}<span class="mono" style="font-size: 12px; color: var(--n-9)">{{ t.n }}</span></button></template>
</div>
<label style="position: relative; display: block; width: 240px; max-width: 100%; margin-bottom: 8px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Поиск по командам</span><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 12px; top: 12px; color: var(--n-9)"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.3-4.3"></path></svg><input type="search" class="inp" placeholder="Найти команду" value="{{ q }}" onChange="{{ setQ }}" style="padding-left: 36px"></label>
</div>
<div style="padding: 12px 20px 20px">
<template data-if="loading"><p style="margin: 0; padding: 24px 0; font-size: 14px; color: var(--n-9)">Загружаем команды…</p></template>
<template data-if="loadFailed"><div role="alert" class="errbox" style="margin-top: 8px"><p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--n-11)">Не удалось загрузить команды. {{ loadErrText }}</p><button type="button" class="bs sm" onClick="{{ reload }}">Повторить</button></div></template>
<template data-if="emptyAll"><div class="empty"><p style="margin: 0">Команд пока нет. Создай первую, например ссылку на Discord или ответ «Сколько идёт эфир».</p><button type="button" class="bs" onClick="{{ create }}">Создать команду</button></div></template>
<template data-if="emptyFilter"><div class="empty"><p style="margin: 0">{{ filterText }}</p><button type="button" class="bs" onClick="{{ resetFilter }}">Показать все команды</button></div></template>
<template data-if="showList">
<p class="hint">«Стартовые» создаются при первом входе: !аптайм, !команды, !время. Их можно менять или удалить.</p>
<ul style="list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<template data-for="shown" data-as="c">
<li class="cmd" style="{{ c.rowStyle }}">
<div style="min-width: 0">
<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap"><span class="mono" style="font-size: 15px; font-weight: 500; color: {{ c.nameColor }}">{{ c.name }}</span><span style="font-size: 12px; line-height: 16px; padding: 2px 8px; border: 1px solid var(--n-6); border-radius: 4px; color: var(--n-10)">{{ c.access }}</span><template data-if="c.starter"><span style="font-size: 12px; line-height: 16px; padding: 2px 8px; border-radius: 4px; background: var(--n-4); color: var(--n-11)">стартовая</span></template></div>
<p style="margin: 4px 0 0; font-size: 13px; line-height: 18px; color: var(--n-9); overflow-wrap: anywhere">{{ c.desc }}</p>
<p class="mono" style="margin: 4px 0 0; font-size: 12px; line-height: 16px; color: var(--n-9)">{{ c.cd }} · {{ c.uses }}</p>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 12px; color: var(--n-9); min-width: 72px; text-align: right">{{ c.stateLabel }}</span>
<button type="button" role="switch" class="sw" aria-checked="{{ c.on }}" aria-label="{{ c.swLabel }}" onClick="{{ c.toggle }}"><span></span></button>
<button type="button" class="ib" aria-label="{{ c.editLabel }}" onClick="{{ c.edit }}"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg></button>
</div>
</li>
</template>
</ul>
</template>
</div>
</section>

<section aria-labelledby="ed-t" class="card" style="flex: 1 1 420px; max-width: 540px; min-width: 0; box-sizing: border-box; box-shadow: inset 0 1px 0 rgb(var(--n-13-rgb) / 0.08)">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 20px 24px; border-bottom: 1px solid var(--n-5)"><h2 id="ed-t" style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 600">{{ edTitle }}</h2><template data-if="hasEditor"><button type="button" class="ib" aria-label="Закрыть редактор" onClick="{{ closeEd }}"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></template></div>

<template data-if="noEditor">
<div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
<p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--n-10)">Выбери команду в списке, чтобы изменить её, или нажми «Создать команду».</p>
<div class="card" style="padding: 16px 18px; box-sizing: border-box; background: var(--s-2)">
<h3 style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 600">Переменные для ответа</h3>
<p class="hint" style="margin-top: 4px">Бот заменяет переменную на живое значение в момент ответа. Вставить их можно в редакторе команды.</p>
<template data-for="vars" data-as="v"><div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--n-4)"><div style="min-width: 0"><span class="mono" style="font-size: 13px; color: var(--n-12)">{{ v.code }}</span> <span class="mono" style="font-size: 12px; color: var(--n-9); overflow-wrap: anywhere">{{ v.ex }}</span><p class="hint" style="margin-top: 2px">{{ v.desc }}</p></div><button type="button" class="bs sm" disabled="{{ v.dis }}" onClick="{{ v.pick }}">Вставить</button></div></template>
</div>
</div>
</template>

<template data-if="hasEditor">
<form style="padding: 20px 24px; display: flex; flex-direction: column; gap: 22px" onSubmit="{{ save }}">

<template data-if="isNew"><div class="fl"><span class="lab">Заготовка (необязательно)</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><template data-for="templates" data-as="tp"><button type="button" class="bs sm" onClick="{{ tp.pick }}">{{ tp.label }}</button></template></div><p class="hint">Заполнит поля, а дальше ты их поправишь и сохранишь.</p></div></template>

<div class="fl"><span class="lab" id="pf">Префикс</span>
<div role="radiogroup" aria-labelledby="pf" style="display: inline-flex; align-self: flex-start; padding: 2px; border: 1px solid var(--n-6); border-radius: 6px">
<template data-for="prefixes" data-as="p"><button type="button" role="radio" class="seg" aria-checked="{{ p.sel }}" onClick="{{ p.pick }}" style="{{ p.style }}">{{ p.label }}</button></template>
</div>
<p class="hint">Знак перед словом. Без префикса бот отвечает, только если сообщение целиком совпадает с названием.</p>
</div>

<div class="fl"><label for="cn">Название</label>
<div style="display: flex; align-items: center; height: 40px; border-radius: 6px; background: var(--s-3); border: 1px solid var(--n-8); overflow: hidden"><span class="mono" style="padding: 0 0 0 12px; color: var(--n-9); font-size: 15px">{{ f.prefix }}</span><input id="cn" value="{{ f.name }}" onChange="{{ setName }}" autocomplete="off" placeholder="дс" class="mono" style="flex: 1; min-width: 0; height: 100%; padding: 0 12px 0 2px; border: 0; background: transparent; color: var(--n-12); font-size: 15px"></div>
<p class="hint">Одно слово без пробелов. Регистр не важен: !Дс и !дс — одна команда.</p>
</div>

<div class="fl"><label for="rp">Ответ бота</label>
<textarea id="rp" rows="3" value="{{ f.response }}" onChange="{{ setResp }}" placeholder="Сервер Discord: discord.gg/… · заходи, {user}" style="box-sizing: border-box; width: 100%; padding: 10px 12px; border-radius: 6px; background: var(--s-3); border: 1px solid var(--n-8); color: var(--n-12); font: 400 15px/22px var(--font-sans), sans-serif; resize: vertical"></textarea>
<div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap"><p class="hint">Вставь переменные из блока ниже: они заменятся на живые значения.</p><span class="hint mono">{{ respCount }}</span></div>
</div>

<div class="card" style="padding: 16px 18px; box-sizing: border-box; background: var(--s-2)">
<h3 style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 600">Переменные для ответа</h3>
<p class="hint" style="margin-top: 4px">Нажми «Вставить», и переменная добавится в конец ответа. Бот заменит её на значение в момент ответа.</p>
<template data-for="vars" data-as="v"><div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--n-4)"><div style="min-width: 0"><span class="mono" style="font-size: 13px; color: var(--n-12)">{{ v.code }}</span> <span class="mono" style="font-size: 12px; color: var(--n-9); overflow-wrap: anywhere">{{ v.ex }}</span><p class="hint" style="margin-top: 2px">{{ v.desc }}</p></div><button type="button" class="bs sm" disabled="{{ v.dis }}" onClick="{{ v.pick }}">Вставить</button></div></template>
</div>

<div style="padding: 12px 14px; border-radius: 8px; border: 1px dashed var(--n-6)">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap">
<p class="ov" style="margin: 0">Предпросмотр в чате</p>
<div role="radiogroup" aria-label="Пример: в эфире или нет" style="display: inline-flex; padding: 2px; border: 1px solid var(--n-6); border-radius: 6px">
<button type="button" role="radio" class="seg" aria-checked="{{ pvLiveSel }}" onClick="{{ pickPvLive }}" style="{{ pvLiveStyle }}">В эфире</button><button type="button" role="radio" class="seg" aria-checked="{{ pvOffSel }}" onClick="{{ pickPvOff }}" style="{{ pvOffStyle }}">Вне эфира</button>
</div>
</div>
<p style="margin: 10px 0 0; font-size: 13px; line-height: 19px; color: var(--n-10)"><span style="color: var(--n-9)">{{ previewUser }}:</span> <span class="mono" style="color: var(--n-11)">{{ previewAsk }}</span></p>
<p style="margin: 4px 0 0; font-size: 13px; line-height: 19px; color: var(--n-12); overflow-wrap: anywhere"><span style="font-weight: 500">{{ botName }}:</span> <span>{{ preview }}</span></p>
<p class="hint" style="margin-top: 8px">Пример с придуманными значениями. В реальном чате будут настоящие.</p>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div class="fl"><label for="cd1">Пауза для всех</label><div style="position: relative"><input id="cd1" class="inp mono" type="number" min="0" max="3600" value="{{ f.cooldownGlobal }}" onChange="{{ setCdg }}" style="padding-right: 44px"><span style="position: absolute; right: 12px; top: 10px; font-size: 13px; color: var(--n-9)">сек</span></div><span class="hint">Кулдаун: после вызова команда ждёт столько секунд. Модераторы не ждут.</span></div>
<div class="fl"><span class="lab">Кто может вызвать</span><div class="inp" style="display: flex; align-items: center">{{ accessLabel }}</div><span class="hint">Поменять можно в расширенных настройках ниже.</span></div>
</div>

<div class="fl">
<button type="button" class="bs" aria-expanded="{{ advAria }}" onClick="{{ toggleAdv }}" style="width: 100%; justify-content: space-between"><span>Расширенные настройки</span><svg class="ic chev" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="{{ advIconStyle }}"><path d="M6 9l6 6 6-6"></path></svg></button>
<template data-if="advOpen">
<div style="margin-top: 8px; padding: 16px; display: flex; flex-direction: column; gap: 20px; border: 1px solid var(--n-5); border-radius: 8px">
<div class="fl"><label for="cd2">Пауза для одного зрителя</label><div style="position: relative"><input id="cd2" class="inp mono" type="number" min="0" max="86400" value="{{ f.cooldownUser }}" onChange="{{ setCdu }}" style="padding-right: 44px"><span style="position: absolute; right: 12px; top: 10px; font-size: 13px; color: var(--n-9)">сек</span></div><span class="hint">Сколько ждать одному и тому же зрителю между вызовами. 0 — без ограничения.</span></div>
<div class="fl"><span class="lab" id="ac">Кто может вызвать</span>
<div role="radiogroup" aria-labelledby="ac" style="display: flex; flex-direction: column; margin: 0 -12px">
<template data-for="access" data-as="a"><button type="button" role="radio" class="rad" aria-checked="{{ a.sel }}" onClick="{{ a.pick }}"><span class="dot" style="{{ a.ring }}"><template data-if="a.on"><span style="width: 8px; height: 8px; border-radius: 999px; background: var(--n-1)"></span></template></span><span>{{ a.label }}</span><span class="hint" style="margin-left: auto; text-align: right">{{ a.sub }}</span></button></template>
</div>
<template data-if="showNicks"><label class="fl" style="margin-top: 8px"><span class="hint">Ники через запятую. Модераторы и стример могут всегда.</span><input class="inp" value="{{ f.allowList }}" onChange="{{ setList }}" placeholder="moroz_tv, lenta_ln"></label></template>
</div>
<div class="fl"><label for="cdesc">Пометка для себя</label><input id="cdesc" class="inp" value="{{ f.description }}" onChange="{{ setDesc }}" placeholder="Ссылка на Discord-сервер"><span class="hint">Видна только тебе. Показывается в списке вместо ответа.</span></div>
</div>
</template>
</div>

<template data-if="hasErr"><p role="alert" style="margin: 0; padding: 10px 12px; border: 1px solid var(--n-6); border-radius: 6px; font-size: 14px; line-height: 20px; color: var(--n-12)">{{ err }}</p></template>

<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 20px; border-top: 1px solid var(--n-5)">
<template data-if="canDelete"><button type="button" class="bd" onClick="{{ remove }}"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"></path></svg>Удалить команду</button></template>
<span style="display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap"><button type="button" class="bs" onClick="{{ closeEd }}">Отменить</button><button type="submit" class="bp" disabled="{{ saving }}">{{ saveLabel }}</button></span>
</div>
</form>
</template>
</section>
</div>

<section aria-labelledby="tts-t" class="card" style="margin-top: 20px; padding: 20px 24px; box-sizing: border-box">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap">
<div style="min-width: 0; flex: 1 1 360px"><h2 id="tts-t" style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 600">Озвучка (!tts)</h2><p class="hint" style="margin-top: 4px">Зритель пишет в чат «!tts текст», и бот передаёт этот текст на страницу в OBS. Там его читают вслух, и это слышно в эфире.</p></div>
<div style="display: flex; align-items: center; gap: 12px"><span style="font-size: 13px; color: var(--n-9)">{{ ttsStateLabel }}</span><button type="button" role="switch" class="sw" aria-checked="{{ ttsOn }}" aria-label="Озвучка !tts включена" disabled="{{ ttsOff }}" onClick="{{ ttsToggle }}"><span></span></button></div>
</div>
<p class="hint" style="margin-top: 12px">Переключатель сохраняется сразу. «Включена» — команда !tts работает для тех, кому разрешено ниже. «Выключена» — !tts ничего не делает.</p>

<template data-if="ttsLoading"><p style="margin: 16px 0 0; font-size: 14px; color: var(--n-9)">Загружаем настройки озвучки…</p></template>
<template data-if="ttsErrShow"><div role="alert" class="errbox" style="margin-top: 16px"><p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--n-11)">Не удалось загрузить настройки озвучки. {{ ttsErr }}</p><button type="button" class="bs sm" onClick="{{ reloadTts }}">Повторить</button></div></template>

<template data-if="ttsReady">
<div style="margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
<div class="fl"><label for="tta">Кто может озвучивать</label><select id="tta" class="inp" value="{{ ttsAccess }}" disabled="{{ ttsOff }}" onChange="{{ ttsSetAccess }}"><template data-for="ttsAccOpts" data-as="o"><option value="{{ o.v }}">{{ o.label }}</option></template></select><span class="hint">Для начала оставь «Модераторы и стример».</span></div>
<div class="fl"><label for="ttc">Пауза между сообщениями, сек</label><input id="ttc" class="inp mono" type="number" min="0" max="600" value="{{ ttsCooldown }}" disabled="{{ ttsOff }}" onChange="{{ ttsSetCooldown }}"><span class="hint">Сколько ждать одному зрителю между !tts. Модераторы без паузы. 0 — без паузы.</span></div>
<div class="fl"><label for="ttl">Максимум символов</label><input id="ttl" class="inp mono" type="number" min="20" max="300" value="{{ ttsMaxLen }}" disabled="{{ ttsOff }}" onChange="{{ ttsSetMaxLen }}"><span class="hint">Текст длиннее обрежется до этой длины.</span></div>
</div>
<template data-if="ttsListShow"><div class="fl" style="margin-top: 14px"><label for="tta2">Ники, которые могут озвучивать</label><textarea id="tta2" rows="2" value="{{ ttsAllow }}" disabled="{{ ttsOff }}" onChange="{{ ttsSetAllow }}" placeholder="moroz_tv, lenta_ln" style="box-sizing: border-box; width: 100%; padding: 10px 12px; border-radius: 6px; background: var(--s-3); border: 1px solid var(--n-8); color: var(--n-12); font: 400 14px/20px var(--font-sans), system-ui, sans-serif; resize: vertical"></textarea><span class="hint">Через запятую, без @. Модераторы и стример могут всегда.</span></div></template>
<div style="margin-top: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap"><button type="button" class="bs" disabled="{{ ttsOff }}" onClick="{{ ttsSave }}">{{ ttsSaveLabel }}</button><span class="hint">{{ ttsStatus }}</span></div>
</template>

<div style="margin-top: 20px; padding: 14px 16px; border-radius: 8px; border: 1px dashed var(--n-6); box-sizing: border-box">
<h3 style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 600">Подключить в OBS</h3>
<ol style="margin: 8px 0 0; padding: 0 0 0 18px; font-size: 13px; line-height: 19px; color: var(--n-10)">
<li>Скопируй ссылку ниже.</li>
<li>В OBS нажми «Источники», «+», «Браузер» и вставь ссылку.</li>
<li>Звук из браузера попадёт в эфир. Голос берётся из браузера, поэтому на компьютере со OBS должен быть установлен русский голос.</li>
</ol>
<div style="margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center"><input readonly class="inp mono" style="flex: 1 1 320px; font-size: 13px" value="{{ ttsUrl }}" aria-label="Ссылка для OBS"><button type="button" class="bs" disabled="{{ ttsCopyOff }}" onClick="{{ ttsCopy }}">{{ ttsCopyLabel }}</button></div>
</div>
</section>

</div>
</div>
</div>
</template>
<script src="assets/dc-lite.js?v=5f8ce08a"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      items: [], loaded: false, loadErr: '', limit: 0, user: null, bot: 'StreOps',
      tab: 0, q: '', f: null, saving: false, err: '', adv: false, pvLive: true,
      tts: null, ttsToken: '', ttsLoaded: false, ttsErr: '', ttsBusy: false, ttsDirty: false, ttsSaved: false, ttsCopied: false,
    };
  }
  componentDidMount() { this.load(false); this.loadTts(); }

  // ---------- загрузка ----------
  async load(quiet) {
    if (!quiet) this.setState({ loaded: false, loadErr: '' });
    StreAPI.me().then((me) => this.setState({ user: me.user || null, bot: (me.bot && me.bot.login) || 'StreOps' }));
    try {
      const r = await StreAPI.get('commands.list');
      this.setState({ items: r.items, limit: r.limit, loaded: true, loadErr: '' });
    } catch (e) {
      this.setState({ loaded: true, loadErr: e.message || 'нет связи с сервером' });
      if (quiet) StreAPI.toast(e.message, 'error');
    }
  }
  async loadTts() {
    this.setState({ ttsLoaded: false, ttsErr: '' });
    try {
      const r = await StreAPI.get('tts.get');
      this.setState({ tts: r.cfg, ttsToken: r.token || '', ttsLoaded: true, ttsDirty: false, ttsSaved: false });
    } catch (e) { this.setState({ ttsLoaded: true, tts: null, ttsErr: e.message || 'нет связи с сервером' }); }
  }

  // ---------- озвучка ----------
  setTts(p) { this.setState({ tts: Object.assign({}, this.state.tts, p), ttsDirty: true, ttsSaved: false }); }
  async saveTts(revertTo) {
    this.setState({ ttsBusy: true });
    try {
      await StreAPI.post('tts.save', this.state.tts);
      this.setState({ ttsBusy: false, ttsDirty: false, ttsSaved: true });
      StreAPI.toast('Озвучка сохранена');
    } catch (e) {
      this.setState(revertTo ? { ttsBusy: false, tts: revertTo } : { ttsBusy: false });
      StreAPI.toast(e.message, 'error');
    }
  }
  toggleTts() {
    const prev = this.state.tts;
    if (!prev || this.state.ttsBusy) return;
    this.setState({ tts: Object.assign({}, prev, { on: !prev.on }), ttsDirty: true });
    this.saveTts(prev);
  }
  copyTtsUrl() {
    const url = location.origin + '/w/tts.php?t=' + encodeURIComponent(this.state.ttsToken);
    const done = () => { this.setState({ ttsCopied: true }); setTimeout(() => this.setState({ ttsCopied: false }), 2000); };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => StreAPI.toast('Скопируй ссылку вручную: ' + url, 'error'));
    else StreAPI.toast('Скопируй ссылку вручную: ' + url, 'error');
  }

  // ---------- команды ----------
  edit(c) {
    const isEdit = !!c;
    this.setState({
      f: c ? Object.assign({}, c) : { id: 0, name: '', prefix: '!', response: '', access: 'all', allowList: '', cooldownGlobal: 30, cooldownUser: 0, description: '' },
      err: '',
      adv: isEdit && (c.access !== 'all' || c.cooldownUser > 0 || !!c.description),
    });
  }
  setF(p) { this.setState({ f: Object.assign({}, this.state.f, p) }); }
  toggleAdv() { this.setState({ adv: !this.state.adv }); }
  insertVar(code) {
    const f = this.state.f;
    if (!f) return;
    const cur = f.response || '';
    const sep = cur && !/\s$/.test(cur) ? ' ' : '';
    this.setF({ response: cur + sep + code });
  }
  async save(e) {
    if (e && e.preventDefault) e.preventDefault();
    const f = this.state.f;
    if (!f) return;
    const name = (f.name || '').trim();
    const response = (f.response || '').trim();
    let err = '';
    if (!name) err = 'Укажи название команды';
    else if (name.length > 40) err = 'Название длиннее 40 символов';
    else if (!response) err = 'Напиши, что ответит бот';
    else if (response.length > 480) err = 'Ответ длиннее 480 символов. Сократи его';
    else if ((f.description || '').length > 200) err = 'Пометка длиннее 200 символов';
    if (err) { this.setState({ err: err }); return; }
    this.setState({ saving: true, err: '' });
    try {
      const r = await StreAPI.post('commands.save', Object.assign({}, f, { name: name, response: response }));
      StreAPI.toast('Команда ' + r.item.prefix + r.item.name + ' сохранена');
      this.setState({ f: r.item, saving: false });
      this.load(true);
    } catch (e2) { this.setState({ saving: false, err: e2.message }); }
  }
  toggleCmd(c) {
    const prev = this.state.items;
    this.setState({ items: prev.map((x) => (x.id === c.id ? Object.assign({}, x, { enabled: !x.enabled }) : x)) });
    StreAPI.post('commands.toggle', { id: c.id }).catch((e) => { this.setState({ items: prev }); StreAPI.toast(e.message, 'error'); });
  }
  async removeCmd() {
    const f = this.state.f;
    if (!f || !f.id) return;
    if (!confirm('Удалить команду ' + f.prefix + f.name + '? Отменить будет нельзя.')) return;
    try {
      await StreAPI.post('commands.delete', { id: f.id });
      StreAPI.toast('Команда удалена');
      this.setState({ f: null, err: '' });
      this.load(true);
    } catch (e) { StreAPI.toast(e.message, 'error'); }
  }
  applyTemplate(t) {
    if (!this.state.f || this.state.f.id) return;
    this.setF({ name: t.name, response: t.response, description: t.desc });
  }

  renderVals() {
    const s = this.state;
    const ACC = { all: 'Все зрители', followers: 'Фолловеры и выше', subs: 'Подписчики и выше', vip: 'Випы и модераторы', mods: 'Только модераторы', list: 'Только из списка' };
    const ACC_OPTS = [
      ['all', 'Все зрители', 'любой, кто написал в чат'],
      ['followers', 'Фолловеры и выше', 'фолловеры, подписчики, випы, модераторы'],
      ['subs', 'Подписчики и выше', 'подписчики, випы, модераторы'],
      ['vip', 'Випы и модераторы', ''],
      ['mods', 'Только модераторы', 'модераторы и стример'],
      ['list', 'Только из списка', 'ники ниже'],
    ];
    const STARTERS = ['аптайм', 'команды', 'время'];
    const f = s.f;
    const q = s.q.trim().toLowerCase();
    const n = s.items.length;
    const limit = s.limit || 0;
    const plan = s.user ? s.user.plan : '';
    const planName = s.user ? s.user.planName : '';
    const atLimit = s.loaded && !s.loadErr && limit > 0 && n >= limit;
    const usedPct = limit ? Math.min(100, Math.round(n / limit * 100)) : 0;
    const all = s.items.filter((c) => !q || (c.prefix + c.name + ' ' + c.response + ' ' + (c.description || '')).toLowerCase().indexOf(q) >= 0).map((c) => {
      const active = !!f && f.id === c.id;
      return {
        name: c.prefix + c.name, desc: c.description || c.response, access: ACC[c.access] || 'Все зрители',
        starter: c.prefix === '!' && STARTERS.indexOf(c.name) >= 0,
        cd: c.cooldownGlobal > 0 ? 'пауза ' + c.cooldownGlobal + ' с' : 'без паузы',
        uses: 'вызовов: ' + StreAPI.fmtNum(c.uses), isOn: !!c.enabled,
        on: c.enabled ? 'true' : 'false', stateLabel: c.enabled ? 'Включена' : 'Выключена',
        nameColor: c.enabled ? 'var(--n-12)' : 'var(--n-9)',
        rowStyle: active ? 'border-color: var(--n-12); box-shadow: inset 2px 0 0 var(--n-12)' : '',
        swLabel: 'Команда ' + c.prefix + c.name, editLabel: 'Настроить ' + c.prefix + c.name,
        toggle: () => this.toggleCmd(c),
        edit: () => this.edit(c),
      };
    });
    const nOn = all.filter((c) => c.isOn).length;
    const tabDefs = [['Все', n], ['Включённые', s.items.filter((c) => c.enabled).length], ['Выключенные', s.items.filter((c) => !c.enabled).length]];
    const shown = s.tab === 0 ? all : all.filter((c) => (s.tab === 1 ? c.isOn : !c.isOn));
    const loading = !s.loaded;
    const loadFailed = s.loaded && !!s.loadErr;
    const emptyAll = s.loaded && !s.loadErr && n === 0;
    const emptyFilter = s.loaded && !s.loadErr && n > 0 && shown.length === 0;
    const filterText = q ? 'Ничего не найдено по запросу «' + s.q.trim() + '».' : (s.tab === 1 ? 'Включённых команд нет.' : 'Выключенных команд нет.');
    const pre = [['!', '!'], ['', 'Без префикса'], ['?', '?']];
    const isNew = !!f && !f.id;
    const useArgs = !!f && /\{(target|args)\}/.test(f.response || '');
    const cmdList = s.items.filter((c) => c.enabled && c.access === 'all').map((c) => c.prefix + c.name);
    const VARS = [
      { code: '{user}', ex: 'moroz_tv', desc: 'Ник того, кто вызвал команду' },
      { code: '{count}', ex: '185', desc: 'Сколько раз команду вызвали' },
      { code: '{uptime}', ex: '2 ч 47 мин', desc: 'Сколько идёт эфир. Без эфира — «стрим сейчас не идёт»' },
      { code: '{time}', ex: '21:40 МСК', desc: 'Текущее время по Москве' },
      { code: '{channel}', ex: 'kira_stream', desc: 'Название твоего канала' },
      { code: '{game}', ex: 'Counter-Strike 2', desc: 'Категория эфира. Пусто, если эфира нет' },
      { code: '{title}', ex: 'Ранкед до утра', desc: 'Название эфира. Пусто, если эфира нет' },
      { code: '{viewers}', ex: '1 284', desc: 'Зрителей сейчас. Без эфира — 0' },
      { code: '{commands}', ex: '!аптайм, !команды', desc: 'Включённые команды, которые может вызвать любой зритель' },
      { code: '{target}', ex: 'lenta_ln', desc: 'Ник из первого слова после команды. Если слова нет — ник того, кто написал' },
      { code: '{args}', ex: '@lenta_ln привет', desc: 'Весь текст после команды' },
    ];
    const vars = VARS.map((v) => ({ code: v.code, ex: v.ex, desc: v.desc, dis: !f, pick: () => this.insertVar(v.code) }));
    const TEMPLATES = [
      { label: 'Ссылка на Discord', name: 'дс', response: 'Заходи в наш Discord: [вставь ссылку на сервер]', desc: 'Ссылка на Discord-сервер' },
      { label: 'Сколько идёт эфир', name: 'эфир', response: 'Эфир: {uptime}. Зрителей сейчас: {viewers}', desc: 'Сколько идёт эфир и зрители' },
      { label: 'Что играем', name: 'игра', response: 'Сейчас играем в {game}', desc: 'Категория эфира' },
    ];
    const templates = TEMPLATES.map((t) => ({ label: t.label, pick: () => this.applyTemplate(t) }));
    // Пример предпросмотра: значения придуманы, но переменные те же, что на сервере
    const pvLive = s.pvLive;
    const sample = (tpl) => {
      const now = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      const vals = {
        '{user}': 'moroz_tv', '{count}': '185',
        '{uptime}': pvLive ? '2 ч 47 мин' : 'стрим сейчас не идёт',
        '{time}': now + ' МСК',
        '{channel}': (s.user && s.user.name) || 'kira_stream',
        '{game}': pvLive ? 'Counter-Strike 2' : '',
        '{title}': pvLive ? 'Ранкед до утра' : '',
        '{viewers}': pvLive ? '1 284' : '0',
        '{commands}': cmdList.length ? cmdList.join(', ') : 'пока нет команд',
        '{target}': useArgs ? 'lenta_ln' : 'moroz_tv',
        '{args}': useArgs ? '@lenta_ln' : '',
      };
      return tpl.replace(/\{\w+\}/g, (m) => (vals[m] !== undefined ? vals[m] : m));
    };
    const respText = f ? (f.response || '').trim() : '';
    const pvLiveStyle = pvLive ? 'background: var(--n-12); color: var(--n-1)' : '';
    const pvOffStyle = pvLive ? '' : 'background: var(--n-12); color: var(--n-1)';
    const access = ACC_OPTS.map((o) => ({ label: o[1], sub: o[2], on: !!f && f.access === o[0], sel: f && f.access === o[0] ? 'true' : 'false', ring: f && f.access === o[0] ? 'background: var(--n-13); border-color: var(--n-13)' : '', pick: () => this.setF({ access: o[0] }) }));
    const prefixes = pre.map((p) => ({ label: p[1], sel: f && f.prefix === p[0] ? 'true' : 'false', style: f && f.prefix === p[0] ? 'background: var(--n-12); color: var(--n-1)' : '', pick: () => this.setF({ prefix: p[0] }) }));
    const accessLabel = f ? (ACC[f.access] || 'Все зрители') : '';
    const tabs = tabDefs.map((t, i) => ({ label: t[0], n: t[1], sel: s.tab === i ? 'true' : 'false', style: s.tab === i ? 'color: var(--n-12); box-shadow: inset 0 -2px 0 var(--n-12)' : '', pick: () => this.setState({ tab: i }) }));
    const showNicks = !!f && f.access === 'list';
    const planLine = s.loaded && !s.loadErr && planName ? 'Тариф: ' + planName + '.' : '';
    const upsell = plan === 'free'
      ? 'Больше команд дают тарифы «Продвинутая» (30) и «Про» (до 1000, и заказы музыки).'
      : (plan === 'advanced' ? 'Тариф «Про» даёт до 1000 команд и заказы музыки.' : '');
    const ttsDef = { on: false, access: 'mods', allowList: '', cooldown: 5, maxLen: 200 };
    const t = s.tts || ttsDef;
    const TTS_ACC = [['mods', 'Модераторы и стример'], ['vip', 'Випы и модераторы'], ['subs', 'Подписчики и выше'], ['followers', 'Фолловеры и выше'], ['list', 'Только из списка ников'], ['all', 'Все зрители']].map((o) => ({ v: o[0], label: o[1] }));
    const ttsReady = s.ttsLoaded && !!s.tts;
    const ttsOff = !ttsReady || s.ttsBusy;
    return {
      countLabel: !s.loaded ? 'Загружаем…' : (s.loadErr ? 'Не удалось узнать, сколько команд создано' : 'Использовано ' + n + ' из ' + limit + ' команд'),
      usedPct,
      planLine: !s.loaded ? '' : planLine,
      limitShow: atLimit, limitNote: 'Лимит достигнут. Чтобы добавить новую, удали ненужную или смени тариф.',
      upsellShow: s.loaded && !s.loadErr && !!upsell, upsell,
      notBot: s.loaded && !!s.user && !s.user.botEnabled,
      createCls: f ? 'bs' : 'bp',
      create: () => (atLimit ? StreAPI.toast('Лимит ' + limit + ' команд исчерпан. Удали ненужную или смени тариф.', 'error') : this.edit(null)),
      loading, loadFailed, loadErrText: s.loadErr, reload: () => this.load(false),
      emptyAll, emptyFilter, filterText, resetFilter: () => this.setState({ q: '', tab: 0 }),
      showList: s.loaded && !s.loadErr && shown.length > 0,
      tabs, shown, q: s.q, setQ: (e) => this.setState({ q: e.target.value }),
      hasEditor: !!f, noEditor: !f, isNew,
      edTitle: f ? (f.id ? 'Редактор: ' + (f.prefix + f.name) : 'Новая команда') : 'Редактор',
      closeEd: () => this.setState({ f: null, err: '' }),
      vars, templates,
      f: f || {},
      setName: (e) => this.setF({ name: e.target.value.replace(/\s+/g, '') }),
      setResp: (e) => this.setF({ response: e.target.value }),
      setDesc: (e) => this.setF({ description: e.target.value }),
      setCdg: (e) => this.setF({ cooldownGlobal: Math.max(0, Number(e.target.value) || 0) }),
      setCdu: (e) => this.setF({ cooldownUser: Math.max(0, Number(e.target.value) || 0) }),
      setList: (e) => this.setF({ allowList: e.target.value }),
      respCount: respText.length + ' / 480',
      prefixes,
      preview: f ? (respText ? sample(respText) : 'Напиши ответ, и здесь появится пример.') : '',
      previewAsk: f ? (f.prefix + (f.name || 'команда') + (useArgs ? ' @lenta_ln' : '')) : '',
      previewUser: 'moroz_tv',
      botName: s.bot,
      pvLiveSel: pvLive ? 'true' : 'false', pvOffSel: pvLive ? 'false' : 'true',
      pvLiveStyle, pvOffStyle,
      pickPvLive: () => this.setState({ pvLive: true }), pickPvOff: () => this.setState({ pvLive: false }),
      access, accessLabel, showNicks,
      advOpen: s.adv, advAria: s.adv ? 'true' : 'false', advIconStyle: s.adv ? 'transform: rotate(180deg)' : '', toggleAdv: () => this.toggleAdv(),
      hasErr: !!s.err, err: s.err,
      saving: s.saving, saveLabel: s.saving ? 'Сохраняем…' : (f && f.id ? 'Сохранить команду' : 'Создать команду'),
      save: (e) => this.save(e),
      canDelete: !!(f && f.id), remove: () => this.removeCmd(),
      // озвучка
      ttsStateLabel: !s.ttsLoaded ? 'Загружаем…' : (!s.tts ? 'Не загружено' : (t.on ? 'Включена' : 'Выключена')),
      ttsOn: t.on ? 'true' : 'false', ttsToggle: () => this.toggleTts(), ttsOff,
      ttsLoading: !s.ttsLoaded, ttsErrShow: s.ttsLoaded && !!s.ttsErr, ttsErr: s.ttsErr, reloadTts: () => this.loadTts(),
      ttsReady,
      ttsAccess: t.access, ttsSetAccess: (e) => this.setTts({ access: e.target.value }), ttsAccOpts: TTS_ACC,
      ttsCooldown: t.cooldown, ttsSetCooldown: (e) => this.setTts({ cooldown: Math.max(0, Math.min(600, Number(e.target.value) || 0)) }),
      ttsMaxLen: t.maxLen, ttsSetMaxLen: (e) => this.setTts({ maxLen: Math.max(20, Math.min(300, Number(e.target.value) || 200)) }),
      ttsListShow: t.access === 'list', ttsAllow: t.allowList, ttsSetAllow: (e) => this.setTts({ allowList: e.target.value }),
      ttsSave: () => this.saveTts(null),
      ttsSaveLabel: s.ttsBusy ? 'Сохраняем…' : 'Сохранить озвучку',
      ttsStatus: s.ttsBusy ? '' : (s.ttsDirty ? 'Есть несохранённые изменения' : (s.ttsSaved ? 'Сохранено' : '')),
      ttsUrl: s.ttsToken ? location.origin + '/w/tts.php?t=' + encodeURIComponent(s.ttsToken) : (s.ttsErr ? 'Ссылка не загрузилась. Нажми «Повторить» выше.' : 'Загружаем ссылку…'),
      ttsCopyOff: !s.ttsToken,
      ttsCopy: () => this.copyTtsUrl(), ttsCopyLabel: s.ttsCopied ? 'Скопировано' : 'Скопировать ссылку',
    };
  }
}
DCMount(Component);
</script>
</body>
</html>
