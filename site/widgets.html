<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — виджеты для OBS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js?v=460ce522"></script>
<script src="assets/api.js?v=e0a21f5b"></script>
<script src="assets/widgets-lib.js?v=840111b5"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ov{font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9);margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10)}
.nav-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.card{background:rgb(var(--n-2-rgb) / .62);border:1px solid rgb(var(--n-13-rgb) / .10);border-radius:12px;box-sizing:border-box;min-width:0}
.chipf{height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-10);font:500 13px/18px var(--font-sans),sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chipf:hover{border-color:var(--n-9);color:var(--n-12)}
.sw{position:relative;width:40px;height:24px;border-radius:999px;border:1px solid var(--n-8);background:transparent;cursor:pointer;flex:none;padding:0}
.sw span{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:var(--n-9);transition:transform 180ms cubic-bezier(.2,0,0,1)}
.sw[aria-checked="true"]{background:var(--n-13);border-color:var(--n-13)}
.sw[aria-checked="true"] span{transform:translateX(16px);background:var(--n-1)}
.sw:disabled{border-color:var(--n-5);cursor:not-allowed}
.sw:disabled span{background:var(--n-6)}
.wc{display:flex;flex-direction:column;overflow:hidden;transition:border-color 150ms}
.wc:hover{border-color:rgb(var(--n-13-rgb) / .22)}
.pv{position:relative;height:136px;background:radial-gradient(220px 120px at 70% 20%,rgb(var(--n-13-rgb) / .08),transparent 70%),linear-gradient(160deg,var(--n-4),var(--n-1));display:flex;align-items:center;justify-content:center;padding:14px;box-sizing:border-box;border-bottom:1px solid var(--n-5);overflow:hidden}
.ob{background:var(--w-bg);backdrop-filter:blur(var(--w-blur));border:var(--w-bd);border-radius:var(--w-rad);box-shadow:var(--w-shadow);padding:8px 10px;color:var(--w-fg);font-family:var(--w-font);text-shadow:var(--w-tshadow);text-transform:var(--w-upper)}
.pv .mono{font-family:inherit}
.em{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:3px;background:linear-gradient(135deg,var(--n-10),var(--n-7));vertical-align:-5px;color:var(--n-1)}
.ib{width:36px;height:36px;border-radius:6px;border:0;background:transparent;color:var(--n-10);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ib:hover{background:rgb(var(--n-13-rgb) / .06);color:var(--n-12)}
.tierb{font-size:11px;line-height:14px;padding:2px 6px;border:1px solid var(--n-6);border-radius:4px;color:var(--n-10);white-space:nowrap}
.bp{height:40px;padding:0 16px;border-radius:6px;border:0;background:var(--n-13);color:var(--n-1);font:500 14px/20px var(--font-sans),sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;flex:none;white-space:nowrap;text-decoration:none}
.bp:hover{background:var(--n-11)}
.bp:disabled{opacity:.5;cursor:not-allowed;background:var(--n-13)}
.bs{height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);font:500 13px/18px var(--font-sans),sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;flex:none;white-space:nowrap}
.bs:hover{border-color:var(--n-9);background:rgb(var(--n-13-rgb) / .04)}
.bsm{height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);font:500 12px/16px var(--font-sans),sans-serif;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;text-decoration:none}
.bsm:hover{border-color:var(--n-9);background:rgb(var(--n-13-rgb) / .04)}
.bsm:disabled{color:var(--n-8);cursor:not-allowed}
.need{margin:0;padding:6px 8px;border:1px dashed var(--n-8);border-radius:6px;font-size:12px;line-height:16px;color:var(--n-11)}
.need a{text-decoration:underline;white-space:nowrap}
.note{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:8px;font-size:14px;line-height:20px;color:var(--n-12)}
.hint{margin:0;font-size:13px;line-height:18px;color:var(--n-9)}
.sw[aria-busy="true"]{opacity:.6}
.bp:focus-visible,.bs:focus-visible,.sw:focus-visible,.chipf:focus-visible,.bsm:focus-visible,.ib:focus-visible,a:focus-visible{outline:2px solid var(--n-12);outline-offset:2px}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none;white-space:nowrap;overflow:hidden}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
.sb-search{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;margin:0 0 8px;border:1px solid var(--n-6);border-radius:8px;background:rgb(var(--n-13-rgb) / .03);color:var(--n-9)}
.sb-search:focus-within{border-color:var(--n-12)}
.sb-search input{flex:1;min-width:0;min-width:0;border:0;outline:0;background:transparent;color:var(--n-12);font:400 14px/20px 'Onest',sans-serif;padding:0}
.sb-search input::placeholder{color:var(--n-9)}
.sb-search input::-webkit-search-cancel-button{display:none}
.sb-search kbd{font:400 10px/1 'JetBrains Mono',monospace;margin-left:auto;color:var(--n-9);border:1px solid var(--n-6);border-radius:4px;padding:2px 5px;white-space:nowrap}
.sb-empty{margin:8px 12px;font-size:13px;color:var(--n-9)}
.sb-hide{display:none!important}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var nav = document.querySelector('nav.sb'), box = nav && nav.querySelector('[data-sb-search]');
  if (!box) return;
  var empty = nav.querySelector('[data-sb-empty]');
  function apply() {
    var q = box.value.trim().toLowerCase(), any = false, group = null, groupHit = false;
    var rows = Array.prototype.slice.call(nav.children).filter(function (el) { return el.matches('a.sb-i, span.sb-i, p.sb-h, div.sb-sep'); });
    rows.forEach(function (el) {
      if (el.matches('p.sb-h')) { if (group) group.classList.toggle('sb-hide', !groupHit && !!q); group = el; groupHit = false; el.classList.remove('sb-hide'); return; }
      if (el.matches('div.sb-sep')) { el.classList.toggle('sb-hide', !!q); return; }
      var hit = !q || (el.textContent + ' ' + (el.getAttribute('data-kw') || '')).toLowerCase().indexOf(q) !== -1;
      el.classList.toggle('sb-hide', !hit);
      if (hit) { groupHit = true; any = true; }
    });
    if (group) group.classList.toggle('sb-hide', !!q && !groupHit);
    if (empty) empty.hidden = any || !q;
  }
  box.addEventListener('input', apply);
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var first = nav.querySelector('a.sb-i:not(.sb-hide)'); if (first) location.href = first.getAttribute('href'); }
    if (e.key === 'Escape') { box.value = ''; apply(); box.blur(); }
  });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); box.focus(); box.select(); }
  });
});
</script>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<a href="settings.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; font-size: 14px; font-weight: 500" aria-label="Профиль" data-dc-keep data-stre-user><span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, var(--n-10), var(--n-6)); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--n-1)" data-av></span><span data-name>Профиль</span></a>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" class="sb" data-dc-keep>
<label class="sb-search"><svg class="sb-ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" data-sb-search placeholder="Поиск" aria-label="Найти раздел" autocomplete="off"><kbd>Ctrl K</kbd></label><p class="sb-empty" data-sb-empty hidden>Такого раздела нет</p>
<p class="sb-h">Сегодня</p>
<a href="panel.html" class="sb-i" data-kw="главная статистика эфир статус"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Старт</a>
<p class="sb-h">Чат</p>
<a href="moderation.html" class="sb-i" data-kw="фильтр чат удалить бан таймаут проверка"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<a href="mods.html" class="sb-i" data-kw="мод модераторы помощник права журнал"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Помощники</a>
<a href="commands.html" class="sb-i" data-kw="команда ответ чат кулдаун"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды</a>
<a href="timers.html" class="sb-i" data-kw="таймер сообщение напоминание"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6M12 2v3"/></svg>Таймеры</a>
<p class="sb-h">Музыка</p>
<a href="music.html" class="sb-i" data-kw="музыка трек плеер заказ очередь песня"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Очередь и заказы</a>
<a href="manage.html" class="sb-i" data-kw="помощник канал трек музыка добавить"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Управлять каналом</a>
<p class="sb-h">Эфир и сайт</p>
<a href="widgets.html" class="sb-i" aria-current="page" data-kw="виджет obs браузер ссылка чат розыгрыш"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты для OBS</a>
<a href="site-settings.html" class="sb-i" data-kw="сайт подписчики видео значок галочка модератор"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Мой сайт</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i" data-kw="розыгрыш приз участники победитель"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<a href="clips.html" class="sb-i" data-kw="нарезка клип момент видео"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 9-12 9z"/><path d="M3 3v18"/></svg>Нарезки</a>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i" data-kw="тариф оплата аккаунт email промокод"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
<a href="support.html" class="sb-i" data-kw="помощь вопрос обращение"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Поддержка</a>
</nav>

<main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div style="max-width: 640px"><h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Виджеты для OBS</h1><p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: var(--n-10)">Виджет — это картинка поверх эфира: алерт о подписке, полоска цели, чат. Включи нужные здесь и добавь каждый в OBS по его ссылке.</p></div>
<section class="card" aria-label="Тариф и лимит виджетов" style="min-width: 260px; flex: 0 1 340px; padding: 14px 16px">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 13px"><span style="color: var(--n-10)">{{ planLabel }}</span><span class="mono">{{ countLabel }}</span></div>
<div role="progressbar" aria-label="Включено виджетов" aria-valuenow="{{ active }}" aria-valuemin="0" aria-valuemax="{{ limit }}" style="margin-top: 10px; height: 4px; border-radius: 2px; background: var(--n-5)"><div style="height: 100%; border-radius: 2px; background: var(--n-12); width: {{ pct }}; transition: width 200ms"></div></div>
<p style="margin: 8px 0 0; font-size: 13px; line-height: 18px; color: var(--n-11)">{{ planNote }}</p>
<template data-if="hasMore"><p style="margin: 6px 0 0; font-size: 12px; line-height: 16px; color: var(--n-9)">{{ moreTiers }}</p></template>
<template data-if="canUpgrade"><p style="margin: 8px 0 0; font-size: 13px"><a href="settings.html#billing" style="text-decoration: underline">Посмотреть тарифы</a></p></template>
</section>
</div>

<template data-if="hasErr"><div role="alert" class="note" style="border: 2px solid var(--n-12)"><span style="flex: 1">{{ err }}</span><button type="button" class="ib" style="width: 28px; height: 28px" aria-label="Закрыть сообщение" onClick="{{ closeErr }}"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div></template>
<template data-if="hasInfo"><div role="status" class="note" style="border: 1px dashed var(--n-9)"><span style="flex: 1">{{ info }}</span><button type="button" class="ib" style="width: 28px; height: 28px" aria-label="Закрыть сообщение" onClick="{{ closeInfo }}"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div></template>

<section class="card" aria-labelledby="ob-t" style="padding: 20px 22px; display: flex; flex-direction: column; gap: 14px">
<div>
<h2 id="ob-t" style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">Как подключить в OBS</h2>
<p class="hint" style="margin-top: 4px">OBS — программа, с которой ты ведёшь эфир. Виджет добавляется в неё как источник «Браузер». Три шага:</p>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<li style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border: 1px solid var(--n-5); border-radius: 8px">
<span aria-hidden="true" style="width: 24px; height: 24px; flex: none; border-radius: 999px; border: 1px solid var(--n-6); display: inline-flex; align-items: center; justify-content: center; font-size: 12px">1</span>
<div style="min-width: 200px; flex: 1 1 240px"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Скопируй ссылку виджета</p><p style="margin: 2px 0 0; font-size: 12px; line-height: 16px; color: var(--n-9)">{{ firstHint }}</p></div>
<button type="button" class="bp" onClick="{{ copyFirst }}" disabled="{{ firstOff }}" aria-label="Скопировать ссылку для OBS первого включённого виджета">{{ firstLabel }}</button>
</li>
<li style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border: 1px solid var(--n-5); border-radius: 8px">
<span aria-hidden="true" style="width: 24px; height: 24px; flex: none; border-radius: 999px; border: 1px solid var(--n-6); display: inline-flex; align-items: center; justify-content: center; font-size: 12px">2</span>
<div style="min-width: 200px; flex: 1 1 240px"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Добавь источник в OBS</p><p style="margin: 2px 0 0; font-size: 12px; line-height: 16px; color: var(--n-9)">В OBS нажми «Источники» → «+» → «Браузер». Назови его, например «Алерты».</p></div>
</li>
<li style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border: 1px solid var(--n-5); border-radius: 8px">
<span aria-hidden="true" style="width: 24px; height: 24px; flex: none; border-radius: 999px; border: 1px solid var(--n-6); display: inline-flex; align-items: center; justify-content: center; font-size: 12px">3</span>

<script src="assets/dc-lite.js?v=5f8ce08a"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { loaded: false, loadFailed: false, loadErr: '', data: { on: {}, cfg: {} }, token: '', limit: 0, me: {}, plans: [], live: {}, busy: {}, copied: '', err: '', info: '', cat: 'Все', onlyOn: false };
  }
  componentDidMount() { this.load(); }
  async load() {
    const W = window.StreWidgets;
    this.setState({ loadFailed: false, loadErr: '', err: '' });
    try {
      // тарифы нужны только для подсказки «что даёт следующий тариф»: если не пришли, страница работает и без них
      const [r, me, plans] = await Promise.all([W.load(), StreAPI.me(), StreAPI.get('plans').catch(() => null)]);
      let info = '';
      if (r.migrated === 'local') info = 'Настройки виджетов перенесли из этого браузера на сервер, теперь их видит OBS.' + (r.dropped.length ? ' Не влезли в лимит тарифа и выключены: ' + r.dropped.map((id) => '«' + W.meta(id)[1] + '»').join(', ') + '. Чтобы включить их, выключи другой виджет.' : '');
      this.setState({ loaded: true, data: r.data, token: r.token, limit: r.limit, me: me || {}, plans: (plans && plans.items) || [], info });
      W.LIST.forEach((w) => this.fetchLive(w[0]));
    } catch (e) {
      this.setState({ loadFailed: true, loadErr: (e && e.message) || 'нет связи с сервером' });
    }
  }
  // Живые данные для превью карточки — только для виджетов, где это дёшево (без внешних API)
  async fetchLive(id) {
    const s = this.state;
    const cheap = ['goal', 'subgoal', 'chat', 'events', 'topdon', 'np', 'queue', 'deaths'];
    if (!s.token || !((cheap.indexOf(id) >= 0 && s.data.on[id]) || id === 'cs' || id === 'dota')) return;
    try {
      const p = await StreAPI.get('widget.data', { t: s.token, w: id, after: 0 });
      this.setState({ live: Object.assign({}, this.state.live, { [id]: p }) });
    } catch (e) { /* превью останется схематичным */ }
  }
  toggle(id) {
    const W = window.StreWidgets;
    const s = this.state;
    if (!s.loaded || s.busy[id]) return;
    const next = !s.data.on[id];
    const setOn = (v) => { const on = Object.assign({}, this.state.data.on); if (v) on[id] = true; else delete on[id]; return Object.assign({}, this.state.data, { on }); };
    this.setState({ data: setOn(next), busy: Object.assign({}, s.busy, { [id]: true }), err: '' });
    W.update((d) => { if (next) d.on[id] = true; else delete d.on[id]; })
      .then((fresh) => {
        const busy = Object.assign({}, this.state.busy); delete busy[id];
        this.setState({ busy, data: Object.assign({}, this.state.data, { cfg: fresh.cfg }) });
        if (next) this.fetchLive(id);
      })
      .catch((e) => {
        const busy = Object.assign({}, this.state.busy); delete busy[id];
        this.setState({ busy, data: setOn(!next), err: e.message });
        StreAPI.toast(e.message, 'error');
      });
  }
  async copy(id) {
    const url = window.StreWidgets.obsUrl(this.state.token, id);
    let ok = false;
    try { await navigator.clipboard.writeText(url); ok = true; } catch (e) {
      const t = document.createElement('textarea'); t.value = url; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(t); t.select(); try { ok = document.execCommand('copy'); } catch (e2) { ok = false; } t.remove();
    }
    if (!ok) { StreAPI.toast('Не получилось скопировать. Ссылка есть в редакторе виджета, вкладка «OBS»', 'error'); return; }
    StreAPI.toast('Ссылка для OBS скопирована');
    this.setState({ copied: id });
    clearTimeout(this.copyT);
    this.copyT = setTimeout(() => this.setState({ copied: '' }), 2500);
  }
  preview(id, c) {
    const W = window.StreWidgets;
    const ct = c.content;
    const L = this.state.live[id];
    const d = (L && L.data) || null;
    const u = this.state.me.user || {};
    const st = this.state.me.stream || {};
    const fmt = StreAPI.fmtNum;
    const list = (head, rows, empty) => ({ isList: true, head, hasHead: !!head, rows: rows || [], hasEmpty: !(rows && rows.length), empty });
    const big = (head, value, sub) => ({ isBig: true, head, big: value, sub: sub || '', hasSub: !!sub });
    switch (id) {
      case 'alerts': {
        const e = { type: 'sub', name: ct.name || 'viewer_42', data: { months: 1 } };
        return { isAlert: true, head: W.alertLabel(e) + ' · пример', big: e.name, sub: W.alertText(ct, e) };
      }
      case 'goal':
      case 'subgoal': {
        const cur = d ? Number(d.current) || 0 : Number(ct.current) || 0;
        const tgt = Math.max(1, Number(ct.target) || 1);
        const pct = Math.max(0, Math.min(100, Math.round(cur / tgt * 100)));
        return { isBar: true, head: ct.title, right: pct + '%', pct, sub: fmt(cur) + ' / ' + fmt(tgt) + (id === 'goal' ? ' ₽' : '') };
      }
      case 'chat':
        return list('', d ? (d.items || []).slice(-3).map((m) => ({ b: m.name || m.login, t: m.text, r: '' })) : [], d ? 'Сообщений пока нет' : 'Здесь появятся сообщения чата');
      case 'events': {
        const what = { follow: 'фоллов', sub: 'подписка', resub: 'продление', gift: 'дарит подписки', raid: 'рейд', donation: 'донат' };
        return list('Последние события', d ? (d.items || []).slice(0, 3).map((e) => ({ b: e.name || e.login, t: what[e.type] || e.type, r: e.type === 'donation' ? fmt(e.data.amount) + ' ₽' : e.type === 'raid' ? fmt(e.data.viewers) : '' })) : [], d ? 'Событий пока нет' : 'Фолловы, подписки, рейды, донаты');
      }
      case 'topdon': {
        const per = { stream: 'за стрим', week: 'за неделю', month: 'за месяц' }[ct.period] || '';
        return list('Топ ' + per, d ? (d.items || []).slice(0, 3).map((t, i) => ({ b: (i + 1) + '.', t: t.username, r: fmt(t.total) + ' ₽' })) : [], d ? 'Донатов пока нет' : 'Здесь будут самые щедрые зрители');
      }
      case 'queue':
        return list('Дальше в очереди', d ? (d.items || []).slice(0, 3).map((q, i) => ({ b: String(i + 1), t: q.title, r: '' })) : [], d ? 'Очередь пуста' : 'Ближайшие заказанные треки');
      case 'np': {
        const cur = d && d.current;
        return { isText: true, head: cur ? cur.title : (d ? 'Сейчас ничего не играет' : 'Название трека'), sub: cur ? (cur.requester ? 'заказал ' + cur.requester : '') : 'и кто его заказал' };
      }
      case 'uptime':
        return big(ct.label, st.live ? StreAPI.fmtDur(Date.now() / 1000 - st.startedAt) : '—', st.live ? '' : 'не в эфире');
      case 'deaths':
        return big(ct.label, d ? fmt(d.value) : fmt(ct.value), 'команда ' + ct.command);
      case 'faceit':
      case 'fmatch':
        return big('FACEIT · ' + (ct.nick || 'ник не указан'), '— ELO', ct.nick ? 'уровень и матчи — в OBS' : 'укажи ник в настройках');
      case 'cs': {
        const g = d && d.gsi && d.gsi.map;
        return g ? big('CS2 · ' + String(g.name || '').replace(/^(de|cs|ar)_/, ''), 'CT ' + ((g.team_ct && g.team_ct.score) || 0) + ' : ' + ((g.team_t && g.team_t.score) || 0) + ' T', 'раунд ' + ((Number(g.round) || 0) + 1)) : big('CS2', 'CT – : – T', 'ждём данные из игры');
      }
      case 'dota': {
        const g = d && d.gsi;
        const pl = (g && g.player) || {};
        return g && g.hero && g.hero.name ? big('Dota 2 · ' + String(g.hero.name).replace('npc_dota_hero_', '').replace(/_/g, ' '), (pl.kills || 0) + ' / ' + (pl.deaths || 0) + ' / ' + (pl.assists || 0), 'K / D / A') : big('Dota 2', '– / – / –', 'ждём данные из игры');
      }
      case 'poll':
        return { isPoll: true, head: 'Голосование в чате' };
      case 'ticker':
        return { isTicker: true, head: ct.text };
    }
    return {};
  }
  // Подсказка под карточкой: что мешает виджету работать. Возвращает [текст, ссылка, адрес] или null
  need(id, c) {
    const s = this.state;
    const u = s.me.user || {};
    const L = s.live[id];
    const edit = (tab) => 'widget-editor.html?w=' + id + '&tab=' + tab;
    if (!s.loaded) return null;
    if (['chat', 'alerts', 'events', 'subgoal', 'deaths'].indexOf(id) >= 0 && !u.botEnabled) return ['Бот не в канале, поэтому чат и события не приходят.', 'Подключить', 'panel.html'];
    if ((id === 'goal' || id === 'topdon') && !u.daConnected) return ['Донаты берутся из DonationAlerts, а он не подключён.', 'Подключить', 'settings.html#platforms'];
    if ((id === 'alerts' || id === 'events') && !u.daConnected) return ['Донаты из DonationAlerts не придут, пока он не подключён.', 'Подключить', 'settings.html#platforms'];
    if ((id === 'faceit' || id === 'fmatch') && !c.content.nick) return ['Нужен ник с faceit.com, иначе виджет пустой.', 'Указать ник', edit('content')];
    if ((id === 'cs' || id === 'dota') && !(L && L.data && L.data.updatedAt)) return ['Игра пока не передаёт данные. Положи файл настроек в папку игры.', 'Как подключить', edit('game')];
    if ((id === 'np' || id === 'queue') && u.limits && !u.limits.music) return ['Заказ музыки доступен с тарифа «Про».', 'Тарифы', 'settings.html#billing'];
    return null;
  }
  renderVals() {
    const W = window.StreWidgets;
    const s = this.state;
    const on = s.data.on;
    const loaded = s.loaded;
    const active = W.countOn(s.data);
    const limit = s.limit;
    // лимит тарифа исчерпан: новые виджеты не включаются, пока не выключишь другой
    const full = loaded && active >= limit;
    const u = s.me.user || {};
    const REC = ['alerts', 'chat'];
    const firstId = W.LIST.map((w) => w[0]).filter((id) => !!on[id])[0] || '';
    const firstName = firstId ? W.meta(firstId)[1] : '';
    const all = W.LIST.map((w) => {
      const id = w[0];
      const isOn = !!on[id];
      const soon = w[5] === 'soon';
      const c = W.cfg(id, s.data);
      const busy = !!s.busy[id];
      const limBlock = full && !isOn && !soon;
      let n = this.need(id, c);
      if (!n && limBlock) n = ['Чтобы включить этот виджет, сначала выключи другой.', 'Тарифы', 'settings.html#billing'];
      let status = isOn ? '● Включён' : 'Выключен';
      if (!loaded) status = 'Загружаем…';
      else if (busy) status = 'Сохраняем…';
      else if (soon) status = 'Скоро';
      else if (limBlock) status = 'Выключено тарифом: ' + active + ' из ' + limit;
      return {
        id, name: w[1], cat: w[2], desc: w[3], isOn, soon, rec: REC.indexOf(id) >= 0, canUse: !soon,
        p: this.preview(id, c), vars: W.vars(c),
        on: isOn ? 'true' : 'false', busy: busy ? 'true' : 'false',
        swOff: !loaded || (soon && !isOn) || limBlock,
        status, statusStyle: isOn && !busy ? 'color: var(--n-12)' : 'color: var(--n-9)',
        hasNeed: !!n, need: n ? n[0] : '', needLink: n ? n[1] : '', needHref: n ? n[2] : '',
        cardStyle: isOn ? 'border-color: var(--n-8)' : '',
        href: 'widget-editor.html?w=' + id,
        swLabel: 'Виджет «' + w[1] + '»', cfgLabel: 'Настроить «' + w[1] + '»',
        noToken: !s.token, copyLabel: s.copied === id ? 'Скопировано' : 'Скопировать ссылку', copyAria: 'Скопировать ссылку для OBS: ' + w[1],
        copy: () => this.copy(id),
        toggle: () => this.toggle(id),
      };
    });
    let shown = s.cat === 'Все' ? all : all.filter((w) => w.cat === s.cat);
    if (s.onlyOn) shown = shown.filter((w) => w.isOn);

    // Что даёт следующий тариф: тарифы с большим лимитом виджетов
    const tiers = (s.plans || []).filter((p) => Number(p.widgets) > limit);
    const moreTiers = !loaded ? '' : tiers.length
      ? 'Больше виджетов дают тарифы: ' + tiers.map((p) => '«' + p.name + '» — до ' + p.widgets).join(', ') + '.'
      : (u.plan !== 'max' ? 'Тарифы с большим лимитом — в «Настройках».' : '');
    let planNote = '';
    if (loaded) planNote = full
      ? 'Лимит тарифа исчерпан. Чтобы включить ещё один виджет, выключи один из включённых.'
      : 'Можно включить ещё ' + (limit - active) + ' ' + W.plural(limit - active, ['виджет', 'виджета', 'виджетов']) + '.';

    // Первый шаг: ссылка первого включённого виджета
    let firstHint;
    if (s.loadFailed) firstHint = 'Виджеты не загрузились. Нажми «Повторить» ниже.';
    else if (!loaded) firstHint = 'Загружаем…';
    else if (!firstId) firstHint = 'Сначала включи хотя бы один виджет ниже, например «Алерты».';
    else firstHint = 'Скопируем ссылку виджета «' + firstName + '». Она понадобится на шаге 3.';

    // Подсказка категории «Цели»
    const daOff = s.cat === 'Цели' && loaded && !u.daConnected;
    const catHint = s.cat === 'Цели'
      ? 'Цель — полоса прогресса, которую видят зрители. Полоса доната растёт от донатов из DonationAlerts, полоса подписчиков — от подписок, продлений и подарков.'
      : '';

    return {
      active: loaded ? active : '—', limit: limit || 0,
      planLabel: u.planName ? 'Включено на тарифе «' + u.planName + '»' : 'Включено',
      countLabel: loaded ? active + ' из ' + limit : '— из —',
      full, planNote, hasMore: !!moreTiers, moreTiers, canUpgrade: u.plan !== 'max',
      pct: (limit ? Math.min(100, Math.round(active / limit * 100)) : 0) + '%',
      hasErr: !!s.err, err: s.err, closeErr: () => this.setState({ err: '' }),
      hasInfo: !!s.info, info: s.info, closeInfo: () => this.setState({ info: '' }),
      loading: !loaded && !s.loadFailed,
      loadFailed: s.loadFailed, loadErrText: s.loadErr ? 'Подробности: ' + s.loadErr : '', retry: () => this.load(),
      showGrid: loaded,
      firstHint, firstOff: !loaded || !firstId || !s.token,
      firstLabel: firstId && s.copied === firstId ? 'Скопировано' : 'Скопировать ссылку',
      copyFirst: () => { if (firstId) this.copy(firstId); },
      hasCatHint: !!catHint, catHint,
      hasCatNeed: daOff, catNeed: 'DonationAlerts не подключён, поэтому полоса доната не растёт.', catNeedLink: 'Подключить', catNeedHref: 'settings.html#platforms',
      onlyOn: s.onlyOn ? 'true' : 'false',
      toggleOnly: () => this.setState({ onlyOn: !s.onlyOn }),
      cats: W.CATS.map((c) => ({
        label: c, n: c === 'Все' ? all.length : all.filter((w) => w.cat === c).length,
        sel: s.cat === c ? 'true' : 'false',
        style: s.cat === c ? 'background: var(--n-12); color: var(--n-1); border-color: var(--n-12)' : '',
        pick: () => this.setState({ cat: c }),
      })),
      shown,
      emptyShown: loaded && !shown.length,
      emptyTitle: s.cat === 'Все' ? 'Ни один виджет не включён' : 'В категории «' + s.cat + '» ничего не включено',
      emptyText: 'Включи нужный переключателем на его карточке, или покажи все виджеты категории.',
      showAll: () => this.setState({ onlyOn: false }),
    };
  }
}
DCMount(Component);
</script>
</body>
</html>
