<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — виджеты</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0A}
a{color:#F2F2F2;text-decoration:none}a:hover{color:#FFFFFF}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ov{font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:#8F8F8F;margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:#B4B4B4}
.nav-i:hover{background:rgba(255,255,255,.04);color:#F2F2F2}
.chipf{height:36px;padding:0 14px;border-radius:6px;border:1px solid #3A3A3A;background:transparent;color:#B4B4B4;font:500 13px/18px 'Onest',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chipf:hover{border-color:#8F8F8F;color:#F2F2F2}
.sw{position:relative;width:40px;height:24px;border-radius:999px;border:1px solid #6E6E6E;background:transparent;cursor:pointer;flex:none;padding:0}
.sw span{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:#8F8F8F;transition:transform 180ms cubic-bezier(.2,0,0,1)}
.sw[aria-checked="true"]{background:#FFFFFF;border-color:#FFFFFF}
.sw[aria-checked="true"] span{transform:translateX(16px);background:#0A0A0A}
.sw:disabled{border-color:#2A2A2A;cursor:not-allowed}
.sw:disabled span{background:#3A3A3A}
.wc{display:flex;flex-direction:column;border-radius:8px;border:1px solid #2A2A2A;background:#111111;overflow:hidden}
.wc:hover{border-color:#3A3A3A}
.pv{position:relative;height:136px;background:radial-gradient(220px 120px at 70% 20%,rgba(255,255,255,.08),transparent 70%),linear-gradient(160deg,#1F1F1F,#0A0A0A);display:flex;align-items:center;justify-content:center;padding:14px;box-sizing:border-box;border-bottom:1px solid #2A2A2A;overflow:hidden}
.ob{background:rgba(10,10,10,.78);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:8px 10px;color:#F2F2F2}
.em{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:3px;background:linear-gradient(135deg,#B4B4B4,#525252);vertical-align:-5px;color:#0A0A0A}
.ib{width:36px;height:36px;border-radius:6px;border:0;background:transparent;color:#B4B4B4;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ib:hover{background:rgba(255,255,255,.06);color:#F2F2F2}
.tierb{font-size:11px;line-height:14px;padding:2px 6px;border:1px solid #3A3A3A;border-radius:4px;color:#B4B4B4}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: #0A0A0A; color: #F2F2F2; font-family: 'Onest', system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgba(10,10,10,0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgba(255,255,255,0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F"></rect></svg>StreOps</a>
<a href="settings.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; font-size: 14px; font-weight: 500"><span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, #B4B4B4, #3A3A3A); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #0A0A0A">КС</span>kira_stream</a>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" style="flex: 1 1 200px; max-width: 248px; min-width: 200px; align-self: flex-start; box-sizing: border-box; padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 2px">
<p class="ov" style="padding: 8px 12px">Эфир</p>
<a href="panel.html" class="nav-i">Обзор</a>
<a href="chat.html" class="nav-i">Чат и эмоуты</a>
<a href="moderation.html" class="nav-i">Модерация</a>
<p class="ov" style="padding: 16px 12px 8px">Бот</p>
<a href="commands.html" class="nav-i">Команды</a>
<a href="music.html" class="nav-i">Музыка</a>
<a href="widgets.html" aria-current="page" class="nav-i" style="background: rgba(255,255,255,0.10); color: #F2F2F2; box-shadow: inset 2px 0 0 #F2F2F2">Виджеты<span class="mono" style="margin-left: auto; font-size: 12px; color: #8F8F8F">{{ active }}</span></a>
<div style="height: 1px; background: #2A2A2A; margin: 10px 0"></div>
<a href="settings.html" class="nav-i">Настройки</a>
</nav>

<main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div><h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Виджеты</h1><p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: #B4B4B4; max-width: 640px">Включи нужные и добавь в OBS как источник «Браузер». У каждого виджета своя ссылка, а настройки применяются на лету, без перезагрузки сцены.</p></div>
<div style="min-width: 260px; padding: 14px 16px; border-radius: 8px; border: 1px solid #3A3A3A">
<div style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: #B4B4B4">Включено на тарифе «Про»</span><span class="mono">{{ active }} из 10</span></div>
<div role="progressbar" aria-label="Включено виджетов" aria-valuenow="{{ active }}" aria-valuemin="0" aria-valuemax="10" style="margin-top: 10px; height: 4px; border-radius: 2px; background: #2A2A2A"><div style="height: 100%; border-radius: 2px; background: #F2F2F2; width: {{ pct }}"></div></div>
<template data-if="full"><p style="margin: 8px 0 0; font-size: 12px; color: #DCDCDC">Лимит исчерпан. Выключи один из виджетов или перейди на «Максимум».</p></template>
</div>
</div>

<div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center">
<div role="group" aria-label="Категории" style="display: flex; gap: 8px; flex-wrap: wrap">
<template data-for="cats" data-as="c"><button type="button" class="chipf" aria-pressed="{{ c.sel }}" onClick="{{ c.pick }}" style="{{ c.style }}">{{ c.label }}<span class="mono" style="font-size: 11px; opacity: .7">{{ c.n }}</span></button></template>
</div>
<label style="display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: #B4B4B4; cursor: pointer"><button type="button" role="switch" class="sw" aria-checked="{{ onlyOn }}" onClick="{{ toggleOnly }}" aria-label="Только включённые"><span></span></button>Только включённые</label>
</div>

<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 16px">
<template data-for="shown" data-as="w">
<li class="wc" style="{{ w.cardStyle }}">
<div class="pv" aria-hidden="true">
<template data-if="w.k.alerts"><div style="text-align: center"><p class="ov" style="color: #B4B4B4">Новая подписка</p><p style="margin: 6px 0 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">tixiy_bard</p><p style="margin: 2px 0 0; font-size: 12px; color: #B4B4B4">3 месяца подряд</p></div></template>
<template data-if="w.k.goal"><div class="ob" style="width: 100%"><div style="display: flex; justify-content: space-between; font-size: 12px"><span>Новая видеокарта</span><span class="mono">41%</span></div><div style="margin-top: 8px; height: 10px; border-radius: 2px; background: #2A2A2A; overflow: hidden"><div style="width: 41%; height: 100%; background: repeating-linear-gradient(135deg, #F2F2F2 0 6px, #DCDCDC 6px 12px)"></div></div><p class="mono" style="margin: 6px 0 0; font-size: 11px; color: #B4B4B4">12 400 / 30 000 ₽</p></div></template>
<template data-if="w.k.subgoal"><div class="ob" style="width: 100%"><div style="display: flex; justify-content: space-between; font-size: 12px"><span>Подписчики</span><span class="mono">186 / 250</span></div><div style="margin-top: 8px; height: 10px; border-radius: 2px; background: #2A2A2A"><div style="width: 74%; height: 100%; border-radius: 2px; background: #F2F2F2"></div></div></div></template>
<template data-if="w.k.chat"><div class="ob" style="width: 100%; font-size: 12px; line-height: 20px"><div><b style="font-weight: 600">lenta_ln</b> клатч <span class="em"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="10" r="2" fill="#0A0A0A"></circle><circle cx="16" cy="10" r="2" fill="#0A0A0A"></circle><path d="M6 15c3 4 9 4 12 0" fill="none" stroke="#0A0A0A" stroke-width="2"></path></svg></span></div><div><b style="font-weight: 600">moroz_tv</b> <span class="em"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h4M15 9h4M7 15h10" stroke="#0A0A0A" stroke-width="2"></path></svg></span> <span class="em"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h4M15 9h4M7 15h10" stroke="#0A0A0A" stroke-width="2"></path></svg></span></div><div><b style="font-weight: 600">nastya_k</b> привет всем</div></div></template>
<template data-if="w.k.wall"><div style="position: absolute; inset: 0"><span class="em" style="position: absolute; left: 18%; top: 22%; width: 32px; height: 32px"></span><span class="em" style="position: absolute; left: 52%; top: 12%; width: 24px; height: 24px; opacity: .7"></span><span class="em" style="position: absolute; left: 70%; top: 52%; width: 40px; height: 40px"></span><span class="em" style="position: absolute; left: 34%; top: 60%; width: 28px; height: 28px; opacity: .5"></span><span class="em" style="position: absolute; left: 8%; top: 64%; width: 20px; height: 20px; opacity: .8"></span></div></template>
<template data-if="w.k.events"><div class="ob" style="width: 100%; font-size: 12px; line-height: 20px"><div style="display: flex; justify-content: space-between"><span>sever_ops · рейд</span><span class="mono">212</span></div><div style="display: flex; justify-content: space-between"><span>tixiy_bard · подписка</span><span class="mono">3 мес</span></div><div style="display: flex; justify-content: space-between; color: #B4B4B4"><span>moroz_tv · донат</span><span class="mono">300 ₽</span></div></div></template>
<template data-if="w.k.topdon"><div class="ob" style="width: 100%; font-size: 12px; line-height: 20px"><p class="ov" style="margin-bottom: 4px">Топ за месяц</p><div style="display: flex; justify-content: space-between"><span>1. moroz_tv</span><span class="mono">4 300 ₽</span></div><div style="display: flex; justify-content: space-between"><span>2. polyana_live</span><span class="mono">2 150 ₽</span></div><div style="display: flex; justify-content: space-between; color: #B4B4B4"><span>3. gleb_1999</span><span class="mono">900 ₽</span></div></div></template>
<template data-if="w.k.faceit"><div class="ob" style="display: flex; align-items: center; gap: 12px"><span style="width: 40px; height: 40px; border-radius: 999px; border: 3px solid #F2F2F2; border-right-color: #525252; display: inline-flex; align-items: center; justify-content: center; font: 600 16px/1 'JetBrains Mono', monospace">9</span><span><span class="mono" style="display: block; font-size: 20px; font-weight: 500">1 874 <span style="font-size: 11px; color: #B4B4B4">ELO</span></span><span class="mono" style="display: block; font-size: 12px; color: #DCDCDC">▲ +25 за стрим</span></span></div></template>
<template data-if="w.k.fmatch"><div class="ob mono" style="display: grid; grid-template-columns: repeat(3, auto); gap: 4px 16px; font-size: 12px"><span style="color: #8F8F8F">K/D</span><span style="color: #8F8F8F">Матчи</span><span style="color: #8F8F8F">HS</span><span style="font-size: 18px">1.32</span><span style="font-size: 18px">4W 1L</span><span style="font-size: 18px">54%</span></div></template>
<template data-if="w.k.cs"><div class="ob mono" style="text-align: center"><span style="font-size: 26px; font-weight: 500">CT 9 <span style="color: #6E6E6E">:</span> 7 T</span><span style="display: block; font-size: 11px; color: #B4B4B4">Mirage · раунд 17</span></div></template>
<template data-if="w.k.dota"><div class="ob mono" style="display: flex; gap: 16px; font-size: 12px"><span><span style="display: block; color: #8F8F8F">MMR</span><span style="font-size: 20px">4 210</span></span><span><span style="display: block; color: #8F8F8F">Стрим</span><span style="font-size: 20px">3W 1L</span></span><span><span style="display: block; color: #8F8F8F">Герой</span><span style="font-size: 14px">Invoker 18</span></span></div></template>
<template data-if="w.k.np"><div class="ob" style="display: flex; align-items: center; gap: 10px; width: 100%"><span style="display: flex; align-items: flex-end; gap: 2px; height: 24px"><span style="width: 3px; height: 40%; background: #F2F2F2"></span><span style="width: 3px; height: 90%; background: #F2F2F2"></span><span style="width: 3px; height: 60%; background: #F2F2F2"></span><span style="width: 3px; height: 75%; background: #F2F2F2"></span></span><span style="font-size: 12px; line-height: 16px"><b style="font-weight: 600">Выхода нет</b><br><span style="color: #B4B4B4">Сплин · заказал tixiy_bard</span></span></div></template>
<template data-if="w.k.queue"><div class="ob" style="width: 100%; font-size: 12px; line-height: 20px"><div><span class="mono" style="color: #8F8F8F">1</span> Кино — Звезда по имени Солнце</div><div><span class="mono" style="color: #8F8F8F">2</span> Грибы — Тает лёд</div><div style="color: #B4B4B4"><span class="mono" style="color: #8F8F8F">3</span> Звери — Районы-кварталы</div></div></template>
<template data-if="w.k.uptime"><div class="ob mono" style="font-size: 30px; font-weight: 500; letter-spacing: -0.02em">02:47:13</div></template>
<template data-if="w.k.deaths"><div class="ob" style="display: flex; align-items: baseline; gap: 10px"><span style="font-size: 13px; color: #B4B4B4">Смертей</span><span class="mono" style="font-size: 30px; font-weight: 500">14</span></div></template>
<template data-if="w.k.poll"><div class="ob" style="width: 100%; font-size: 12px"><p style="margin: 0 0 6px; font-weight: 600">Какую карту дальше?</p><div style="display: flex; justify-content: space-between"><span>Mirage</span><span class="mono">62%</span></div><div style="height: 4px; background: #2A2A2A; margin: 3px 0 6px"><div style="width: 62%; height: 100%; background: #F2F2F2"></div></div><div style="display: flex; justify-content: space-between; color: #B4B4B4"><span>Inferno</span><span class="mono">38%</span></div></div></template>
<template data-if="w.k.ticker"><div style="position: absolute; left: 0; right: 0; bottom: 18px; height: 28px; background: rgba(10,10,10,0.82); border-top: 1px solid rgba(255,255,255,0.14); border-bottom: 1px solid rgba(255,255,255,0.14); display: flex; align-items: center; white-space: nowrap; font-size: 12px; padding-left: 14px">Сервер Discord: discord.gg/kira · Заказ музыки: !музыка · Стрим каждый день с 21:00</div></template>
<template data-if="w.locked"><div style="position: absolute; inset: 0; background: rgba(10,10,10,0.6)"></div></template>
</div>
<div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
<span style="min-width: 0"><span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span style="font-size: 15px; font-weight: 500">{{ w.name }}</span><template data-if="w.hasTier"><span class="tierb">{{ w.tier }}</span></template></span><span style="display: block; margin-top: 2px; font-size: 13px; line-height: 18px; color: #8F8F8F">{{ w.desc }}</span></span>
<button type="button" role="switch" class="sw" aria-checked="{{ w.on }}" aria-label="{{ w.swLabel }}" onClick="{{ w.toggle }}" disabled="{{ w.locked }}"><span></span></button>
</div>
<div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-size: 12px; line-height: 16px; display: inline-flex; gap: 6px; align-items: center; {{ w.statusStyle }}">{{ w.status }}</span>
<a href="{{ w.href }}" class="ib" aria-label="{{ w.cfgLabel }}"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg></a>
</div>
</div>
</li>
</template>
</ul>
</main>
</div>
</div>
</template>
<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'Все', onlyOn: false, on: { alerts: true, goal: true, chat: true, events: true, faceit: true, np: true, uptime: true } };
  }
  renderVals() {
    const W = [
      ['alerts', 'Алерты', 'Алерты', 'Фолловы, подписки, рейды и донаты со звуком', '', 'ok'],
      ['goal', 'Цель доната', 'Цели', 'Полоса прогресса к сумме, обновляется сразу после доната', '', 'ok'],
      ['subgoal', 'Цель подписчиков', 'Цели', 'Сколько подписок осталось до цели', '', 'ok'],
      ['chat', 'Чат на экране', 'Чат', 'Сообщения с эмоутами 7TV, BTTV и FFZ', '', 'ok'],
      ['wall', 'Стена эмоутов', 'Чат', 'Эмоуты из чата всплывают поверх сцены', 'Про', 'ok'],
      ['events', 'Последние события', 'Алерты', 'Лента: рейды, подписки, донаты', '', 'ok'],
      ['topdon', 'Топ донатеров', 'Алерты', 'За стрим, неделю или месяц', '', 'ok'],
      ['faceit', 'FACEIT: уровень и ELO', 'Игры', 'Уровень, ELO и изменение за стрим', '', 'ok'],
      ['fmatch', 'FACEIT: статистика стрима', 'Игры', 'K/D, хедшоты, победы и поражения', '', 'ok'],
      ['cs', 'CS2: счёт матча', 'Игры', 'Счёт и раунд через Game State Integration', '', 'setup'],
      ['dota', 'Dota 2: статистика', 'Игры', 'MMR, результат за стрим, уровень героя Dota Plus', '', 'setup'],
      ['np', 'Сейчас играет', 'Музыка', 'Трек и кто его заказал', '', 'ok'],
      ['queue', 'Очередь заказов', 'Музыка', 'Ближайшие 3–5 треков', '', 'ok'],
      ['uptime', 'Таймер эфира', 'Таймеры', 'Сколько идёт стрим', '', 'ok'],
      ['deaths', 'Счётчик', 'Таймеры', 'Смерти, победы, что угодно. Модераторы ведут командой !+1', '', 'ok'],
      ['poll', 'Голосование', 'Интерактив', 'Зрители голосуют цифрой в чате', 'Максимум', 'locked'],
      ['ticker', 'Бегущая строка', 'Интерактив', 'Ссылки, расписание, правила чата', '', 'ok']
    ];
    const on = this.state.on;
    const active = Object.keys(on).filter((k) => on[k]).length;
    const full = active >= 10;
    const cats = ['Все', 'Алерты', 'Цели', 'Чат', 'Игры', 'Музыка', 'Таймеры', 'Интерактив'];
    const all = W.map((w) => {
      const isOn = !!on[w[0]];
      const locked = w[5] === 'locked' || (full && !isOn);
      const k = {}; k[w[0]] = true;
      let status = isOn ? '● Включён' : 'Выключен';
      let statusStyle = isOn ? 'color: #F2F2F2' : 'color: #8F8F8F';
      if (w[5] === 'setup') { status = w[0] === 'cs' ? '▲ Нужен файл конфигурации CS2' : '▲ Нужен файл конфигурации Dota 2'; statusStyle = 'color: #DCDCDC; border: 1px dashed #8F8F8F; border-radius: 4px; padding: 2px 6px'; }
      if (w[5] === 'locked') { status = 'Доступно в «Максимум»'; statusStyle = 'color: #8F8F8F'; }
      return {
        id: w[0], name: w[1], cat: w[2], desc: w[3], tier: w[4], hasTier: !!w[4], isOn, k, locked,
        on: isOn ? 'true' : 'false', status, statusStyle,
        cardStyle: isOn ? 'border-color: #6E6E6E' : '',
        href: w[0] === 'faceit' ? 'widget-faceit.html' : (w[0] === 'chat' ? 'chat.html' : '#'),
        swLabel: 'Виджет ' + w[1], cfgLabel: 'Настроить ' + w[1],
        toggle: () => { if (locked && !isOn) return; this.setState({ on: Object.assign({}, on, { [w[0]]: !isOn }) }); }
      };
    });
    let shown = this.state.cat === 'Все' ? all : all.filter((w) => w.cat === this.state.cat);
    if (this.state.onlyOn) shown = shown.filter((w) => w.isOn);
    return {
      active, full, pct: (active * 10) + '%',
      onlyOn: this.state.onlyOn ? 'true' : 'false',
      toggleOnly: () => this.setState({ onlyOn: !this.state.onlyOn }),
      cats: cats.map((c) => ({
        label: c, n: c === 'Все' ? all.length : all.filter((w) => w.cat === c).length,
        sel: this.state.cat === c ? 'true' : 'false',
        style: this.state.cat === c ? 'background: #F2F2F2; color: #0A0A0A; border-color: #F2F2F2' : '',
        pick: () => this.setState({ cat: c })
      })),
      shown
    };
  }
}
DCMount(Component);
</script>
