<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — виджеты</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js?v=460ce522"></script>
<script src="assets/api.js?v=47744cb2"></script>
<script src="assets/widgets-lib.js?v=287ddb33"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ov{font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9);margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10)}
.nav-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.chipf{height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-10);font:500 13px/18px var(--font-sans),sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chipf:hover{border-color:var(--n-9);color:var(--n-12)}
.sw{position:relative;width:40px;height:24px;border-radius:999px;border:1px solid var(--n-8);background:transparent;cursor:pointer;flex:none;padding:0}
.sw span{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:var(--n-9);transition:transform 180ms cubic-bezier(.2,0,0,1)}
.sw[aria-checked="true"]{background:var(--n-13);border-color:var(--n-13)}
.sw[aria-checked="true"] span{transform:translateX(16px);background:var(--n-1)}
.sw:disabled{border-color:var(--n-5);cursor:not-allowed}
.sw:disabled span{background:var(--n-6)}
.wc{display:flex;flex-direction:column;border-radius:8px;border:1px solid var(--n-5);background:var(--s-2);overflow:hidden}
.wc:hover{border-color:var(--n-6)}
.pv{position:relative;height:136px;background:radial-gradient(220px 120px at 70% 20%,rgb(var(--n-13-rgb) / .08),transparent 70%),linear-gradient(160deg,var(--n-4),var(--n-1));display:flex;align-items:center;justify-content:center;padding:14px;box-sizing:border-box;border-bottom:1px solid var(--n-5);overflow:hidden}
.ob{background:var(--w-bg);backdrop-filter:blur(var(--w-blur));border:var(--w-bd);border-radius:var(--w-rad);box-shadow:var(--w-shadow);padding:8px 10px;color:var(--w-fg);font-family:var(--w-font);text-shadow:var(--w-tshadow);text-transform:var(--w-upper)}
.pv .mono{font-family:inherit}
.em{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:3px;background:linear-gradient(135deg,var(--n-10),var(--n-7));vertical-align:-5px;color:var(--n-1)}
.ib{width:36px;height:36px;border-radius:6px;border:0;background:transparent;color:var(--n-10);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ib:hover{background:rgb(var(--n-13-rgb) / .06);color:var(--n-12)}
.tierb{font-size:11px;line-height:14px;padding:2px 6px;border:1px solid var(--n-6);border-radius:4px;color:var(--n-10)}
.bsm{height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);font:500 12px/16px var(--font-sans),sans-serif;cursor:pointer;white-space:nowrap}
.bsm:hover{border-color:var(--n-9);background:rgb(var(--n-13-rgb) / .04)}
.bsm:disabled{color:var(--n-8);cursor:not-allowed}
.need{margin:0;padding:6px 8px;border:1px dashed var(--n-8);border-radius:6px;font-size:12px;line-height:16px;color:var(--n-11)}
.need a{text-decoration:underline;white-space:nowrap}
.note{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:8px;font-size:14px;line-height:20px;color:var(--n-12)}
.sw[aria-busy="true"]{opacity:.6}
.sw:focus-visible,.chipf:focus-visible,.bsm:focus-visible,.ib:focus-visible,a:focus-visible{outline:2px solid var(--n-12);outline-offset:2px}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<a href="settings.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; font-size: 14px; font-weight: 500" aria-label="Профиль" data-dc-keep data-stre-user><span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, var(--n-10), var(--n-6)); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--n-1)" data-av></span><span data-name>Профиль</span></a>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" class="sb" data-dc-keep>
<p class="sb-h">Эфир</p>
<a href="panel.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Обзор</a>
<a href="moderation.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<p class="sb-h">Бот</p>
<a href="commands.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды</a>
<a href="music.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Музыка</a>
<a href="widgets.html" class="sb-i" aria-current="page"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<span class="sb-i sb-off" aria-disabled="true"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 13l-7.5 7.5a2.1 2.1 0 0 1-3-3L11 10M16 16l6-6M8 8l6-6M9 7l8 8M21 11l-8-8"/></svg>Аукционы<span class="sb-tag">скоро</span></span>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
</nav>

<main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div><h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Виджеты</h1><p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: var(--n-10); max-width: 640px">Включи нужные и добавь в OBS как источник «Браузер». У каждого виджета своя ссылка, а настройки применяются на лету, без перезагрузки сцены.</p></div>
<div style="min-width: 260px; flex: 0 1 320px; padding: 14px 16px; border-radius: 8px; border: 1px solid var(--n-6); box-sizing: border-box">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 13px"><span style="color: var(--n-10)">{{ planLabel }}</span><span class="mono">{{ countLabel }}</span></div>
<div role="progressbar" aria-label="Включено виджетов" aria-valuenow="{{ active }}" aria-valuemin="0" aria-valuemax="{{ limit }}" style="margin-top: 10px; height: 4px; border-radius: 2px; background: var(--n-5)"><div style="height: 100%; border-radius: 2px; background: var(--n-12); width: {{ pct }}; transition: width 200ms"></div></div>
<template data-if="full"><p style="margin: 8px 0 0; font-size: 12px; line-height: 16px; color: var(--n-11)">Лимит исчерпан. Выключи один из виджетов<template data-if="canUpgrade"> или <a href="settings.html#billing" style="text-decoration: underline">перейди на тариф выше</a></template>.</p></template>
</div>
</div>

<template data-if="hasErr"><div role="alert" class="note" style="border: 2px solid var(--n-12)"><span style="flex: 1">{{ err }}</span><template data-if="loadFailed"><button type="button" class="bsm" onClick="{{ retry }}">Повторить</button></template><button type="button" class="ib" style="width: 28px; height: 28px" aria-label="Закрыть сообщение" onClick="{{ closeErr }}"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div></template>
<template data-if="hasInfo"><div role="status" class="note" style="border: 1px dashed var(--n-9)"><span style="flex: 1">{{ info }}</span><button type="button" class="ib" style="width: 28px; height: 28px" aria-label="Закрыть сообщение" onClick="{{ closeInfo }}"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div></template>

<div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center">
<div role="group" aria-label="Категории" style="display: flex; gap: 8px; flex-wrap: wrap">
<template data-for="cats" data-as="c"><button type="button" class="chipf" aria-pressed="{{ c.sel }}" onClick="{{ c.pick }}" style="{{ c.style }}">{{ c.label }}<span class="mono" style="font-size: 11px; opacity: .7">{{ c.n }}</span></button></template>
</div>
<label style="display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: var(--n-10); cursor: pointer"><button type="button" role="switch" class="sw" aria-checked="{{ onlyOn }}" onClick="{{ toggleOnly }}" aria-label="Только включённые"><span></span></button>Только включённые</label>
</div>

<template data-if="emptyShown"><p style="margin: 0; padding: 32px 16px; text-align: center; border: 1px dashed var(--n-6); border-radius: 8px; font-size: 14px; color: var(--n-10)">Включённых виджетов в этой категории нет. Сними фильтр «Только включённые», чтобы увидеть все.</p></template>

<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 16px">
<template data-for="shown" data-as="w">
<li class="wc" style="{{ w.cardStyle }}">
<div class="pv" aria-hidden="true" style="{{ w.vars }}">
<template data-if="w.p.isAlert"><div class="ob" style="text-align: center; width: 100%"><p class="ov" style="color: var(--w-fg2)">{{ w.p.head }}</p><p style="margin: 4px 0 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: var(--w-acc)">{{ w.p.big }}</p><p style="margin: 2px 0 0; font-size: 12px; color: var(--w-fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ w.p.sub }}</p></div></template>
<template data-if="w.p.isBar"><div class="ob" style="width: 100%"><div style="display: flex; justify-content: space-between; gap: 8px; font-size: 12px"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ w.p.head }}</span><span class="mono">{{ w.p.right }}</span></div><div style="margin-top: 8px; height: 10px; border-radius: 2px; background: var(--w-acc-soft); overflow: hidden"><div style="width: {{ w.p.pct }}%; height: 100%; background: var(--w-acc)"></div></div><p class="mono" style="margin: 6px 0 0; font-size: 11px; color: var(--w-fg2)">{{ w.p.sub }}</p></div></template>
<template data-if="w.p.isList"><div class="ob" style="width: 100%; font-size: 12px; line-height: 20px"><template data-if="w.p.hasHead"><p class="ov" style="margin-bottom: 4px; color: var(--w-fg2)">{{ w.p.head }}</p></template><template data-for="w.p.rows" data-as="r"><div style="display: flex; justify-content: space-between; gap: 8px"><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"><b style="font-weight: 600; color: var(--w-acc)">{{ r.b }}</b> {{ r.t }}</span><span class="mono" style="flex: none">{{ r.r }}</span></div></template><template data-if="w.p.hasEmpty"><div style="color: var(--w-fg2)">{{ w.p.empty }}</div></template></div></template>
<template data-if="w.p.isBig"><div class="ob" style="text-align: center; min-width: 140px; max-width: 100%"><p class="ov" style="color: var(--w-fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ w.p.head }}</p><p class="mono" style="margin: 2px 0 0; font-size: 26px; font-weight: 500; letter-spacing: -0.02em; color: var(--w-acc)">{{ w.p.big }}</p><template data-if="w.p.hasSub"><p style="margin: 2px 0 0; font-size: 11px; color: var(--w-fg2)">{{ w.p.sub }}</p></template></div></template>
<template data-if="w.p.isText"><div class="ob" style="display: flex; align-items: center; gap: 10px; width: 100%"><span style="flex: none; display: flex; align-items: flex-end; gap: 2px; height: 24px"><span style="width: 3px; height: 40%; background: var(--w-acc)"></span><span style="width: 3px; height: 90%; background: var(--w-acc)"></span><span style="width: 3px; height: 60%; background: var(--w-acc)"></span><span style="width: 3px; height: 75%; background: var(--w-acc)"></span></span><span style="min-width: 0; font-size: 12px; line-height: 16px"><b style="display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ w.p.head }}</b><span style="color: var(--w-fg2)">{{ w.p.sub }}</span></span></div></template>
<template data-if="w.p.isPoll"><div class="ob" style="width: 100%; font-size: 12px"><p style="margin: 0 0 6px; font-weight: 600">{{ w.p.head }}</p><div style="height: 4px; background: var(--w-acc-soft); margin: 3px 0 8px"><div style="width: 55%; height: 100%; background: var(--w-acc)"></div></div><div style="height: 4px; background: var(--w-acc-soft)"><div style="width: 30%; height: 100%; background: var(--w-fg2)"></div></div></div></template>
<template data-if="w.p.isTicker"><div class="ob" style="position: absolute; left: 0; right: 0; bottom: 18px; height: 28px; border-radius: 0; border-left: 0; border-right: 0; padding: 0 0 0 14px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; font-size: 12px">{{ w.p.head }}</div></template>
<template data-if="w.soon"><div style="position: absolute; inset: 0; background: rgb(var(--n-1-rgb) / 0.6)"></div></template>
</div>
<div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
<span style="min-width: 0"><span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span style="font-size: 15px; font-weight: 500">{{ w.name }}</span><template data-if="w.soon"><span class="tierb">Скоро</span></template></span><span style="display: block; margin-top: 2px; font-size: 13px; line-height: 18px; color: var(--n-9)">{{ w.desc }}</span></span>
<button type="button" role="switch" class="sw" aria-checked="{{ w.on }}" aria-label="{{ w.swLabel }}" aria-busy="{{ w.busy }}" onClick="{{ w.toggle }}" disabled="{{ w.swOff }}"><span></span></button>
</div>
<template data-if="w.hasNeed"><p class="need">{{ w.need }} <a href="{{ w.needHref }}">{{ w.needLink }}</a></p></template>
<div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-size: 12px; line-height: 16px; {{ w.statusStyle }}">{{ w.status }}</span>
<template data-if="w.canUse"><span style="display: inline-flex; align-items: center; gap: 4px"><button type="button" class="bsm" onClick="{{ w.copy }}" aria-label="{{ w.copyAria }}" disabled="{{ w.noToken }}">{{ w.copyLabel }}</button><a href="{{ w.href }}" class="ib" aria-label="{{ w.cfgLabel }}" title="Настроить"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg></a></span></template>
</div>
</div>
</li>
</template>
</ul>
<p style="margin: 0; font-size: 13px; line-height: 20px; color: var(--n-9)">Ссылка для OBS: «Источники» → «+» → «Браузер», размер 1920 × 1080. Не показывай ссылки в эфире — по ним любой может вставить твой виджет к себе.</p>
</main>
</div>
</div>
</template>
<script src="assets/dc-lite.js?v=5f8ce08a"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { loaded: false, loadFailed: false, data: { on: {}, cfg: {} }, token: '', limit: 0, me: {}, live: {}, busy: {}, copied: '', err: '', info: '', cat: 'Все', onlyOn: false };
  }
  componentDidMount() { this.load(); }
  async load() {
    const W = window.StreWidgets;
    this.setState({ err: '', loadFailed: false });
    try {
      const [r, me] = await Promise.all([W.load(), StreAPI.me()]);
      let info = '';
      if (r.migrated === 'local') info = 'Перенесли настройки виджетов из этого браузера на сервер — теперь их видит OBS.' + (r.dropped.length ? ' Выключены из-за лимита тарифа: ' + r.dropped.map((id) => W.meta(id)[1]).join(', ') + '.' : '');
      this.setState({ loaded: true, data: r.data, token: r.token, limit: r.limit, me: me || {}, info });
      W.LIST.forEach((w) => this.fetchLive(w[0]));
    } catch (e) {
      this.setState({ loadFailed: true, err: 'Не удалось загрузить виджеты: ' + e.message });
    }
  }
  // Живые данные для превью карточки — только для виджетов, где это дёшево (без внешних API)
  async fetchLive(id) {
    const s = this.state;
    const cheap = ['goal', 'subgoal', 'chat', 'events', 'topdon', 'np', 'queue', 'deaths'];
    if (!s.token || !((cheap.indexOf(id) >= 0 && s.data.on[id]) || id === 'cs' || id === 'dota')) return;
    try {
      const p = await StreAPI.get('widget.data', { t: s.token, w: id, after: 0 });
      this.setState({ live: Object.assign({}, this.state.live, { [id]: p }) });
    } catch (e) { /* превью останется схематичным */ }
  }
  toggle(id) {
    const W = window.StreWidgets;
    const s = this.state;
    if (!s.loaded || s.busy[id]) return;
    const next = !s.data.on[id];
    const setOn = (v) => { const on = Object.assign({}, this.state.data.on); if (v) on[id] = true; else delete on[id]; return Object.assign({}, this.state.data, { on }); };
    this.setState({ data: setOn(next), busy: Object.assign({}, s.busy, { [id]: true }), err: '' });
    W.update((d) => { if (next) d.on[id] = true; else delete d.on[id]; })
      .then((fresh) => {
        const busy = Object.assign({}, this.state.busy); delete busy[id];
        this.setState({ busy, data: Object.assign({}, this.state.data, { cfg: fresh.cfg }) });
        if (next) this.fetchLive(id);
      })
      .catch((e) => {
        const busy = Object.assign({}, this.state.busy); delete busy[id];
        this.setState({ busy, data: setOn(!next), err: e.message });
        StreAPI.toast(e.message, 'error');
      });
  }
  async copy(id) {
    const url = window.StreWidgets.obsUrl(this.state.token, id);
    let ok = false;
    try { await navigator.clipboard.writeText(url); ok = true; } catch (e) {
      const t = document.createElement('textarea'); t.value = url; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(t); t.select(); try { ok = document.execCommand('copy'); } catch (e2) { ok = false; } t.remove();
    }
    if (!ok) { StreAPI.toast('Не получилось скопировать. Ссылка есть в редакторе виджета, вкладка «OBS»', 'error'); return; }
    StreAPI.toast('Ссылка для OBS скопирована');
    this.setState({ copied: id });
    clearTimeout(this.copyT);
    this.copyT = setTimeout(() => this.setState({ copied: '' }), 2500);
  }
  preview(id, c) {
    const W = window.StreWidgets;
    const ct = c.content;
    const L = this.state.live[id];
    const d = (L && L.data) || null;
    const u = this.state.me.user || {};
    const st = this.state.me.stream || {};
    const fmt = StreAPI.fmtNum;
    const list = (head, rows, empty) => ({ isList: true, head, hasHead: !!head, rows: rows || [], hasEmpty: !(rows && rows.length), empty });
    const big = (head, value, sub) => ({ isBig: true, head, big: value, sub: sub || '', hasSub: !!sub });
    switch (id) {
      case 'alerts': {
        const e = { type: 'sub', name: ct.name || 'viewer_42', data: { months: 1 } };
        return { isAlert: true, head: W.alertLabel(e) + ' · пример', big: e.name, sub: W.alertText(ct, e) };
      }
      case 'goal':
      case 'subgoal': {
        const cur = d ? Number(d.current) || 0 : Number(ct.current) || 0;
        const tgt = Math.max(1, Number(ct.target) || 1);
        const pct = Math.max(0, Math.min(100, Math.round(cur / tgt * 100)));
        return { isBar: true, head: ct.title, right: pct + '%', pct, sub: fmt(cur) + ' / ' + fmt(tgt) + (id === 'goal' ? ' ₽' : '') };
      }
      case 'chat':
        return list('', d ? (d.items || []).slice(-3).map((m) => ({ b: m.name || m.login, t: m.text, r: '' })) : [], d ? 'Сообщений пока нет' : 'Здесь появятся сообщения чата');
      case 'events': {
        const what = { follow: 'фоллов', sub: 'подписка', resub: 'продление', gift: 'дарит подписки', raid: 'рейд', donation: 'донат' };
        return list('Последние события', d ? (d.items || []).slice(0, 3).map((e) => ({ b: e.name || e.login, t: what[e.type] || e.type, r: e.type === 'donation' ? fmt(e.data.amount) + ' ₽' : e.type === 'raid' ? fmt(e.data.viewers) : '' })) : [], d ? 'Событий пока нет' : 'Фолловы, подписки, рейды, донаты');
      }
      case 'topdon': {
        const per = { stream: 'за стрим', week: 'за неделю', month: 'за месяц' }[ct.period] || '';
        return list('Топ ' + per, d ? (d.items || []).slice(0, 3).map((t, i) => ({ b: (i + 1) + '.', t: t.username, r: fmt(t.total) + ' ₽' })) : [], d ? 'Донатов пока нет' : 'Здесь будут самые щедрые зрители');
      }
      case 'queue':
        return list('Дальше в очереди', d ? (d.items || []).slice(0, 3).map((q, i) => ({ b: String(i + 1), t: q.title, r: '' })) : [], d ? 'Очередь пуста' : 'Ближайшие заказанные треки');
      case 'np': {
        const cur = d && d.current;
        return { isText: true, head: cur ? cur.title : (d ? 'Сейчас ничего не играет' : 'Название трека'), sub: cur ? (cur.requester ? 'заказал ' + cur.requester : '') : 'и кто его заказал' };
      }
      case 'uptime':
        return big(ct.label, st.live ? StreAPI.fmtDur(Date.now() / 1000 - st.startedAt) : '—', st.live ? '' : 'не в эфире');
      case 'deaths':
        return big(ct.label, d ? fmt(d.value) : fmt(ct.value), 'команда ' + ct.command);
      case 'faceit':
      case 'fmatch':
        return big('FACEIT · ' + (ct.nick || 'ник не указан'), '— ELO', ct.nick ? 'уровень и матчи — в OBS' : 'укажи ник в настройках');
      case 'cs': {
        const g = d && d.gsi && d.gsi.map;
        return g ? big('CS2 · ' + String(g.name || '').replace(/^(de|cs|ar)_/, ''), 'CT ' + ((g.team_ct && g.team_ct.score) || 0) + ' : ' + ((g.team_t && g.team_t.score) || 0) + ' T', 'раунд ' + ((Number(g.round) || 0) + 1)) : big('CS2', 'CT – : – T', 'ждём данные из игры');
      }
      case 'dota': {
        const g = d && d.gsi;
        const pl = (g && g.player) || {};
        return g && g.hero && g.hero.name ? big('Dota 2 · ' + String(g.hero.name).replace('npc_dota_hero_', '').replace(/_/g, ' '), (pl.kills || 0) + ' / ' + (pl.deaths || 0) + ' / ' + (pl.assists || 0), 'K / D / A') : big('Dota 2', '– / – / –', 'ждём данные из игры');
      }
      case 'poll':
        return { isPoll: true, head: 'Голосование в чате' };
      case 'ticker':
        return { isTicker: true, head: ct.text };
    }
    return {};
  }
  need(id, c) {
    const s = this.state;
    const u = s.me.user || {};
    const L = s.live[id];
    const edit = (tab) => 'widget-editor.html?w=' + id + '&tab=' + tab;
    if (!s.loaded) return null;
    if (['chat', 'alerts', 'events', 'subgoal', 'deaths'].indexOf(id) >= 0 && !u.botEnabled) return ['Бот не в канале — чат и события не приходят.', 'Подключить', 'panel.html'];
    if ((id === 'goal' || id === 'topdon') && !u.daConnected) return ['Донаты приходят из DonationAlerts — он не подключён.', 'Подключить', 'settings.html#platforms'];
    if ((id === 'alerts' || id === 'events') && !u.daConnected) return ['Донаты появятся после подключения DonationAlerts.', 'Подключить', 'settings.html#platforms'];
    if ((id === 'faceit' || id === 'fmatch') && !c.content.nick) return ['Без ника FACEIT виджет пустой.', 'Указать ник', edit('content')];
    if ((id === 'cs' || id === 'dota') && !(L && L.data && L.data.updatedAt)) return ['Нужен файл конфигурации в папке игры.', 'Как подключить', edit('game')];
    if ((id === 'np' || id === 'queue') && u.limits && !u.limits.music) return ['Заказ музыки — на тарифе «Про» и выше.', 'Тарифы', 'settings.html#billing'];
    return null;
  }
  renderVals() {
    const W = window.StreWidgets;
    const s = this.state;
    const on = s.data.on;
    const active = W.countOn(s.data);
    const limit = s.limit;
    const full = s.loaded && active >= limit;
    const u = s.me.user || {};
    const all = W.LIST.map((w) => {
      const id = w[0];
      const isOn = !!on[id];
      const soon = w[5] === 'soon';
      const c = W.cfg(id, s.data);
      const busy = !!s.busy[id];
      const n = this.need(id, c);
      let status = isOn ? '● Включён' : 'Выключен';
      if (!s.loaded) status = 'Загрузка…';
      else if (busy) status = 'Сохраняем…';
      else if (soon) status = 'Скоро';
      return {
        id, name: w[1], cat: w[2], desc: w[3], isOn, soon, canUse: !soon,
        p: this.preview(id, c), vars: W.vars(c),
        on: isOn ? 'true' : 'false', busy: busy ? 'true' : 'false',
        swOff: !s.loaded || (soon && !isOn),
        status, statusStyle: isOn && !busy ? 'color: var(--n-12)' : 'color: var(--n-9)',
        hasNeed: !!n, need: n ? n[0] : '', needLink: n ? n[1] : '', needHref: n ? n[2] : '',
        cardStyle: isOn ? 'border-color: var(--n-8)' : '',
        href: 'widget-editor.html?w=' + id,
        swLabel: 'Виджет «' + w[1] + '»', cfgLabel: 'Настроить «' + w[1] + '»',
        noToken: !s.token, copyLabel: s.copied === id ? 'Скопировано' : 'Ссылка для OBS', copyAria: 'Скопировать ссылку для OBS: ' + w[1],
        copy: () => this.copy(id),
        toggle: () => this.toggle(id),
      };
    });
    let shown = s.cat === 'Все' ? all : all.filter((w) => w.cat === s.cat);
    if (s.onlyOn) shown = shown.filter((w) => w.isOn);
    return {
      active: s.loaded ? active : '—', limit: limit || 0,
      planLabel: u.planName ? 'Включено на тарифе «' + u.planName + '»' : 'Включено',
      countLabel: s.loaded ? active + ' из ' + limit : '— из —',
      full, canUpgrade: u.plan !== 'max',
      pct: (limit ? Math.min(100, Math.round(active / limit * 100)) : 0) + '%',
      hasErr: !!s.err, err: s.err, loadFailed: s.loadFailed, retry: () => this.load(), closeErr: () => this.setState({ err: '' }),
      hasInfo: !!s.info, info: s.info, closeInfo: () => this.setState({ info: '' }),
      onlyOn: s.onlyOn ? 'true' : 'false',
      toggleOnly: () => this.setState({ onlyOn: !s.onlyOn }),
      cats: W.CATS.map((c) => ({
        label: c, n: c === 'Все' ? all.length : all.filter((w) => w.cat === c).length,
        sel: s.cat === c ? 'true' : 'false',
        style: s.cat === c ? 'background: var(--n-12); color: var(--n-1); border-color: var(--n-12)' : '',
        pick: () => this.setState({ cat: c }),
      })),
      shown, emptyShown: s.loaded && !shown.length,
    };
  }
}
DCMount(Component);
</script>
