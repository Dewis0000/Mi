<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — мой сайт</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js?v=460ce522"></script>
<script src="assets/api.js?v=aea5953e"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.card{display:flex;flex-direction:column;gap:14px;padding:20px 22px;box-sizing:border-box;border-radius:12px;border:1px solid rgb(var(--n-13-rgb) / .10);background:rgb(var(--n-2-rgb) / .62)}
.ttl{margin:0;font-size:18px;line-height:24px;font-weight:600}
.hint{margin:0;font-size:13px;line-height:18px;color:var(--n-9)}
.lab{font-size:13px;line-height:18px;color:var(--n-11)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.inp{height:40px;box-sizing:border-box;padding:0 12px;border-radius:6px;background:var(--n-1);border:1px solid var(--n-8);color:var(--n-12);font:400 14px/20px var(--font-sans),sans-serif;width:100%;min-width:0}
.inp:disabled{color:var(--n-8);border-color:var(--n-5)}
textarea.inp{height:auto;padding:10px 12px;resize:vertical}
.bs{height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);font:500 14px/20px var(--font-sans),sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;text-decoration:none}
.bs:hover{border-color:var(--n-9);background:rgb(var(--n-13-rgb) / .04)}
.bs:disabled{color:var(--n-7);border-color:var(--n-5);cursor:not-allowed}
.bsm{height:30px;padding:0 10px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);font:500 13px/18px var(--font-sans),sans-serif;cursor:pointer;display:inline-flex;align-items:center;white-space:nowrap;text-decoration:none}
.bsm:hover{border-color:var(--n-9)}
.bd{border-color:var(--accent)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:20px;color:var(--n-12);cursor:pointer}
.chk input{margin:4px 0 0;width:16px;height:16px;flex:none;accent-color:var(--n-13)}
.chk2{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--n-11);cursor:pointer}
.chk2 input{width:16px;height:16px;margin:0;accent-color:var(--n-13)}
.item{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:8px;border:1px solid var(--n-5);box-sizing:border-box;min-width:0}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;border:1px solid var(--n-6);font-size:12px;color:var(--n-9);white-space:nowrap}
.stp{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;justify-content:space-between}
.stp-main{display:flex;gap:12px;align-items:center;min-width:0;flex:1 1 240px}
.stp-n{width:24px;height:24px;flex:none;border-radius:999px;border:1px solid var(--n-6);display:inline-flex;align-items:center;justify-content:center;font:500 12px/1 'JetBrains Mono',monospace;color:var(--n-11)}
.stp-t{display:block;font-size:14px;line-height:20px;font-weight:500}
.empty{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:14px;border:1px dashed var(--n-6);border-radius:8px}
.err{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:8px;border:1px solid var(--n-10);font-size:14px;line-height:20px;color:var(--n-12)}
.sw{position:relative;width:56px;height:32px;border-radius:999px;border:1px solid var(--n-8);background:transparent;cursor:pointer;flex:none;padding:0}
.sw span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:999px;background:var(--n-9);transition:transform 180ms cubic-bezier(.2,0,0,1)}
.sw[aria-checked="true"]{background:var(--n-13);border-color:var(--n-13)}
.sw[aria-checked="true"] span{transform:translateX(24px);background:var(--n-1)}
.sw:disabled{border-color:var(--n-5);cursor:not-allowed}
.sw:disabled span{background:var(--n-6)}
.sw:focus-visible,.bs:focus-visible,.bsm:focus-visible,.inp:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--n-12);outline-offset:2px}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none;white-space:nowrap;overflow:hidden}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
.sb-search{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;margin:0 0 8px;border:1px solid var(--n-6);border-radius:8px;background:rgb(var(--n-13-rgb) / .03);color:var(--n-9)}
.sb-search:focus-within{border-color:var(--n-12)}
.sb-search input{flex:1;min-width:0;min-width:0;border:0;outline:0;background:transparent;color:var(--n-12);font:400 14px/20px 'Onest',sans-serif;padding:0}
.sb-search input::placeholder{color:var(--n-9)}
.sb-search input::-webkit-search-cancel-button{display:none}
.sb-search kbd{font:400 10px/1 'JetBrains Mono',monospace;margin-left:auto;color:var(--n-9);border:1px solid var(--n-6);border-radius:4px;padding:2px 5px;white-space:nowrap}
.sb-empty{margin:8px 12px;font-size:13px;color:var(--n-9)}
.sb-hide{display:none!important}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var nav = document.querySelector('nav.sb'), box = nav && nav.querySelector('[data-sb-search]');
  if (!box) return;
  var empty = nav.querySelector('[data-sb-empty]');
  function apply() {
    var q = box.value.trim().toLowerCase(), any = false, group = null, groupHit = false;
    var rows = Array.prototype.slice.call(nav.children).filter(function (el) { return el.matches('a.sb-i, span.sb-i, p.sb-h, div.sb-sep'); });
    rows.forEach(function (el) {
      if (el.matches('p.sb-h')) { if (group) group.classList.toggle('sb-hide', !groupHit && !!q); group = el; groupHit = false; el.classList.remove('sb-hide'); return; }
      if (el.matches('div.sb-sep')) { el.classList.toggle('sb-hide', !!q); return; }
      var hit = !q || (el.textContent + ' ' + (el.getAttribute('data-kw') || '')).toLowerCase().indexOf(q) !== -1;
      el.classList.toggle('sb-hide', !hit);
      if (hit) { groupHit = true; any = true; }
    });
    if (group) group.classList.toggle('sb-hide', !!q && !groupHit);
    if (empty) empty.hidden = any || !q;
  }
  box.addEventListener('input', apply);
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var first = nav.querySelector('a.sb-i:not(.sb-hide)'); if (first) location.href = first.getAttribute('href'); }
    if (e.key === 'Escape') { box.value = ''; apply(); box.blur(); }
  });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); box.focus(); box.select(); }
  });
});
</script>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<a href="settings.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; font-size: 14px; font-weight: 500" aria-label="Профиль" data-dc-keep data-stre-user><span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, var(--n-10), var(--n-6)); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--n-1)" data-av></span><span data-name>Профиль</span></a>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" class="sb" data-dc-keep>
<label class="sb-search"><svg class="sb-ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" data-sb-search placeholder="Поиск" aria-label="Найти раздел" autocomplete="off"><kbd>Ctrl K</kbd></label><p class="sb-empty" data-sb-empty hidden>Такого раздела нет</p>
<p class="sb-h">Сегодня</p>
<a href="panel.html" class="sb-i" data-kw="главная статистика эфир статус"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Старт</a>
<p class="sb-h">Чат</p>
<a href="moderation.html" class="sb-i" data-kw="фильтр чат удалить бан таймаут проверка"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<a href="mods.html" class="sb-i" data-kw="мод модераторы помощник права журнал"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Помощники</a>
<a href="commands.html" class="sb-i" data-kw="команда ответ чат кулдаун"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды</a>
<a href="timers.html" class="sb-i" data-kw="таймер сообщение напоминание"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6M12 2v3"/></svg>Таймеры</a>
<p class="sb-h">Музыка</p>
<a href="music.html" class="sb-i" data-kw="музыка трек плеер заказ очередь песня"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Очередь и заказы</a>
<a href="manage.html" class="sb-i" data-kw="помощник канал трек музыка добавить"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Управлять каналом</a>
<p class="sb-h">Эфир и сайт</p>
<a href="widgets.html" class="sb-i" data-kw="виджет obs браузер ссылка чат розыгрыш"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты для OBS</a>
<a href="site-settings.html" class="sb-i" aria-current="page" data-kw="сайт подписчики видео значок галочка модератор"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Мой сайт</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i" data-kw="розыгрыш приз участники победитель"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<a href="clips.html" class="sb-i" data-kw="нарезка клип момент видео"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 9-12 9z"/><path d="M3 3v18"/></svg>Нарезки</a>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i" data-kw="тариф оплата аккаунт email промокод"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
<a href="support.html" class="sb-i" data-kw="помощь вопрос обращение"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Поддержка</a>
</nav>
<main style="flex: 999 1 640px; min-width: 0; max-width: 880px; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div style="min-width: 0; flex: 1 1 420px">
<h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Мой сайт</h1>
<p style="margin: 8px 0 0; font-size: 15px; line-height: 22px; color: var(--n-10); max-width: 640px">Мой сайт — твоя публичная страница. Подписчики заходят на неё по ссылке, предлагают видео, пишут в чат сайта и получают от тебя значки. Сайт виден людям, только когда он включён.</p>
<div class="row2" style="align-items: center; margin-top: 14px">
<a href="{{ siteUrl }}" target="_blank" rel="noopener" class="bs">Открыть сайт</a>
<button type="button" class="bs" onClick="{{ copyLink }}" disabled="{{ noLink }}">{{ copyLabel }}</button>
</div>
<p class="hint" style="margin-top: 8px">Адрес: {{ siteUrlLabel }}. {{ siteHint }}</p>
</div>
<template data-if="blocked"><div role="status" style="min-width: 260px; flex: 0 1 320px; padding: 14px 16px; border-radius: 8px; border: 1px solid var(--n-6); box-sizing: border-box; font-size: 14px; line-height: 20px; color: var(--n-11)">Сайт заблокирован администрацией StreOps. Посетители его не видят. Напиши в поддержку, если это ошибка.</div></template>
</div>
<p role="status" style="margin: 0; font-size: 14px; color: var(--n-10); min-height: 20px">{{ info }}</p>

<template data-if="staleErr"><div role="alert" class="err"><span>Нет связи с сервером. Показаны последние данные.</span><button type="button" class="bs" onClick="{{ retry }}">Повторить</button></div></template>

<template data-if="loadingNow"><section class="card" aria-live="polite"><p role="status" style="margin: 0; font-size: 14px; color: var(--n-10)">Загружаем…</p></section></template>

<template data-if="loadFail"><div role="alert" class="err"><span style="min-width: 0"><b style="font-weight: 600">Не удалось загрузить сайт.</b><span class="hint" style="display: block; margin-top: 2px; overflow-wrap: anywhere">Причина: {{ loadErrText }}. Проверь интернет и попробуй ещё раз.</span></span><button type="button" class="bs" onClick="{{ retry }}">Повторить</button></div></template>

<template data-if="ready"><div style="display: flex; flex-direction: column; gap: 24px">

<section class="card" aria-labelledby="t-on" style="flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<div style="min-width: 0; flex: 1 1 280px">
<h2 id="t-on" class="ttl" style="font-size: 20px; line-height: 26px">Сайт включён</h2>
<p class="hint" style="margin-top: 4px; font-size: 14px; line-height: 20px; color: var(--n-10)">{{ enabledHint }}</p>
</div>
<button type="button" role="switch" class="sw" aria-checked="{{ enabledAria }}" aria-label="Сайт включён" onClick="{{ toggleEnabled }}" disabled="{{ toggleOff }}"><span></span></button>
</section>

<section class="card" id="how" aria-labelledby="t-how">
<div>
<h2 id="t-how" class="ttl">Как включить сайт</h2>
<p class="hint" style="margin-top: 4px">Три шага, обычно хватает пары минут. Когда шаг выполнен, рядом появится «Готово».</p>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<li class="stp"><span class="stp-main"><span class="stp-n">1</span><span><span class="stp-t">Включи сайт</span><span class="hint">Переключатель «Сайт включён» вверху страницы.</span></span></span><span class="pill" style="{{ s1Style }}">{{ s1Text }}</span></li>
<li class="stp"><span class="stp-main"><span class="stp-n">2</span><span><span class="stp-t">Укажи название и статус</span><span class="hint">Так сайт выглядит для посетителей.</span></span></span><span class="row2" style="align-items: center"><span class="pill" style="{{ s2Style }}">{{ s2Text }}</span><a href="#name" class="bsm">К названию</a></span></li>
<li class="stp"><span class="stp-main"><span class="stp-n">3</span><span><span class="stp-t">Добавь модераторов и выбери галочки</span><span class="hint">Модераторы одобряют видео и чистят чат сайта. Галочка — значок «проверено» у ника.</span></span></span><span class="row2" style="align-items: center"><span class="pill" style="{{ s3Style }}">{{ s3Text }}</span><a href="#mods" class="bsm">К модераторам</a></span></li>
</ol>
</section>

<section class="card" id="name" aria-labelledby="t-name">
<h2 id="t-name" class="ttl">Название и статус</h2>
<label class="fld"><span class="lab">Название на сайте</span><input class="inp" value="{{ title }}" onChange="{{ saveTitle }}" maxlength="80" placeholder="{{ streamerName }}"><span class="hint">Видно посетителям на сайте. Сохранится, когда выйдешь из поля.</span></label>
<label class="fld"><span class="lab">Статус</span><input class="inp" value="{{ status }}" onChange="{{ saveStatus }}" maxlength="120" placeholder="Например: играю в ранкед до 23:00"><span class="hint">Короткая фраза о том, чем ты занят. Видна, если включён показ статуса ниже.</span></label>
</section>

<section class="card" aria-labelledby="t-show">
<h2 id="t-show" class="ttl">Что показывать на сайте</h2>
<p class="hint">Изменения сохраняются сразу, как только переключишь галочку.</p>
<label class="chk"><input type="checkbox" checked="{{ chatOn }}" onChange="{{ toggleChat }}"><span><span style="display: block">Чат сайта</span><span class="hint">Зрители пишут сообщения прямо на твоём сайте.</span></span></label>
<label class="chk"><input type="checkbox" checked="{{ showFeed }}" onChange="{{ toggleFeed }}"><span><span style="display: block">Лента одобренных видео</span><span class="hint">Видео из очереди, которые ты одобрил.</span></span></label>
<label class="chk"><input type="checkbox" checked="{{ showWatched }}" onChange="{{ toggleWatched }}"><span><span style="display: block">Раздел «Просмотренное»</span><span class="hint">Видно зрителям, когда есть публичные записи (см. ниже).</span></span></label>
<label class="chk"><input type="checkbox" checked="{{ showStatus }}" onChange="{{ toggleStatus }}"><span><span style="display: block">Показывать статус</span><span class="hint">Фраза из поля «Статус» видна посетителям.</span></span></label>
</section>

<section class="card" id="mods" aria-labelledby="t-mods">
<div>
<h2 id="t-mods" class="ttl">Модераторы и галочки</h2>
<p class="hint" style="margin-top: 4px">Модератор одобряет видео в очереди и удаляет сообщения в чате сайта. Галочка — значок «проверено» рядом с ником. Зритель должен хотя бы раз войти на StreOps.</p>
</div>
<div class="row2" style="align-items: flex-end">
<label class="fld" style="flex: 1 1 220px"><span class="lab">Добавить зрителя по нику</span><input id="newMember" class="inp" value="{{ newLogin }}" onChange="{{ setNewLogin }}" placeholder="ник на Twitch"></label>
<button type="button" class="bs" onClick="{{ addMember }}">Добавить в список</button>
</div>
<p class="hint">Ник появится в списке. Дальше отметь, что ему выдать.</p>
<template data-if="noMembers"><div class="empty"><p style="margin: 0; font-size: 14px">Пока никого нет.</p><p class="hint">Добавь ник друга или модератора, а потом выбери, что ему дать: модерацию или галочку.</p><button type="button" class="bs" onClick="{{ focusMember }}">Ввести ник</button></div></template>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px"><template data-for="members" data-as="m"><li class="item" style="flex-direction: column; align-items: stretch">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
<span style="font-size: 15px; font-weight: 500; color: {{ m.colorValue }}; overflow-wrap: anywhere">{{ m.name }} <span class="hint">{{ m.tags }}</span></span>
<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center">
<label class="chk2"><input type="checkbox" checked="{{ m.mod }}" onChange="{{ m.toggleMod }}"> Модератор</label>
<label class="chk2"><input type="checkbox" checked="{{ m.verified }}" onChange="{{ m.toggleVerified }}"> Галочка</label>
<button type="button" class="bsm bd" onClick="{{ m.remove }}">Убрать из списка</button>
</div>
</div>
<div><button type="button" class="bsm" aria-expanded="{{ m.advAria }}" onClick="{{ m.toggleAdv }}">{{ m.advLabel }}</button></div>
<template data-if="m.adv"><div style="display: flex; flex-wrap: wrap; gap: 12px; padding-top: 12px; border-top: 1px solid var(--n-4)">
<label class="fld" style="flex: 1 1 220px"><span class="lab">Подпись значка</span><input class="inp" value="{{ m.badge }}" onChange="{{ m.setBadge }}" maxlength="40" placeholder="например, Мастер нарезок"><span class="hint">Показывается рядом с ником на сайте. Пусто — значка нет.</span></label>
<label class="fld" style="flex: 0 1 200px"><span class="lab">Цвет ника</span><select class="inp" onChange="{{ m.setColor }}"><template data-for="m.colorOptions" data-as="o"><option value="{{ o.value }}" selected="{{ o.selected }}">{{ o.label }}</option></template></select><span class="hint">Виден всем в чате сайта.</span></label>
</div></template>
</li></template></ul>
</section>

<section class="card" id="watch" aria-labelledby="t-watch">
<div>
<h2 id="t-watch" class="ttl">Просмотренное</h2>
<p class="hint" style="margin-top: 4px">Записи видны только тебе, пока не отметишь «показать сайту». Тогда видео появится у зрителей на вкладке «Просмотренное» вместе с твоей заметкой.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="fld"><span class="lab">Ссылка</span><input id="wurl" class="inp" value="{{ wUrl }}" onChange="{{ setWUrl }}" placeholder="ссылка YouTube или Twitch"></label>
<label class="fld"><span class="lab">Название</span><input class="inp" value="{{ wTitle }}" onChange="{{ setWTitle }}" placeholder="как назвать видео"></label>
<label class="fld"><span class="lab">Заметка</span><textarea class="inp" rows="2" onChange="{{ setWNote }}" placeholder="почему стоит посмотреть">{{ wNote }}</textarea></label>
<div class="row2" style="align-items: center"><button type="button" class="bs" onClick="{{ addWatch }}">Добавить в список</button><span class="hint">Добавится как «Только тебе».</span></div>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px"><template data-for="watch" data-as="w"><li class="item"><div style="min-width: 0; flex: 1 1 240px"><p style="margin: 0; font-size: 15px; font-weight: 500; overflow-wrap: anywhere">{{ w.title }} <span class="pill" style="{{ w.visStyle }}">{{ w.vis }}</span></p><p class="hint" style="margin-top: 4px; overflow-wrap: anywhere">{{ w.note }}</p></div><div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center"><label class="chk2"><input type="checkbox" checked="{{ w.public }}" onChange="{{ w.togglePublic }}"> показать сайту</label><button type="button" class="bsm bd" onClick="{{ w.remove }}">Удалить</button></div></li></template></ul>
<template data-if="noWatch"><div class="empty"><p style="margin: 0; font-size: 14px">Пока пусто.</p><p class="hint">Добавь видео, которое стоит посмотреть: ссылку YouTube или Twitch и пару слов о нём.</p><button type="button" class="bs" onClick="{{ focusWatch }}">Добавить первое видео</button></div></template>
</section>

<section class="card" id="queue" aria-labelledby="t-queue">
<div>
<h2 id="t-queue" class="ttl">Очередь видео от подписчиков</h2>
<p class="hint" style="margin-top: 4px">Подписчики предлагают видео прямо на твоём сайте. Одобренное появится на сайте, отклонённое — нет.</p>
</div>
<template data-if="noQueue"><div class="empty"><p style="margin: 0; font-size: 14px">Очередь пуста.</p><p class="hint">Предложения появятся, когда подписчики предложат видео на твоём сайте. Поделись ссылкой на сайт, чтобы они его нашли.</p><button type="button" class="bs" onClick="{{ copyLink }}" disabled="{{ noLink }}">{{ copyLabel }}</button></div></template>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px"><template data-for="queue" data-as="q"><li class="item"><div style="min-width: 0; flex: 1 1 240px"><a href="{{ q.url }}" target="_blank" rel="noopener" style="font-size: 15px; font-weight: 500; overflow-wrap: anywhere">{{ q.title }}</a><p class="hint" style="margin-top: 4px">от {{ q.by }} · {{ q.sectionLabel }}</p></div><div class="row2"><button type="button" class="bsm" onClick="{{ q.approve }}">Одобрить</button><button type="button" class="bsm" onClick="{{ q.reject }}">Отклонить</button></div></li></template></ul>
</section>

<section class="card" id="chat" aria-labelledby="t-chat">
<div>
<h2 id="t-chat" class="ttl">Чат сайта</h2>
<p class="hint" style="margin-top: 4px">Сообщения зрителей в чате твоего сайта. Удалить можно любое. Сам чат видно, если он включён в списке «Что показывать».</p>
</div>
<template data-if="noChat"><div class="empty"><p style="margin: 0; font-size: 14px">Сообщений пока нет.</p><p class="hint">Когда зрители начнут писать в чат сайта, сообщения появятся здесь.</p></div></template>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px"><template data-for="chat" data-as="c"><li class="item" style="justify-content: flex-start; flex-wrap: nowrap; align-items: flex-start"><span style="min-width: 0; flex: 1 1 auto; font-size: 14px; line-height: 20px; overflow-wrap: anywhere"><b style="font-weight: 600; color: {{ c.colorValue }}">{{ c.name }}</b>{{ c.tags }} <span style="color: var(--n-11)">{{ c.text }}</span></span><button type="button" class="bsm bd" onClick="{{ c.remove }}" style="flex: none">Удалить</button></li></template></ul>
</section>

</div></template>
</main>
</div>
</div>
</template>
<script src="assets/dc-lite.js?v=5f8ce08a"></script>
<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { d: null, loaded: false, loadErr: '', info: '', newLogin: '', wUrl: '', wTitle: '', wNote: '', login: '', copied: false, openM: {} };
}
componentDidMount() {
this.load(false);
this.timer = setInterval(() => this.load(true), 8000);
}
componentWillUnmount() { clearInterval(this.timer); clearTimeout(this.copyT); }
async load(quiet) {
try {
const d = await StreAPI.get('site.manage');
const me = this.state.login ? null : await StreAPI.me();
this.setState(Object.assign({ d, loaded: true, loadErr: '' }, me && me.user ? { login: me.user.login } : {}));
} catch (e) {
const msg = (e && e.message) || 'нет связи с сервером';
if (!quiet) StreAPI.toast(msg, 'error');
this.setState({ loadErr: msg });
}
}
retry() { this.setState({ loadErr: '' }); this.load(false); }
// Возвращает true, если сервер принял запрос; при ошибке показывает уведомление и возвращает false.
async call(route, body, ok) {
try {
await StreAPI.post(route, Object.assign({ c: this.state.login }, body));
if (ok) this.setState({ info: ok });
await this.load(true);
return true;
} catch (e) { StreAPI.toast(e.message, 'error'); return false; }
}
saveSettings(patch) { return this.call('site.settings.save', patch, 'Сохранено'); }
memberAct(login, action, extra) { return this.call('site.members.save', Object.assign({ login, action }, extra || {}), null); }
async copyLink() {
const d = this.state.d;
if (!d || !d.url) return;
let url = d.url;
try { url = new URL(d.url, location.href).href; } catch (e) { /* оставляем как есть */ }
let ok = false;
try { await navigator.clipboard.writeText(url); ok = true; } catch (e) {
try { const t = document.createElement('textarea'); t.value = url; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); ok = document.execCommand('copy'); t.remove(); } catch (e2) { ok = false; }
}
if (!ok) { StreAPI.toast('Не получилось скопировать. Выдели ссылку и скопируй вручную', 'error'); return; }
this.setState({ copied: true });
clearTimeout(this.copyT);
this.copyT = setTimeout(() => this.setState({ copied: false }), 2000);
}
focusEl(id) { const el = document.getElementById(id); if (el) el.focus(); }
renderVals() {
const s = this.state, d = s.d;
const set = (k) => (e) => this.saveSettings({ [k]: e.target.checked });
const settings = d ? d.settings : {};
const on = !!settings.enabled;
const blocked = !!(d && d.blocked);
const ready = !!d;
const colorOpts = (cur) => (d ? d.colors : []).map((c) => ({ value: c, label: c, selected: c === cur }));
const tags = (x) => [x.mod ? 'модератор' : '', x.verified ? 'галочка' : ''].filter(Boolean).join(' · ');
const openM = s.openM || {};
const members = d ? d.members.map((m) => {
const adv = !!openM[m.login];
return {
name: m.name, tags: tags(m), mod: !!m.mod, verified: !!m.verified, colorValue: m.color || 'var(--n-12)',
colorOptions: colorOpts(m.color),
badge: m.badge || '',
adv: adv, advAria: adv ? 'true' : 'false',
advLabel: adv ? 'Расширенные: цвет и значок ▴' : 'Расширенные: цвет и значок ▾',
toggleAdv: () => this.setState({ openM: Object.assign({}, this.state.openM, { [m.login]: !(this.state.openM || {})[m.login] }) }),
setBadge: (e) => this.call('site.badge', { login: m.login, label: e.target.value.trim() }, 'Подпись значка сохранена'),
toggleMod: (e) => this.memberAct(m.login, 'mod', { value: e.target.checked }),
toggleVerified: (e) => this.memberAct(m.login, 'verified', { value: e.target.checked }),
setColor: (e) => this.memberAct(m.login, 'color', { color: e.target.value }),
remove: () => { if (confirm('Убрать ' + m.name + ' из списка?')) this.memberAct(m.login, 'remove'); },
};
}) : [];
const watch = d ? d.watch.map((w) => ({
id: w.id, title: w.title || w.url, note: w.note || '', public: !!w.public,
vis: w.public ? 'Видно зрителям' : 'Только тебе',
visStyle: w.public ? 'border-color: var(--n-12); color: var(--n-12)' : '',
togglePublic: (e) => this.call('site.watch.save', { id: w.id, url: w.url, title: w.title, note: w.note, public: e.target.checked }, e.target.checked ? 'Видно зрителям на вкладке «Просмотренное»' : 'Скрыто: видно только тебе'),
remove: () => { if (confirm('Удалить «' + (w.title || w.url) + '» из просмотренного? Отменить это нельзя.')) this.call('site.watch.delete', { id: w.id }, 'Запись удалена'); },
})) : [];
const queue = d ? d.queue.map((q) => ({
url: q.url, title: q.title, by: q.by, sectionLabel: q.section === 'stream' ? 'Стрим' : 'Не стрим',
approve: () => this.call('site.review', { id: q.id, action: 'approve' }, 'Видео одобрено'),
reject: () => this.call('site.review', { id: q.id, action: 'reject' }, 'Видео отклонено'),
})) : [];
const chat = d ? d.chat.map((c) => ({
name: c.name, text: c.text, colorValue: c.color || 'var(--n-12)',
tags: c.verified ? ' ✓' : '',
remove: () => this.call('site.chat.delete', { id: c.id }, 'Сообщение удалено'),
})) : [];
const siteUrl = d ? d.url : '#';
const titleSet = !!String(settings.title || '').trim();
const statusSet = !!String(settings.status || '').trim();
const membersDone = members.some((m) => m.mod || m.verified);
const pillStyle = (done) => done ? 'border-color: var(--n-12); color: var(--n-12)' : '';
const pillText = (done) => done ? 'Готово' : 'Сделать';
return {
ready,
loadingNow: !s.loaded && !s.loadErr,
loadFail: !s.loaded && !!s.loadErr,
loadErrText: s.loadErr,
staleErr: s.loaded && !!s.loadErr,
retry: () => this.retry(),
siteUrl, siteUrlLabel: d ? 'streops.ru/' + siteUrl : 'Загружаем…',
siteHint: on ? 'Скопированную ссылку можно отправить подписчикам.' : 'Сайт сейчас выключен: по ссылке его никто не увидит. Включи его ниже.',
noLink: !(d && d.url),
copied: s.copied,
copyLabel: s.copied ? 'Ссылка скопирована' : 'Скопировать ссылку',
copyLink: () => this.copyLink(),
blocked, info: s.info,
toggleOff: !ready || blocked,
enabledAria: on ? 'true' : 'false',
enabledHint: blocked ? 'Недоступно: сайт заблокирован администрацией StreOps.' : (on ? 'Выключи — сайт перестанет открываться для всех. Данные сохранятся.' : 'Сейчас выключен: сайт никто не видит. Включи — и он откроется по ссылке. Данные не теряются.'),
toggleEnabled: () => this.call('site.settings.save', { enabled: !on }, on ? 'Сайт выключен. Данные сохранены' : 'Сайт включён. Теперь его можно открыть по ссылке'),
s1Text: pillText(on), s1Style: pillStyle(on),
s2Text: pillText(titleSet && statusSet), s2Style: pillStyle(titleSet && statusSet),
s3Text: pillText(membersDone), s3Style: pillStyle(membersDone),
title: settings.title || '', saveTitle: (e) => this.saveSettings({ title: e.target.value.trim() }),
streamerName: s.login,
status: settings.status || '', saveStatus: (e) => this.saveSettings({ status: e.target.value.trim() }),
chatOn: !!settings.chatOn, toggleChat: set('chatOn'),
showFeed: !!settings.showFeed, toggleFeed: set('showFeed'),
showWatched: !!settings.showWatched, toggleWatched: set('showWatched'),
showStatus: !!settings.showStatus, toggleStatus: set('showStatus'),
newLogin: s.newLogin, setNewLogin: (e) => this.setState({ newLogin: e.target.value.trim() }),
addMember: () => s.newLogin ? this.memberAct(s.newLogin, 'mod', { value: false }).then((ok) => { if (ok) this.setState({ newLogin: '' }); }) : StreAPI.toast('Укажи ник', 'error'),
focusMember: () => this.focusEl('newMember'),
members, noMembers: ready && !members.length,
wUrl: s.wUrl, setWUrl: (e) => this.setState({ wUrl: e.target.value.trim() }),
wTitle: s.wTitle, setWTitle: (e) => this.setState({ wTitle: e.target.value }),
wNote: s.wNote, setWNote: (e) => this.setState({ wNote: e.target.value }),
addWatch: () => { if (!s.wUrl) return StreAPI.toast('Вставь ссылку', 'error'); this.call('site.watch.save', { url: s.wUrl, title: s.wTitle, note: s.wNote, public: false }, 'Добавлено. Видно только тебе').then((ok) => { if (ok) this.setState({ wUrl: '', wTitle: '', wNote: '' }); }); },
focusWatch: () => this.focusEl('wurl'),
watch, noWatch: ready && !watch.length,
queue, noQueue: ready && !queue.length,
chat, noChat: ready && !chat.length,
};
}
}
DCMount(Component);
</script>
</body>
</html>
