<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — мой сайт</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js?v=460ce522"></script>
<script src="assets/api.js?v=c464f264"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ov{font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9);margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10)}
.nav-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.chipf{height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-10);font:500 13px/18px var(--font-sans),sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chipf:hover{border-color:var(--n-9);color:var(--n-12)}
.sw{position:relative;width:40px;height:24px;border-radius:999px;border:1px solid var(--n-8);background:transparent;cursor:pointer;flex:none;padding:0}
.sw span{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:var(--n-9);transition:transform 180ms cubic-bezier(.2,0,0,1)}
.sw[aria-checked="true"]{background:var(--n-13);border-color:var(--n-13)}
.sw[aria-checked="true"] span{transform:translateX(16px);background:var(--n-1)}
.sw:disabled{border-color:var(--n-5);cursor:not-allowed}
.sw:disabled span{background:var(--n-6)}
.wc{display:flex;flex-direction:column;border-radius:8px;border:1px solid var(--n-5);background:var(--s-2);overflow:hidden}
.wc:hover{border-color:var(--n-6)}
.pv{position:relative;height:136px;background:radial-gradient(220px 120px at 70% 20%,rgb(var(--n-13-rgb) / .08),transparent 70%),linear-gradient(160deg,var(--n-4),var(--n-1));display:flex;align-items:center;justify-content:center;padding:14px;box-sizing:border-box;border-bottom:1px solid var(--n-5);overflow:hidden}
.ob{background:var(--w-bg);backdrop-filter:blur(var(--w-blur));border:var(--w-bd);border-radius:var(--w-rad);box-shadow:var(--w-shadow);padding:8px 10px;color:var(--w-fg);font-family:var(--w-font);text-shadow:var(--w-tshadow);text-transform:var(--w-upper)}
.pv .mono{font-family:inherit}
.em{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:3px;background:linear-gradient(135deg,var(--n-10),var(--n-7));vertical-align:-5px;color:var(--n-1)}
.ib{width:36px;height:36px;border-radius:6px;border:0;background:transparent;color:var(--n-10);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ib:hover{background:rgb(var(--n-13-rgb) / .06);color:var(--n-12)}
.tierb{font-size:11px;line-height:14px;padding:2px 6px;border:1px solid var(--n-6);border-radius:4px;color:var(--n-10)}
.bsm{height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);font:500 12px/16px var(--font-sans),sans-serif;cursor:pointer;white-space:nowrap}
.bsm:hover{border-color:var(--n-9);background:rgb(var(--n-13-rgb) / .04)}
.bsm:disabled{color:var(--n-8);cursor:not-allowed}
.need{margin:0;padding:6px 8px;border:1px dashed var(--n-8);border-radius:6px;font-size:12px;line-height:16px;color:var(--n-11)}
.need a{text-decoration:underline;white-space:nowrap}
.note{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:8px;font-size:14px;line-height:20px;color:var(--n-12)}
.sw[aria-busy="true"]{opacity:.6}
.sw:focus-visible,.chipf:focus-visible,.bsm:focus-visible,.ib:focus-visible,a:focus-visible{outline:2px solid var(--n-12);outline-offset:2px}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none;white-space:nowrap;overflow:hidden}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
.sb-search{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;margin:0 0 8px;border:1px solid var(--n-6);border-radius:8px;background:rgb(var(--n-13-rgb) / .03);color:var(--n-9)}
.sb-search:focus-within{border-color:var(--n-12)}
.sb-search input{flex:1;min-width:0;min-width:0;border:0;outline:0;background:transparent;color:var(--n-12);font:400 14px/20px 'Onest',sans-serif;padding:0}
.sb-search input::placeholder{color:var(--n-9)}
.sb-search input::-webkit-search-cancel-button{display:none}
.sb-search kbd{font:400 10px/1 'JetBrains Mono',monospace;margin-left:auto;color:var(--n-9);border:1px solid var(--n-6);border-radius:4px;padding:2px 5px;white-space:nowrap}
.sb-empty{margin:8px 12px;font-size:13px;color:var(--n-9)}
.sb-hide{display:none!important}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var nav = document.querySelector('nav.sb'), box = nav && nav.querySelector('[data-sb-search]');
  if (!box) return;
  var empty = nav.querySelector('[data-sb-empty]');
  function apply() {
    var q = box.value.trim().toLowerCase(), any = false, group = null, groupHit = false;
    var rows = Array.prototype.slice.call(nav.children).filter(function (el) { return el.matches('a.sb-i, span.sb-i, p.sb-h, div.sb-sep'); });
    rows.forEach(function (el) {
      if (el.matches('p.sb-h')) { if (group) group.classList.toggle('sb-hide', !groupHit && !!q); group = el; groupHit = false; el.classList.remove('sb-hide'); return; }
      if (el.matches('div.sb-sep')) { el.classList.toggle('sb-hide', !!q); return; }
      var hit = !q || (el.textContent + ' ' + (el.getAttribute('data-kw') || '')).toLowerCase().indexOf(q) !== -1;
      el.classList.toggle('sb-hide', !hit);
      if (hit) { groupHit = true; any = true; }
    });
    if (group) group.classList.toggle('sb-hide', !!q && !groupHit);
    if (empty) empty.hidden = any || !q;
  }
  box.addEventListener('input', apply);
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var first = nav.querySelector('a.sb-i:not(.sb-hide)'); if (first) location.href = first.getAttribute('href'); }
    if (e.key === 'Escape') { box.value = ''; apply(); box.blur(); }
  });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); box.focus(); box.select(); }
  });
});
</script>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<a href="settings.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; font-size: 14px; font-weight: 500" aria-label="Профиль" data-dc-keep data-stre-user><span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, var(--n-10), var(--n-6)); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--n-1)" data-av></span><span data-name>Профиль</span></a>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" class="sb" data-dc-keep>
<label class="sb-search"><svg class="sb-ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" data-sb-search placeholder="Поиск" aria-label="Найти раздел" autocomplete="off"><kbd>Ctrl K</kbd></label><p class="sb-empty" data-sb-empty hidden>Такого раздела нет</p>
<p class="sb-h">Сегодня</p>
<a href="panel.html" class="sb-i" data-kw="главная статистика эфир статус"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Старт</a>
<p class="sb-h">Чат</p>
<a href="moderation.html" class="sb-i" data-kw="фильтр чат удалить бан таймаут проверка"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<a href="mods.html" class="sb-i" data-kw="мод модераторы помощник права журнал"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Помощники</a>
<a href="commands.html" class="sb-i" data-kw="команда ответ чат кулдаун"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды</a>
<a href="timers.html" class="sb-i" data-kw="таймер сообщение напоминание"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6M12 2v3"/></svg>Таймеры</a>
<p class="sb-h">Музыка</p>
<a href="music.html" class="sb-i" data-kw="музыка трек плеер заказ очередь песня"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Очередь и заказы</a>
<a href="manage.html" class="sb-i" data-kw="помощник канал трек музыка добавить"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Управлять каналом</a>
<p class="sb-h">Эфир и сайт</p>
<a href="widgets.html" class="sb-i" data-kw="виджет obs браузер ссылка чат розыгрыш"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты для OBS</a>
<a href="site-settings.html" class="sb-i" aria-current="page" data-kw="сайт подписчики видео значок галочка модератор"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Мой сайт</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i" data-kw="розыгрыш приз участники победитель"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<a href="clips.html" class="sb-i" data-kw="нарезка клип момент видео"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 9-12 9z"/><path d="M3 3v18"/></svg>Нарезки</a>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i" data-kw="тариф оплата аккаунт email промокод"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
<a href="support.html" class="sb-i" data-kw="помощь вопрос обращение"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Поддержка</a>
</nav>
<main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div><h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Мой сайт</h1><p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: var(--n-10); max-width: 640px">Свой сайт для подписчиков: они предлагают видео, пишут в чат и получают значки. Ссылка: <a href="{{ siteUrl }}" target="_blank" rel="noopener" style="color: var(--n-12); text-decoration: underline">{{ siteUrlLabel }}</a></p></div>
<template data-if="blocked"><div role="status" style="min-width: 260px; flex: 0 1 320px; padding: 14px 16px; border-radius: 8px; border: 1px solid var(--n-6); box-sizing: border-box; font-size: 14px; color: var(--n-11)">Сайт заблокирован администрацией StreOps. Посетители его не видят. Напиши в поддержку, если это ошибка.</div></template>
</div>
<p role="status" style="margin: 0; font-size: 14px; color: var(--n-10); min-height: 20px">{{ info }}</p>

<section style="padding: 20px 22px; border-radius: 12px; border: 1px solid rgb(var(--n-13-rgb) / .10); background: rgb(var(--n-2-rgb) / .62); display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer"><span><span style="display: block; font-size: 16px; font-weight: 600">Сайт включён</span><span style="display: block; margin-top: 2px; font-size: 13px; color: var(--n-9)">Выключи — сайт перестанет открываться для всех, данные сохранятся</span></span><input type="checkbox" aria-label="Сайт включён" checked="{{ enabled }}" disabled="{{ blocked }}" onChange="{{ toggleEnabled }}" style="width: 20px; height: 20px; accent-color: var(--n-13)"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--n-11)">Название на сайте<input value="{{ title }}" onChange="{{ saveTitle }}" maxlength="80" placeholder="{{ streamerName }}" style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; background: var(--n-1); border: 1px solid var(--n-8); color: var(--n-12); font: 400 14px/20px var(--font-sans),sans-serif"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--n-11)">Статус (виден на сайте)<input value="{{ status }}" onChange="{{ saveStatus }}" maxlength="120" placeholder="Например: играю в ранкед до 23:00" style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; background: var(--n-1); border: 1px solid var(--n-8); color: var(--n-12); font: 400 14px/20px var(--font-sans),sans-serif"></label>
<div style="display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--n-4); padding-top: 14px">
<p style="margin: 0; font-size: 14px; font-weight: 600">Что показывать</p>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px"><input type="checkbox" checked="{{ chatOn }}" onChange="{{ toggleChat }}" style="accent-color: var(--n-13)"> Чат сайта</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px"><input type="checkbox" checked="{{ showFeed }}" onChange="{{ toggleFeed }}" style="accent-color: var(--n-13)"> Лента одобренных видео</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px"><input type="checkbox" checked="{{ showWatched }}" onChange="{{ toggleWatched }}" style="accent-color: var(--n-13)"> Раздел «Просмотренное» (видно только публичные записи)</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px"><input type="checkbox" checked="{{ showStatus }}" onChange="{{ toggleStatus }}" style="accent-color: var(--n-13)"> Показывать статус</label>
</div>
</section>

<section style="padding: 20px 22px; border-radius: 12px; border: 1px solid rgb(var(--n-13-rgb) / .10); background: rgb(var(--n-2-rgb) / .62); display: flex; flex-direction: column; gap: 14px">
<div><p style="margin: 0; font-size: 16px; font-weight: 600">Модераторы, галочки и цвета ников</p><p style="margin: 4px 0 0; font-size: 13px; color: var(--n-9)">Модератор одобряет видео и удаляет сообщения в чате сайта. Галочка и цвет ника видны всем в чате. Зритель должен хотя бы раз войти на StreOps.</p></div>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><input value="{{ newLogin }}" onChange="{{ setNewLogin }}" placeholder="ник на Twitch" style="flex: 1 1 200px; height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; background: var(--n-1); border: 1px solid var(--n-8); color: var(--n-12); font: 400 14px/20px var(--font-sans),sans-serif"><button type="button" onClick="{{ addMember }}" style="height: 40px; padding: 0 14px; border-radius: 6px; border: 0; background: var(--n-13); color: var(--n-1); font: 500 14px/20px var(--font-sans),sans-serif; cursor: pointer">Добавить</button></div>
<template data-if="noMembers"><p style="margin: 0; font-size: 14px; color: var(--n-9)">Пока никого. Добавь ник — и выдай модерацию, галочку или цвет.</p></template>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px"><template data-for="members" data-as="m"><li style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--n-5)"><span style="font-size: 15px; font-weight: 500; color: {{ m.colorValue }}">{{ m.name }} <span style="font-size: 12px; color: var(--n-9)">{{ m.tags }}</span></span><div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 13px; color: var(--n-11)"><label style="display: flex; gap: 6px; align-items: center"><input type="checkbox" checked="{{ m.mod }}" onChange="{{ m.toggleMod }}" style="accent-color: var(--n-13)"> модератор</label><label style="display: flex; gap: 6px; align-items: center"><input type="checkbox" checked="{{ m.verified }}" onChange="{{ m.toggleVerified }}" style="accent-color: var(--n-13)"> галочка</label><input aria-label="Значок (подпись)" value="{{ m.badge }}" onChange="{{ m.setBadge }}" maxlength="40" placeholder="значок, например Мастер нарезок" style="height: 30px; width: 200px; box-sizing: border-box; padding: 0 8px; border-radius: 6px; background: var(--n-1); border: 1px solid var(--n-8); color: var(--n-12); font: 400 13px/18px var(--font-sans),sans-serif"><select aria-label="Цвет ника" onChange="{{ m.setColor }}" style="height: 30px; padding: 0 6px; border-radius: 6px; background: var(--n-1); border: 1px solid var(--n-8); color: var(--n-12); font: 400 13px/18px var(--font-sans),sans-serif"><template data-for="m.colorOptions" data-as="o"><option value="{{ o.value }}" selected="{{ o.selected }}">{{ o.label }}</option></template></select><button type="button" onClick="{{ m.remove }}" style="height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--n-6); background: transparent; color: var(--n-12); font: 500 13px/18px var(--font-sans),sans-serif; cursor: pointer">Убрать</button></div></li></template></ul>
</section>

<section style="padding: 20px 22px; border-radius: 12px; border: 1px solid rgb(var(--n-13-rgb) / .10); background: rgb(var(--n-2-rgb) / .62); display: flex; flex-direction: column; gap: 14px">
<div><p style="margin: 0; font-size: 16px; font-weight: 600">Просмотренное</p><p style="margin: 4px 0 0; font-size: 13px; color: var(--n-9)">Здесь видно только тебе. Отметь «показать сайту» — и видео появится у всех на вкладке «Просмотренное» вместе с твоей заметкой.</p></div>
<div style="display: flex; flex-direction: column; gap: 8px"><input value="{{ wUrl }}" onChange="{{ setWUrl }}" placeholder="ссылка YouTube или Twitch" style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; background: var(--n-1); border: 1px solid var(--n-8); color: var(--n-12); font: 400 14px/20px var(--font-sans),sans-serif"><input value="{{ wTitle }}" onChange="{{ setWTitle }}" placeholder="название" style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; background: var(--n-1); border: 1px solid var(--n-8); color: var(--n-12); font: 400 14px/20px var(--font-sans),sans-serif"><textarea rows="2" onChange="{{ setWNote }}" placeholder="заметка: почему стоит посмотреть" style="padding: 10px 12px; border-radius: 6px; background: var(--n-1); border: 1px solid var(--n-8); color: var(--n-12); font: 400 14px/20px var(--font-sans),sans-serif; resize: vertical">{{ wNote }}</textarea><div><button type="button" onClick="{{ addWatch }}" style="height: 36px; padding: 0 14px; border-radius: 6px; border: 0; background: var(--n-13); color: var(--n-1); font: 500 14px/20px var(--font-sans),sans-serif; cursor: pointer">Добавить</button></div></div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px"><template data-for="watch" data-as="w"><li style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--n-5)"><div style="min-width: 0; flex: 1 1 240px"><p style="margin: 0; font-size: 15px; font-weight: 500; overflow-wrap: anywhere">{{ w.title }}</p><p style="margin: 4px 0 0; font-size: 13px; color: var(--n-9); overflow-wrap: anywhere">{{ w.note }}</p></div><div style="display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--n-11)"><label style="display: flex; gap: 6px; align-items: center"><input type="checkbox" checked="{{ w.public }}" onChange="{{ w.togglePublic }}" style="accent-color: var(--n-13)"> показать сайту</label><button type="button" onClick="{{ w.remove }}" style="height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--n-6); background: transparent; color: var(--n-12); font: 500 13px/18px var(--font-sans),sans-serif; cursor: pointer">Удалить</button></div></li></template></ul>
<template data-if="noWatch"><p style="margin: 0; font-size: 14px; color: var(--n-9)">Пока пусто.</p></template>
</section>

<section style="padding: 20px 22px; border-radius: 12px; border: 1px solid rgb(var(--n-13-rgb) / .10); background: rgb(var(--n-2-rgb) / .62); display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-size: 16px; font-weight: 600">Очередь видео от подписчиков</p>
<template data-if="noQueue"><p style="margin: 0; font-size: 14px; color: var(--n-9)">Очередь пуста.</p></template>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px"><template data-for="queue" data-as="q"><li style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--n-5)"><div style="min-width: 0; flex: 1 1 240px"><a href="{{ q.url }}" target="_blank" rel="noopener" style="font-size: 15px; font-weight: 500; overflow-wrap: anywhere">{{ q.title }}</a><p style="margin: 4px 0 0; font-size: 13px; color: var(--n-9)">от {{ q.by }} · {{ q.sectionLabel }}</p></div><div style="display: flex; gap: 8px"><button type="button" onClick="{{ q.approve }}" style="height: 32px; padding: 0 12px; border-radius: 6px; border: 0; background: var(--n-13); color: var(--n-1); font: 500 13px/18px var(--font-sans),sans-serif; cursor: pointer">Одобрить</button><button type="button" onClick="{{ q.reject }}" style="height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--n-6); background: transparent; color: var(--n-12); font: 500 13px/18px var(--font-sans),sans-serif; cursor: pointer">Отклонить</button></div></li></template></ul>
</section>

<section style="padding: 20px 22px; border-radius: 12px; border: 1px solid rgb(var(--n-13-rgb) / .10); background: rgb(var(--n-2-rgb) / .62); display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-size: 16px; font-weight: 600">Чат сайта</p>
<template data-if="noChat"><p style="margin: 0; font-size: 14px; color: var(--n-9)">Сообщений пока нет.</p></template>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px"><template data-for="chat" data-as="c"><li style="display: flex; gap: 10px; align-items: center; justify-content: space-between"><span style="min-width: 0; overflow-wrap: anywhere"><b style="color: {{ c.colorValue }}">{{ c.name }}</b>{{ c.tags }} <span style="color: var(--n-11)">{{ c.text }}</span></span><button type="button" onClick="{{ c.remove }}" style="flex: none; height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--n-6); background: transparent; color: var(--n-12); font: 500 12px/16px var(--font-sans),sans-serif; cursor: pointer">Удалить</button></li></template></ul>
</section>
</main>
</div>
</template>
<script src="assets/dc-lite.js?v=5f8ce08a"></script>
<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { d: null, loaded: false, info: '', newLogin: '', wUrl: '', wTitle: '', wNote: '', login: '' };
}
componentDidMount() {
this.load(false);
this.timer = setInterval(() => this.load(true), 8000);
}
componentWillUnmount() { clearInterval(this.timer); }
async load(quiet) {
try {
const d = await StreAPI.get('site.manage');
const me = this.state.login ? null : await StreAPI.me();
this.setState(Object.assign({ d, loaded: true }, me && me.user ? { login: me.user.login } : {}));
} catch (e) {
if (!quiet) StreAPI.toast(e.message, 'error');
this.setState({ loaded: true });
}
}
async call(route, body, ok) {
try {
await StreAPI.post(route, Object.assign({ c: this.state.login }, body));
if (ok) this.setState({ info: ok });
await this.load(true);
} catch (e) { StreAPI.toast(e.message, 'error'); }
}
saveSettings(patch) { return this.call('site.settings.save', patch, 'Сохранено'); }
memberAct(login, action, extra) { return this.call('site.members.save', Object.assign({ login, action }, extra || {}), null); }
renderVals() {
const s = this.state, d = s.d;
const set = (k) => (e) => this.saveSettings({ [k]: e.target.checked });
const settings = d ? d.settings : {};
const colorOpts = (cur) => (d ? d.colors : []).map((c) => ({ value: c, label: c, selected: c === cur }));
const tags = (x) => [x.mod ? 'модератор' : '', x.verified ? 'галочка' : ''].filter(Boolean).join(' · ');
const members = d ? d.members.map((m) => ({
name: m.name, tags: tags(m), mod: !!m.mod, verified: !!m.verified, colorValue: m.color || 'var(--n-12)',
colorOptions: colorOpts(m.color),
badge: m.badge || '',
setBadge: (e) => this.call('site.badge', { login: m.login, label: e.target.value.trim() }, 'Значок сохранён'),
toggleMod: (e) => this.memberAct(m.login, 'mod', { value: e.target.checked }),
toggleVerified: (e) => this.memberAct(m.login, 'verified', { value: e.target.checked }),
setColor: (e) => this.memberAct(m.login, 'color', { color: e.target.value }),
remove: () => this.memberAct(m.login, 'remove'),
})) : [];
const watch = d ? d.watch.map((w) => ({
id: w.id, title: w.title, note: w.note, public: !!w.public,
togglePublic: (e) => this.call('site.watch.save', { id: w.id, url: w.url, title: w.title, note: w.note, public: e.target.checked }, null),
remove: () => this.call('site.watch.delete', { id: w.id }, null),
})) : [];
const queue = d ? d.queue.map((q) => ({
url: q.url, title: q.title, by: q.by, sectionLabel: q.section === 'stream' ? 'Стрим' : 'Не стрим',
approve: () => this.call('site.review', { id: q.id, action: 'approve' }, null),
reject: () => this.call('site.review', { id: q.id, action: 'reject' }, null),
})) : [];
const chat = d ? d.chat.map((c) => ({
name: c.name, text: c.text, colorValue: c.color || 'var(--n-12)',
tags: c.verified ? ' ✓' : '',
remove: () => this.call('site.chat.delete', { id: c.id }, null),
})) : [];
const siteUrl = d ? d.url : '#';
return {
siteUrl, siteUrlLabel: 'streops.ru/' + siteUrl,
blocked: !!(d && d.blocked),
info: s.info,
enabled: !!settings.enabled,
toggleEnabled: (e) => this.saveSettings({ enabled: e.target.checked }),
title: settings.title || '',
saveTitle: (e) => this.saveSettings({ title: e.target.value.trim() }),
streamerName: s.login,
status: settings.status || '',
saveStatus: (e) => this.saveSettings({ status: e.target.value.trim() }),
chatOn: !!settings.chatOn, toggleChat: set('chatOn'),
showFeed: !!settings.showFeed, toggleFeed: set('showFeed'),
showWatched: !!settings.showWatched, toggleWatched: set('showWatched'),
showStatus: !!settings.showStatus, toggleStatus: set('showStatus'),
newLogin: s.newLogin, setNewLogin: (e) => this.setState({ newLogin: e.target.value.trim() }),
addMember: () => s.newLogin ? this.memberAct(s.newLogin, 'mod', { value: false }).then(() => this.setState({ newLogin: '' })) : StreAPI.toast('Укажи ник', 'error'),
members, noMembers: !!d && !members.length,
wUrl: s.wUrl, setWUrl: (e) => this.setState({ wUrl: e.target.value.trim() }),
wTitle: s.wTitle, setWTitle: (e) => this.setState({ wTitle: e.target.value }),
wNote: s.wNote, setWNote: (e) => this.setState({ wNote: e.target.value }),
addWatch: () => { if (!s.wUrl) return StreAPI.toast('Вставь ссылку', 'error'); this.call('site.watch.save', { url: s.wUrl, title: s.wTitle, note: s.wNote, public: false }, 'Добавлено, видно только тебе').then(() => this.setState({ wUrl: '', wTitle: '', wNote: '' })); },
watch, noWatch: !!d && !watch.length,
queue, noQueue: !!d && !queue.length,
chat, noChat: !!d && !chat.length,
};
}
}
DCMount(Component);
</script>
</body>
</html>
