<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — поддержка</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js?v=460ce522"></script>
<script src="assets/api.js?v=c464f264"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
[hidden]{display:none!important}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.card{display:flex;flex-direction:column;gap:12px;min-width:0;padding:20px 22px;border-radius:12px;background:rgb(var(--n-2-rgb) / .62);border:1px solid rgb(var(--n-13-rgb) / .10);box-shadow:inset 0 1px 0 rgb(var(--n-13-rgb) / .06)}
.h2{margin:0;font-size:18px;line-height:24px;font-weight:600}
.hint{margin:0;font-size:13px;line-height:18px;color:var(--n-9)}
.lab{font-size:13px;line-height:18px;font-weight:500;color:var(--n-11)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.inp{box-sizing:border-box;height:38px;padding:0 12px;border-radius:6px;background:var(--s-3);border:1px solid var(--n-8);color:var(--n-12);font:400 14px/20px var(--font-sans),sans-serif;width:100%;min-width:0}
.inp:hover{border-color:var(--n-9)}
.btn{height:40px;padding:0 16px;border-radius:6px;border:0;background:var(--n-13);color:var(--n-1);font:500 14px/20px var(--font-sans),sans-serif;cursor:pointer;flex:none}
.btn:disabled{opacity:.5;cursor:default}
.btn-s{height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);font:500 14px/20px var(--font-sans),sans-serif;cursor:pointer;flex:none}
.btn-s:hover{border-color:var(--n-9)}
.btn-s:disabled{opacity:.5;cursor:default}
.note{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:8px;border:1px solid var(--n-6);background:var(--s-3)}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:20px 16px;border-radius:8px;border:1px dashed var(--n-5)}
.faq{display:flex;flex-direction:column;min-width:0;border-top:1px solid var(--n-4)}
.faq-q{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:48px;padding:12px 0;border:0;background:transparent;color:var(--n-12);font:500 15px/22px var(--font-sans),sans-serif;text-align:left;cursor:pointer}
.faq-q:hover{color: var(--accent-on)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--n-12);outline-offset:2px}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none;white-space:nowrap;overflow:hidden}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
.sb-search{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;margin:0 0 8px;border:1px solid var(--n-6);border-radius:8px;background:rgb(var(--n-13-rgb) / .03);color:var(--n-9)}
.sb-search:focus-within{border-color:var(--n-12)}
.sb-search input{flex:1;min-width:0;min-width:0;border:0;outline:0;background:transparent;color:var(--n-12);font:400 14px/20px 'Onest',sans-serif;padding:0}
.sb-search input::placeholder{color:var(--n-9)}
.sb-search input::-webkit-search-cancel-button{display:none}
.sb-search kbd{font:400 10px/1 'JetBrains Mono',monospace;margin-left:auto;color:var(--n-9);border:1px solid var(--n-6);border-radius:4px;padding:2px 5px;white-space:nowrap}
.sb-empty{margin:8px 12px;font-size:13px;color:var(--n-9)}
.sb-hide{display:none!important}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var nav = document.querySelector('nav.sb'), box = nav && nav.querySelector('[data-sb-search]');
  if (!box) return;
  var empty = nav.querySelector('[data-sb-empty]');
  function apply() {
    var q = box.value.trim().toLowerCase(), any = false, group = null, groupHit = false;
    var rows = Array.prototype.slice.call(nav.children).filter(function (el) { return el.matches('a.sb-i, span.sb-i, p.sb-h, div.sb-sep'); });
    rows.forEach(function (el) {
      if (el.matches('p.sb-h')) { if (group) group.classList.toggle('sb-hide', !groupHit && !!q); group = el; groupHit = false; el.classList.remove('sb-hide'); return; }
      if (el.matches('div.sb-sep')) { el.classList.toggle('sb-hide', !!q); return; }
      var hit = !q || (el.textContent + ' ' + (el.getAttribute('data-kw') || '')).toLowerCase().indexOf(q) !== -1;
      el.classList.toggle('sb-hide', !hit);
      if (hit) { groupHit = true; any = true; }
    });
    if (group) group.classList.toggle('sb-hide', !!q && !groupHit);
    if (empty) empty.hidden = any || !q;
  }
  box.addEventListener('input', apply);
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var first = nav.querySelector('a.sb-i:not(.sb-hide)'); if (first) location.href = first.getAttribute('href'); }
    if (e.key === 'Escape') { box.value = ''; apply(); box.blur(); }
  });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); box.focus(); box.select(); }
  });
});
</script>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<a href="settings.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; border-radius: 6px; font-size: 14px; font-weight: 500" aria-label="Профиль" data-dc-keep data-stre-user><span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, var(--n-10), var(--n-6)); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--n-1)" data-av></span><span data-name>Профиль</span><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" class="sb" data-dc-keep>
<label class="sb-search"><svg class="sb-ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" data-sb-search placeholder="Поиск" aria-label="Найти раздел" autocomplete="off"><kbd>Ctrl K</kbd></label><p class="sb-empty" data-sb-empty hidden>Такого раздела нет</p>
<p class="sb-h">Сегодня</p>
<a href="panel.html" class="sb-i" data-kw="главная статистика эфир статус"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Старт</a>
<p class="sb-h">Чат</p>
<a href="moderation.html" class="sb-i" data-kw="фильтр чат удалить бан таймаут проверка"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<a href="mods.html" class="sb-i" data-kw="мод модераторы помощник права журнал"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Помощники</a>
<a href="commands.html" class="sb-i" data-kw="команда ответ чат кулдаун"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды</a>
<a href="timers.html" class="sb-i" data-kw="таймер сообщение напоминание"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6M12 2v3"/></svg>Таймеры</a>
<p class="sb-h">Музыка</p>
<a href="music.html" class="sb-i" data-kw="музыка трек плеер заказ очередь песня"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Очередь и заказы</a>
<a href="manage.html" class="sb-i" data-kw="помощник канал трек музыка добавить"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Управлять каналом</a>
<p class="sb-h">Эфир и сайт</p>
<a href="widgets.html" class="sb-i" data-kw="виджет obs браузер ссылка чат розыгрыш"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты для OBS</a>
<a href="site-settings.html" class="sb-i" data-kw="сайт подписчики видео значок галочка модератор"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Мой сайт</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i" data-kw="розыгрыш приз участники победитель"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<a href="clips.html" class="sb-i" data-kw="нарезка клип момент видео"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 9-12 9z"/><path d="M3 3v18"/></svg>Нарезки</a>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i" data-kw="тариф оплата аккаунт email промокод"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
<a href="support.html" class="sb-i" aria-current="page" data-kw="помощь вопрос обращение"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Поддержка</a>
</nav>
<div style="flex: 999 1 640px; min-width: 0">
<nav aria-label="Хлебные крошки"><ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px"><li><a href="panel.html" style="color: var(--n-9)">Стрим-панель</a></li><li aria-hidden="true" style="color: var(--n-7)">/</li><li><a href="panel.html" style="color: var(--n-9)">Обзор</a></li><li aria-hidden="true" style="color: var(--n-7)">/</li><li aria-current="page" style="color: var(--n-12)">Поддержка</li></ol></nav>

<div style="margin-top: 16px">
<h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Поддержка</h1>
<p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: var(--n-10)">Сначала загляни в частые вопросы: часто ответ там уже есть. Если нет, напиши в чат ниже. Ответ придёт в этот же чат.</p>
</div>

<section class="card" aria-labelledby="sp-faq" style="margin-top: 24px">
<h2 id="sp-faq" class="h2">Частые вопросы</h2>
<p class="hint">Нажми на вопрос, чтобы увидеть ответ.</p>
<template data-for="faq" data-as="f"><div class="faq">
<button type="button" class="faq-q" aria-expanded="{{ f.exp }}" aria-controls="{{ f.id }}" onClick="{{ f.toggle }}"><span>{{ f.q }}</span><span aria-hidden="true" class="mono" style="font-size: 18px; line-height: 20px; color: var(--n-9)">{{ f.mark }}</span></button>
<div id="{{ f.id }}" hidden="{{ f.closed }}" style="padding: 0 0 16px; font-size: 14px; line-height: 22px; color: var(--n-10); white-space: pre-line">{{ f.a }}</div>
</div></template>
</section>

<div style="margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start">

<section class="card" aria-labelledby="sp-chat" style="min-height: 460px">
<h2 id="sp-chat" class="h2">Написать в поддержку</h2>
<p class="hint">Ответим здесь, в этом чате. Точный срок ответа пока не обещаем.</p>

<template data-if="histLoading"><p role="status" style="margin: 0; font-size: 14px; line-height: 20px; color: var(--n-10)">Загружаем переписку…</p></template>

<template data-if="hasHistErr"><div role="alert" class="note"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Не получилось загрузить переписку</p><p style="margin: 0; font-size: 13px; line-height: 18px; color: var(--n-10)">{{ histErr }}</p><div><button type="button" class="btn-s" onClick="{{ retryLoad }}">Повторить</button></div></div></template>

<template data-if="histEmpty"><div class="empty"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Обращений пока нет</p><p class="hint" style="line-height: 19px">Опиши, что случилось: что делал, чего ждал и что увидел. Ответы поддержки появятся здесь.</p></div></template>

<div role="log" aria-live="polite" aria-label="Сообщения" style="display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; padding-right: 4px">
<template data-for="msgs" data-as="m"><div style="max-width: 78%; padding: 10px 12px; border-radius: 10px; font-size: 14px; line-height: 20px; white-space: pre-wrap; overflow-wrap: anywhere; {{ m.style }}"><span style="display: block; margin-bottom: 2px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; opacity: .7">{{ m.who }} · {{ m.time }}</span>{{ m.text }}</div></template>
</div>

<template data-if="hasPollErr"><div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap"><span class="hint">Не удалось обновить переписку. {{ pollErr }}</span><button type="button" class="btn-s" onClick="{{ retryLoad }}" style="height: 32px; padding: 0 10px; font-size: 13px">Повторить</button></div></template>

<form onSubmit="{{ send }}" style="display: flex; flex-direction: column; gap: 10px">
<div class="fld">
<label class="lab" for="sp-topic">Тема (необязательно)</label>
<select id="sp-topic" class="inp" value="{{ topic }}" onChange="{{ setTopic }}"><option value="">Выбери тему</option><option value="Настройка бота">Настройка бота</option><option value="Музыка и заказы">Музыка и заказы</option><option value="Оплата и тариф">Оплата и тариф</option><option value="Ошибка в панели">Ошибка в панели</option><option value="Другое">Другое</option></select>
</div>
<div class="fld">
<label class="lab" for="sp-in">Сообщение</label>
<textarea id="sp-in" rows="3" maxlength="900" value="{{ text }}" onChange="{{ setText }}" placeholder="Что случилось: что делал, чего ждал и что увидел" style="box-sizing: border-box; padding: 10px 12px; border-radius: 6px; background: var(--s-3); border: 1px solid var(--n-8); color: var(--n-12); font: 400 14px/20px var(--font-sans), sans-serif; resize: vertical; width: 100%"></textarea>
<p class="hint">Не присылай пароли и ключи: токен канала и ключ OBS.</p>
</div>
<div><button type="submit" class="btn" disabled="{{ sendOff }}">{{ sendLabel }}</button></div>
</form>

<template data-if="hasSendErr"><div role="alert" class="note"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Сообщение не отправлено</p><p style="margin: 0; font-size: 13px; line-height: 18px; color: var(--n-10)">{{ sendErr }}. Текст сохранён, его можно отправить снова.</p><div><button type="button" class="btn-s" onClick="{{ retrySend }}" disabled="{{ sending }}">Повторить</button></div></div></template>
</section>

<section class="card" aria-labelledby="sp-code">
<h2 id="sp-code" class="h2">Код для администратора</h2>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--n-10)">Нужен, если сам не можешь разобраться и доверяешь администратору StreOps. По коду администратор войдёт в твой аккаунт и поможет на месте.</p>
<ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 19px; color: var(--n-10)">
<li><span style="color: var(--n-12)">Что он получит:</span> доступ как у тебя. Администратор увидит и сможет поменять настройки, команды, тариф и подключения.</li>
<li><span style="color: var(--n-12)">Срок:</span> код действует 1 час и работает один раз. После входа доступ по таймеру не закрывается: завершить его может только администратор, когда закончит.</li>
<li><span style="color: var(--n-12)">Контроль:</span> все входы администратора записываются.</li>
<li><span style="color: var(--n-12)">Не работает?</span> Значит, код истёк или уже был использован. Создай новый.</li>
</ul>

<template data-if="hasCode"><div style="padding: 14px 16px; border-radius: 8px; border: 1px dashed var(--n-6); display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--n-9)">Код для администратора</span>
<span class="mono" style="font-size: 26px; line-height: 30px; letter-spacing: .14em; color: var(--n-12)">{{ code }}</span>
<span style="font-size: 13px; line-height: 18px; color: var(--n-10)">{{ codeUntilLabel }}. Передай его администратору StreOps и не публикуй в чате.</span>
</div></template>

<template data-if="hasCodeErr"><div role="alert" class="note"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Код не создан</p><p style="margin: 0; font-size: 13px; line-height: 18px; color: var(--n-10)">{{ codeErr }}</p><div><button type="button" class="btn-s" onClick="{{ makeCode }}" disabled="{{ making }}">Повторить</button></div></div></template>

<div><button type="button" class="btn-s" onClick="{{ makeCode }}" disabled="{{ making }}">{{ codeLabel }}</button></div>
</section>
</div>
</div>
</div>
</div>
</template>
<script src="assets/dc-lite.js?v=5f8ce08a"></script>
<script>
// Частые вопросы: ответы по текущему поведению сервиса
const FAQ = [
  {
    q: 'Как подключить бота к каналу?',
    a: 'Открой «Стрим-панель» → «Обзор» и нажми «Подключить бота». Бот станет модератором твоего канала и напишет в чат, что подключён.\nЕсли кнопка неактивна и подписана «Ждём администратора», бот ещё не настроен на сервисе. Напиши в поддержку ниже: там подскажут, что делать.',
  },
  {
    q: 'Почему не играет музыка?',
    a: 'Проверь по порядку:\n1. Музыка доступна с тарифа «Про». На «Бесплатном» и «Продвинутой» музыки нет, команда в чате молчит.\n2. Треки играют там, где открыт плеер: во вкладке «Музыка и заказы» в панели или в OBS по ссылке из блока «Плеер для OBS». Закрыл вкладку, и музыка остановилась.\n3. На странице включён «Приём заказов» и включена команда заказа.\n4. Если трек ждёт, включена ручная проверка: одобри его в очереди.\n5. Если пишет «Плеер YouTube не загрузился», проверь интернет и отключи блокировщик рекламы для этой страницы.',
  },
  {
    q: 'Как работает тариф и оплата?',
    a: 'Оплата проходит на странице ЮKassa: картой или через СБП, что доступно в форме. Тариф включается, как только оплата подтверждена, и действует 30 дней.\nАвтосписаний нет. Когда срок закончится, аккаунт вернётся на бесплатный тариф, а команды и настройки сохранятся.\nПредоплаты нет: каждый тариф оплачивается отдельно, когда он нужен.',
  },
  {
    q: 'Как удалить аккаунт?',
    a: 'Нажми свой ник в правом верхнем углу, найди блок «Опасная зона» и нажми «Удалить аккаунт». Подтверди, введя свой ник.\nУдалятся команды, настройки, история чата, розыгрыши, очередь музыки и сам аккаунт. Бот отключится от канала. Отменить удаление нельзя.\nЗаписи об оплатах останутся: это история платежей.',
  },
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      faqOpen: -1,
      items: [], loaded: false, histBusy: false, histErr: '', pollErr: '',
      text: '', topic: '', sending: false, sendErr: '',
      code: '', codeUntil: 0, making: false, codeErr: '',
    };
  }
  componentDidMount() {
    this.load(false);
    this.timer = setInterval(() => this.load(true), 5000);
  }
  componentWillUnmount() { clearInterval(this.timer); }

  // Переписка: первая загрузка и «Повторить» показывают состояние загрузки. Фоновое обновление тихое.
  async load(quiet) {
    if (!quiet) this.setState({ histBusy: true });
    try {
      const r = await StreAPI.get('support.list');
      const changed = JSON.stringify(r.items) !== JSON.stringify(this.state.items);
      this.setState({ histBusy: false, loaded: true, histErr: '', pollErr: '', items: changed ? r.items : this.state.items });
    } catch (e) {
      // если переписка уже видна, ошибка фонового обновления не должна выглядеть как пустой список
      if (this.state.loaded) this.setState({ histBusy: false, pollErr: e.message || 'Нет связи с сервером.' });
      else this.setState({ histBusy: false, histErr: e.message || 'Нет связи с сервером.' });
    }
  }

  toggleFaq(i) {
    this.setState({ faqOpen: this.state.faqOpen === i ? -1 : i });
  }

  async send(e) {
    if (e && e.preventDefault) e.preventDefault();
    const raw = this.state.text.trim();
    if (!raw || this.state.sending) return;
    // тема уходит первой строкой текста: отдельного поля в API нет
    const text = (this.state.topic ? 'Тема: ' + this.state.topic + '\n' : '') + raw;
    this.setState({ sending: true, sendErr: '' });
    try {
      const r = await StreAPI.post('support.send', { text });
      this.setState({ items: r.items, loaded: true, histErr: '', text: '', topic: '', sending: false });
    } catch (err) {
      // текст не очищаем: его можно отправить снова кнопкой «Повторить»
      this.setState({ sending: false, sendErr: err.message || 'Нет связи с сервером.' });
    }
  }

  async makeCode() {
    this.setState({ making: true, codeErr: '' });
    try {
      const r = await StreAPI.post('account.supportCode');
      this.setState({ code: r.code, codeUntil: r.until, making: false });
      StreAPI.toast('Код создан. Передай его администратору.');
    } catch (e) {
      this.setState({ making: false, codeErr: e.message || 'Нет связи с сервером.' });
    }
  }

  renderVals() {
    const s = this.state;
    const time = (ts) => new Date(ts * 1000).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    const msgs = s.items.map((m) => {
      const admin = m.from === 'admin';
      return {
        who: admin ? 'Поддержка' : 'Вы',
        time: time(m.at),
        text: m.text,
        style: admin ? 'background: var(--n-4); border: 1px solid var(--n-5); color: var(--n-12); align-self: flex-start' : 'background: var(--n-12); color: var(--n-1); align-self: flex-end; margin-left: auto',
      };
    });
    const until = s.codeUntil ? new Date(s.codeUntil * 1000).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
    return {
      faq: FAQ.map((f, i) => {
        const open = s.faqOpen === i;
        return { id: 'sp-faq-' + i, q: f.q, a: f.a, exp: open ? 'true' : 'false', closed: !open, mark: open ? '−' : '+', toggle: () => this.toggleFaq(i) };
      }),
      histLoading: s.histBusy && !s.loaded,
      hasHistErr: !s.loaded && !s.histBusy && !!s.histErr,
      histErr: s.histErr,
      retryLoad: () => this.load(false),
      hasPollErr: s.loaded && !!s.pollErr,
      pollErr: s.pollErr,
      histEmpty: s.loaded && !msgs.length && !s.histErr,
      msgs,
      text: s.text, setText: (e) => this.setState({ text: e.target.value }),
      topic: s.topic, setTopic: (e) => this.setState({ topic: e.target.value }),
      send: (e) => this.send(e),
      retrySend: () => this.send(),
      sending: !!s.sending,
      sendOff: !!s.sending || !s.text.trim(),
      sendLabel: s.sending ? 'Отправляем…' : 'Отправить',
      hasSendErr: !!s.sendErr, sendErr: s.sendErr,
      hasCode: !!s.code, code: s.code, codeUntilLabel: 'Действует до ' + until,
      makeCode: () => this.makeCode(),
      making: !!s.making,
      codeLabel: s.making ? 'Создаём…' : (s.code ? 'Создать новый код' : 'Создать код для администратора'),
      hasCodeErr: !!s.codeErr, codeErr: s.codeErr,
    };
  }
}
DCMount(Component);
</script>
</body>
</html>
