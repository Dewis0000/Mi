<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — поддержка</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js?v=460ce522"></script>
<script src="assets/api.js?v=c464f264"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ov{font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9);margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tab{height:44px;padding:0;border:0;background:transparent;color:var(--n-9);font:500 14px/20px var(--font-sans),sans-serif;display:flex;gap:6px;align-items:center;cursor:pointer}
.tab:hover{color:var(--n-12)}
.cmd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 20px;border-radius:8px;border:1px solid var(--n-5);background:var(--s-2)}
.cmd:hover{border-color:var(--n-6)}
.sw{position:relative;width:40px;height:24px;border-radius:999px;border:1px solid var(--n-8);background:transparent;cursor:pointer;flex:none;padding:0}
.sw span{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:var(--n-9);transition:transform 180ms cubic-bezier(.2,0,0,1)}
.sw[aria-checked="true"]{background:var(--n-13);border-color:var(--n-13)}
.sw[aria-checked="true"] span{transform:translateX(16px);background:var(--n-1)}
.ib{width:36px;height:36px;border-radius:6px;border:0;background:transparent;color:var(--n-10);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ib:hover{background:rgb(var(--n-13-rgb) / .06);color:var(--n-12)}
.fl{display:flex;flex-direction:column;gap:8px}
.fl > label,.lab{font-size:13px;line-height:18px;font-weight:500;color:var(--n-11)}
.inp{height:40px;box-sizing:border-box;padding:0 12px;border-radius:6px;background:var(--s-3);border:1px solid var(--n-8);color:var(--n-12);font:400 15px/22px var(--font-sans),sans-serif;width:100%}
.inp:hover{border-color:var(--n-9)}
.hint{font-size:12px;line-height:16px;color:var(--n-9);margin:0}
.seg{height:36px;padding:0 14px;border:0;border-radius:4px;background:transparent;color:var(--n-10);font:500 14px/20px var(--font-sans),sans-serif;cursor:pointer}
.seg:hover{color:var(--n-12)}
.tag{height:28px;padding:0 10px;border-radius:4px;border:1px solid var(--n-6);background:transparent;color:var(--n-11);font:400 12px/16px 'JetBrains Mono',monospace;cursor:pointer}
.tag:hover{border-color:var(--n-9);background:rgb(var(--n-13-rgb) / .04)}
.rad{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-11);cursor:pointer;border:0;background:transparent;width:100%;text-align:left;font-family:var(--font-sans),sans-serif}
.rad:hover{background:rgb(var(--n-13-rgb) / .04)}
.dot{width:18px;height:18px;border-radius:999px;border:1px solid var(--n-8);box-sizing:border-box;flex:none;display:inline-flex;align-items:center;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;border-radius:4px;background:var(--n-4);border:1px solid var(--n-6);font-size:13px}
.chip button{width:20px;height:20px;border:0;border-radius:3px;background:transparent;color:var(--n-9);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.chip button:hover{color:var(--n-12);background:rgb(var(--n-13-rgb) / .08)}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<a href="settings.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; border-radius: 6px; font-size: 14px; font-weight: 500" aria-label="Профиль" data-dc-keep data-stre-user><span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, var(--n-10), var(--n-6)); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--n-1)" data-av></span><span data-name>Профиль</span><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" class="sb" data-dc-keep>
<p class="sb-h">Эфир</p>
<a href="panel.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Обзор</a>
<a href="moderation.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<a href="mods.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Мои модераторы</a>
<p class="sb-h">Бот</p>
<a href="commands.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды</a>
<a href="timers.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6M12 2v3"/></svg>Таймеры</a>
<a href="music.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Музыка</a>
<a href="manage.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Управлять каналом</a>
<a href="widgets.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<a href="clips.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 9-12 9z"/><path d="M3 3v18"/></svg>Нарезки</a>
<span class="sb-i sb-off" aria-disabled="true"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 13l-7.5 7.5a2.1 2.1 0 0 1-3-3L11 10M16 16l6-6M8 8l6-6M9 7l8 8M21 11l-8-8"/></svg>Аукционы<span class="sb-tag">скоро</span></span>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
<a href="support.html" class="sb-i" aria-current="page"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Поддержка</a>
</nav>
<div style="flex: 999 1 640px; min-width: 0">
<nav aria-label="Хлебные крошки"><ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px"><li><a href="panel.html" style="color: var(--n-9)">Стрим-панель</a></li><li aria-hidden="true" style="color: var(--n-7)">/</li><li><a href="#" style="color: var(--n-9)">Чат-бот</a></li><li aria-hidden="true" style="color: var(--n-7)">/</li><li aria-current="page" style="color: var(--n-12)">Поддержка</li></ol></nav>
<div style="margin-top: 16px">
<h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Поддержка</h1>
<p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: var(--n-10)">Напиши, что нужно: вопросы по настройке, ошибки, оплата. Ответ придёт сюда же, в этот чат.</p>
</div>
<div style="margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start">

<section aria-labelledby="sc-chat" style="display: flex; flex-direction: column; gap: 12px; padding: 20px 22px; border-radius: 12px; background: rgb(var(--n-2-rgb) / 0.72); border: 1px solid rgb(var(--n-13-rgb) / 0.10); box-shadow: inset 0 1px 0 rgb(var(--n-13-rgb) / 0.06); min-height: 420px">
<h2 id="sc-chat" style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">Чат с поддержкой</h2>
<div role="log" aria-live="polite" aria-label="Сообщения" style="display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 240px; max-height: 480px; overflow-y: auto; padding-right: 4px">
<template data-if="empty"><p style="margin: auto; padding: 24px; text-align: center; font-size: 14px; line-height: 20px; color: var(--n-9)">Сообщений пока нет. Опиши проблему — администратор ответит здесь.</p></template>
<template data-for="msgs" data-as="m"><div style="max-width: 78%; padding: 10px 12px; border-radius: 10px; font-size: 14px; line-height: 20px; white-space: pre-wrap; overflow-wrap: anywhere; {{ m.style }}"><span style="display: block; margin-bottom: 2px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; opacity: .7">{{ m.who }} · {{ m.time }}</span>{{ m.text }}</div></template>
</div>
<form onSubmit="{{ send }}" style="display: flex; gap: 8px; align-items: flex-end">
<label for="sc-in" class="vh" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Сообщение в поддержку</label>
<textarea id="sc-in" rows="2" maxlength="1000" value="{{ text }}" onChange="{{ setText }}" placeholder="Напиши сообщение" style="flex: 1; box-sizing: border-box; padding: 10px 12px; border-radius: 6px; background: var(--s-3); border: 1px solid var(--n-8); color: var(--n-12); font: 400 14px/20px var(--font-sans), sans-serif; resize: vertical"></textarea>
<button type="submit" disabled="{{ sending }}" style="height: 40px; padding: 0 16px; border-radius: 6px; border: 0; background: var(--n-13); color: var(--n-1); font: 500 14px/20px var(--font-sans), sans-serif; cursor: pointer; flex: none">{{ sendLabel }}</button>
</form>
<template data-if="hasErr"><p role="alert" style="margin: 0; padding: 10px 12px; border: 2px solid var(--n-12); border-radius: 6px; font-size: 13px; line-height: 18px">{{ err }}</p></template>
</section>

<section aria-labelledby="sc-code" style="display: flex; flex-direction: column; gap: 12px; padding: 20px 22px; border-radius: 12px; background: rgb(var(--n-2-rgb) / 0.72); border: 1px solid rgb(var(--n-13-rgb) / 0.10); box-shadow: inset 0 1px 0 rgb(var(--n-13-rgb) / 0.06)">
<h2 id="sc-code" style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">Помощь с настройкой</h2>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--n-10)">Если хочешь, чтобы администратор сам настроил канал, создай код. Он действует один час и работает один раз. Все входы записываются, а доступ закрывается сам по истечении часа.</p>
<template data-if="hasCode"><div style="padding: 14px 16px; border-radius: 8px; border: 1px dashed var(--n-6); display: flex; flex-direction: column; gap: 6px"><span style="font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--n-9)">Код поддержки</span><span class="mono" style="font-size: 26px; line-height: 30px; letter-spacing: .14em; color: var(--n-12)">{{ code }}</span><span style="font-size: 13px; color: var(--n-10)">{{ codeUntilLabel }}. Передай его администратору StreOps.</span></div></template>
<div><button type="button" onClick="{{ makeCode }}" style="height: 40px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--n-6); background: transparent; color: var(--n-12); font: 500 14px/20px var(--font-sans), sans-serif; cursor: pointer">{{ codeLabel }}</button></div>
</section>
</div>
</div>
</div>
</div>
</template>
<script src="assets/dc-lite.js?v=5f8ce08a"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { items: [], loaded: false, text: '', sending: false, err: '', code: '', codeUntil: 0, making: false };
  }
  componentDidMount() {
    this.load(false);
    this.timer = setInterval(() => this.load(true), 5000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  async load(quiet) {
    try {
      const r = await StreAPI.get('support.list');
      if (JSON.stringify(r.items) !== JSON.stringify(this.state.items)) this.setState({ items: r.items, loaded: true });
      else if (!this.state.loaded) this.setState({ loaded: true });
    } catch (e) { if (!quiet) StreAPI.toast(e.message, 'error'); this.setState({ loaded: true }); }
  }
  async send(e) {
    if (e && e.preventDefault) e.preventDefault();
    const t = this.state.text.trim();
    if (!t || this.state.sending) return;
    this.setState({ sending: true, err: '' });
    try {
      const r = await StreAPI.post('support.send', { text: t });
      this.setState({ items: r.items, text: '', sending: false });
    } catch (err) { this.setState({ sending: false, err: err.message }); }
  }
  async makeCode() {
    this.setState({ making: true, err: '' });
    try {
      const r = await StreAPI.post('account.supportCode');
      this.setState({ code: r.code, codeUntil: r.until, making: false });
      StreAPI.toast('Код создан. Передай его администратору.');
    } catch (e) { this.setState({ making: false, err: e.message }); }
  }
  renderVals() {
    const s = this.state;
    const time = (ts) => new Date(ts * 1000).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    const msgs = s.items.map((m) => {
      const admin = m.from === 'admin';
      return {
        who: admin ? 'Поддержка' : 'Вы',
        time: time(m.at),
        text: m.text,
        style: admin ? 'background: var(--n-4); border: 1px solid var(--n-5); color: var(--n-12); align-self: flex-start' : 'background: var(--n-12); color: var(--n-1); align-self: flex-end; margin-left: auto',
      };
    });
    const until = s.codeUntil ? new Date(s.codeUntil * 1000).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
    return {
      msgs, empty: s.loaded && !msgs.length,
      text: s.text, setText: (e) => this.setState({ text: e.target.value }),
      send: (e) => this.send(e), sending: !!s.sending,
      sendLabel: s.sending ? 'Отправка…' : 'Отправить',
      hasErr: !!s.err, err: s.err,
      hasCode: !!s.code, code: s.code, codeUntilLabel: 'Действует до ' + until,
      makeCode: () => this.makeCode(),
      codeLabel: s.making ? 'Создаём…' : (s.code ? 'Создать новый код' : 'Создать код на 1 час'),
    };
  }
}
DCMount(Component);
</script>
</body>
</html>
