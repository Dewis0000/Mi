<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — настройки</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js?v=460ce522"></script>
<script src="assets/api.js?v=47744cb2"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
html{scroll-padding-top:88px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
:focus-visible{outline:2px solid var(--n-12);outline-offset:2px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ov{font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9);margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10)}
.nav-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.nav-i[aria-current]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.nav-i.dz{color:var(--accent-text)}
.nav-i.dz[aria-current]{box-shadow:inset 2px 0 0 var(--accent-text)}
.snav{flex:1 1 200px;max-width:240px;display:flex;flex-direction:column;gap:2px;position:sticky;top:88px;align-self:flex-start}
.sec{padding:28px;border-radius:8px;border:1px solid var(--n-5);background:var(--s-2);scroll-margin-top:88px}
.sec h2{margin:0;font-size:20px;line-height:26px;font-weight:600;letter-spacing:-.01em}
.sub{margin:6px 0 0;font-size:14px;line-height:20px;color:var(--n-9)}
.fl{display:flex;flex-direction:column;gap:8px}
.fl label,.lab{font-size:13px;line-height:18px;font-weight:500;color:var(--n-11)}
.inp{height:40px;box-sizing:border-box;padding:0 12px;border-radius:6px;background:var(--s-3);border:1px solid var(--n-8);color:var(--n-12);font:400 15px/22px var(--font-sans),sans-serif;width:100%}
.inp:hover{border-color:var(--n-9)}
.inp[readonly]{background:transparent;border-color:var(--n-5);color:var(--n-11)}
.inp[readonly]:hover{border-color:var(--n-6)}
.hint{font-size:12px;line-height:16px;color:var(--n-9);margin:0}
.hint a{text-decoration:underline;text-underline-offset:2px;color:var(--n-11)}
.bp{height:40px;padding:0 16px;border-radius:6px;border:0;background:var(--n-13);color:var(--n-1);font:500 14px/20px var(--font-sans),sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;white-space:nowrap}
.bp:hover{background:var(--n-11);color:var(--n-1)}
.bs{height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);font:500 14px/20px var(--font-sans),sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;white-space:nowrap}
.bs:hover{background:rgb(var(--n-13-rgb) / .04);border-color:var(--n-8)}
.bd{height:40px;padding:0 16px;border-radius:6px;border:0;background:var(--accent);color: var(--accent-on);font:500 14px/20px var(--font-sans),sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;white-space:nowrap}
.bp:disabled,.bd:disabled{background:var(--n-5);color:var(--n-8);cursor:not-allowed}
.bs:disabled{border-color:var(--n-5);color:var(--n-8);background:transparent;cursor:not-allowed}
.pl{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--n-4)}
.pli{width:40px;height:40px;border-radius:8px;border:1px solid var(--n-6);display:inline-flex;align-items:center;justify-content:center;font:600 13px/1 'JetBrains Mono',monospace;color:var(--n-11);box-sizing:border-box}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:var(--n-10)}
.err{margin:0;padding:10px 12px;border:2px solid var(--n-12);border-radius:6px;font-size:13px;line-height:18px;color:var(--n-12)}
.note{margin:0;padding:10px 12px;border:1px solid var(--n-6);border-radius:6px;font-size:13px;line-height:18px;color:var(--n-11);background:var(--s-3)}
.hl{margin:16px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.hl li{display:flex;gap:10px;font-size:13px;line-height:19px;color:var(--n-10)}
.hl li svg{flex:none;margin-top:2px;color:var(--n-9)}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;border:1px solid var(--n-6);font-size:12px;line-height:16px;color:var(--n-11);white-space:nowrap}
.plans{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.plan{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:8px;border:1px solid var(--n-5);background:var(--s-3);min-width:0}
.feat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;flex:1}
.feat li{display:flex;gap:8px;font-size:13px;line-height:18px;color:var(--n-11)}
.feat li.off{color:var(--n-9)}
.feat svg{flex:none;margin-top:1px}
.tx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--n-4);font-size:14px;line-height:20px}
.dlg-bg{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.64);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;overflow-y:auto}
.dlg{width:100%;max-width:480px;box-sizing:border-box;padding:28px;border-radius:12px;background:rgb(var(--n-2-rgb) / 0.92);border:1px solid rgb(var(--n-13-rgb) / 0.14);box-shadow:inset 0 1px 0 rgb(var(--n-13-rgb) / 0.12),0 32px 80px -16px rgba(0,0,0,0.75);margin:auto}
.dlg h2{margin:0;font-size:20px;line-height:26px;font-weight:600}
.dlg-t{margin:8px 0 0;font-size:14px;line-height:20px;color:var(--n-10)}
.dlg-a{margin-top:24px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.sk{display:inline-block;height:12px;border-radius:4px;background:var(--n-4)}
@media (max-width: 760px){
.snav{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}
.nav-i{height:36px}
.sec,#danger{padding:20px}
.pl{grid-template-columns:40px minmax(0,1fr)}
.pl > :last-child{grid-column:2 / -1;justify-self:start}
.dlg{padding:20px}
}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="position: relative; min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<a href="panel.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; border-radius: 6px; font-size: 14px; font-weight: 500" aria-label="Профиль" data-dc-keep data-stre-user><span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, var(--n-10), var(--n-6)); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--n-1)" data-av></span><span data-name>Профиль</span><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" class="sb" data-dc-keep>
<p class="sb-h">Эфир</p>
<a href="panel.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Обзор</a>
<a href="moderation.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<p class="sb-h">Бот</p>
<a href="commands.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды</a>
<a href="music.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Музыка</a>
<a href="widgets.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<span class="sb-i sb-off" aria-disabled="true"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 13l-7.5 7.5a2.1 2.1 0 0 1-3-3L11 10M16 16l6-6M8 8l6-6M9 7l8 8M21 11l-8-8"/></svg>Аукционы<span class="sb-tag">скоро</span></span>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i" aria-current="page"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
</nav>
<div style="flex: 999 1 640px; min-width: 0; max-width: 1200px; padding-bottom: 72px">
<h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Настройки</h1>
<div style="margin-top: 24px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
<nav aria-label="Разделы настроек" class="snav">
<template data-for="secs" data-as="n"><a href="{{ n.href }}" class="{{ n.cls }}" aria-current="{{ n.cur }}" onClick="{{ n.pick }}">{{ n.label }}</a></template>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px; max-width: 880px">

<!-- Профиль -->
<section id="profile" class="sec" aria-labelledby="p-t">
<h2 id="p-t">Профиль</h2><p class="sub">Ник, имя и аватар берутся из Twitch — их видят зрители в виджетах и ответах бота.</p>
<div style="margin-top: 24px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap">
<span style="width: 72px; height: 72px; flex: none; border-radius: 999px; overflow: hidden; background: linear-gradient(135deg, var(--n-10), var(--n-6)); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600; color: var(--n-1)"><template data-if="hasAvatar"><img src="{{ avatar }}" alt="" width="72" height="72" style="width: 72px; height: 72px; object-fit: cover; display: block"></template><template data-if="noAvatar">{{ initials }}</template></span>
<div style="min-width: 0; flex: 1 1 240px">
<p style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 600; overflow-wrap: anywhere">{{ profName }}</p>
<p class="mono" style="margin: 2px 0 0; font-size: 14px; line-height: 20px; color: var(--n-10)">{{ profLogin }}</p>
<p class="hint" style="margin-top: 6px">{{ profSince }}</p>
</div>
</div>
<div style="margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
<div class="fl"><label for="pf-login">Ник на Twitch</label><input id="pf-login" class="inp mono" readonly value="{{ fLogin }}" aria-describedby="pf-h"></div>
<div class="fl"><label for="pf-name">Имя на канале</label><input id="pf-name" class="inp" readonly value="{{ fName }}" aria-describedby="pf-h"></div>
</div>
<p id="pf-h" class="hint" style="margin-top: 12px">Меняются в Twitch: поменяй ник, имя или аватар в <a href="https://www.twitch.tv/settings/profile" target="_blank" rel="noopener">настройках профиля Twitch</a> — здесь они обновятся при следующем входе.</p>
<div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--n-4); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<p class="hint" style="font-size: 13px; line-height: 18px">Вход в StreOps — только через Twitch, пароль не нужен.</p>
<a href="/auth/logout.php" class="bs"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>Выйти</a>
</div>
</section>

<!-- Бот -->
<section id="bot" class="sec" aria-labelledby="bt-t">
<h2 id="bt-t">Бот в канале</h2><p class="sub">{{ botSub }}</p>
<div style="margin-top: 20px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 16px 20px; border-radius: 8px; border: 1px solid var(--n-5); background: var(--s-3)">
<div style="display: flex; gap: 12px; align-items: center; min-width: 0; flex: 1 1 260px">
<span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 999px; flex: none; {{ botDot }}"></span>
<div role="status" style="min-width: 0"><p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 600">{{ botTitle }}</p><p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--n-9)">{{ botText }}</p></div>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<template data-if="botShowRetry"><button type="button" class="bs" onClick="{{ enableBot }}" disabled="{{ botBusy }}">Подключить заново</button></template>
<template data-if="botCanEnable"><button type="button" class="bp" onClick="{{ enableBot }}" disabled="{{ botBusy }}"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>{{ enableLabel }}</button></template>
<template data-if="botCanDisable"><button type="button" class="bs" onClick="{{ disableBot }}" disabled="{{ botBusy }}">{{ disableLabel }}</button></template>
</div>
</div>
<template data-if="hasBotFail"><p role="alert" class="err" style="margin-top: 12px">{{ botFail }}</p></template>
<template data-if="hasBotErrors"><div role="alert" class="err" style="margin-top: 12px"><p style="margin: 0; font-weight: 600">Что мешает боту</p><ul style="margin: 6px 0 0; padding-left: 18px"><template data-for="botErrors" data-as="e"><li style="overflow-wrap: anywhere">{{ e.text }}</li></template></ul></div></template>
<ul class="hl">
<li><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg><span>{{ modHint }}</span></li>
<template data-if="modFailed"><li style="color: var(--n-12)"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--n-12)"><path d="M10.3 3.9L2.4 17.5a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></svg><span>{{ modFailText }}</span></li></template>
<template data-if="botNotReady"><li><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg><span>Аккаунт бота ещё не подключил администратор StreOps. Включить бота можно уже сейчас — чтение чата и ответы на команды заработают, как только его подключат.</span></li></template>
</ul>
</section>

<!-- Подключения -->
<section id="platforms" class="sec" aria-labelledby="pl-t">
<h2 id="pl-t">Подключения</h2><p class="sub">Откуда StreOps берёт чат, подписки и донаты.</p>
<template data-if="hasDaMsg"><div role="{{ daMsgRole }}" class="{{ daMsgCls }}" style="margin-top: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px"><span>{{ daMsgText }}</span><button type="button" onClick="{{ hideDaMsg }}" aria-label="Скрыть сообщение" style="flex: none; width: 24px; height: 24px; margin: -2px -4px 0 0; border: 0; border-radius: 4px; background: transparent; color: var(--n-10); cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></div></template>
<div style="margin-top: 16px">
<div class="pl"><span class="pli">Tw</span><span style="min-width: 0"><span style="display: block; font-size: 15px; font-weight: 500">Twitch</span><span class="st"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="10" fill="#F2F2F2" data-fill="12"></circle><path d="M8 12.5l2.5 2.5L16 9.5" fill="none" stroke="#0A0A0A" data-stroke="1" stroke-width="2" stroke-linecap="round"></path></svg><span style="overflow-wrap: anywhere">{{ twStatus }}</span></span></span><span class="badge" title="Через Twitch ты входишь в StreOps — отвязать его можно только вместе с аккаунтом">Основной вход</span></div>

<script src="assets/dc-lite.js?v=5f8ce08a"></script>
<script>
// Тарифы — копия server/app/lib/plans.php (публичного маршрута со списком тарифов пока нет).
// Лимиты текущего тарифа берутся из me.user.limits.
const STRE_PLANS = [
  { key: 'free', name: 'Бесплатный', price: 0, commands: 10, widgets: 2, music: false },
  { key: 'advanced', name: 'Продвинутая', price: 299, commands: 30, widgets: 3, music: false },
  { key: 'pro', name: 'Про', price: 499, commands: 1000, widgets: 10, music: true },
  { key: 'max', name: 'Максимум', price: 967, commands: 1000, widgets: 100, music: true },
];
const STRE_SECS = [['profile', 'Профиль'], ['bot', 'Бот в канале'], ['platforms', 'Подключения'], ['billing', 'Тариф и баланс'], ['obs', 'Ссылки для OBS'], ['theme', 'Оформление'], ['danger', 'Опасная зона']];
const STRE_TX = { plan: 'Оплата тарифа', topup: 'Пополнение', charge: 'Списание', grant: 'Тариф от администратора', ban: 'Блокировка' };
const STRE_DA_ERR = {
  denied: 'Ты отменил подключение на странице DonationAlerts.',
  state: 'Ссылка подключения устарела. Нажми «Подключить» ещё раз.',
  token: 'DonationAlerts не подтвердил подключение. Попробуй ещё раз через пару минут.',
  config: 'DonationAlerts пока не настроен на сервере StreOps. Напиши администратору.',
};

function streDays(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}
function streRub(n) { return (n < 0 ? '−' : '') + StreAPI.fmtNum(Math.abs(n)) + ' ₽'; }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      me: null, bot: null, tx: [], txLoaded: false,
      busy: '', botMsg: null, botFail: '', daMsg: null, showToken: false,
      acctTheme: undefined, ask: null, askErr: '', askBusy: false,
      confirm: false, typed: '', delErr: '', deleting: false, sec: 'profile',
    };
  }

  componentDidMount() {
    this.readDaParam();
    this.load();
    this.loadTx();
    this.loadAcctTheme();
    this.onScroll = () => {
      if (this.raf) return;
      this.raf = requestAnimationFrame(() => { this.raf = 0; this.spy(); });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (this.state.ask && !this.state.askBusy) this.closeAsk();
      else if (this.state.confirm && !this.state.deleting) this.closeDelete();
    });
    // Баланс могли пополнить, пока вкладка была в фоне
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && this.state.me) { this.reloadMe(); this.loadTx(); }
    });
    this.spy();
  }

  readDaParam() {
    let p;
    try { p = new URLSearchParams(location.search); } catch (e) { return; }
    const da = p.get('da');
    if (!da) return;
    if (da === 'connected') this.setState({ daMsg: { ok: true } });
    else {
      const reason = p.get('reason') || (da.indexOf('error_') === 0 ? da.slice(6) : '');
      this.setState({ daMsg: { ok: false, text: STRE_DA_ERR[reason] || 'Не удалось подключить DonationAlerts. Попробуй ещё раз.' } });
    }
    p.delete('da'); p.delete('reason');
    const q = p.toString();
    try { history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash); } catch (e) { /* ничего */ }
  }

  async load() {
    try {
      const m = await StreAPI.me();
      if (!m || !m.user) return; // api.js отправит на вход через Twitch
      this.setState({ me: m.user, bot: m.bot || null });
      if (location.hash && !this.scrolled) {
        this.scrolled = true;
        const el = document.getElementById(location.hash.slice(1));
        if (el) requestAnimationFrame(() => el.scrollIntoView());
      }
    } catch (e) { StreAPI.toast(e.message, 'error'); }
  }

  async reloadMe() {
    try {
      const m = await StreAPI.refreshMe();
      if (!m || !m.user) return;
      if (JSON.stringify(m.user) !== JSON.stringify(this.state.me) || JSON.stringify(m.bot) !== JSON.stringify(this.state.bot)) this.setState({ me: m.user, bot: m.bot || null });
    } catch (e) { /* покажем старые данные */ }
  }

  async loadTx() {
    try {
      const r = await StreAPI.get('account.transactions');
      const items = r.items || [];
      if (!this.state.txLoaded || JSON.stringify(items) !== JSON.stringify(this.state.tx)) this.setState({ tx: items, txLoaded: true });
    } catch (e) { if (!this.state.txLoaded) { this.setState({ txLoaded: true, txErr: e.message }); } }
  }

  async loadAcctTheme() {
    try {
      const r = await StreAPI.get('account.theme');
      this.setState({ acctTheme: r.theme && typeof r.theme === 'object' ? r.theme : null });
      return r.theme || null;
    } catch (e) { this.setState({ acctTheme: null, acctThemeErr: e.message }); return null; }
  }

  spy() {
    let cur = STRE_SECS[0][0];
    for (const [id] of STRE_SECS) {
      const el = document.getElementById(id);
      if (el && el.getBoundingClientRect().top <= 140) cur = id;
    }
    const doc = document.documentElement;
    if (window.innerHeight + window.scrollY >= doc.scrollHeight - 4) cur = STRE_SECS[STRE_SECS.length - 1][0];
    if (cur !== this.state.sec) this.setState({ sec: cur });
  }

  // ---------- модальные окна ----------
  openAsk(ask) {
    this.lastFocus = document.activeElement;
    this.setState({ ask: Object.assign({ no: 'Отмена', cls: 'bp' }, ask), askErr: '', askBusy: false });
    setTimeout(() => { const b = document.getElementById('ask-no'); if (b) b.focus(); }, 0);
  }
  closeAsk() {
    this.setState({ ask: null, askErr: '', askBusy: false });
    this.restoreFocus();
  }
  restoreFocus() {
    const f = this.lastFocus;
    this.lastFocus = null;
    setTimeout(() => { if (f && document.contains(f) && !f.disabled) f.focus(); }, 0);
  }
  async runAsk() {
    const a = this.state.ask;
    if (!a || this.state.askBusy) return;
    this.setState({ askBusy: true, askErr: '' });
    try {
      await a.run();
      this.setState({ ask: null, askBusy: false });
      this.restoreFocus();
    } catch (e) { this.setState({ askBusy: false, askErr: e.message }); }
  }
  openDelete() {
    this.lastFocus = document.activeElement;
    this.setState({ confirm: true, typed: '', delErr: '' });
    setTimeout(() => { const i = document.getElementById('cf-in'); if (i) i.focus(); }, 0);
  }
  closeDelete() {
    this.setState({ confirm: false, typed: '', delErr: '' });
    this.restoreFocus();
  }

  // ---------- бот ----------
  async enableBot() {
    const me = this.state.me;
    if (!me || this.state.busy) return;
    this.setState({ busy: 'botOn', botFail: '', botMsg: null });
    try {
      const r = await StreAPI.post('bot.enable');
      const errors = r.errors || [];
      this.setState({ botMsg: { moderator: r.moderator !== false, errors } });
      StreAPI.toast(errors.length ? 'Бот включён, но не всё получилось — смотри подробности' : 'Бот подключён к каналу', errors.length ? 'error' : undefined);
      await this.reloadMe();
    } catch (e) {
      this.setState({ botFail: e.message });
    }
    this.setState({ busy: '' });
  }
  async disableBot() {
    const me = this.state.me;
    if (!me || this.state.busy) return;
    // оптимистично: бот сразу показан выключенным, при ошибке вернём как было
    this.setState({ busy: 'botOff', botFail: '', botMsg: null, me: Object.assign({}, me, { botEnabled: false, botError: null }) });
    try {
      await StreAPI.post('bot.disable');
      StreAPI.toast('Бот отключён от канала');
      await this.reloadMe();
    } catch (e) {
      this.setState({ me, botFail: e.message });
    }
    this.setState({ busy: '' });
  }

  // ---------- тариф ----------
  askBuy(p) {
    const me = this.state.me;
    if (!me) return;
    const now = Date.now() / 1000;
    const same = me.plan === p.key;
    const base = same && me.planUntil > now ? me.planUntil : now;
    const until = StreAPI.fmtDate(base + 30 * 86400);
    let text = 'Спишем ' + streRub(p.price) + ' с баланса (сейчас ' + streRub(me.balance) + '). ';
    if (same) text += 'Тариф продлится до ' + until + '.';
    else {
      text += 'Тариф «' + p.name + '» включится сразу и будет действовать до ' + until + '.';
      if (me.plan !== 'free') text += me.planUntil > 0 ? ' Оставшиеся дни тарифа «' + me.planName + '» (до ' + StreAPI.fmtDate(me.planUntil) + ') не переносятся.' : ' Бессрочный тариф «' + me.planName + '» сменится на «' + p.name + '» на 30 дней.';
    }
    this.openAsk({
      title: (same ? 'Продлить' : 'Оплатить') + ' «' + p.name + '» с баланса?',
      text, yes: 'Оплатить ' + streRub(p.price), cls: 'bp',
      run: async () => {
        await StreAPI.post('account.buy', { plan: p.key });
        const m = await StreAPI.refreshMe();
        if (m && m.user) this.setState({ me: m.user });
        StreAPI.toast('Тариф «' + p.name + '» оплачен' + (m && m.user && m.user.planUntil ? ' до ' + StreAPI.fmtDate(m.user.planUntil) : ''));
        this.loadTx();
      },
    });
  }

  // ---------- подключения, ключ, тема ----------
  askDaDisconnect() {
    const me = this.state.me;
    this.openAsk({
      title: 'Отключить DonationAlerts?',
      text: 'Новые донаты перестанут приходить в алерты, цель сбора и топ донатеров' + (me && me.daName ? ' (аккаунт ' + me.daName + ')' : '') + '. Подключить снова можно в любой момент.',
      yes: 'Отключить', cls: 'bp',
      run: async () => {
        await StreAPI.post('account.da.disconnect');
        await this.reloadMe();
        this.setState({ daMsg: null });
        StreAPI.toast('DonationAlerts отключён');
      },
    });
  }
  askResetToken() {
    this.openAsk({
      title: 'Сбросить ссылки виджетов?',
      text: 'Создадим новый ключ. Все виджеты, которые сейчас добавлены в OBS по старым ссылкам, сразу перестанут работать — новые ссылки нужно будет вставить заново из раздела «Виджеты».',
      yes: 'Сбросить ссылки', cls: 'bd',
      run: async () => {
        await StreAPI.post('account.widgetToken');
        await this.reloadMe();
        StreAPI.toast('Ключ обновлён. Вставь новые ссылки в OBS.');
      },
    });
  }
  async copy(text) {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
      ta.remove();
    }
    StreAPI.toast(ok ? 'Ключ скопирован' : 'Не получилось скопировать — нажми «Показать» и выдели ключ вручную', ok ? undefined : 'error');
  }
  async saveTheme() {
    if (!window.StreTheme || this.state.busy) return;
    const t = window.StreTheme.get();
    this.setState({ busy: 'theme' });
    try {
      await StreAPI.post('account.theme', { theme: t });
      const saved = Object.assign({}, t);
      delete saved.image;
      this.setState({ acctTheme: saved });
      StreAPI.toast(t.bgType === 'image' ? 'Тема сохранена в аккаунт. Картинка фона осталась только в этом браузере.' : 'Тема сохранена в аккаунт');
    } catch (e) { StreAPI.toast(e.message, 'error'); }
    this.setState({ busy: '' });
  }
  askLoadTheme() {
    this.openAsk({
      title: 'Применить тему из аккаунта?',
      text: 'Текущее оформление в этом браузере заменится темой, сохранённой в аккаунте.',
      yes: 'Применить', cls: 'bp',
      run: async () => {
        const r = await StreAPI.get('account.theme');
        if (!r.theme || typeof r.theme !== 'object') { this.setState({ acctTheme: null }); throw new Error('В аккаунте нет сохранённой темы'); }
        const t = Object.assign({}, r.theme);
        delete t.image;
        const local = window.StreTheme.get();
        if (t.bgType === 'image' && !local.image) t.bgType = 'solid';
        window.StreTheme.set(t);
        this.setState({ acctTheme: r.theme });
        StreAPI.toast('Тема из аккаунта применена');
      },
    });
  }

  async doDelete(e) {
    if (e && e.preventDefault) e.preventDefault();
    const me = this.state.me;
    const typed = this.state.typed.trim();
    if (!me || this.state.deleting || typed.toLowerCase() !== me.login.toLowerCase()) return;
    this.setState({ deleting: true, delErr: '' });
    try {
      await StreAPI.post('account.delete', { confirm: typed });
      location.href = 'index.html';
    } catch (err) { this.setState({ deleting: false, delErr: err.message }); }
  }

  renderVals() {
    const s = this.state;
    const me = s.me;
    const bot = (s.bot && s.bot.login) || 'zaka_bot';
    const now = Date.now() / 1000;
    const L = 'Загрузка…';

    // профиль
    const initials = me ? ((me.name || me.login).replace(/[^A-Za-zА-Яа-яЁё0-9]/g, '').slice(0, 2).toUpperCase() || '?') : '';

    // бот
    const errs = me && me.botEnabled && me.botError ? String(me.botError).split('; ').filter(Boolean) : [];
    const botBusy = s.busy === 'botOn' || s.busy === 'botOff';
    let botTitle = L, botText = '', botDot = 'background: var(--n-6)';
    if (me) {
      if (s.busy === 'botOn') { botTitle = 'Подключаем бота…'; botText = 'Назначаем ' + bot + ' модератором и подписываемся на события канала.'; botDot = 'background: var(--n-9)'; }
      else if (s.busy === 'botOff') { botTitle = 'Отключаем бота…'; botText = 'Это займёт пару секунд.'; botDot = 'background: var(--n-9)'; }
      else if (me.botEnabled && !errs.length) { botTitle = 'Бот работает в канале'; botText = bot + ' читает чат, отвечает на команды и модерирует.'; botDot = 'background: var(--n-12); box-shadow: 0 0 0 4px rgb(var(--n-13-rgb) / 0.12)'; }
      else if (me.botEnabled) { botTitle = 'Бот включён, но не всё работает'; botText = 'Подробности ниже. Исправь причину и нажми «Подключить заново».'; botDot = 'background: transparent; border: 2px solid var(--n-12); box-sizing: border-box'; }
      else { botTitle = 'Бот выключен'; botText = 'Включи, чтобы ' + bot + ' начал отвечать на команды и следить за чатом.'; botDot = 'background: var(--n-7)'; }
    }

    // DonationAlerts
    const daOn = !!(me && me.daConnected);
    let daMsgText = '';
    if (s.daMsg) daMsgText = s.daMsg.ok ? 'DonationAlerts подключён' + (me && me.daName ? ' как ' + me.daName : '') + '. Новые донаты появятся в алертах и виджетах.' : s.daMsg.text;

    // тарифы
    const bal = me ? me.balance : 0;
    const cur = me ? STRE_PLANS.find((p) => p.key === me.plan) : null;
    const plans = STRE_PLANS.map((p0) => {
      const p = Object.assign({}, p0, me && me.plan === p0.key && me.limits ? { commands: me.limits.commands, widgets: me.limits.widgets, music: !!me.limits.music } : {});
      const isCur = !!me && me.plan === p.key;
      const unlimitedCur = isCur && p.price > 0 && me.planUntil === 0;
      const canBuy = !!me && p.price > 0 && !unlimitedCur;
      const short = Math.max(0, p.price - bal);
      let note = '';
      if (!me) note = '';
      else if (p.price === 0) note = isCur ? 'Действует всегда, без оплаты' : 'Включится сам, когда закончится платный тариф';
      else if (unlimitedCur) note = 'Выдан бессрочно — продлевать не нужно';
      else if (short > 0) note = 'Не хватает ' + streRub(short) + ' на балансе';
      else if (isCur) note = 'Продлим с ' + StreAPI.fmtDate(me.planUntil > now ? me.planUntil : now);
      else note = 'Хватает на балансе';
      return {
        name: p.name, current: isCur,
        price: p.price ? StreAPI.fmtNum(p.price) + ' ₽' : '0 ₽',
        per: p.price ? 'за 30 дней' : 'навсегда',
        ring: isCur ? 'border: 2px solid var(--n-12); padding: 15px' : '',
        lines: [
          { text: p.commands >= 1000 ? 'Команды без ограничений' : 'До ' + p.commands + ' ' + streDays(p.commands, 'команды', 'команд', 'команд'), on: true, off: false, cls: '' },
          { text: (p.widgets >= 100 ? 'До ' : '') + p.widgets + ' ' + streDays(p.widgets, 'виджет', 'виджета', 'виджетов') + ' для OBS', on: true, off: false, cls: '' },
          { text: p.music ? 'Музыка по заказу зрителей' : 'Без музыки по заказу', on: p.music, off: !p.music, cls: p.music ? '' : 'off' },
        ],
        canBuy, dis: short > 0 || !!s.ask,
        btnCls: isCur ? 'bs' : 'bp',
        btn: (isCur ? 'Продлить · ' : 'Оплатить · ') + streRub(p.price),
        descId: 'plan-' + p.key + '-n',
        note,
        buy: () => this.askBuy(p),
      };
    });
    let planUntil = L, planLimits = '';
    if (me) {
      if (me.plan === 'free') planUntil = 'Бесплатно, без срока';
      else if (me.planUntil > 0) {
        const left = Math.max(0, Math.ceil((me.planUntil - now) / 86400));
        planUntil = 'до ' + StreAPI.fmtDate(me.planUntil) + ' · ' + (left ? 'осталось ' + left + ' ' + streDays(left, 'день', 'дня', 'дней') : 'последний день');
      } else planUntil = 'бессрочно';
      const lim = me.limits || {};
      planLimits = (lim.commands >= 1000 ? 'Команды без ограничений' : 'Команд: до ' + lim.commands) + ' · виджетов: ' + lim.widgets + ' · музыка: ' + (lim.music ? 'есть' : 'нет');
    }
    let balanceNote = '';
    if (me) {
      if (cur && cur.price > 0) {
        const n = Math.floor(bal / cur.price);
        balanceNote = n > 0 ? 'Хватит на ' + n + ' ' + streDays(n, 'продление', 'продления', 'продлений') + ' «' + cur.name + '»' : 'На продление «' + cur.name + '» не хватает ' + streRub(cur.price - bal);
      } else balanceNote = bal > 0 ? 'Можно оплатить тариф ниже' : 'Пока пусто';
    }

    // операции
    const tx = s.tx.map((t) => ({
      title: t.comment || STRE_TX[t.kind] || 'Операция',
      meta: (STRE_TX[t.kind] || t.kind) + ' · ' + StreAPI.fmtDate(t.at) + ' · ' + StreAPI.fmtTime(t.at) + ' · № ' + t.id,
      amount: t.amount === 0 ? '—' : (t.amount > 0 ? '+' : '') + streRub(t.amount),
      color: t.amount > 0 ? 'color: var(--n-12)' : 'color: var(--n-10)',
    }));
    const txEmpty = !s.txLoaded || !tx.length;
    const txEmptyText = !s.txLoaded ? L : (s.txErr ? 'Не удалось загрузить операции: ' + s.txErr : 'Операций пока нет. Здесь появятся пополнения баланса и оплаты тарифов.');

    // ключ виджетов
    const token = (me && me.widgetToken) || '';
    const masked = token ? '•'.repeat(Math.max(12, token.length)) : '';
    const origin = location.origin && location.origin !== 'null' ? location.origin : 'https://streops.ru';

    // тема
    let acctThemeText = 'Проверяем…';
    if (s.acctTheme === null) acctThemeText = 'В аккаунте пока нет сохранённой темы.';
    else if (s.acctTheme) {
      const pr = window.StreTheme && window.StreTheme.presets ? window.StreTheme.presets[s.acctTheme.preset] : null;
      acctThemeText = 'Сохранена тема «' + (pr ? pr.name : 'Своя') + '»' + (s.acctTheme.mode === 'light' ? ', светлая' : ', тёмная') + '.';
    }

    // удаление
    const typedOk = !!me && s.typed.trim().toLowerCase() === me.login.toLowerCase();
    let delText = 'Команды, настройки, история чата и статистика канала удалятся навсегда, бот отключится от канала.';
    if (me && me.plan !== 'free') delText += ' Тариф «' + me.planName + '» сгорит.';
    if (me && me.balance > 0) delText += ' На балансе ' + streRub(me.balance) + ' — они тоже пропадут.';

    const ask = s.ask;
    return {
      secs: STRE_SECS.map(([id, label]) => ({
        href: '#' + id, label, cls: id === 'danger' ? 'nav-i dz' : 'nav-i', cur: s.sec === id ? 'true' : false,
        pick: () => this.setState({ sec: id }),
      })),
      noMe: !me,

      hasAvatar: !!(me && me.avatar), noAvatar: !(me && me.avatar), avatar: me ? me.avatar : '', initials,
      profName: me ? me.name : L, profLogin: me ? 'twitch.tv/' + me.login : '',
      profSince: me && me.createdAt ? 'В StreOps с ' + StreAPI.fmtDate(me.createdAt) : '',
      fLogin: me ? me.login : '', fName: me ? me.name : '',

      botSub: 'Бот ' + bot + ' отвечает на команды, ставит музыку, проводит розыгрыши и модерирует чат твоего канала Twitch.',
      botTitle, botText, botDot, botBusy: botBusy || !me,
      botCanEnable: !!me && (s.busy === 'botOn' || (!me.botEnabled && s.busy !== 'botOff')),
      botCanDisable: !!me && (s.busy === 'botOff' || (!!me.botEnabled && s.busy !== 'botOn')),
      botShowRetry: !!me && !!me.botEnabled && errs.length > 0 && !botBusy,
      enableLabel: s.busy === 'botOn' ? 'Подключаем…' : 'Подключить бота',
      disableLabel: s.busy === 'botOff' ? 'Отключаем…' : 'Отключить',
      enableBot: () => this.enableBot(), disableBot: () => this.disableBot(),
      hasBotFail: !!s.botFail, botFail: s.botFail,
      hasBotErrors: !botBusy && errs.length > 0, botErrors: errs.map((t) => ({ text: t })),
      modHint: bot + ' сам становится модератором твоего канала, когда ты подключаешь бота: без этого он не сможет удалять сообщения и выдавать таймауты.',
      modFailed: !!(s.botMsg && !s.botMsg.moderator),
      modFailText: 'Не получилось назначить ' + bot + ' модератором. Сделай это вручную: напиши в своём чате /mod ' + bot,
      botNotReady: !!(s.bot && !s.bot.ready),

      twStatus: me ? 'Подключено как ' + me.login : L,
      daOn, daOff: !daOn && !!me,
      daStatus: !me ? L : (daOn ? 'Подключено' + (me.daName ? ' как ' + me.daName : '') : 'Не подключено'),
      daStatusStyle: daOn ? '' : 'color: var(--n-9)',
      daIconStyle: daOn ? '' : 'border-style: dashed; color: var(--n-9)',
      daBusy: !!s.ask,
      daDisconnect: () => this.askDaDisconnect(),
      hasDaMsg: !!s.daMsg, daMsgText, daMsgRole: s.daMsg && !s.daMsg.ok ? 'alert' : 'status', daMsgCls: s.daMsg && !s.daMsg.ok ? 'err' : 'note',
      hideDaMsg: () => this.setState({ daMsg: null }),

      planName: me ? me.planName : L, planUntil, planLimits,
      balance: me ? streRub(bal) : '—', balanceNote,
      plans,
      tx, txEmpty, txEmptyText, txBusy: s.txLoaded ? 'false' : 'true',

      tokenShown: !token ? (me ? 'Ключа нет' : L) : (s.showToken ? token : masked),
      noToken: !token,
      showTokenLabel: s.showToken ? 'Скрыть' : 'Показать',
      toggleToken: () => this.setState({ showToken: !s.showToken }),
      copyToken: () => this.copy(token),
      linkExample: origin + '/w/?t=' + (token && s.showToken ? token : '••••') + '&w=alerts',
      tokenBusy: !me,
      resetToken: () => this.askResetToken(),

      openTheme: () => { if (window.StreTheme) window.StreTheme.open(); },
      resetTheme: () => this.openAsk({
        title: 'Сбросить оформление?',
        text: 'Вернём стандартную тему «Графит» в этом браузере. Тема, сохранённая в аккаунте, не изменится.',
        yes: 'Сбросить', cls: 'bp',
        run: async () => { if (window.StreTheme) window.StreTheme.reset(); StreAPI.toast('Оформление сброшено к «Графиту»'); },
      }),
      acctThemeText,
      themeBusy: s.busy === 'theme' || !me,
      saveThemeLabel: s.busy === 'theme' ? 'Сохраняем…' : 'Сохранить тему в аккаунт',
      saveTheme: () => this.saveTheme(),
      cantLoadTheme: !s.acctTheme,
      loadTheme: () => this.askLoadTheme(),

      hasAsk: !!ask, ask: ask || {},
      hasAskErr: !!s.askErr, askErr: s.askErr, askBusy: s.askBusy,
      askYesLabel: s.askBusy ? 'Секунду…' : (ask ? ask.yes : ''),
      askYes: () => this.runAsk(),
      closeAsk: () => { if (!s.askBusy) this.closeAsk(); },
      askBackdrop: (e) => { if (e.target === e.currentTarget && !s.askBusy) this.closeAsk(); },

      confirm: s.confirm,
      openDelete: () => this.openDelete(),
      closeConfirm: () => { if (!s.deleting) this.closeDelete(); },
      delBackdrop: (e) => { if (e.target === e.currentTarget && !s.deleting) this.closeDelete(); },
      delTitle: 'Удалить аккаунт ' + (me ? me.login : '') + '?',
      delText, myLogin: me ? me.login : '',
      typed: s.typed,
      setTyped: (e) => this.setState({ typed: e.target.value, delErr: '' }),
      delInvalid: !!s.delErr,
      hasDelErr: !!s.delErr, delErr: s.delErr,
      cantDelete: !typedOk || s.deleting,
      delLabel: s.deleting ? 'Удаляем…' : 'Удалить навсегда',
      doDelete: (e) => this.doDelete(e),
    };
  }
}
DCMount(Component);
</script>
</body>
</html>
