<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — настройки</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js?v=460ce522"></script>
<script src="assets/api.js?v=05dec39a"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
html{scroll-padding-top:150px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
:focus-visible{outline:2px solid var(--n-12);outline-offset:2px}
[id]{scroll-margin-top:150px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.card{background:rgb(var(--n-2-rgb) / .62);border:1px solid rgb(var(--n-13-rgb) / .10);border-radius:12px;box-sizing:border-box;min-width:0;padding:22px 24px;display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.card.dz{border-color:rgb(var(--accent-rgb) / .55)}
.grp{display:flex;flex-direction:column;gap:16px;margin:0;min-width:0}
.grp h2{margin:0;font-size:20px;line-height:26px;font-weight:600;letter-spacing:-.01em}
.ov{margin:0;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.ct{margin:0;font-size:16px;line-height:22px;font-weight:600}
.sub{margin:4px 0 0;font-size:14px;line-height:20px;color:var(--n-9)}
.hint{margin:0;font-size:13px;line-height:18px;color:var(--n-9)}
.hint a{text-decoration:underline;text-underline-offset:2px;color:var(--n-11)}
.lab{font-size:13px;line-height:18px;font-weight:500;color:var(--n-11)}
.fl{display:flex;flex-direction:column;gap:8px;min-width:0}
.inl{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:0}
.inp{height:40px;box-sizing:border-box;padding:0 12px;border-radius:6px;background:var(--n-1);border:1px solid var(--n-8);color:var(--n-12);font:400 15px/22px var(--font-sans),sans-serif;width:100%;min-width:0}
.inp:hover{border-color:var(--n-9)}
.inp[readonly]{background:transparent;border-color:var(--n-5);color:var(--n-11)}
.inp:disabled{opacity:.5}
.bp,.bs,.bd{height:40px;padding:0 16px;border-radius:6px;font:500 14px/20px var(--font-sans),sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;white-space:nowrap;text-decoration:none}
.bp{border:0;background:var(--n-13);color:var(--n-1)}
.bp:hover{background:var(--n-11);color:var(--n-1)}
.bs{border:1px solid var(--n-6);background:transparent;color:var(--n-12)}
.bs:hover{background:rgb(var(--n-13-rgb) / .04);border-color:var(--n-8);color:var(--n-12)}
.bd{border:0;background:var(--accent);color: var(--accent-on)}
.bd:hover{background:var(--accent-hover);color: var(--accent-on)}
.bp:disabled,.bd:disabled{background:var(--n-5);color:var(--n-8);cursor:not-allowed}
.bs:disabled{border-color:var(--n-5);color:var(--n-8);background:transparent;cursor:not-allowed}
.bs.sm{height:32px;padding:0 10px;font-size:13px}
.tabs{position:sticky;top:72px;z-index:150;display:flex;flex-wrap:wrap;gap:4px;padding:6px;border-radius:12px;background:rgb(var(--n-2-rgb) / .82);border:1px solid rgb(var(--n-13-rgb) / .10);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-sizing:border-box}
.tab{height:36px;padding:0 14px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:20px;color:var(--n-10);white-space:nowrap}
.tab:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.tab[aria-current="true"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 0 -2px 0 var(--n-12)}
.err{margin:0;padding:12px 14px;border:1px solid var(--n-12);border-radius:8px;font-size:13px;line-height:18px;color:var(--n-12);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;box-sizing:border-box}
.note{margin:0;padding:12px 14px;border:1px solid var(--n-6);border-radius:8px;font-size:13px;line-height:18px;color:var(--n-11);background:rgb(var(--n-13-rgb) / .03);box-sizing:border-box}
.status{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 18px;border-radius:10px;border:1px solid var(--n-5);background:rgb(var(--n-13-rgb) / .03);box-sizing:border-box}
.dot{width:10px;height:10px;border-radius:999px;flex:none}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--n-4)}
.row:first-child{border-top:0;padding-top:4px}
.pli{width:40px;height:40px;border-radius:8px;border:1px solid var(--n-6);display:inline-flex;align-items:center;justify-content:center;font:600 13px/1 'JetBrains Mono',monospace;color:var(--n-11);box-sizing:border-box}
.st{margin:2px 0 0;display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:var(--n-10);min-width:0}
.plans{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.plan{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:10px;border:1px solid var(--n-5);background:rgb(var(--n-1-rgb) / .5);min-width:0;box-sizing:border-box}
.feat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;flex:1}
.feat li{display:flex;gap:8px;font-size:13px;line-height:18px;color:var(--n-11)}
.feat li.off{color:var(--n-9)}
.feat svg{flex:none;margin-top:1px}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;border:1px solid var(--n-6);font-size:12px;line-height:16px;color:var(--n-11);white-space:nowrap}
.tx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--n-4);font-size:14px;line-height:20px}
.dlg-bg{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.64);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;overflow-y:auto}
.dlg{width:100%;max-width:480px;box-sizing:border-box;padding:28px;border-radius:12px;background:rgb(var(--n-2-rgb) / 0.92);border:1px solid rgb(var(--n-13-rgb) / 0.14);box-shadow:inset 0 1px 0 rgb(var(--n-13-rgb) / 0.12),0 32px 80px -16px rgba(0,0,0,0.75);margin:auto}
.dlg h2{margin:0;font-size:20px;line-height:26px;font-weight:600;overflow-wrap:anywhere}
.dlg-t{margin:8px 0 0;font-size:14px;line-height:20px;color:var(--n-10)}
.dlg-a{margin-top:24px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
@media (max-width: 760px){
.card{padding:20px}
.dlg{padding:20px}
.tab{flex:1 1 auto}
.row{grid-template-columns:40px minmax(0,1fr)}
.row > :last-child{grid-column:2 / -1;justify-self:start}
}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none;white-space:nowrap;overflow:hidden}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
.sb-search{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;margin:0 0 8px;border:1px solid var(--n-6);border-radius:8px;background:rgb(var(--n-13-rgb) / .03);color:var(--n-9)}
.sb-search:focus-within{border-color:var(--n-12)}
.sb-search input{flex:1;min-width:0;min-width:0;border:0;outline:0;background:transparent;color:var(--n-12);font:400 14px/20px 'Onest',sans-serif;padding:0}
.sb-search input::placeholder{color:var(--n-9)}
.sb-search input::-webkit-search-cancel-button{display:none}
.sb-search kbd{font:400 10px/1 'JetBrains Mono',monospace;margin-left:auto;color:var(--n-9);border:1px solid var(--n-6);border-radius:4px;padding:2px 5px;white-space:nowrap}
.sb-empty{margin:8px 12px;font-size:13px;color:var(--n-9)}
.sb-hide{display:none!important}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var nav = document.querySelector('nav.sb'), box = nav && nav.querySelector('[data-sb-search]');
  if (!box) return;
  var empty = nav.querySelector('[data-sb-empty]');
  function apply() {
    var q = box.value.trim().toLowerCase(), any = false, group = null, groupHit = false;
    var rows = Array.prototype.slice.call(nav.children).filter(function (el) { return el.matches('a.sb-i, span.sb-i, p.sb-h, div.sb-sep'); });
    rows.forEach(function (el) {
      if (el.matches('p.sb-h')) { if (group) group.classList.toggle('sb-hide', !groupHit && !!q); group = el; groupHit = false; el.classList.remove('sb-hide'); return; }
      if (el.matches('div.sb-sep')) { el.classList.toggle('sb-hide', !!q); return; }
      var hit = !q || (el.textContent + ' ' + (el.getAttribute('data-kw') || '')).toLowerCase().indexOf(q) !== -1;
      el.classList.toggle('sb-hide', !hit);
      if (hit) { groupHit = true; any = true; }
    });
    if (group) group.classList.toggle('sb-hide', !!q && !groupHit);
    if (empty) empty.hidden = any || !q;
  }
  box.addEventListener('input', apply);
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var first = nav.querySelector('a.sb-i:not(.sb-hide)'); if (first) location.href = first.getAttribute('href'); }
    if (e.key === 'Escape') { box.value = ''; apply(); box.blur(); }
  });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); box.focus(); box.select(); }
  });
});
</script>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="position: relative; min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<a href="panel.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; border-radius: 6px; font-size: 14px; font-weight: 500" aria-label="Профиль" data-dc-keep data-stre-user><span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, var(--n-10), var(--n-6)); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--n-1)" data-av></span><span data-name>Профиль</span><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px 16px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" class="sb" data-dc-keep>
<label class="sb-search"><svg class="sb-ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" data-sb-search placeholder="Поиск" aria-label="Найти раздел" autocomplete="off"><kbd>Ctrl K</kbd></label><p class="sb-empty" data-sb-empty hidden>Такого раздела нет</p>
<p class="sb-h">Сегодня</p>
<a href="panel.html" class="sb-i" data-kw="главная статистика эфир статус"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Старт</a>
<p class="sb-h">Чат</p>
<a href="moderation.html" class="sb-i" data-kw="фильтр чат удалить бан таймаут проверка"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<a href="mods.html" class="sb-i" data-kw="мод модераторы помощник права журнал"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Помощники</a>
<a href="commands.html" class="sb-i" data-kw="команда ответ чат кулдаун"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды</a>
<a href="timers.html" class="sb-i" data-kw="таймер сообщение напоминание"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6M12 2v3"/></svg>Таймеры</a>
<p class="sb-h">Музыка</p>
<a href="music.html" class="sb-i" data-kw="музыка трек плеер заказ очередь песня"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Очередь и заказы</a>
<a href="manage.html" class="sb-i" data-kw="помощник канал трек музыка добавить"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Управлять каналом</a>
<p class="sb-h">Эфир и сайт</p>
<a href="widgets.html" class="sb-i" data-kw="виджет obs браузер ссылка чат розыгрыш"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты для OBS</a>
<a href="site-settings.html" class="sb-i" data-kw="сайт подписчики видео значок галочка модератор"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Мой сайт</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i" data-kw="розыгрыш приз участники победитель"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<a href="clips.html" class="sb-i" data-kw="нарезка клип момент видео"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 9-12 9z"/><path d="M3 3v18"/></svg>Нарезки</a>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i" aria-current="page" data-kw="тариф оплата аккаунт email промокод"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
<a href="support.html" class="sb-i" data-kw="помощь вопрос обращение"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Поддержка</a>
</nav>
<div style="flex: 999 1 640px; min-width: 0; max-width: 880px; padding-bottom: 72px">
<h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Настройки</h1>
<p class="sub" style="margin-top: 8px; max-width: 620px">Аккаунт, бот в канале, тариф и удаление аккаунта. Поля с кнопкой «Сохранить» сохраняются только после нажатия.</p>

<nav aria-label="Разделы настроек" class="tabs" style="margin-top: 20px">
<template data-for="secs" data-as="n"><a href="{{ n.href }}" class="tab" aria-current="{{ n.cur }}" onClick="{{ n.pick }}">{{ n.label }}</a></template>
</nav>

<main style="display: flex; flex-direction: column; gap: 40px; margin-top: 28px; min-width: 0">

<!-- ================= Аккаунт ================= -->
<section id="account" class="grp" aria-labelledby="g-acc">
<div><h2 id="g-acc">Аккаунт</h2><p class="sub">Как ты входишь в StreOps, email для чеков и оформление панели.</p></div>

<section id="profile" class="card" aria-labelledby="c-prof">
<h3 id="c-prof" class="ct">Профиль и вход</h3>
<template data-if="meLoading"><p class="hint" role="status">Загружаем профиль…</p></template>
<template data-if="meFailed"><div role="alert" class="err"><span>Не получилось загрузить профиль. Проверь интернет и попробуй ещё раз.</span><button type="button" class="bs" onClick="{{ retryMe }}">Повторить</button></div></template>
<template data-if="hasMe">
<div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap">
<span style="width: 64px; height: 64px; flex: none; border-radius: 999px; overflow: hidden; background: linear-gradient(135deg, var(--n-10), var(--n-6)); display: inline-flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600; color: var(--n-1)"><template data-if="hasAvatar"><img src="{{ avatar }}" alt="" width="64" height="64" style="width: 64px; height: 64px; object-fit: cover; display: block"></template><template data-if="noAvatar">{{ initials }}</template></span>
<div style="min-width: 0; flex: 1 1 200px">
<p style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; overflow-wrap: anywhere">{{ profName }}</p>
<p class="mono" style="margin: 2px 0 0; font-size: 14px; line-height: 20px; color: var(--n-10); overflow-wrap: anywhere">{{ profLogin }}</p>
<p class="hint" style="margin-top: 4px">{{ profSince }}</p>

  { key: 'max', name: 'Максимум', price: 967, commands: 1000, widgets: 100, music: true, history: 3650 },
];
const STRE_GROUPS = [['account', 'Аккаунт'], ['bot', 'Бот и каналы'], ['billing', 'Тариф'], ['more', 'Дополнительно']];
const STRE_TX = { plan: 'Оплата тарифа', topup: 'Пополнение баланса', charge: 'Списание', grant: 'Выдан тариф', ban: 'Блокировка' };
const STRE_DA_ERR = {
  denied: 'Ты отменил подключение на странице DonationAlerts.',
  state: 'Ссылка подключения устарела. Нажми «Подключить» ещё раз.',
  token: 'DonationAlerts не подтвердил подключение. Попробуй ещё раз через пару минут.',
  config: 'DonationAlerts пока не настроен на сервере StreOps. Напиши администратору.',
};

function streDays(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}
function streRub(n) { return (n < 0 ? '−' : '') + StreAPI.fmtNum(Math.abs(n)) + ' ₽'; }

// Виджет ЮKassa: скрипт грузим один раз; оплата открывается поверх экрана, чтобы страница не уходила от пользователя
function loadYooWidget() {
  if (window.YooMoneyCheckoutWidget) return Promise.resolve();
  return new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = 'https://yookassa.ru/checkout-widget/v1/checkout-widget.js';
    s.onload = () => ok();
    s.onerror = () => no(new Error('Не загрузилась платёжная форма. Проверь интернет или отключи блокировщик рекламы'));
    document.head.appendChild(s);
  });
}
function openYooPay(token, returnUrl, cb) {
  const ov = document.createElement('div');
  ov.setAttribute('role', 'dialog');
  ov.setAttribute('aria-modal', 'true');
  ov.setAttribute('aria-label', 'Оплата');
  ov.style.cssText = 'position: fixed; inset: 0; z-index: 10000; background: var(--n-1); overflow: auto; display: flex; flex-direction: column';
  ov.innerHTML = '<div style="flex: none; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--n-4)"><span style="font: 600 16px/22px var(--font-sans), system-ui, sans-serif; color: var(--n-12)">Оплата тарифа</span><button type="button" style="height: 40px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--n-6); background: transparent; color: var(--n-12); font: 500 14px/20px var(--font-sans), system-ui, sans-serif; cursor: pointer">Закрыть</button></div><div id="yoo-host" style="flex: 1; display: flex; justify-content: center; padding: 24px; box-sizing: border-box"></div>';
  document.body.appendChild(ov);
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  ov.querySelector('button').onclick = close;
  const w = new window.YooMoneyCheckoutWidget({
    confirmation_token: token,
    return_url: returnUrl,
    error_callback: () => { close(); cb.fail(); },
  });
  w.on('success', () => { close(); cb.ok(); });
  w.render('yoo-host');
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      me: null, bot: null, meErr: false,
      tx: [], txLoaded: false, txErr: false,
      busy: '', botMsg: null, botFail: '', botFailAct: '', daMsg: null, showToken: false, advOpen: false,
      acctTheme: undefined, acctThemeErr: false, ask: null, askErr: '', askBusy: false,
      payBusy: false, payInfo: null, payLoaded: false, planList: null,
      promoIn: '', promo: null, promoBusy: false, promoErr: '', promoDone: '',
      emailIn: null, emailBusy: false,
      confirm: false, typed: '', delErr: '', deleting: false, sec: 'account',
    };
  }

  componentDidMount() {
    this.readDaParam();
    this.loadPlans();
    this.checkPayReturn();
    this.load();
    this.loadTx();
    this.loadAcctTheme();
    this.onScroll = () => {
      if (this.raf) return;
      this.raf = requestAnimationFrame(() => { this.raf = 0; this.spy(); });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (this.state.ask && !this.state.askBusy) this.closeAsk();
      else if (this.state.confirm && !this.state.deleting) this.closeDelete();
    });
    // Баланс могли пополнить, пока вкладка была в фоне
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && this.state.me) { this.reloadMe(); this.loadTx(); }
    });
    this.spy();
  }

  readDaParam() {
    let p;
    try { p = new URLSearchParams(location.search); } catch (e) { return; }
    const da = p.get('da');
    if (!da) return;
    if (da === 'connected') this.setState({ daMsg: { ok: true } });
    else {
      const reason = p.get('reason') || (da.indexOf('error_') === 0 ? da.slice(6) : '');
      this.setState({ daMsg: { ok: false, text: STRE_DA_ERR[reason] || 'Не удалось подключить DonationAlerts. Попробуй ещё раз.' } });
    }
    p.delete('da'); p.delete('reason');
    const q = p.toString();
    try { history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash); } catch (e) { /* ничего */ }
  }

  async load() {
    try {
      const m = await StreAPI.me();
      if (!m || !m.user) return; // api.js отправит на вход через Twitch
      this.setState({ me: m.user, bot: m.bot || null, meErr: false });
      if (location.hash && !this.scrolled) {
        this.scrolled = true;
        const el = document.getElementById(location.hash.slice(1));
        if (el) requestAnimationFrame(() => el.scrollIntoView());
      }
    } catch (e) { this.setState({ meErr: true }); }
  }
  retryMe() { this.setState({ meErr: false }); this.load(); }

  async reloadMe() {
    try {
      const m = await StreAPI.refreshMe();
      if (!m || !m.user) return;
      if (JSON.stringify(m.user) !== JSON.stringify(this.state.me) || JSON.stringify(m.bot) !== JSON.stringify(this.state.bot)) this.setState({ me: m.user, bot: m.bot || null });
    } catch (e) { /* покажем старые данные */ }
  }

  // Список тарифов с сервера (тот же источник, что plans.php); если ответа нет, берём запасной
  loadPlans() {
    StreAPI.get('plans')
      .then((r) => this.setState({ payInfo: r.pay || { enabled: false }, planList: Array.isArray(r.items) && r.items.length ? r.items : null, payLoaded: true }))
      .catch(() => this.setState({ payInfo: null, payLoaded: true }));
  }
  plansSrc() {
    const s = this.state;
    if (!s.planList) return STRE_PLANS;
    const fb = {};
    STRE_PLANS.forEach((p) => { fb[p.key] = p; });
    return s.planList.filter((x) => fb[x.key]).map((x) => Object.assign({}, fb[x.key], {
      name: x.name || fb[x.key].name,
      price: Number(x.price),
      commands: Number(x.commands),
      widgets: Number(x.widgets),
      music: !!x.music,
      history: Number(x.history_days) || fb[x.key].history,
    }));
  }
  planName(key) {
    const p = this.plansSrc().find((x) => x.key === key);
    return p ? p.name : 'Тариф';
  }

  // Возврат с платёжной страницы ЮKassa: сервер сам проверяет платёж и зачисляет деньги
  async checkPayReturn() {
    if (!/[?&]pay=return/.test(location.search)) return;
    history.replaceState(null, '', location.pathname + location.hash);
    try {
      const r = await StreAPI.post('pay.check', {});
      if (r.credited) { StreAPI.toast('Тариф оплачен и включён'); this.reloadMe(); this.loadTx(); }
      else StreAPI.toast('Платёж ещё обрабатывается. Тариф включится, когда ЮKassa подтвердит оплату');
    } catch (e) { StreAPI.toast(e.message, 'error'); }
  }

  // Промокоды: проверка и применение. Бесплатный код включает тариф сразу, скидка запоминается до оплаты
  async promoSubmit(e) {
    if (e && e.preventDefault) e.preventDefault();
    const code = this.state.promoIn.trim();
    if (!code) { this.setState({ promoErr: 'Введи промокод, который тебе дали.', promoDone: '' }); return; }
    this.setState({ promoBusy: true, promoErr: '', promoDone: '' });
    try {
      const r = await StreAPI.post('promo.apply', { code: code });
      if (r.free) {
        const name = this.planName(r.plan);
        const days = Number(r.days) || 0;
        this.setState({ promoIn: '', promo: null, promoDone: 'Тариф «' + name + '» включён на ' + days + ' ' + streDays(days, 'день', 'дня', 'дней') + ' и уже действует. Он виден в блоке «Твой тариф сейчас» выше.' });
        StreAPI.toast('Тариф «' + name + '» включён');
        await this.reloadMe(); this.loadTx();
      } else {
        this.setState({ promo: r, promoIn: '' });
        StreAPI.toast('Скидка ' + r.percent + '% применена');
      }
    } catch (err) {
      this.setState({ promoErr: err.message || 'Промокод не сработал. Проверь написание и попробуй ещё раз.' });
    }
    this.setState({ promoBusy: false });
  }
  promoClear() { this.setState({ promo: null }); }

  async saveEmail(e) {
    if (e && e.preventDefault) e.preventDefault();
    const email = this.state.emailIn === null ? (this.state.me.email || '') : this.state.emailIn;
    this.setState({ emailBusy: true });
    try {
      await StreAPI.post('account.email', { email: email.trim() });
      StreAPI.toast('Email сохранён');
      this.setState({ emailIn: null });
      await this.reloadMe();
    } catch (err) { StreAPI.toast(err.message, 'error'); }
    this.setState({ emailBusy: false });
  }

  // Оплата тарифа: виджет ЮKassa открывается поверх всего экрана
  async startPay(p, code) {
    this.setState({ payBusy: true });
    try {
      const r = await StreAPI.post('pay.create', { plan: p.key, code: code || '' });
      await loadYooWidget();
      this.setState({ payBusy: false });
      openYooPay(r.token, r.returnUrl, {
        ok: async () => { // виджет сообщил об оплате: сервер сам проверит платёж и включит тариф
          try {
            const c = await StreAPI.post('pay.check', {});
            if (c.credited) { StreAPI.toast('Тариф «' + p.name + '» включён'); this.setState({ promo: null }); await this.reloadMe(); this.loadTx(); }
            else StreAPI.toast('Платёж ещё обрабатывается. Тариф включится, как только ЮKassa подтвердит оплату');
          } catch (e) { StreAPI.toast(e.message, 'error'); }
        },
        fail: () => StreAPI.toast('Оплата не прошла. Попробуй ещё раз или выбери другой способ', 'error'),
      });
    } catch (e) { this.setState({ payBusy: false }); StreAPI.toast(e.message, 'error'); }
  }

  async loadTx() {
    try {
      const r = await StreAPI.get('account.transactions');
      const items = r.items || [];
      if (!this.state.txLoaded || this.state.txErr || JSON.stringify(items) !== JSON.stringify(this.state.tx)) this.setState({ tx: items, txLoaded: true, txErr: false });
    } catch (e) { this.setState({ txLoaded: true, txErr: true }); }
  }
  retryTx() { this.setState({ txLoaded: false, txErr: false }); this.loadTx(); }

  async loadAcctTheme() {
    this.setState({ acctThemeErr: false });
    try {
      const r = await StreAPI.get('account.theme');
      this.setState({ acctTheme: r.theme && typeof r.theme === 'object' ? r.theme : null, acctThemeErr: false });
      return r.theme || null;
    } catch (e) { this.setState({ acctThemeErr: true }); return null; }
  }

  spy() {
    let cur = STRE_GROUPS[0][0];
    for (const [id] of STRE_GROUPS) {
      const el = document.getElementById(id);
      if (el && el.getBoundingClientRect().top <= 170) cur = id;
    }
    const doc = document.documentElement;
    if (window.innerHeight + window.scrollY >= doc.scrollHeight - 4) cur = STRE_GROUPS[STRE_GROUPS.length - 1][0];
    if (cur !== this.state.sec) this.setState({ sec: cur });
  }

  // ---------- модальные окна ----------
  openAsk(ask) {
    this.lastFocus = document.activeElement;
    this.setState({ ask: Object.assign({ no: 'Отмена', cls: 'bp' }, ask), askErr: '', askBusy: false });
    setTimeout(() => { const b = document.getElementById('ask-no'); if (b) b.focus(); }, 0);
  }
  closeAsk() {
    this.setState({ ask: null, askErr: '', askBusy: false });
    this.restoreFocus();
  }
  restoreFocus() {
    const f = this.lastFocus;
    this.lastFocus = null;
    setTimeout(() => { if (f && document.contains(f) && !f.disabled) f.focus(); }, 0);
  }
  async runAsk() {
    const a = this.state.ask;
    if (!a || this.state.askBusy) return;
    this.setState({ askBusy: true, askErr: '' });
    try {
      await a.run();
      this.setState({ ask: null, askBusy: false });
      this.restoreFocus();
    } catch (e) { this.setState({ askBusy: false, askErr: e.message }); }
  }
  openDelete() {
    this.lastFocus = document.activeElement;
    this.setState({ confirm: true, typed: '', delErr: '' });
    setTimeout(() => { const i = document.getElementById('cf-in'); if (i) i.focus(); }, 0);
  }
  closeDelete() {
    this.setState({ confirm: false, typed: '', delErr: '' });
    this.restoreFocus();
  }

  // ---------- бот ----------
  async enableBot() {
    const me = this.state.me;
    if (!me || this.state.busy) return;
    this.setState({ busy: 'botOn', botFail: '', botFailAct: '', botMsg: null });
    try {
      const r = await StreAPI.post('bot.enable');
      const errors = r.errors || [];
      this.setState({ botMsg: { moderator: r.moderator !== false, errors } });
      StreAPI.toast(errors.length ? 'Бот включён, но не всё получилось. Причины — в блоке «Бот в канале»' : 'Бот подключён к каналу', errors.length ? 'error' : undefined);
      await this.reloadMe();
    } catch (e) {
      this.setState({ botFail: e.message, botFailAct: 'on' });
    }
    this.setState({ busy: '' });
  }
  async disableBot() {
    const me = this.state.me;
    if (!me || this.state.busy) return;
    // оптимистично: бот сразу показан выключенным, при ошибке вернём как было
    this.setState({ busy: 'botOff', botFail: '', botFailAct: '', botMsg: null, me: Object.assign({}, me, { botEnabled: false, botError: null }) });
    try {
      await StreAPI.post('bot.disable');
      StreAPI.toast('Бот отключён от канала');
      await this.reloadMe();
    } catch (e) {
      this.setState({ me, botFail: e.message, botFailAct: 'off' });
    }
    this.setState({ busy: '' });
  }

  // ---------- тариф ----------
  askBuy(p) {
    const me = this.state.me;
    if (!me) return;
    const now = Date.now() / 1000;
    const same = me.plan === p.key;
    const base = same && me.planUntil > now ? me.planUntil : now;
    const pr = this.state.promo && this.state.promo.plan === p.key ? this.state.promo : null;
    const until = StreAPI.fmtDate(base + (pr && pr.days ? pr.days : 30) * 86400);
    const price = pr ? Math.round(p.price * (100 - pr.percent) / 100) : p.price;
    let text = 'Оплата ' + streRub(price) + ' картой или через СБП, ЮKassa проведёт платёж. ';
    if (pr) text += 'Скидка ' + pr.percent + '% по промокоду ' + pr.code + '. ';
    if (same) text += 'Тариф продлится до ' + until + '.';
    else {
      text += 'Тариф «' + p.name + '» включится сразу после оплаты и будет действовать до ' + until + '.';
      if (me.plan !== 'free') text += me.planUntil > 0 ? ' Оставшиеся дни тарифа «' + me.planName + '» (до ' + StreAPI.fmtDate(me.planUntil) + ') не переносятся.' : ' Бессрочный тариф «' + me.planName + '» заменится.';
    }
    this.openAsk({
      title: (same ? 'Продлить' : 'Оплатить') + ' «' + p.name + '»?',
      text, yes: 'Перейти к оплате · ' + streRub(price), cls: 'bp',
      run: () => this.startPay(p, pr ? pr.code : ''),
    });
  }

  // ---------- подключения, ключ, тема ----------
  askDaDisconnect() {
    const me = this.state.me;
    this.openAsk({
      title: 'Отключить DonationAlerts?',
      text: 'Новые донаты перестанут приходить в алерты, цель сбора и топ донатеров' + (me && me.daName ? ' (аккаунт ' + me.daName + ')' : '') + '. Подключить снова можно в любой момент.',
      yes: 'Отключить', cls: 'bp',
      run: async () => {
        await StreAPI.post('account.da.disconnect');
        await this.reloadMe();
        this.setState({ daMsg: null });
        StreAPI.toast('DonationAlerts отключён');
      },
    });
  }
  askResetToken() {
    this.openAsk({
      title: 'Сбросить ключ для OBS?',
      text: 'Создадим новый ключ. Виджеты, которые сейчас добавлены в OBS по старым ссылкам, сразу перестанут работать. Новые ссылки нужно будет вставить заново из раздела «Виджеты».',
      yes: 'Сбросить ключ', cls: 'bd',
      run: async () => {
        await StreAPI.post('account.widgetToken');
        await this.reloadMe();
        StreAPI.toast('Ключ обновлён. Вставь новые ссылки в OBS.');
      },
    });
  }
  async copy(text) {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
      ta.remove();
    }
    StreAPI.toast(ok ? 'Ключ скопирован' : 'Не получилось скопировать. Нажми «Показать» и выдели ключ вручную', ok ? undefined : 'error');
  }
  async saveTheme() {
    if (!window.StreTheme || this.state.busy) return;
    const t = window.StreTheme.get();
    this.setState({ busy: 'theme' });
    try {
      await StreAPI.post('account.theme', { theme: t });
      const saved = Object.assign({}, t);
      delete saved.image;
      this.setState({ acctTheme: saved });
      StreAPI.toast(t.bgType === 'image' ? 'Тема сохранена в аккаунт. Картинка фона осталась только в этом браузере.' : 'Тема сохранена в аккаунт');
    } catch (e) { StreAPI.toast(e.message, 'error'); }
    this.setState({ busy: '' });
  }
  askLoadTheme() {
    this.openAsk({
      title: 'Применить тему из аккаунта?',
      text: 'Текущее оформление в этом браузере заменится темой, сохранённой в аккаунте.',
      yes: 'Применить', cls: 'bp',
      run: async () => {
        const r = await StreAPI.get('account.theme');
        if (!r.theme || typeof r.theme !== 'object') { this.setState({ acctTheme: null }); throw new Error('В аккаунте нет сохранённой темы'); }
        const t = Object.assign({}, r.theme);
        delete t.image;
        const local = window.StreTheme.get();
        if (t.bgType === 'image' && !local.image) t.bgType = 'solid';
        window.StreTheme.set(t);
        this.setState({ acctTheme: r.theme });
        StreAPI.toast('Тема из аккаунта применена');
      },
    });
  }

  toggleAdv() { this.setState({ advOpen: !this.state.advOpen }); }

  async doDelete(e) {
    if (e && e.preventDefault) e.preventDefault();
    const me = this.state.me;
    const typed = this.state.typed.trim();
    if (!me || this.state.deleting || typed.toLowerCase() !== me.login.toLowerCase()) return;
    this.setState({ deleting: true, delErr: '' });
    try {
      await StreAPI.post('account.delete', { confirm: typed });
      location.href = 'index.html';
    } catch (err) { this.setState({ deleting: false, delErr: err.message }); }
  }

  renderVals() {
    const s = this.state;
    const me = s.me;
    const bot = (s.bot && s.bot.login) || 'streopsbot';
    const now = Date.now() / 1000;
    const L = 'Загружаем…';
    const hasMe = !!me;
    const meLoading = !me && !s.meErr;
    const meFailed = !me && !!s.meErr;
    const isPaid = !!me && me.plan !== 'free';

    // профиль
    const initials = me ? ((me.name || me.login).replace(/[^A-Za-zА-Яа-яЁё0-9]/g, '').slice(0, 2).toUpperCase() || '?') : '';
    const twStatus = me ? 'Подключено как ' + me.login : (s.meErr ? 'Не удалось проверить вход' : L);

    // бот
    const errs = me && me.botEnabled && me.botError ? String(me.botError).split('; ').filter(Boolean) : [];
    const botReady = !!(s.bot && s.bot.ready);
    const botOn = !!(me && me.botEnabled);
    const botBusy = s.busy === 'botOn' || s.busy === 'botOff';
    let botTitle = L, botText = '', botDot = 'background: var(--n-6)';
    if (me) {
      if (s.busy === 'botOn') { botTitle = 'Подключаем бота…'; botText = 'Назначаем ' + bot + ' модератором и подписываемся на события канала.'; botDot = 'background: var(--n-9)'; }
      else if (s.busy === 'botOff') { botTitle = 'Отключаем бота…'; botText = 'Это займёт пару секунд.'; botDot = 'background: var(--n-9)'; }
      else if (botOn && errs.length) { botTitle = 'Бот подключён, но не всё работает'; botText = 'Причины ниже. Исправь их и нажми «Подключить заново».'; botDot = 'background: transparent; border: 2px solid var(--n-12); box-sizing: border-box'; }
      else if (!botReady) { botTitle = 'Бот ждёт администратора'; botText = 'Аккаунт бота подключает администратор StreOps. Когда это сделают, здесь появится кнопка «Подключить бота». Ничего делать не нужно.'; botDot = 'background: var(--n-7)'; }
      else if (botOn) { botTitle = 'Бот в канале'; botText = bot + ' читает чат и отвечает на команды. «Отключить» остановит его, команды и настройки останутся.'; botDot = 'background: var(--n-12); box-shadow: 0 0 0 4px rgb(var(--n-13-rgb) / 0.12)'; }
      else { botTitle = 'Бот выключен'; botText = 'Нажми «Подключить бота»: он станет модератором канала и начнёт читать чат.'; botDot = 'background: var(--n-7)'; }
    }
    const botCanEnable = !!me && botReady && (s.busy === 'botOn' || (!botOn && s.busy !== 'botOff'));
    const botCanDisable = !!me && (s.busy === 'botOff' || (botOn && s.busy !== 'botOn'));
    const enableLabel = s.busy === 'botOn' ? 'Подключаем…' : (s.botFailAct === 'on' ? 'Подключить заново' : 'Подключить бота');
    const disableLabel = s.busy === 'botOff' ? 'Отключаем…' : 'Отключить';
    const botFailText = !s.botFail ? '' : s.botFailAct === 'off'
      ? 'Не получилось отключить бота: ' + s.botFail + '. Попробуй ещё раз, нажав «Отключить».'
      : 'Не получилось подключить бота: ' + s.botFail + '. Исправь причину и нажми «Подключить заново».';

    // DonationAlerts
    const daOn = !!(me && me.daConnected);
    const daOff = !daOn && !!me;
    let daMsgText = '';
    if (s.daMsg) daMsgText = s.daMsg.ok ? 'DonationAlerts подключён' + (me && me.daName ? ' как ' + me.daName : '') + '. Новые донаты появятся в алертах и виджетах.' : s.daMsg.text;
    let daHint = '';
    if (me) daHint = daOn
      ? 'Донаты попадают в алерты, цель сбора и топ донатеров. «Отключить» остановит это.'
      : 'Нужен для алертов донатов, цели сбора и топа донатеров. «Подключить» откроет DonationAlerts: там разреши доступ и вернёшься сюда.';

    // тарифы
    const payOn = !!(s.payInfo && s.payInfo.enabled);
    const payUnknown = s.payLoaded && !s.payInfo;
    const payOffNote = s.payLoaded && !!s.payInfo && !payOn;
    const planList = this.plansSrc();
    const primaryKey = isPaid ? me.plan : ((planList.find((x) => x.price > 0) || {}).key);
    const plans = planList.map((p0) => {
      const p = Object.assign({}, p0, me && me.plan === p0.key && me.limits ? { commands: me.limits.commands, widgets: me.limits.widgets, music: !!me.limits.music, history: me.limits.history_days || p0.history } : {});
      const isCur = !!me && me.plan === p.key;
      const unlimitedCur = isCur && p.price > 0 && me.planUntil === 0;
      const canBuy = !!me && p.price > 0 && !unlimitedCur && payOn;
      const pr = s.promo && s.promo.plan === p.key ? s.promo : null;
      const shown = pr ? Math.round(p.price * (100 - pr.percent) / 100) : p.price;
      let note = '';
      if (!me) note = '';
      else if (p.price === 0) note = isCur ? 'Действует без срока' : 'Включится сам, когда закончится платный тариф';
      else if (unlimitedCur) note = 'Выдан бессрочно, продлевать не нужно';
      else if (!s.payLoaded) note = 'Проверяем оплату…';
      else if (payUnknown) note = 'Не получилось проверить оплату. Обнови страницу';
      else if (!payOn) note = 'Онлайн-оплата сейчас недоступна';
      else if (isCur) note = 'Продлим с ' + StreAPI.fmtDate(me.planUntil > now ? me.planUntil : now) + ' ещё на 30 дней';
      else note = 'Оплата картой или через СБП';
      const lines = [
        { text: p.commands >= 1000 ? 'Команды: без ограничений' : 'Команды: ' + p.commands, on: true, off: false, cls: '' },
        { text: 'Виджеты для OBS: ' + (p.widgets >= 100 ? 'до ' : '') + p.widgets, on: true, off: false, cls: '' },
        { text: 'Музыка по заказу: ' + (p.music ? 'да' : 'нет'), on: !!p.music, off: !p.music, cls: p.music ? '' : 'off' },
        { text: 'История: ' + p.history + ' ' + streDays(p.history, 'день', 'дня', 'дней'), on: true, off: false, cls: '' },
      ];
      return {
        name: p.name, current: isCur,
        price: p.price ? StreAPI.fmtNum(shown) + ' ₽' : '0 ₽',
        per: p.price ? 'за 30 дней' : 'без срока',
        ring: isCur ? 'border: 2px solid var(--n-12); padding: 15px' : '',
        lines,
        canBuy, dis: s.payBusy || !!s.ask,
        btnCls: primaryKey === p.key ? 'bp' : 'bs',
        btn: (isCur ? 'Продлить · ' : 'Оплатить · ') + streRub(shown),
        descId: 'plan-' + p.key + '-n',
        note,
        buy: () => this.askBuy(p),
      };
    });
    let planUntil = L, planLimits = '';
    if (me) {
      if (me.plan === 'free') planUntil = 'Бесплатно, без срока';
      else if (me.planUntil > 0) {
        const left = Math.max(0, Math.ceil((me.planUntil - now) / 86400));
        planUntil = 'до ' + StreAPI.fmtDate(me.planUntil) + ' · ' + (left ? 'осталось ' + left + ' ' + streDays(left, 'день', 'дня', 'дней') : 'последний день');
      } else planUntil = 'бессрочно';
      const lim = me.limits || {};
      const hd = lim.history_days || 0;
      planLimits = 'Команды: ' + (lim.commands >= 1000 ? 'без ограничений' : lim.commands) + ' · виджеты: ' + lim.widgets + ' · музыка по заказу: ' + (lim.music ? 'да' : 'нет') + ' · история: ' + hd + ' ' + streDays(hd, 'день', 'дня', 'дней');
    }

    // промокод
    const pr = s.promo;
    const prPlan = pr ? planList.find((x) => x.key === pr.plan) : null;
    let promoText = '';
    if (pr && prPlan) {
      const days = pr.days || 30;
      promoText = 'Скидка ' + pr.percent + '% по коду ' + pr.code + ' на тариф «' + prPlan.name + '»: ' + streRub(prPlan.price) + ' → ' + streRub(Math.round(prPlan.price * (100 - pr.percent) / 100)) + '. Срок тарифа — ' + days + ' ' + streDays(days, 'день', 'дня', 'дней') + '. Скидка применится при оплате этого тарифа.';
    }

    // операции
    const tx = s.tx.map((t) => ({
      title: t.comment || STRE_TX[t.kind] || 'Операция',
      meta: (t.comment && STRE_TX[t.kind] ? STRE_TX[t.kind] + ' · ' : '') + StreAPI.fmtDate(t.at) + ' · ' + StreAPI.fmtTime(t.at) + ' · № ' + t.id,
      amount: t.amount === 0 ? '—' : (t.amount > 0 ? '+' : '') + streRub(t.amount),
      color: t.amount > 0 ? 'color: var(--n-12)' : 'color: var(--n-10)',
    }));
    const txLoading = !s.txLoaded;
    const txFailed = !!s.txErr;
    const txHas = s.txLoaded && tx.length > 0;
    const txEmpty = s.txLoaded && !s.txErr && !tx.length;

    // ключ виджетов
    const token = (me && me.widgetToken) || '';
    const masked = token ? '•'.repeat(Math.max(12, token.length)) : '';
    const origin = location.origin && location.origin !== 'null' ? location.origin : 'https://streops.ru';

    // тема
    let acctThemeText = 'Проверяем…';
    if (s.acctTheme === null) acctThemeText = 'В аккаунте пока нет сохранённой темы.';
    else if (s.acctTheme) {
      const prs = window.StreTheme && window.StreTheme.presets ? window.StreTheme.presets[s.acctTheme.preset] : null;
      acctThemeText = 'Сохранена тема «' + (prs ? prs.name : 'Своя') + '»' + (s.acctTheme.mode === 'light' ? ', светлая' : ', тёмная') + '.';
    }

    // удаление
    const typedOk = !!me && s.typed.trim().toLowerCase() === me.login.toLowerCase();
    let delText = 'Удалятся команды, настройки бота, таймеры, модерация, музыка, розыгрыши, донаты, статистика и история чата. Бот выйдет из канала.';
    if (isPaid) delText += ' Оплаченный тариф «' + me.planName + '» пропадёт.';
    delText += ' Отменить удаление нельзя.';

    const ask = s.ask;
    return {
      secs: STRE_GROUPS.map(([id, label]) => ({
        href: '#' + id, label, cur: s.sec === id ? 'true' : false,
        pick: () => this.setState({ sec: id }),
      })),
      hasMe, meLoading, meFailed, retryMe: () => this.retryMe(),
      noMe: !me,

      hasAvatar: !!(me && me.avatar), noAvatar: !(me && me.avatar), avatar: me ? me.avatar : '', initials,
      profName: me ? me.name : L, profLogin: me ? 'twitch.tv/' + me.login : '',
      profSince: me && me.createdAt ? 'В StreOps с ' + StreAPI.fmtDate(me.createdAt) : '',
      fLogin: me ? me.login : '', fName: me ? me.name : '',
      twStatus,

      emailIn: s.emailIn === null ? (me && me.email ? me.email : '') : s.emailIn,
      setEmailIn: (e) => this.setState({ emailIn: e.target.value }),
      emailSubmit: (e) => this.saveEmail(e),
      emailOff: !me || s.emailBusy,
      emailBtn: s.emailBusy ? 'Сохраняем…' : 'Сохранить',

      acctThemeFailed: !!s.acctThemeErr, acctThemeOk: !s.acctThemeErr, acctThemeText,
      retryAcctTheme: () => this.loadAcctTheme(),
      openTheme: () => { if (window.StreTheme) window.StreTheme.open(); },
      resetTheme: () => this.openAsk({
        title: 'Вернуть тему «Графит»?',
        text: 'Вернём стандартную тему «Графит» в этом браузере. Тема, сохранённая в аккаунте, не изменится.',
        yes: 'Вернуть', cls: 'bp',
        run: async () => { if (window.StreTheme) window.StreTheme.reset(); StreAPI.toast('Оформление сброшено к «Графиту»'); },
      }),
      themeBusy: s.busy === 'theme' || !me,
      saveThemeLabel: s.busy === 'theme' ? 'Сохраняем…' : 'Сохранить тему в аккаунт',
      saveTheme: () => this.saveTheme(),
      cantLoadTheme: !s.acctTheme,
      loadTheme: () => this.askLoadTheme(),

      botSub: 'Бот ' + bot + ' отвечает на команды, ставит музыку, проводит розыгрыши и модерирует чат твоего канала.',
      botTitle, botText, botDot, botBusy: botBusy || !me,
      botCanEnable, botCanDisable,
      enableBot: () => this.enableBot(), disableBot: () => this.disableBot(),
      enableLabel, disableLabel,
      botRetryLabel: s.busy === 'botOn' ? 'Подключаем…' : 'Подключить заново',
      hasBotFail: !!s.botFail, botFailText,
      hasBotErrors: !botBusy && errs.length > 0, botErrors: errs.map((t) => ({ text: t })),
      modHint: bot + ' станет модератором твоего канала при подключении. Без этого он не сможет удалять сообщения и выдавать таймауты.',
      modFailed: !!(s.botMsg && !s.botMsg.moderator),
      modFailText: 'Не получилось назначить ' + bot + ' модератором. Сделай это вручную: напиши в своём чате /mod ' + bot,

      daOn, daOff, daHint,
      daStatus: !me ? (s.meErr ? 'Не удалось проверить' : L) : (daOn ? 'Подключено' + (me.daName ? ' как ' + me.daName : '') : 'Не подключено'),
      daStatusStyle: daOn ? '' : 'color: var(--n-9)',
      daIconStyle: daOn ? '' : 'border-style: dashed; color: var(--n-9)',
      daBusy: !!s.ask,
      daDisconnect: () => this.askDaDisconnect(),
      hasDaMsg: !!s.daMsg, daMsgText, daMsgRole: s.daMsg && !s.daMsg.ok ? 'alert' : 'status', daMsgCls: s.daMsg && !s.daMsg.ok ? 'err' : 'note',
      hideDaMsg: () => this.setState({ daMsg: null }),

      planName: me ? me.planName : L, planUntil, planLimits, isPaid,
      promoHas: !!pr && !!prPlan, promoText, promoClear: () => this.promoClear(),
      promoIn: s.promoIn, setPromoIn: (e) => this.setState({ promoIn: e.target.value }),
      promoSubmit: (e) => this.promoSubmit(e), promoBusy: !!s.promoBusy,
      promoBtn: s.promoBusy ? 'Проверяем…' : 'Применить',
      hasPromoErr: !!s.promoErr, promoErr: s.promoErr,
      hasPromoDone: !!s.promoDone, promoDone: s.promoDone,
      payUnknown, payOffNote,
      plans,
      txLoading, txFailed, retryTx: () => this.retryTx(), txEmpty, txHas, tx,

      advOpen: s.advOpen, advExp: s.advOpen ? 'true' : 'false', advLabel: s.advOpen ? 'Свернуть' : 'Показать',
      toggleAdv: () => this.toggleAdv(),
      tokenShown: !token ? (me ? 'Ключа пока нет' : L) : (s.showToken ? token : masked),
      noToken: !token,
      showTokenLabel: s.showToken ? 'Скрыть' : 'Показать',
      toggleToken: () => this.setState({ showToken: !s.showToken }),
      copyToken: () => this.copy(token),
      linkExample: origin + '/w/?t=' + (token && s.showToken ? token : '••••') + '&w=alerts',
      tokenBusy: !me,
      resetToken: () => this.askResetToken(),

      hasAsk: !!ask, ask: ask || {},
      hasAskErr: !!s.askErr, askErr: s.askErr, askBusy: s.askBusy,
      askYesLabel: s.askBusy ? 'Секунду…' : (ask ? ask.yes : ''),
      askYes: () => this.runAsk(),
      closeAsk: () => { if (!s.askBusy) this.closeAsk(); },
      askBackdrop: (e) => { if (e.target === e.currentTarget && !s.askBusy) this.closeAsk(); },

      confirm: s.confirm,
      openDelete: () => this.openDelete(),
      closeConfirm: () => { if (!s.deleting) this.closeDelete(); },
      delBackdrop: (e) => { if (e.target === e.currentTarget && !s.deleting) this.closeDelete(); },
      delTitle: 'Удалить аккаунт ' + (me ? me.login : '') + '?',
      delText, myLogin: me ? me.login : '',
      typed: s.typed,
      setTyped: (e) => this.setState({ typed: e.target.value, delErr: '' }),
      delInvalid: !!s.delErr,
      hasDelErr: !!s.delErr, delErr: s.delErr,
      cantDelete: !typedOk || s.deleting,
      delLabel: s.deleting ? 'Удаляем…' : 'Удалить навсегда',
      doDelete: (e) => this.doDelete(e),
    };
  }
}
DCMount(Component);
</script>
</body>
</html>
