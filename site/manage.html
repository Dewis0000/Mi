<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — управлять каналом</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js?v=460ce522"></script>
<script src="assets/api.js?v=aea5953e"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.card{background:rgb(var(--n-2-rgb) / .62);border:1px solid rgb(var(--n-13-rgb) / .10);border-radius:12px;padding:20px 24px;min-width:0;box-sizing:border-box}
.h2{margin:0;font-size:18px;line-height:24px;font-weight:600}
.hint{margin:6px 0 0;font-size:13px;line-height:18px;color:var(--n-9)}
.bp{height:40px;padding:0 16px;border-radius:6px;border:0;background:var(--n-13);color:var(--n-1);font:500 14px/20px var(--font-sans),system-ui,sans-serif;cursor:pointer}
.bp:disabled{opacity:.4;cursor:default}
.bs{height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);font:500 14px/20px var(--font-sans),system-ui,sans-serif;cursor:pointer}
.bs:hover{border-color:var(--n-9)}
.bs:disabled{opacity:.4;cursor:default}
.bs[role="tab"][aria-selected="true"]{border-color:var(--n-12);background:rgb(var(--n-13-rgb) / .08)}
.bsm{height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-11);font:500 13px/18px var(--font-sans),system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.bsm:hover{border-color:var(--n-9);color:var(--n-12)}
.bsm:disabled{opacity:.4;cursor:default}
.bd{height:40px;padding:0 16px;border-radius:6px;border:0;background:var(--accent);color: var(--accent-on);font:500 14px/20px var(--font-sans),system-ui,sans-serif;cursor:pointer}
.bd:disabled{opacity:.4;cursor:default}
.fl{display:flex;flex-direction:column;gap:8px}
.lab{font-size:13px;line-height:18px;font-weight:500;color:var(--n-11)}
.inp{height:40px;box-sizing:border-box;padding:0 12px;border-radius:6px;background:var(--s-3);border:1px solid var(--n-8);color:var(--n-12);font:400 15px/22px var(--font-sans),sans-serif;width:100%}
.inp:hover{border-color:var(--n-9)}
.sw{position:relative;width:40px;height:24px;border-radius:999px;border:1px solid var(--n-8);background:transparent;cursor:pointer;flex:none;padding:0}
.sw span{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:var(--n-9);transition:transform 180ms cubic-bezier(.2,0,0,1)}
.sw[aria-checked="true"]{background:var(--n-13);border-color:var(--n-13)}
.sw[aria-checked="true"] span{transform:translateX(16px);background:var(--n-1)}
.sw:disabled{opacity:.4;cursor:default}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:8px;border:1px solid var(--n-5)}
.errbox{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--n-6);border-radius:8px}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none;white-space:nowrap;overflow:hidden}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
.sb-search{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;margin:0 0 8px;border:1px solid var(--n-6);border-radius:8px;background:rgb(var(--n-13-rgb) / .03);color:var(--n-9)}
.sb-search:focus-within{border-color:var(--n-12)}
.sb-search input{flex:1;min-width:0;min-width:0;border:0;outline:0;background:transparent;color:var(--n-12);font:400 14px/20px 'Onest',sans-serif;padding:0}
.sb-search input::placeholder{color:var(--n-9)}
.sb-search input::-webkit-search-cancel-button{display:none}
.sb-search kbd{font:400 10px/1 'JetBrains Mono',monospace;margin-left:auto;color:var(--n-9);border:1px solid var(--n-6);border-radius:4px;padding:2px 5px;white-space:nowrap}
.sb-empty{margin:8px 12px;font-size:13px;color:var(--n-9)}
.sb-hide{display:none!important}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var nav = document.querySelector('nav.sb'), box = nav && nav.querySelector('[data-sb-search]');
  if (!box) return;
  var empty = nav.querySelector('[data-sb-empty]');
  function apply() {
    var q = box.value.trim().toLowerCase(), any = false, group = null, groupHit = false;
    var rows = Array.prototype.slice.call(nav.children).filter(function (el) { return el.matches('a.sb-i, span.sb-i, p.sb-h, div.sb-sep'); });
    rows.forEach(function (el) {
      if (el.matches('p.sb-h')) { if (group) group.classList.toggle('sb-hide', !groupHit && !!q); group = el; groupHit = false; el.classList.remove('sb-hide'); return; }
      if (el.matches('div.sb-sep')) { el.classList.toggle('sb-hide', !!q); return; }
      var hit = !q || (el.textContent + ' ' + (el.getAttribute('data-kw') || '')).toLowerCase().indexOf(q) !== -1;
      el.classList.toggle('sb-hide', !hit);
      if (hit) { groupHit = true; any = true; }
    });
    if (group) group.classList.toggle('sb-hide', !!q && !groupHit);
    if (empty) empty.hidden = any || !q;
  }
  box.addEventListener('input', apply);
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var first = nav.querySelector('a.sb-i:not(.sb-hide)'); if (first) location.href = first.getAttribute('href'); }
    if (e.key === 'Escape') { box.value = ''; apply(); box.blur(); }
  });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); box.focus(); box.select(); }
  });
});
</script>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<a href="settings.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; border-radius: 6px; font-size: 14px; font-weight: 500" aria-label="Профиль" data-dc-keep data-stre-user><span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, var(--n-10), var(--n-6)); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--n-1)" data-av></span><span data-name>Профиль</span><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" class="sb" data-dc-keep>
<label class="sb-search"><svg class="sb-ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" data-sb-search placeholder="Поиск" aria-label="Найти раздел" autocomplete="off"><kbd>Ctrl K</kbd></label><p class="sb-empty" data-sb-empty hidden>Такого раздела нет</p>
<p class="sb-h">Сегодня</p>
<a href="panel.html" class="sb-i" data-kw="главная статистика эфир статус"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Старт</a>
<p class="sb-h">Чат</p>
<a href="moderation.html" class="sb-i" data-kw="фильтр чат удалить бан таймаут проверка"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<a href="mods.html" class="sb-i" data-kw="мод модераторы помощник права журнал"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Помощники</a>
<a href="commands.html" class="sb-i" data-kw="команда ответ чат кулдаун"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды</a>
<a href="timers.html" class="sb-i" data-kw="таймер сообщение напоминание"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6M12 2v3"/></svg>Таймеры</a>
<p class="sb-h">Музыка</p>
<a href="music.html" class="sb-i" data-kw="музыка трек плеер заказ очередь песня"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Очередь и заказы</a>
<a href="manage.html" class="sb-i" aria-current="page" data-kw="помощник канал трек музыка добавить"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Управлять каналом</a>
<p class="sb-h">Эфир и сайт</p>
<a href="widgets.html" class="sb-i" data-kw="виджет obs браузер ссылка чат розыгрыш"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты для OBS</a>
<a href="site-settings.html" class="sb-i" data-kw="сайт подписчики видео значок галочка модератор"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Мой сайт</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i" data-kw="розыгрыш приз участники победитель"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<a href="clips.html" class="sb-i" data-kw="нарезка клип момент видео"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 9-12 9z"/><path d="M3 3v18"/></svg>Нарезки</a>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i" data-kw="тариф оплата аккаунт email промокод"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
<a href="support.html" class="sb-i" data-kw="помощь вопрос обращение"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Поддержка</a>
</nav>
<div style="flex: 999 1 640px; min-width: 0">
<nav aria-label="Хлебные крошки"><ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px"><li><a href="panel.html" style="color: var(--n-9)">Стрим-панель</a></li><li aria-hidden="true" style="color: var(--n-7)">/</li><li aria-current="page" style="color: var(--n-12)">Управлять каналом</li></ol></nav>
<div style="margin-top: 16px"><h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Управлять каналом</h1><p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: var(--n-10)">Раздел для помощников. Здесь ты ведёшь музыку на канале, где тебя добавили: пропускаешь треки, одобряешь заказы, включаешь и выключаешь заказы. Настройки канала здесь не меняются.</p></div>

<template data-if="chLoading"><p role="status" class="card" style="margin: 24px 0 0; font-size: 14px; color: var(--n-9)">Загружаем каналы…</p></template>

<template data-if="chErrShow"><div role="alert" class="card errbox" style="margin-top: 24px"><p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--n-11)">Не удалось загрузить каналы. {{ chErrText }}</p><button type="button" class="bs" onClick="{{ retryCh }}">Повторить</button></div></template>

<template data-if="noChannels"><section class="card" aria-labelledby="nc-t" style="margin-top: 24px; padding: 32px 24px; border-style: dashed; border-color: var(--n-6); text-align: center">
<h2 id="nc-t" class="h2">Ты пока не помощник ни на одном канале</h2>
<p style="margin: 10px auto 0; max-width: 480px; font-size: 14px; line-height: 22px; color: var(--n-10)">Стример добавляет помощников в своей панели StreOps: раздел «Помощники», поле «Ник Twitch». Попроси его добавить твой ник. Когда он это сделает, канал появится здесь.</p>
<button type="button" class="bp" onClick="{{ retryCh }}" style="margin-top: 18px">Проверить ещё раз</button>
</section></template>

<template data-if="hasChannels">
<section class="card" aria-labelledby="ctx-t" style="margin-top: 24px">
<h2 id="ctx-t" class="h2">Ты помощник на канале <span style="color: var(--accent-on)">{{ selName }}</span></h2>
<p class="hint mono" style="margin-top: 4px">twitch.tv/{{ selLogin }}</p>

<template data-if="hasMany"><div style="margin-top: 16px">
<p class="hint" style="margin-top: 0">Каналов несколько. Нажми на нужный, чтобы переключиться:</p>
<div role="tablist" aria-label="Каналы, где ты помощник" style="margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap">
<template data-for="chTabs" data-as="c"><button type="button" role="tab" class="bs" aria-selected="{{ c.sel }}" onClick="{{ c.pick }}" style="height: 36px; padding: 0 14px">{{ c.label }}</button></template>
</div></div></template>

<template data-if="netShow"><div role="status" class="row" style="margin-top: 14px; padding: 10px 12px"><span style="font-size: 14px; color: var(--n-11)">{{ netText }}</span><button type="button" class="bsm" onClick="{{ reloadState }}">Повторить</button></div></template>
</section>
</template>

<template data-if="stLoading"><p role="status" class="card" style="margin: 16px 0 0; font-size: 14px; color: var(--n-9)">Загружаем очередь…</p></template>

<template data-if="stErrShow"><div role="alert" class="card errbox" style="margin-top: 16px"><p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--n-11)">{{ stErrText }}</p><button type="button" class="bs" onClick="{{ reloadState }}">Повторить</button></div></template>

<template data-if="hasState">

<section class="card" aria-labelledby="or-t" style="margin-top: 16px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<h2 id="or-t" class="h2">Заказы музыки</h2>
<div style="display: flex; align-items: center; gap: 10px"><span style="font-size: 14px; color: var(--n-11)">{{ ordersLabel }}</span><button type="button" role="switch" class="sw" aria-checked="{{ ordersOn }}" aria-label="Заказы музыки: {{ ordersLabel }}" onClick="{{ toggleOrders }}" disabled="{{ busyOff }}"><span></span></button></div>
</div>
<p class="hint">{{ ordersNote }}</p>
</section>

<section class="card" aria-labelledby="np-t" style="margin-top: 16px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap"><h2 id="np-t" class="h2">Сейчас играет</h2><button type="button" class="bp" onClick="{{ skip }}" disabled="{{ skipOff }}">Пропустить трек</button></div>
<p style="margin: 10px 0 0; font-size: 15px; line-height: 22px; color: var(--n-12)">{{ playingText }}</p>
<p class="hint">{{ skipNote }}</p>
</section>

<section class="card" aria-labelledby="pa-t" style="margin-top: 16px">
<h2 id="pa-t" class="h2">Добавить трек</h2>
<p class="hint">Вставь ссылку на YouTube или напиши название. Трек встанет в конец очереди. Добавлять треки можно, если на канале есть музыка по тарифу «Про» и выше.</p>
<form onSubmit="{{ addTrack }}" style="margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end">
<div class="fl" style="flex: 1 1 260px; min-width: 0"><label for="tr-in" class="lab">Ссылка или название трека</label><input id="tr-in" class="inp" value="{{ addQuery }}" onInput="{{ setAddQuery }}" maxlength="300" placeholder="https://youtube.com/… или название"></div>
<button type="submit" class="bs" disabled="{{ addOff }}">Добавить в очередь</button>
</form>
</section>

<section class="card" aria-labelledby="pq-t" style="margin-top: 16px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap"><div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap"><h2 id="pq-t" class="h2">Очередь</h2><span class="mono" style="font-size: 13px; color: var(--n-9)">{{ queueCount }}</span></div><button type="button" class="bd" onClick="{{ clearQ }}" disabled="{{ noQueueOff }}">Очистить очередь</button></div>
<p class="hint">Что делают кнопки под треком: «В начало» — трек станет первым. «Вверх» и «Вниз» — сдвинут на одно место. «Сыграть сейчас» — трек начнётся сразу, текущий перестанет играть. «Убрать» — трек уйдёт из очереди.</p>

<template data-if="noQueue"><div style="margin-top: 14px; padding: 20px; border: 1px dashed var(--n-6); border-radius: 8px; text-align: center"><p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--n-11)">Очередь пуста. Добавь трек выше или дождись заказов от зрителей.</p><button type="button" class="bs" onClick="{{ goAdd }}" style="margin-top: 12px; height: 36px">Перейти к добавлению</button></div></template>

<ul style="list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<template data-for="queueRows" data-as="q"><li class="row"><span style="min-width: 0; font-size: 14px; line-height: 20px"><span style="color: var(--n-12)">{{ q.title }}</span> <span style="color: var(--n-9)">{{ q.by }}</span></span><span style="display: flex; gap: 6px; flex-wrap: wrap"><button type="button" class="bsm" onClick="{{ q.top }}" disabled="{{ busyOff }}" aria-label="В начало: {{ q.title }}">В начало</button><button type="button" class="bsm" onClick="{{ q.up }}" disabled="{{ q.upOff }}" aria-label="Вверх: {{ q.title }}">Вверх</button><button type="button" class="bsm" onClick="{{ q.down }}" disabled="{{ q.downOff }}" aria-label="Вниз: {{ q.title }}">Вниз</button><button type="button" class="bsm" onClick="{{ q.playNow }}" disabled="{{ busyOff }}" aria-label="Сыграть сейчас: {{ q.title }}">Сыграть сейчас</button><button type="button" class="bsm" onClick="{{ q.remove }}" disabled="{{ busyOff }}" aria-label="Убрать из очереди: {{ q.title }}">Убрать</button></span></li></template>
</ul>
</section>

<section class="card" aria-labelledby="pe-t" style="margin-top: 16px">
<h2 id="pe-t" class="h2">Ждут одобрения</h2>
<p class="hint">Заказы зрителей, которые ждут решения. «Одобрить» — трек встанет в конец очереди. «Отклонить» — заказ отменяется. Если заказ был оплачен наградой Twitch, зрителю вернут награду.</p>
<template data-if="noPending"><p style="margin: 14px 0 0; font-size: 14px; line-height: 20px; color: var(--n-9)">Новых заказов нет. Когда зритель закажет трек, который нужно одобрить, он появится здесь.</p></template>
<ul style="list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<template data-for="pendRows" data-as="p"><li class="row"><span style="min-width: 0; font-size: 14px; line-height: 20px"><span style="color: var(--n-12)">{{ p.title }}</span> <span style="color: var(--n-9)">{{ p.by }}</span></span><span style="display: flex; gap: 6px; flex-wrap: wrap"><button type="button" class="bsm" onClick="{{ p.approve }}" disabled="{{ busyOff }}" aria-label="Одобрить: {{ p.title }}">Одобрить</button><button type="button" class="bsm" onClick="{{ p.reject }}" disabled="{{ busyOff }}" aria-label="Отклонить: {{ p.title }}">Отклонить</button></span></li></template>
</ul>
</section>

</template>
</div>
</div>
</div>
</template>
<script src="assets/dc-lite.js?v=5f8ce08a"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { channels: [], chLoaded: false, chErr: '', sel: '', st: null, stErr: '', netErr: false, stAt: 0, busy: false, addQuery: '', addBusy: false };
  }
  componentDidMount() {
    this.loadChannels();
    this.timer = setInterval(() => { if (this.state.sel && !document.hidden) this.loadState(); }, 4000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  async loadChannels() {
    this.setState({ chLoaded: false });
    try {
      const r = await StreAPI.get('manage.channels');
      const items = r.items || [];
      const cur = this.state.sel;
      const sel = items.some((c) => c.login === cur) ? cur : (items[0] ? items[0].login : '');
      this.setState({ channels: items, chLoaded: true, chErr: '', sel: sel, st: sel === cur ? this.state.st : null, stErr: '', netErr: false });
      if (sel) this.loadState();
    } catch (e) {
      this.setState({ chLoaded: true, chErr: e.message || 'Попробуй ещё раз' });
    }
  }
  // Фоновое обновление очереди. Если связь пропала, данные остаются на экране и показывается «Нет связи, данные на HH:MM»
  async loadState() {
    const ch = this.state.sel;
    if (!ch) return;
    try {
      const r = await StreAPI.get('manage.state', { channel: ch });
      if (this.state.sel === ch) this.setState({ st: r, stErr: '', netErr: false, stAt: Date.now() });
    } catch (e) {
      if (this.state.sel !== ch) return;
      const conn = /^(Нет связи|Сервер ответил)/.test(e.message || '');
      if (conn && this.state.st) this.setState({ netErr: true });
      else this.setState({ stErr: e.message || 'Попробуй ещё раз', netErr: false });
    }
  }
  pickChannel(login) {
    if (login === this.state.sel) return;
    this.setState({ sel: login, st: null, stErr: '', netErr: false });
    this.loadState();
  }
  async act(action, id) {
    if (this.state.busy) return;
    this.setState({ busy: true });
    try {
      await StreAPI.post('manage.do', { channel: this.state.sel, action: action, id: id || 0 });
      const done = { next: 'Трек пропущен', top: 'Трек поставлен в начало очереди', up: 'Трек сдвинут вверх', down: 'Трек сдвинут вниз', playnow: 'Трек запущен', remove: 'Трек убран из очереди', approve: 'Заказ одобрен, трек в очереди', reject: 'Заказ отклонён', clear: 'Очередь очищена' };
      StreAPI.toast(done[action] || 'Готово');
      await this.loadState();
    } catch (e) { StreAPI.toast(e.message, 'error'); }
    this.setState({ busy: false });
  }
  async addTrack(e) {
    if (e && e.preventDefault) e.preventDefault();
    const query = (this.state.addQuery || '').trim();
    if (!query || this.state.addBusy) return;
    this.setState({ addBusy: true });
    try {
      const r = await StreAPI.post('manage.add', { channel: this.state.sel, query: query });
      StreAPI.toast(r.message || 'Трек добавлен в очередь');
      this.setState({ addQuery: '' });
      await this.loadState();
    } catch (err) { StreAPI.toast(err.message, 'error'); }
    this.setState({ addBusy: false });
  }
  async toggleOrders() {
    if (this.state.busy) return;
    const on = !(this.state.st && this.state.st.orders);
    this.setState({ busy: true });
    try {
      await StreAPI.post('manage.do', { channel: this.state.sel, action: 'orders', on: on });
      StreAPI.toast(on ? 'Заказы музыки включены' : 'Заказы музыки выключены');
      await this.loadState();
    } catch (e) { StreAPI.toast(e.message, 'error'); }
    this.setState({ busy: false });
  }
  renderVals() {
    const s = this.state;
    const st = s.st;
    const busy = !!s.busy;
    const title = (x) => x.title || 'Трек';
    const by = (x) => (x.requester ? 'заказал ' + x.requester : '');
    const queue = st ? st.queue : [];
    const queueRows = queue.map((x, i) => ({
      title: title(x), by: by(x),
      upOff: busy || i === 0,
      downOff: busy || i === queue.length - 1,
      top: () => this.act('top', x.id),
      up: () => this.act('up', x.id),
      down: () => this.act('down', x.id),
      playNow: () => this.act('playnow', x.id),
      remove: () => this.act('remove', x.id),
    }));
    const pendRows = st ? st.pending.map((x) => ({ title: title(x), by: by(x), approve: () => this.act('approve', x.id), reject: () => this.act('reject', x.id) })) : [];
    const cur = s.channels.find((c) => c.login === s.sel);
    const chTabs = s.channels.map((c) => ({ label: c.name || c.login, sel: s.sel === c.login ? 'true' : 'false', pick: () => this.pickChannel(c.login) }));
    const playing = st ? st.playing : null;
    const noPlaying = !st || !playing;
    const orders = !!(st && st.orders);
    return {
      chLoading: !s.chLoaded,
      chErrShow: s.chLoaded && !!s.chErr,
      chErrText: s.chErr,
      retryCh: () => this.loadChannels(),
      noChannels: s.chLoaded && !s.chErr && s.channels.length === 0,
      hasChannels: s.channels.length > 0,
      hasMany: s.channels.length > 1,
      selName: cur ? (cur.name || cur.login) : '',
      selLogin: cur ? cur.login : '',
      chTabs,
      netShow: !!(st && s.netErr),
      netText: 'Нет связи, данные на ' + StreAPI.fmtTime(s.stAt / 1000),
      reloadState: () => this.loadState(),
      stLoading: !!s.sel && !st && !s.stErr,
      stErrShow: !!s.sel && !!s.stErr && (!st || !s.netErr),
      stErrText: (st ? 'Не удалось обновить очередь. ' : 'Не удалось загрузить очередь. ') + s.stErr,
      hasState: !!st,
      busyOff: busy,
      ordersOn: orders ? 'true' : 'false',
      ordersLabel: orders ? 'Включены' : 'Выключены',
      ordersNote: orders ? 'Зрители могут заказывать треки по команде в чате и через награды Twitch (заказ за баллы канала). Выключи, чтобы новые заказы перестали приниматься.' : 'Заказы выключены: зрители не могут добавлять треки. Включи, чтобы снова принимать заказы.',
      toggleOrders: () => this.toggleOrders(),
      playingText: playing ? 'Играет: ' + title(playing) + (playing.requester ? ' · заказал ' + playing.requester : '') : 'Сейчас ничего не играет',
      noPlaying,
      skipOff: busy || noPlaying,
      skipNote: noPlaying ? 'Сейчас ничего не играет, поэтому пропускать нечего.' : 'Пропустить — текущий трек сменится следующим из очереди.',
      skip: () => this.act('next'),
      addQuery: s.addQuery || '',
      setAddQuery: (e) => this.setState({ addQuery: e.target.value }),
      addOff: !!s.addBusy || busy,
      addTrack: (e) => this.addTrack(e),
      noQueue: queue.length === 0,
      noQueueOff: busy || queue.length === 0,
      queueCount: st ? (queue.length ? 'треков: ' + queue.length : 'пусто') : '',
      clearQ: () => { if (confirm('Очистить очередь? Все треки из очереди уберутся, вернуть их нельзя. Трек, который играет сейчас, не тронется.')) this.act('clear'); },
      goAdd: () => { const el = document.getElementById('tr-in'); if (el) el.focus(); },
      queueRows,
      noPending: pendRows.length === 0,
      pendRows,
    };
  }
}
DCMount(Component);
</script>
</body>
</html>
