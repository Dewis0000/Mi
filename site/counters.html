<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — счётчики</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js?v=460ce522"></script>
<script src="assets/api.js?v=4a439ce0"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ov{font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9);margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tab{height:44px;padding:0;border:0;background:transparent;color:var(--n-9);font:500 14px/20px var(--font-sans),sans-serif;display:flex;gap:6px;align-items:center;cursor:pointer}
.tab:hover{color:var(--n-12)}
.cmd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 20px;border-radius:8px;border:1px solid var(--n-5);background:var(--s-2)}
.cmd:hover{border-color:var(--n-6)}
.sw{position:relative;width:40px;height:24px;border-radius:999px;border:1px solid var(--n-8);background:transparent;cursor:pointer;flex:none;padding:0}
.sw span{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:var(--n-9);transition:transform 180ms cubic-bezier(.2,0,0,1)}
.sw[aria-checked="true"]{background:var(--n-13);border-color:var(--n-13)}
.sw[aria-checked="true"] span{transform:translateX(16px);background:var(--n-1)}
.ib{width:36px;height:36px;border-radius:6px;border:0;background:transparent;color:var(--n-10);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ib:hover{background:rgb(var(--n-13-rgb) / .06);color:var(--n-12)}
.fl{display:flex;flex-direction:column;gap:8px}
.fl > label,.lab{font-size:13px;line-height:18px;font-weight:500;color:var(--n-11)}
.inp{height:40px;box-sizing:border-box;padding:0 12px;border-radius:6px;background:var(--s-3);border:1px solid var(--n-8);color:var(--n-12);font:400 15px/22px var(--font-sans),sans-serif;width:100%}
.inp:hover{border-color:var(--n-9)}
.hint{font-size:12px;line-height:16px;color:var(--n-9);margin:0}
.seg{height:36px;padding:0 14px;border:0;border-radius:4px;background:transparent;color:var(--n-10);font:500 14px/20px var(--font-sans),sans-serif;cursor:pointer}
.seg:hover{color:var(--n-12)}
.tag{height:28px;padding:0 10px;border-radius:4px;border:1px solid var(--n-6);background:transparent;color:var(--n-11);font:400 12px/16px 'JetBrains Mono',monospace;cursor:pointer}
.tag:hover{border-color:var(--n-9);background:rgb(var(--n-13-rgb) / .04)}
.rad{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-11);cursor:pointer;border:0;background:transparent;width:100%;text-align:left;font-family:var(--font-sans),sans-serif}
.rad:hover{background:rgb(var(--n-13-rgb) / .04)}
.dot{width:18px;height:18px;border-radius:999px;border:1px solid var(--n-8);box-sizing:border-box;flex:none;display:inline-flex;align-items:center;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;border-radius:4px;background:var(--n-4);border:1px solid var(--n-6);font-size:13px}
.chip button{width:20px;height:20px;border:0;border-radius:3px;background:transparent;color:var(--n-9);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.chip button:hover{color:var(--n-12);background:rgb(var(--n-13-rgb) / .08)}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<a href="settings.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; border-radius: 6px; font-size: 14px; font-weight: 500" aria-label="Профиль" data-dc-keep data-stre-user><span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, var(--n-10), var(--n-6)); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--n-1)" data-av></span><span data-name>Профиль</span><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" class="sb" data-dc-keep>
<p class="sb-h">Эфир</p>
<a href="panel.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Обзор</a>
<a href="moderation.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<p class="sb-h">Бот</p>
<a href="commands.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды</a>
<a href="timers.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6M12 2v3"/></svg>Таймеры</a>
<a href="counters.html" class="sb-i" aria-current="page"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12h8M12 8v8"/></svg>Счётчики</a>
<a href="music.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Музыка</a>
<a href="widgets.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<a href="clips.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 9-12 9z"/><path d="M3 3v18"/></svg>Нарезки</a>
<span class="sb-i sb-off" aria-disabled="true"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 13l-7.5 7.5a2.1 2.1 0 0 1-3-3L11 10M16 16l6-6M8 8l6-6M9 7l8 8M21 11l-8-8"/></svg>Аукционы<span class="sb-tag">скоро</span></span>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
<a href="support.html" class="sb-i"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Поддержка</a>
</nav>
<div style="flex: 999 1 640px; min-width: 0">
<nav aria-label="Хлебные крошки"><ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px"><li><a href="panel.html" style="color: var(--n-9)">Стрим-панель</a></li><li aria-hidden="true" style="color: var(--n-7)">/</li><li><a href="#" style="color: var(--n-9)">Бот</a></li><li aria-hidden="true" style="color: var(--n-7)">/</li><li aria-current="page" style="color: var(--n-12)">Счётчики</li></ol></nav>
<div style="margin-top: 16px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div><h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Счётчики</h1><p style="margin: 6px 0 0; font-size: 15px; color: var(--n-10)">Смерти, победы, что угодно. Зрители видят значение по команде, а менять могут те, кому ты разрешил. Счётчик CS2 считает сам по игре.</p></div>
<button type="button" onClick="{{ create }}" style="height: 40px; padding: 0 16px; border-radius: 6px; border: 0; background: var(--n-13); color: var(--n-1); font: 500 14px/20px var(--font-sans), sans-serif; display: inline-flex; align-items: center; gap: 8px; cursor: pointer"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Добавить счётчик</button>
</div>
<p class="mono" style="margin: 16px 0 0; font-size: 13px; color: var(--n-9)">{{ countLabel }}</p>
<template data-if="notBot"><p role="alert" style="margin: 16px 0 0; padding: 12px 14px; border: 1px solid var(--n-5); border-radius: 8px; font-size: 14px; line-height: 20px; color: var(--n-10)">Бот ещё не в канале. Команды счётчиков в чате не сработают, пока не подключишь бота: «Обзор» → «Подключить бота». Значения на виджете и здесь меняются без бота.</p></template>

<ul style="list-style: none; margin: 24px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<template data-for="shown" data-as="c">
<li class="cnt" style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 20px; border-radius: 8px; border: 1px solid var(--n-5); background: var(--s-2)">
<div style="min-width: 0">
<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap"><span style="font-size: 15px; font-weight: 500">{{ c.name }}</span><span class="mono" style="font-size: 12px; padding: 2px 8px; border: 1px solid var(--n-6); border-radius: 4px; color: var(--n-10)">{{ c.command }}</span></div>
<p style="margin: 4px 0 0; font-size: 13px; line-height: 18px; color: var(--n-9)">{{ c.srcLabel }} · менять: {{ c.accLabel }}</p>
<div style="margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap">
<button type="button" class="tag" aria-label="{{ c.minusLabel }}" onClick="{{ c.minus }}" disabled="{{ c.busy }}">−{{ c.step }}</button>
<button type="button" class="tag" aria-label="{{ c.plusLabel }}" onClick="{{ c.plus }}" disabled="{{ c.busy }}">+{{ c.step }}</button>
<button type="button" class="tag" aria-label="Сбросить «{{ c.name }}» в ноль" onClick="{{ c.reset }}" disabled="{{ c.busy }}">в 0</button>
</div>
</div>
<div style="display: flex; align-items: center; gap: 12px"><span class="mono" aria-live="polite" style="font-size: 40px; line-height: 44px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right">{{ c.value }}</span>
<button type="button" class="ib" aria-label="{{ c.editLabel }}" onClick="{{ c.edit }}"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg></button></div>
</li>
</template>
</ul>
<template data-if="emptyList"><p style="margin: 24px 0; text-align: center; font-size: 14px; color: var(--n-9)">Счётчиков пока нет. Добавь первый, например «Смерти» с командой !смерть.</p></template>

<template data-if="hasEditor">
<section aria-labelledby="ced-t" style="margin-top: 24px; border-radius: 12px; background: rgb(var(--n-2-rgb) / 0.62); border: 1px solid rgb(var(--n-13-rgb) / 0.10)">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid var(--n-5)"><h2 id="ced-t" style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 600">{{ edTitle }}</h2><button type="button" class="ib" aria-label="Закрыть редактор" onClick="{{ closeEd }}"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button></div>
<form style="padding: 24px; display: flex; flex-direction: column; gap: 20px" onSubmit="{{ save }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div class="fl"><label for="cn">Название</label><input id="cn" class="inp" type="text" maxlength="40" value="{{ f.name }}" onChange="{{ setName }}" placeholder="Смерти"><span class="hint">Так называется счётчик на виджете и в ответе в чат</span></div>
<div class="fl"><label for="cc">Команда в чате</label><input id="cc" class="inp mono" type="text" maxlength="30" value="{{ f.command }}" onChange="{{ setCommand }}" placeholder="!смерть"><span class="hint">Пишут: !смерть — прибавить на шаг, !смерть -1 — минус, !смерть 0 — сброс</span></div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div class="fl"><label for="cs">Шаг</label><input id="cs" class="inp mono" type="number" min="1" max="100" value="{{ f.step }}" onChange="{{ setStep }}"><span class="hint">На сколько прибавляет команда без числа: от 1 до 100</span></div>
<div class="fl"><label for="csrc">Откуда считаем</label><select id="csrc" class="inp" value="{{ f.source }}" onChange="{{ setSource }}"><template data-for="srcOpts" data-as="o"><option value="{{ o.v }}">{{ o.label }}</option></template></select></div>
</div>
<template data-if="isCs"><p style="margin: 0; padding: 10px 12px; border: 1px solid var(--n-5); border-radius: 6px; font-size: 13px; line-height: 18px; color: var(--n-10)">Считаем по игре: каждая смерть, убийство или MVP в CS2 прибавляет счётчик сама. Нужен файл Game State Integration в папке cfg игры (Виджеты → CS2). Бот и команды для этого не нужны. Ручные команды тоже работают.</p></template>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start">
<div class="fl"><label for="ca">Кто может менять командой</label><select id="ca" class="inp" value="{{ f.access }}" onChange="{{ setAccess }}"><template data-for="accOpts" data-as="o"><option value="{{ o.v }}">{{ o.label }}</option></template></select><span class="hint">Стример и модераторы могут менять всегда. Остальным — по выбранному условию</span></div>
<template data-if="showAllow"><div class="fl"><label for="cl">Ники, которые могут менять</label><textarea id="cl" rows="3" value="{{ f.allowList }}" onChange="{{ setAllowList }}" placeholder="moroz_tv, admin_name" style="box-sizing: border-box; width: 100%; padding: 10px 12px; border-radius: 6px; background: var(--s-3); border: 1px solid var(--n-8); color: var(--n-12); font: 400 14px/20px var(--font-sans), sans-serif; resize: vertical"></textarea><span class="hint">Через запятую или пробел. Ники без @</span></div></template>
</div>
<template data-if="warnAll"><p style="margin: 0; padding: 10px 12px; border: 1px solid var(--n-5); border-radius: 6px; font-size: 13px; line-height: 18px; color: var(--n-10)">Тогда менять сможет любой в чате. Лучше выбрать «Модераторы и стример» или список ников.</p></template>
<template data-if="hasErr"><p role="alert" style="margin: 0; padding: 10px 12px; border: 2px solid var(--n-12); border-radius: 6px; font-size: 13px; line-height: 18px">{{ err }}</p></template>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 20px; border-top: 1px solid var(--n-5)">
<template data-if="canDelete"><button type="button" onClick="{{ remove }}" style="height: 40px; padding: 0 12px; border-radius: 6px; border: 0; background: transparent; color: var(--accent-text); font: 500 14px/20px var(--font-sans), sans-serif; cursor: pointer">Удалить счётчик</button></template>
<span style="display: flex; gap: 8px; margin-left: auto"><button type="button" onClick="{{ closeEd }}" style="height: 40px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--n-6); background: transparent; color: var(--n-12); font: 500 14px/20px var(--font-sans), sans-serif; cursor: pointer">Отменить</button><button type="submit" disabled="{{ saving }}" style="height: 40px; padding: 0 16px; border-radius: 6px; border: 0; background: var(--n-13); color: var(--n-1); font: 500 14px/20px var(--font-sans), sans-serif; cursor: pointer">{{ saveLabel }}</button></span>
</div>
</form>
</section>
</template>
</div>
</div>
</div>
</template>
<script src="assets/dc-lite.js?v=5f8ce08a"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { items: [], loaded: false, f: null, err: '', saving: false, max: 10, bot: true, busy: {} };
  }
  componentDidMount() {
    this.load();
    StreAPI.me().then((m) => this.setState({ bot: !!(m.user && m.user.botEnabled) }));
    this.timer = setInterval(() => this.load(true), 3000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  // Тихое обновление значений раз в 3 с: во время редактирования не трогаем форму
  async load(silent) {
    try {
      const r = await StreAPI.get('counters.list');
      this.setState({ items: r.items, max: r.max, loaded: true });
    } catch (e) { if (!silent) StreAPI.toast(e.message, 'error'); this.setState({ loaded: true }); }
  }
  edit(c) {
    this.setState({ f: c ? Object.assign({}, c) : { id: '', name: '', command: '!', step: 1, access: 'mods', allowList: '', source: 'manual' }, err: '' });
  }
  setF(p) { this.setState({ f: Object.assign({}, this.state.f, p) }); }
  busyOn(id, on) { const b = Object.assign({}, this.state.busy); if (on) b[id] = true; else delete b[id]; this.setState({ busy: b }); }
  async adjust(c, op, value) {
    if (this.state.busy[c.id]) return;
    this.busyOn(c.id, true);
    try {
      const r = await StreAPI.post('counters.adjust', { id: c.id, op: op, value: value });
      this.setState({ items: this.state.items.map((x) => (x.id === c.id ? Object.assign({}, x, { value: r.value }) : x)) });
    } catch (e) { StreAPI.toast(e.message, 'error'); }
    this.busyOn(c.id, false);
  }
  async saveCounter(body) {
    if (this.saving) return; // форма иногда отправляется дважды: второй запрос не нужен
    this.saving = true;
    this.setState({ saving: true, err: '' });
    try {
      const r = await StreAPI.post('counters.save', body);
      const items = body.id ? this.state.items.map((x) => (x.id === body.id ? r.item : x)) : this.state.items.concat([r.item]);
      this.saving = false;
      this.setState({ items: items, saving: false, f: null });
      StreAPI.toast('Счётчик сохранён');
    } catch (e) { this.saving = false; this.setState({ saving: false, err: e.message }); }
  }
  renderVals() {
    const s = this.state;
    const f = s.f;
    const ACC = { mods: 'модераторы и стример', vip: 'випы и модераторы', subs: 'подписчики и выше', followers: 'фолловеры и выше', list: 'только из списка', all: 'все зрители' };
    const SRC = { manual: 'вручную', cs_kills: 'убийства в CS2', cs_deaths: 'смерти в CS2', cs_mvp: 'MVP в CS2' };
    const accList = [['mods', 'Модераторы и стример'], ['vip', 'Випы и модераторы'], ['subs', 'Подписчики и выше'], ['followers', 'Фолловеры и выше'], ['list', 'Только из списка ников'], ['all', 'Все зрители']];
    const srcList = [['manual', 'Вручную, командой в чате'], ['cs_kills', 'Убийства в CS2'], ['cs_deaths', 'Смерти в CS2'], ['cs_mvp', 'MVP в CS2']];
    const shown = s.items.map((c) => ({
      name: c.name, command: c.command, value: StreAPI.fmtNum(c.value), step: c.step,
      srcLabel: SRC[c.source] || c.source, accLabel: ACC[c.access] || c.access,
      busy: !!s.busy[c.id],
      minusLabel: 'Убавить на ' + c.step + ': ' + c.name, plusLabel: 'Прибавить на ' + c.step + ': ' + c.name,
      editLabel: 'Настроить счётчик «' + c.name + '»',
      minus: () => this.adjust(c, 'add', -c.step),
      plus: () => this.adjust(c, 'add', c.step),
      reset: () => { if (confirm('Сбросить «' + c.name + '» в ноль?')) this.adjust(c, 'set', 0); },
      edit: () => this.edit(c),
    }));
    const isNew = !(f && f.id);
    return {
      countLabel: s.items.length + ' из ' + s.max,
      shown, emptyList: s.loaded && !s.items.length, notBot: s.loaded && !s.bot,
      create: () => (s.items.length >= s.max ? StreAPI.toast('Счётчиков не больше ' + s.max, 'error') : this.edit(null)),
      hasEditor: !!f, edTitle: isNew ? 'Новый счётчик' : 'Настройки счётчика',
      closeEd: () => this.setState({ f: null, err: '' }),
      f: f || {},
      srcOpts: srcList.map((o) => ({ v: o[0], label: o[1] })),
      accOpts: accList.map((o) => ({ v: o[0], label: o[1] })),
      isCs: !!(f && f.source && f.source !== 'manual'),
      showAllow: !!(f && f.access === 'list'),
      warnAll: !!(f && f.access === 'all'),
      setName: (e) => this.setF({ name: e.target.value }),
      setCommand: (e) => this.setF({ command: e.target.value.replace(/\s+/g, '') }),
      setStep: (e) => this.setF({ step: Math.max(1, Math.min(100, Number(e.target.value) || 1)) }),
      setSource: (e) => this.setF({ source: e.target.value }),
      setAccess: (e) => this.setF({ access: e.target.value }),
      setAllowList: (e) => this.setF({ allowList: e.target.value }),
      hasErr: !!s.err, err: s.err,
      saving: !!s.saving,
      saveLabel: s.saving ? 'Сохраняем…' : 'Сохранить',
      save: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (!f.name || !f.name.trim()) return this.setState({ err: 'Назови счётчик' });
        if (!f.command || f.command.replace('!', '').length < 1) return this.setState({ err: 'Напиши команду, например !смерть' });
        this.saveCounter({ id: f.id, name: f.name, command: f.command, step: f.step, access: f.access, allowList: f.allowList, source: f.source });
      },
      canDelete: !!(f && f.id),
      remove: async () => {
        if (!confirm('Удалить счётчик «' + f.name + '» вместе со значением?')) return;
        try {
          await StreAPI.post('counters.delete', { id: f.id });
          this.setState({ items: s.items.filter((x) => x.id !== f.id), f: null });
          StreAPI.toast('Счётчик удалён');
        } catch (e) { this.setState({ err: e.message }); }
      },
    };
  }
}
DCMount(Component);
</script>
</body>
