<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — пульт управления стримом</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js?v=460ce522"></script>
<script src="assets/api.js?v=47744cb2"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ov{font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9);margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px;box-sizing:border-box}
.btn-p{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:6px;background:var(--n-13);color:var(--n-1);font-size:15px;font-weight:500;border:0;font-family:var(--font-sans),sans-serif;cursor:pointer}
.btn-p:hover{background:var(--n-11);color:var(--n-1)}
.btn-s{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:6px;background:transparent;color:var(--n-12);font-size:15px;font-weight:500;border:1px solid var(--n-6);font-family:var(--font-sans),sans-serif;cursor:pointer}
.btn-s:hover{background:rgb(var(--n-13-rgb) / .04);border-color:var(--n-8)}
.h2{margin:12px 0 0;font-size:clamp(32px,4vw,44px);line-height:1.1;letter-spacing:-.025em;font-weight:500}
.lead{margin:16px 0 0;font-size:17px;line-height:26px;color:var(--n-10);max-width:620px}
.card{background:var(--s-2);border:1px solid var(--n-5);border-radius:8px}
.feat{padding:28px;display:flex;flex-direction:column;gap:12px}
.feat h3{margin:8px 0 0;font-size:20px;line-height:26px;letter-spacing:-.01em;font-weight:600}
.feat p{margin:0;font-size:15px;line-height:22px;color:var(--n-10)}
.li{display:flex;gap:10px;font-size:14px;line-height:20px;color:var(--n-11)}
.li svg{flex:none;margin-top:2px}
.ct{width:100%;border-collapse:collapse;font-size:14px;line-height:20px;min-width:640px}
.ct th{text-align:left;font-weight:500;color:var(--n-12);padding:14px 16px;border-bottom:1px solid var(--n-6)}
.ct td{padding:12px 16px;border-top:1px solid var(--n-4);color:var(--n-10)}
.ct td.v{color:var(--n-12)}
.arrow{width:44px;height:44px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.arrow:hover{background:rgb(var(--n-13-rgb) / .04);border-color:var(--n-8)}
.arrow:disabled{color:var(--n-7);border-color:var(--n-5);cursor:default;background:transparent}
.faq-b{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:64px;padding:16px 0;border:0;background:transparent;color:var(--n-12);font:500 17px/24px var(--font-sans),sans-serif;text-align:left;cursor:pointer}
.faq-b:hover{color: var(--accent-on)}
.foot a{color:var(--n-9);font-size:14px;line-height:28px}
.foot a:hover{color:var(--n-12)}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="position: relative; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif; overflow: hidden">
<svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.045; pointer-events: none"><filter id="gl"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#gl)"></rect></svg>
<div aria-hidden="true" style="position: absolute; left: 50%; top: -420px; width: 1400px; height: 1000px; transform: translateX(-50%); background: radial-gradient(closest-side, rgb(var(--n-13-rgb) / 0.09), rgb(var(--n-13-rgb) / 0) 72%); pointer-events: none"></div>

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.62); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div class="wrap" style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<nav aria-label="Разделы главной" style="display: flex; gap: 28px; font-size: 14px; flex-wrap: wrap"><a href="#features" style="color: var(--n-10)">Возможности</a><a href="#live" style="color: var(--n-10)">Сейчас в эфире</a><a href="#pricing" style="color: var(--n-10)">Тарифы</a><a href="#faq" style="color: var(--n-10)">Вопросы</a></nav>
<a href="{{ panelHref }}" class="btn-p" style="height: 40px; padding: 0 16px; font-size: 14px">{{ startLabel }}</a>
</div>
</header>

<main>
<section class="wrap" style="position: relative; padding-top: 112px; padding-bottom: 96px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 56px; align-items: center">
<div>
<p class="ov">Чат-бот · модерация · виджеты · музыка · аналитика</p>
<h1 style="margin: 24px 0 0; font-size: clamp(44px, 6vw, 72px); line-height: 1.04; letter-spacing: -0.035em; font-weight: 500">Пульт управления стримом</h1>
<p class="lead">Один сервис вместо пяти вкладок. Бот отвечает на команды, модерация держит чат чистым, а метрики эфира всегда видны. Ты занимаешься стримом.</p>
<div style="margin-top: 36px; display: flex; gap: 12px; flex-wrap: wrap"><a href="{{ panelHref }}" class="btn-p">{{ heroLabel }}</a><a href="#pricing" class="btn-s">Посмотреть тарифы</a></div>
<p style="margin: 20px 0 0; font-size: 13px; color: var(--n-9)">Twitch · Вход через аккаунт Twitch · Настройка за 5 минут</p>
</div>

<div aria-label="Пример стрим-панели" role="img" style="position: relative; border-radius: 12px; padding: 20px; background: rgb(var(--n-2-rgb) / 0.62); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgb(var(--n-13-rgb) / 0.10); box-shadow: inset 0 1px 0 rgb(var(--n-13-rgb) / 0.08), 0 32px 80px -16px rgba(0,0,0,0.75)">
<div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--n-5)">
<span style="display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; background: var(--accent); color: var(--accent-on); border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: .08em"><span style="width: 6px; height: 6px; border-radius: 999px; background: var(--n-13)"></span>В ЭФИРЕ</span>
<span class="mono" style="font-size: 13px; color: var(--n-10)">02:47:13</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 16px">
<div class="card" style="padding: 14px"><p style="margin: 0; font-size: 12px; color: var(--n-9)">Зрители</p><p class="mono" style="margin: 6px 0 0; font-size: 24px; font-weight: 500">1 284</p><p class="mono" style="margin: 4px 0 0; font-size: 11px; color: var(--n-10)">↑ 12,4%</p></div>
<div class="card" style="padding: 14px"><p style="margin: 0; font-size: 12px; color: var(--n-9)">Сообщений</p><p class="mono" style="margin: 6px 0 0; font-size: 24px; font-weight: 500">3 912</p><p class="mono" style="margin: 4px 0 0; font-size: 11px; color: var(--n-10)">↑ 8,1%</p></div>
<div class="card" style="padding: 14px"><p style="margin: 0; font-size: 12px; color: var(--n-9)">Удалено</p><p class="mono" style="margin: 6px 0 0; font-size: 24px; font-weight: 500">37</p><p class="mono" style="margin: 4px 0 0; font-size: 11px; color: var(--n-10)">↓ 3,0%</p></div>
</div>
<div class="card" style="margin-top: 12px; padding: 14px; height: 120px; display: flex; align-items: flex-end; gap: 4px">
<span style="flex: 1; height: 22%; background: var(--n-6)"></span><span style="flex: 1; height: 30%; background: var(--n-6)"></span><span style="flex: 1; height: 26%; background: var(--n-6)"></span><span style="flex: 1; height: 42%; background: var(--n-6)"></span><span style="flex: 1; height: 38%; background: var(--n-6)"></span><span style="flex: 1; height: 55%; background: var(--n-8)"></span><span style="flex: 1; height: 61%; background: var(--n-8)"></span><span style="flex: 1; height: 48%; background: var(--n-8)"></span><span style="flex: 1; height: 72%; background: var(--n-10)"></span><span style="flex: 1; height: 88%; background: var(--n-12)"></span><span style="flex: 1; height: 76%; background: var(--n-10)"></span><span style="flex: 1; height: 64%; background: var(--n-10)"></span>
</div>
<div style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; line-height: 18px">
<div style="display: flex; gap: 8px"><span class="mono" style="color: var(--n-8); font-size: 11px; line-height: 18px">21:46</span><span style="font-weight: 500">moroz_tv</span><span style="color: var(--n-11)">!дс</span></div>
<div style="display: flex; gap: 8px; padding: 6px 8px; margin: 0 -8px; border-radius: 4px; background: rgb(var(--n-13-rgb) / 0.04)"><span class="mono" style="color: var(--n-8); font-size: 11px; line-height: 18px">21:46</span><span style="font-weight: 500; color: var(--n-10)">StreOps</span><span style="color: var(--n-11)">Сервер: discord.gg/kira · заходи, moroz_tv</span></div>
<div style="display: flex; gap: 8px"><span class="mono" style="color: var(--n-8); font-size: 11px; line-height: 18px">21:47</span><span style="font-weight: 500">lenta_ln</span><span style="color: var(--n-11)">!музыка Кино — Кукушка</span></div>
</div>
</div>
</section>

<section id="features" class="wrap" style="padding-top: 48px; padding-bottom: 96px">
<p class="ov">Возможности</p>
<h2 class="h2">Пять инструментов, одна панель</h2>
<div style="margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 16px">
<div class="card feat"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"></path></svg><h3>Чат-бот</h3><p>Команды с префиксом или без, кулдауны, права доступа и подстановки вроде <span class="mono" style="color: var(--n-12)">{user}</span> и <span class="mono" style="color: var(--n-12)">{uptime}</span>.</p></div>
<div class="card feat"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg><h3>Модерация</h3><p>Фильтры ссылок, капса и спама. Баны и таймауты в один клик из чата, история всех действий модераторов.</p></div>
<div class="card feat"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg><h3>Виджеты</h3><p>Алерты, цели, последние события и чат на экране. Ссылка для OBS, без плагинов.</p></div>
<div class="card feat"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg><h3>Музыка</h3><p>Зрители заказывают треки командой. Очередь, лимиты на человека и пропуск трека модератором.</p></div>
<div class="card feat"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 15l4-4 3 3 5-6"></path></svg><h3>Аналитика</h3><p>Активность чата, нарушения и самые используемые команды — по текущему эфиру и за прошлые сутки.</p></div>
<div class="card feat" style="background: transparent; border-style: dashed"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20M2 12h20"></path></svg><h3>Твоё оформление</h3><p>Свой фон, размытие и эффекты. Интерфейс останется читаемым на любой картинке.</p></div>
</div>
</section>

<section id="live" class="wrap" style="padding-top: 48px; padding-bottom: 96px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div><p class="ov">Сейчас в эфире</p><h2 class="h2">Стримят с StreOps</h2></div>
<div style="display: flex; gap: 8px"><button type="button" class="arrow" aria-label="Предыдущие стримы" onClick="{{ prev }}" disabled="{{ atStart }}"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button><button type="button" class="arrow" aria-label="Следующие стримы" onClick="{{ next }}" disabled="{{ atEnd }}"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button></div>
</div>
<template data-if="noStreams"><p style="margin: 32px 0 0; padding: 32px; border: 1px dashed var(--n-6); border-radius: 12px; font-size: 15px; line-height: 22px; color: var(--n-10)">{{ emptyLive }}</p></template>
<div role="region" aria-roledescription="карусель" aria-label="Стримеры в эфире" style="margin-top: 32px; overflow: hidden">
<ul style="list-style: none; margin: 0; padding: 0; display: flex; gap: 16px; transition: transform 320ms cubic-bezier(.16,1,.3,1); transform: {{ trackX }}">
<template data-for="streams" data-as="s">
<li style="flex: none; width: 296px">
<a href="{{ s.href }}" target="_blank" rel="noopener" aria-label="{{ s.aria }}" style="display: block; border-radius: 12px; overflow: hidden; border: 1px solid var(--n-5); background: var(--s-2)">
<div style="position: relative; height: 166px; background: {{ s.bg }}; background-size: cover; background-position: center">
<span style="position: absolute; left: 10px; top: 10px; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; background: var(--accent); color: var(--accent-on); border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: .08em"><span style="width: 6px; height: 6px; border-radius: 999px; background: var(--n-13)"></span>LIVE</span>
<span class="mono" style="position: absolute; right: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 4px; background: rgba(0,0,0,0.72); font-size: 12px"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>{{ s.viewers }}</span>
</div>
<div style="display: flex; gap: 12px; padding: 14px">
<span style="position: relative; flex: none; width: 36px; height: 36px; border-radius: 999px; background: {{ s.av }}; background-size: cover; box-shadow: 0 0 0 2px var(--s-2), 0 0 0 4px var(--accent)"></span>
<span style="min-width: 0"><span style="display: block; font-size: 15px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ s.title }}</span><span style="display: block; margin-top: 2px; font-size: 13px; line-height: 18px; color: var(--n-10)">{{ s.nick }}</span><span style="display: inline-block; margin-top: 8px; font-size: 12px; line-height: 16px; padding: 2px 8px; border: 1px solid var(--n-6); border-radius: 4px; color: var(--n-10)">{{ s.cat }}</span></span>
</div>
</a>
</li>
</template>
</ul>
</div>
</section>

<section id="pricing" class="wrap" style="padding-top: 48px; padding-bottom: 96px">
<p class="ov">Тарифы</p>
<h2 class="h2">Плати за то, чем пользуешься</h2>
<p class="lead">Бесплатно — 10 команд и 2 виджета. Платные тарифы оплачиваются с баланса на 30 дней, без автосписаний.</p>
<div style="margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; align-items: stretch">

<div class="card" style="padding: 28px; display: flex; flex-direction: column; gap: 20px">
<div><h3 style="margin: 0; font-size: 20px; font-weight: 600">Продвинутая</h3><p style="margin: 6px 0 0; font-size: 14px; color: var(--n-9)">Для старта: бот и базовая модерация</p></div>
<p style="margin: 0; display: flex; align-items: baseline; gap: 6px"><span class="mono" style="font-size: 40px; line-height: 44px; font-weight: 500; letter-spacing: -0.02em">299&nbsp;₽</span><span style="font-size: 14px; color: var(--n-9)">в месяц</span></p>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<li class="li"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>До 30 команд чат-бота</li>
<li class="li"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>Автомодерация: ссылки, капс, спам</li>
<li class="li"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>3 виджета для OBS</li>
<li class="li"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>Аналитика текущего эфира</li>
<li class="li"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>Розыгрыши с рулеткой и колесом</li>
</ul>
<a href="{{ plansHref }}" class="btn-s" style="margin-top: auto">Выбрать «Продвинутую»</a>
</div>

<div style="position: relative; padding: 27px; display: flex; flex-direction: column; gap: 20px; border-radius: 8px; border: 2px solid var(--n-12); background: rgb(var(--n-2-rgb) / 0.62); box-shadow: inset 0 1px 0 rgb(var(--n-13-rgb) / 0.08)">
<span style="position: absolute; top: -12px; left: 26px; height: 24px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border-radius: 4px; background: var(--n-12); color: var(--n-1); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"></path></svg>Рекомендуем</span>
<div><h3 style="margin: 0; font-size: 20px; font-weight: 600">Про</h3><p style="margin: 6px 0 0; font-size: 14px; color: var(--n-10)">Для регулярных стримов с активным чатом</p></div>
<p style="margin: 0; display: flex; align-items: baseline; gap: 6px"><span class="mono" style="font-size: 40px; line-height: 44px; font-weight: 500; letter-spacing: -0.02em">499&nbsp;₽</span><span style="font-size: 14px; color: var(--n-9)">в месяц</span></p>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<li class="li"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>Всё из «Продвинутой»</li>
<li class="li"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>Команды без лимита</li>

<script src="assets/dc-lite.js?v=5f8ce08a"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { slide: 0, open: 0, streams: [], loaded: false, user: null }; }
  componentDidMount() {
    if (!window.StreAPI) return;
    StreAPI.me().then((m) => this.setState({ user: m.user || null }));
    const load = () => StreAPI.get('live.list').then((r) => this.setState({ streams: r.items, loaded: true })).catch(() => this.setState({ loaded: true }));
    load();
    setInterval(load, 60000);
  }
  renderVals() {
    const clean = (u) => String(u || '').replace(/["'()\\\s]/g, '');
    const streams = this.state.streams.map((x) => ({
      nick: x.name, title: x.title || 'Без названия', cat: x.game || 'Без категории', viewers: StreAPI.fmtNum(x.viewers),
      bg: x.thumb ? 'url("' + clean(x.thumb) + '"), var(--s-3)' : 'linear-gradient(135deg, var(--n-5), var(--n-1))',
      av: x.avatar ? 'url("' + clean(x.avatar) + '"), var(--n-6)' : 'linear-gradient(135deg, var(--n-10), var(--n-6))',
      href: 'https://www.twitch.tv/' + encodeURIComponent(x.login), aria: x.name + ' в эфире: ' + (x.title || 'без названия') + ', зрителей ' + x.viewers,
    }));
    const max = Math.max(0, streams.length - 3);
    const slide = Math.min(this.state.slide, max);
    const user = this.state.user;
    const login = '/auth/login.php?next=' + encodeURIComponent('/panel.html');
    const faqData = [
      ['Какие платформы поддерживаются?', 'Пока только Twitch: вход через аккаунт Twitch, бот работает в твоём чате. Другие платформы — в планах.'],
      ['Нужно ли что-то устанавливать?', 'Нет. Бот работает на наших серверах, а виджеты подключаются в OBS как источник «Браузер» по ссылке из панели.'],
      ['Как бот попадает в мой чат?', 'Нажми «Подключить бота» в панели. Бот StreOps станет модератором канала — это нужно, чтобы удалять сообщения и выдавать муты.'],
      ['Что будет с командами, если я понижу тариф?', 'Они сохранятся. Создавать новые сверх лимита тарифа будет нельзя, пока не удалишь лишние или не вернёшься на старший тариф.'],
      ['Как оплатить и отменить тариф?', 'Тариф оплачивается с баланса в настройках на 30 дней. Автосписаний нет: не продлишь — по окончании срока аккаунт перейдёт на бесплатный тариф.'],
      ['Откуда музыка?', 'Играет плеер YouTube. Зрители присылают ссылку YouTube или просто название трека. Ссылки Яндекс Музыки, Spotify, VK и SoundCloud тоже подойдут: бот возьмёт название трека со страницы и найдёт его на YouTube.']
    ];
    return {
      streams,
      noStreams: this.state.loaded && !streams.length,
      emptyLive: 'Сейчас никто из стримеров StreOps не в эфире. Подключи свой канал — и он появится здесь, когда начнёшь стрим.',
      trackX: 'translateX(-' + (slide * 312) + 'px)',
      atStart: slide === 0,
      atEnd: slide >= max,
      prev: () => this.setState({ slide: Math.max(0, slide - 1) }),
      next: () => this.setState({ slide: Math.min(max, slide + 1) }),
      panelHref: user ? 'panel.html' : login,
      plansHref: user ? 'settings.html' : '/auth/login.php?next=' + encodeURIComponent('/settings.html'),
      startLabel: user ? 'Открыть панель' : 'Войти через Twitch',
      heroLabel: user ? 'Открыть панель' : 'Подключить канал',
      faq: faqData.map((f, i) => ({
        q: f[0], a: f[1], open: this.state.open === i,
        expanded: this.state.open === i ? 'true' : 'false',
        rot: this.state.open === i ? 'rotate(180deg)' : 'rotate(0deg)',
        toggle: () => this.setState({ open: this.state.open === i ? -1 : i })
      }))
    };
  }
}
DCMount(Component);
</script>
