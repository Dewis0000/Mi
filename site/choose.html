<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — выбор панели</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js?v=460ce522"></script>
<script src="assets/api.js?v=35d22610"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.opt{display:flex;gap:16px;align-items:center;padding:20px 22px;border-radius:12px;border:1px solid rgb(var(--n-13-rgb) / .10);background:rgb(var(--n-2-rgb) / .62);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:border-color 160ms}
.opt:hover{border-color:var(--n-6)}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">
<header style="height: 64px; display: flex; align-items: center; padding: 0 24px; box-sizing: border-box; border-bottom: 1px solid var(--n-4)">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
</header>
<main style="max-width: 640px; margin: 0 auto; padding: 48px 24px 64px; box-sizing: border-box">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.01em">Куда зайдём?</h1>
<p style="margin: 6px 0 24px; font-size: 14px; color: var(--n-10)">{{ hello }}</p>
<template data-if="loggedOut"><a href="/auth/login.php?next=/choose.html" style="display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 6px; background: var(--n-13); color: var(--n-1); font-weight: 500; font-size: 14px">Войти через Twitch</a></template>
<template data-if="loggedIn">
<nav aria-label="Панели" style="display: flex; flex-direction: column; gap: 12px">
<a href="panel.html" class="opt"><span style="width: 40px; height: 40px; flex: none; border-radius: 8px; border: 1px solid var(--n-5); display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" class="ic"><rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg></span><span style="min-width: 0"><span style="display: block; font-size: 16px; font-weight: 600">Стрим-панель</span><span style="display: block; margin-top: 2px; font-size: 13px; color: var(--n-9)">Бот, команды, виджеты, музыка, розыгрыши</span></span></a>
<a href="viewer.html" class="opt"><span style="width: 40px; height: 40px; flex: none; border-radius: 8px; border: 1px solid var(--n-5); display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" class="ic"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></span><span style="min-width: 0"><span style="display: block; font-size: 16px; font-weight: 600">Зритель-панель</span><span style="display: block; margin-top: 2px; font-size: 13px; color: var(--n-9)">Мои предложения видео и сайты стримеров</span></span></a>
<template data-if="isAdmin"><a href="admin.html" class="opt"><span style="width: 40px; height: 40px; flex: none; border-radius: 8px; border: 1px solid var(--n-5); display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" class="ic"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg></span><span style="min-width: 0"><span style="display: block; font-size: 16px; font-weight: 600">Админ-панель</span><span style="display: block; margin-top: 2px; font-size: 13px; color: var(--n-9)">Пользователи, тарифы, поддержка, объявления</span></span></a></template>
<a href="{{ siteHref }}" class="opt"><span style="width: 40px; height: 40px; flex: none; border-radius: 8px; border: 1px solid var(--n-5); display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" class="ic"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"></path></svg></span><span style="min-width: 0"><span style="display: block; font-size: 16px; font-weight: 600">Мой сайт</span><span style="display: block; margin-top: 2px; font-size: 13px; color: var(--n-9)">Видео подписчиков, чат и разделы эфира</span></span></a>
<a href="/auth/logout.php" class="opt"><span style="width: 40px; height: 40px; flex: none; border-radius: 8px; border: 1px solid var(--n-5); display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" class="ic"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg></span><span style="min-width: 0"><span style="display: block; font-size: 16px; font-weight: 600">Выйти или сменить аккаунт</span><span style="display: block; margin-top: 2px; font-size: 13px; color: var(--n-9)">После выхода войдёшь снова через Twitch</span></span></a>
</nav>
</template>
</main>
</div>
</template>
<script src="assets/dc-lite.js?v=5f8ce08a"></script>
<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { user: null, loaded: false };
}
componentDidMount() {
StreAPI.me().then((m) => this.setState({ user: m.user || null, loaded: true })).catch(() => this.setState({ loaded: true }));
}
renderVals() {
const u = this.state.user;
return {
loggedIn: !!u,
loggedOut: this.state.loaded && !u,
isAdmin: !!(u && u.isAdmin),
hello: u ? 'Ты вошёл как ' + u.login + '. Выбери, что открыть.' : (this.state.loaded ? 'Войди через Twitch, чтобы открыть панели.' : ''),
siteHref: u ? 'site.html?c=' + encodeURIComponent(u.login) : '#',
};
}
}
DCMount(Component);
</script>
</body>
</html>
