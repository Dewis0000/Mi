<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — помощники музыки</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js?v=460ce522"></script>
<script src="assets/api.js?v=aea5953e"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.card{background:rgb(var(--n-2-rgb) / .62);border:1px solid rgb(var(--n-13-rgb) / .10);border-radius:12px;padding:20px 24px;min-width:0;box-sizing:border-box}
.h2{margin:0;font-size:18px;line-height:24px;font-weight:600}
.hint{margin:6px 0 0;font-size:13px;line-height:18px;color:var(--n-9)}
.bp{height:40px;padding:0 16px;border-radius:6px;border:0;background:var(--n-13);color:var(--n-1);font:500 14px/20px var(--font-sans),system-ui,sans-serif;cursor:pointer}
.bp:disabled{opacity:.4;cursor:default}
.bs{height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);font:500 14px/20px var(--font-sans),system-ui,sans-serif;cursor:pointer}
.bs:hover{border-color:var(--n-9)}
.bs:disabled{opacity:.4;cursor:default}
.fl{display:flex;flex-direction:column;gap:8px}
.lab{font-size:13px;line-height:18px;font-weight:500;color:var(--n-11)}
.inp{height:40px;box-sizing:border-box;padding:0 12px;border-radius:6px;background:var(--s-3);border:1px solid var(--n-8);color:var(--n-12);font:400 15px/22px var(--font-sans),sans-serif;width:100%}
.inp:hover{border-color:var(--n-9)}
.step{display:flex;gap:12px;align-items:flex-start}
.step-n{width:24px;height:24px;flex:none;border-radius:999px;border:1px solid var(--n-6);display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--n-11)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:8px;border:1px solid var(--n-5);background:var(--s-2)}
.errbox{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--n-6);border-radius:8px}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none;white-space:nowrap;overflow:hidden}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
.sb-search{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;margin:0 0 8px;border:1px solid var(--n-6);border-radius:8px;background:rgb(var(--n-13-rgb) / .03);color:var(--n-9)}
.sb-search:focus-within{border-color:var(--n-12)}
.sb-search input{flex:1;min-width:0;min-width:0;border:0;outline:0;background:transparent;color:var(--n-12);font:400 14px/20px 'Onest',sans-serif;padding:0}
.sb-search input::placeholder{color:var(--n-9)}
.sb-search input::-webkit-search-cancel-button{display:none}
.sb-search kbd{font:400 10px/1 'JetBrains Mono',monospace;margin-left:auto;color:var(--n-9);border:1px solid var(--n-6);border-radius:4px;padding:2px 5px;white-space:nowrap}
.sb-empty{margin:8px 12px;font-size:13px;color:var(--n-9)}
.sb-hide{display:none!important}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var nav = document.querySelector('nav.sb'), box = nav && nav.querySelector('[data-sb-search]');
  if (!box) return;
  var empty = nav.querySelector('[data-sb-empty]');
  function apply() {
    var q = box.value.trim().toLowerCase(), any = false, group = null, groupHit = false;
    var rows = Array.prototype.slice.call(nav.children).filter(function (el) { return el.matches('a.sb-i, span.sb-i, p.sb-h, div.sb-sep'); });
    rows.forEach(function (el) {
      if (el.matches('p.sb-h')) { if (group) group.classList.toggle('sb-hide', !groupHit && !!q); group = el; groupHit = false; el.classList.remove('sb-hide'); return; }
      if (el.matches('div.sb-sep')) { el.classList.toggle('sb-hide', !!q); return; }
      var hit = !q || (el.textContent + ' ' + (el.getAttribute('data-kw') || '')).toLowerCase().indexOf(q) !== -1;
      el.classList.toggle('sb-hide', !hit);
      if (hit) { groupHit = true; any = true; }
    });
    if (group) group.classList.toggle('sb-hide', !!q && !groupHit);
    if (empty) empty.hidden = any || !q;
  }
  box.addEventListener('input', apply);
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var first = nav.querySelector('a.sb-i:not(.sb-hide)'); if (first) location.href = first.getAttribute('href'); }
    if (e.key === 'Escape') { box.value = ''; apply(); box.blur(); }
  });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); box.focus(); box.select(); }
  });
});
</script>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<a href="settings.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; border-radius: 6px; font-size: 14px; font-weight: 500" aria-label="Профиль" data-dc-keep data-stre-user><span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, var(--n-10), var(--n-6)); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--n-1)" data-av></span><span data-name>Профиль</span><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" class="sb" data-dc-keep>
<label class="sb-search"><svg class="sb-ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" data-sb-search placeholder="Поиск" aria-label="Найти раздел" autocomplete="off"><kbd>Ctrl K</kbd></label><p class="sb-empty" data-sb-empty hidden>Такого раздела нет</p>
<p class="sb-h">Сегодня</p>
<a href="panel.html" class="sb-i" data-kw="главная статистика эфир статус"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Старт</a>
<p class="sb-h">Чат</p>
<a href="moderation.html" class="sb-i" data-kw="фильтр чат удалить бан таймаут проверка"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<a href="mods.html" class="sb-i" aria-current="page" data-kw="мод модераторы помощник права журнал"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Помощники</a>
<a href="commands.html" class="sb-i" data-kw="команда ответ чат кулдаун"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды</a>
<a href="timers.html" class="sb-i" data-kw="таймер сообщение напоминание"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6M12 2v3"/></svg>Таймеры</a>
<p class="sb-h">Музыка</p>
<a href="music.html" class="sb-i" data-kw="музыка трек плеер заказ очередь песня"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Очередь и заказы</a>
<a href="manage.html" class="sb-i" data-kw="помощник канал трек музыка добавить"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Управлять каналом</a>
<p class="sb-h">Эфир и сайт</p>
<a href="widgets.html" class="sb-i" data-kw="виджет obs браузер ссылка чат розыгрыш"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты для OBS</a>
<a href="site-settings.html" class="sb-i" data-kw="сайт подписчики видео значок галочка модератор"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Мой сайт</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i" data-kw="розыгрыш приз участники победитель"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<a href="clips.html" class="sb-i" data-kw="нарезка клип момент видео"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 9-12 9z"/><path d="M3 3v18"/></svg>Нарезки</a>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i" data-kw="тариф оплата аккаунт email промокод"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
<a href="support.html" class="sb-i" data-kw="помощь вопрос обращение"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Поддержка</a>
</nav>
<div style="flex: 999 1 640px; min-width: 0">
<nav aria-label="Хлебные крошки"><ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px"><li><a href="panel.html" style="color: var(--n-9)">Стрим-панель</a></li><li aria-hidden="true" style="color: var(--n-7)">/</li><li aria-current="page" style="color: var(--n-12)">Помощники музыки</li></ol></nav>
<div style="margin-top: 16px"><h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Помощники музыки</h1><p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: var(--n-10)">Помощник StreOps — это человек, которому ты доверяешь музыку на своём канале. Он ставит треки, пропускает их и решает, какие заказы зрителей принять. Чат он не модерирует. Все его действия видны в журнале модерации.</p></div>

<section class="card" aria-labelledby="cap-t" style="margin-top: 24px">
<h2 id="cap-t" class="h2">Что может помощник</h2>
<div style="margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px">
<div><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--n-12)">Может</p><ul style="margin: 8px 0 0; padding-left: 18px; font-size: 14px; line-height: 22px; color: var(--n-11)"><li>включать и выключать заказы музыки;</li><li>пропускать текущий трек;</li><li>добавлять треки, менять их порядок и убирать из очереди;</li><li>одобрять и отклонять заказы зрителей;</li><li>очищать очередь.</li></ul></div>
<div><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--n-12)">Не может</p><ul style="margin: 8px 0 0; padding-left: 18px; font-size: 14px; line-height: 22px; color: var(--n-11)"><li>менять настройки канала;</li><li>банить и наказывать зрителей;</li><li>менять команды и таймеры;</li><li>управлять модераторами Twitch.</li></ul></div>
</div>
</section>

<section class="card" aria-labelledby="dif-t" style="margin-top: 16px">
<h2 id="dif-t" class="h2">Чем помощник отличается от модератора Twitch</h2>
<p style="margin: 10px 0 0; font-size: 14px; line-height: 22px; color: var(--n-11)">Модераторы Twitch — это отдельный список в самом Twitch. Они работают в чате: удаляют сообщения, дают таймауты и баны. Помощник StreOps отвечает только за музыку.</p>
<p style="margin: 10px 0 0; font-size: 14px; line-height: 22px; color: var(--n-11)">Список модераторов Twitch меняется в Twitch, а не здесь. <a href="https://dashboard.twitch.tv/" target="_blank" rel="noopener" style="color: var(--n-12); text-decoration: underline; text-underline-offset: 3px">Открыть Twitch</a></p>
</section>

<section class="card" aria-labelledby="how-t" style="margin-top: 16px">
<h2 id="how-t" class="h2">Как добавить помощника</h2>
<ol style="list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<li class="step"><span class="step-n" aria-hidden="true">1</span><div style="min-width: 0"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Введи ник Twitch помощника</p><p class="hint">Ник — это имя из адреса twitch.tv/ник. Впиши его в поле ниже. Или сделай помощником одного из модераторов Twitch из списка внизу.</p></div></li>
<li class="step"><span class="step-n" aria-hidden="true">2</span><div style="min-width: 0"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Нажми «Добавить помощника»</p><p class="hint">Помощник сразу появится в списке. На канал можно добавить до 20 помощников.</p></div></li>
<li class="step"><span class="step-n" aria-hidden="true">3</span><div style="min-width: 0"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Попроси его войти в StreOps через Twitch</p><p class="hint">После входа у него появится раздел «Управлять каналом», а в нём — твой канал. Тогда он сможет управлять музыкой.</p></div></li>
</ol>
</section>

<section class="card" aria-labelledby="hl-t" style="margin-top: 16px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap"><h2 id="hl-t" class="h2">Твои помощники</h2><span class="mono" style="font-size: 13px; color: var(--n-9)">{{ countLabel }}</span></div>
<p class="hint">Помощник видит твой канал в разделе «Управлять каналом». Под ником написано, сколько раз он действовал с музыкой и когда в последний раз.</p>

<template data-if="loading"><p role="status" style="margin: 16px 0 0; font-size: 14px; color: var(--n-9)">Загружаем помощников…</p></template>
<template data-if="loadErrShow"><div role="alert" class="errbox" style="margin-top: 16px"><p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--n-11)">{{ loadErrText }}</p><button type="button" class="bs" onClick="{{ reload }}" style="height: 36px">Повторить</button></div></template>

<template data-if="noMgr"><div style="margin-top: 16px; padding: 24px; border: 1px dashed var(--n-6); border-radius: 8px; text-align: center"><p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 500">Помощников пока нет</p><p class="hint" style="margin-top: 6px">Добавь первого: впиши ник Twitch в поле ниже и нажми «Добавить помощника».</p><button type="button" class="bs" onClick="{{ focusAdd }}" style="margin-top: 14px">Перейти к добавлению</button></div></template>

<template data-if="hasMgr"><ul style="list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<template data-for="mgrs" data-as="m">
<li class="row">
<div style="min-width: 0"><span class="mono" style="font-size: 15px; color: var(--n-12)">{{ m.login }}</span><p class="hint" style="margin-top: 4px">{{ m.stat }}</p></div>
<button type="button" class="bs" onClick="{{ m.remove }}" aria-label="Убрать помощника {{ m.login }}" style="height: 36px">Убрать</button>
</li>
</template></ul></template>

<template data-if="limitHit"><p class="hint" style="margin-top: 12px; color: var(--n-11)">{{ limitText }}</p></template>

<form onSubmit="{{ addSubmit }}" style="margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end">
<div class="fl" style="flex: 1 1 240px; max-width: 320px"><label for="mg-in" class="lab">Ник Twitch</label><input id="mg-in" class="inp mono" value="{{ addIn }}" onInput="{{ setAddIn }}" maxlength="25" placeholder="nick_name" aria-describedby="mg-in-h"><p id="mg-in-h" class="hint" style="margin-top: 0">Латиница, цифры и «_», от 3 до 25 знаков. Без @.</p></div>
<button type="submit" class="bp" disabled="{{ addBusy }}">Добавить помощника</button>
</form>
</section>

<section class="card" aria-labelledby="tw-t" style="margin-top: 16px">
<h2 id="tw-t" class="h2">Модераторы Twitch</h2>
<p class="hint">Это модераторы чата из Twitch. Сделать помощником можно любого из них. Модератором в Twitch он останется.</p>
<template data-if="loadingTw"><p role="status" style="margin: 14px 0 0; font-size: 14px; color: var(--n-9)">Загружаем модераторов Twitch…</p></template>
<template data-if="twErr"><div role="alert" class="errbox" style="margin-top: 14px"><p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--n-11)">{{ twErrText }}</p><button type="button" class="bs" onClick="{{ reload }}" style="height: 36px">Повторить</button></div></template>
<template data-if="twEmpty"><p class="hint" style="margin-top: 14px">В чате Twitch пока нет модераторов. Добавить их можно в Twitch.</p></template>
<template data-if="hasTw"><ul style="list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<template data-for="twList" data-as="t">
<li class="row" style="padding: 12px 16px">
<div style="min-width: 0"><span class="mono" style="font-size: 15px; color: var(--n-12)">{{ t.login }}</span><p class="hint" style="margin-top: 2px">{{ t.badge }}</p></div>
<button type="button" class="bs" onClick="{{ t.make }}" disabled="{{ t.dis }}" style="height: 36px">{{ t.label }}</button>
</li>
</template></ul></template>
<template data-if="limitHit"><p class="hint" style="margin-top: 12px">{{ twLimitText }}</p></template>
</section>
</div>
</div>
</div>
</template>
<script src="assets/dc-lite.js?v=5f8ce08a"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { loading: true, loadErr: '', mgrs: [], twitch: [], twitchErr: '', max: 20, addIn: '', addBusy: false };
  }
  componentDidMount() { this.load(); }
  async load() {
    this.setState({ loading: true });
    try {
      const r = await StreAPI.get('mods.get');
      this.setState({ mgrs: r.managers || [], twitch: r.twitch || [], twitchErr: r.twitchErr || '', max: r.max || 20, loadErr: '', loading: false });
    } catch (e) {
      this.setState({ loadErr: e.message || 'Попробуй ещё раз', loading: false });
    }
  }
  async add(login) {
    const l = String(login || '').trim().replace(/^@/, '');
    if (!l) return StreAPI.toast('Введи ник Twitch', 'error');
    this.setState({ addBusy: true });
    try {
      await StreAPI.post('mods.add', { login: l });
      StreAPI.toast('Помощник «' + l + '» добавлен. Он увидит канал, когда войдёт в StreOps.');
      this.setState({ addIn: '' });
      await this.load();
    } catch (e) { StreAPI.toast(e.message, 'error'); }
    this.setState({ addBusy: false });
  }
  async remove(login) {
    if (!confirm('Убрать помощника «' + login + '»? Он сразу потеряет доступ к музыке. Вернуть его можно, снова добавив ник.')) return;
    try { await StreAPI.post('mods.remove', { login: login }); StreAPI.toast('Помощник убран'); await this.load(); }
    catch (e) { StreAPI.toast(e.message, 'error'); }
  }
  focusAdd() { const el = document.getElementById('mg-in'); if (el) el.focus(); }
  renderVals() {
    const s = this.state;
    const names = s.mgrs.map((m) => m.login);
    const fmtLast = (ts) => ts ? 'последнее действие: ' + new Date(ts * 1000).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : 'ещё не действовал';
    const full = s.mgrs.length >= s.max;
    const mgrs = s.mgrs.map((m) => ({
      login: m.login,
      stat: 'действий с музыкой: ' + m.music + ' · ' + fmtLast(m.last),
      remove: () => this.remove(m.login),
    }));
    const twList = s.twitch.map((t) => {
      const isMgr = names.indexOf(t.login) >= 0;
      return {
        login: t.login,
        badge: 'модератор Twitch',
        label: isMgr ? 'Уже помощник' : 'Сделать помощником',
        dis: isMgr || full,
        make: () => this.add(t.login),
      };
    });
    const hasMgr = s.mgrs.length > 0;
    return {
      countLabel: s.loading ? '' : 'Помощников: ' + s.mgrs.length + ' из ' + s.max,
      loading: !!s.loading,
      loadingTw: !!s.loading,
      loadErrShow: !s.loading && !!s.loadErr,
      loadErrText: 'Не удалось загрузить список помощников. ' + s.loadErr,
      reload: () => this.load(),
      noMgr: !s.loading && !s.loadErr && !hasMgr,
      focusAdd: () => this.focusAdd(),
      hasMgr,
      mgrs,
      limitHit: full,
      limitText: 'Лимит достигнут: ' + s.mgrs.length + ' из ' + s.max + '. Чтобы добавить нового помощника, убери кого-нибудь из списка.',
      twLimitText: 'Помощников ' + s.mgrs.length + ' из ' + s.max + ', поэтому сделать помощником нового модератора нельзя. Сначала убери кого-нибудь из списка помощников.',
      addIn: s.addIn,
      setAddIn: (e) => this.setState({ addIn: e.target.value }),
      addSubmit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.add(s.addIn); },
      addBusy: !!s.addBusy,
      twErr: !s.loading && !!s.twitchErr,
      twErrText: s.twitchErr,
      twEmpty: !s.loading && !s.loadErr && !s.twitchErr && s.twitch.length === 0,
      hasTw: s.twitch.length > 0,
      twList,
    };
  }
}
DCMount(Component);
</script>
</body>
</html>
