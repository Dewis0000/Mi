<script>
const FF_BASE = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm';
let ffmpegPromise = null;

// ffmpeg.wasm грузим с CDN при первом запуске; запись остаётся на компьютере
function loadFFmpeg() {
  if (!ffmpegPromise) {
    ffmpegPromise = (async () => {
      const { FFmpeg } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js');
      const { toBlobURL } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js');
      const ff = new FFmpeg();
            // рабочий скрипт грузим как blob, а его относительные импорты переписываем на полные адреса CDN
      const wbase = 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm';
      const wsrc = await (await fetch(wbase + '/worker.js')).text();
      const wfix = wsrc.replace(/from\s*"\.\/([^"]+)"/g, 'from "' + wbase + '/$1"').replace(/from\s*'\.\/([^']+)'/g, "from '" + wbase + "/$1'");
      await ff.load({
        classWorkerURL: URL.createObjectURL(new Blob([wfix], { type: 'text/javascript' })),
        coreURL: await toBlobURL(FF_BASE + '/ffmpeg-core.js', 'text/javascript'),
        wasmURL: await toBlobURL(FF_BASE + '/ffmpeg-core.wasm', 'application/wasm'),
      });
      return ff;
    })().catch((e) => { ffmpegPromise = null; throw e; });
  }
  return ffmpegPromise;
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.file = null;
    this.state = {
      token: '', recFrom: 0, recText: '', recValid: false, fileName: '', orient: 'v', plate: '', items: [], loaded: false,
      busy: false, progress: '', err: '', findBusy: false,
    };
  }
  componentDidMount() {
    StreAPI.me().then((m) => {
      const u = m.user;
      if (!u) return;
      this.setState({ token: u.widgetToken, plate: u.name + ' · twitch.tv/' + u.login });
    });
  }
  // ДД.ММ.ГГГГ ЧЧ:ММ → unix-секунды (локальное время), иначе null
  parseRec(text) {
    const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})\s+(\d{1,2}):(\d{2})$/.exec((text || '').trim());
    if (!m) return null;
    const d = new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5], 0);
    if (d.getDate() !== +m[1] || d.getHours() !== +m[4]) return null;
    return Math.floor(d.getTime() / 1000);
  }
  formatRec(ts) {
    const d = new Date(ts * 1000);
    const p = (n) => String(n).padStart(2, '0');
    return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  setRecText(e) {
    const text = e.target.value;
    const ts = this.parseRec(text);
    if (ts) this.setState({ recText: text, recValid: true, recFrom: ts });
    else this.setState({ recText: text, recValid: false });
  }
  toLocal(ts) {
    const d = new Date(ts * 1000);
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  // «Последний стрим»: дата начала последнего эфира и сразу поиск моментов
  async lastStream() {
    this.setState({ recFrom: 0 });
    await this.findMoments();
  }
  async findMoments() {
    const s = this.state;
    if (!s.token) { this.setState({ err: 'Нет ключа: открой страницу заново.' }); return; }
    const from = s.recFrom || 0;
    this.setState({ findBusy: true, err: '' });
    try {
      const q = new URLSearchParams({ r: 'clips.highlights', t: s.token, count: '6' });
      if (from) q.set('from', String(from));
      const res = await fetch('/api/index.php?' + q.toString(), { cache: 'no-store' });
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || 'Не получилось найти моменты');
      const items = j.items.map((it, i) => ({
        i, start: it.start, end: it.end, from: j.from,
        time: this.fmtOffset(it.start - j.from),
        why: (it.events.length ? it.events.join(', ') + ' · ' : '') + 'чат: ' + it.chat,
        caption: it.title || 'Лучший момент стрима',
        on: true,
      }));
      this.setState({ items, recFrom: j.from, recText: this.formatRec(j.from), recValid: true, loaded: true, findBusy: false });
      if (!items.length) this.setState({ err: 'За этот стрим пока нет данных: включи бота заранее, и моменты появятся.' });
    } catch (e) { this.setState({ findBusy: false, err: e.message }); }
  }
  fmtOffset(sec) {
    sec = Math.max(0, Math.round(sec));
    const p = (n) => String(n).padStart(2, '0');
    return p(Math.floor(sec / 3600)) + ':' + p(Math.floor(sec % 3600 / 60)) + ':' + p(sec % 60);
  }
  pickFile(e) {
    const f = e.target.files && e.target.files[0];
    this.file = f || null;
    this.setState({ fileName: f ? f.name + ' · ' + (f.size / 1048576).toFixed(0) + ' МБ' : '' });
  }
  // Плашка и подпись рисуются на картинке и накладываются на видео в ffmpeg
  overlayPng(caption, W, H) {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    const s = this.state;
    const pad = Math.round(W * 0.03);
    g.font = '600 ' + Math.round(W * 0.034) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
    const plateText = s.plate || '';
    const pw = Math.min(W - 2 * pad, g.measureText(plateText).width + pad * 2);
    const ph = Math.round(W * 0.06);
    g.fillStyle = 'rgba(12, 10, 10, 0.82)';
    g.beginPath(); g.roundRect(pad, pad, pw, ph, ph / 2); g.fill();
    g.fillStyle = '#FFFFFE';
    g.textBaseline = 'middle';
    g.fillText(plateText, pad + pad, pad + ph / 2);
    // подпись внизу: перенос по словам
    g.font = '700 ' + Math.round(W * 0.046) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
    const maxW = W - pad * 4;
    const words = caption.split(' ');
    const lines = []; let line = '';
    words.forEach((w) => { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
    if (line) lines.push(line);
    const lh = Math.round(W * 0.06);
    const top = H - pad * 2 - lh * lines.length - Math.round(H * 0.04);
    g.fillStyle = 'rgba(12, 10, 10, 0.7)';
    g.beginPath(); g.roundRect(pad, top - pad / 2, W - pad * 2, lh * lines.length + pad, pad); g.fill();
    g.fillStyle = '#FFFFFE';
    lines.forEach((t, i) => { g.fillText(t, W / 2 - g.measureText(t).width / 2, top + lh * i + lh / 2); });
    return g.getImageData(0, 0, W, H).data; // сырые пиксели RGBA: без декодирования PNG
  }
  async cutOne(item, ff, index, total) {
    const s = this.state;
    const vertical = s.orient === 'v';
    const W = vertical ? 720 : 1280, H = vertical ? 1280 : 720;
    const dur = item.end - item.start;
    const off = item.start - s.recFrom; // смещение от текущей даты начала записи
    const { fetchFile } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js');
    const ext = (this.file.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '') || 'mp4';
    await ff.writeFile('src.' + ext, await fetchFile(this.file));
    const rgba = this.overlayPng(item.caption || '', W, H);
    await ff.writeFile('ov.raw', rgba);
    const vf = vertical ? 'scale=-2:' + H + ',crop=' + W + ':' + H : 'scale=' + W + ':-2,crop=' + W + ':' + H;
    const pRe = ((index + 1) + '/' + total);
    this.setState({ progress: 'Режем ' + pRe + '…' });
    ff.on && ff.on('progress', () => {});
    await ff.exec(['-ss', String(off), '-i', 'src.' + ext, '-t', String(dur), '-f', 'rawvideo', '-pix_fmt', 'rgba', '-s', W + 'x' + H, '-i', 'ov.raw',
      '-filter_complex', '[0:v]' + vf + '[b];[b][1:v]overlay=0:0[v]', '-map', '[v]', '-map', '0:a?',
      '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '23', '-pix_fmt', 'yuv420p',
      '-c:a', 'aac', '-b:a', '160k', '-movflags', '+faststart', 'out.mp4']);
    const data = await ff.readFile('out.mp4');
    if (!data || data.length < 2000) throw new Error('в этом месте записи нет кадров. Проверь дату и время начала записи: момент должен попадать внутрь файла');
    await ff.deleteFile('out.mp4');
    const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
    const a = document.createElement('a');
    const name = (s.plate.split(' · ')[0] || 'stream').replace(/[^\wА-Яа-яЁё-]+/g, '_') + '_' + item.time.replace(/:/g, '-') + '.mp4';
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
  async cutSelected(list) {
    if (!this.file) { this.setState({ err: 'Сначала выбери файл записи.' }); return; }
    const todo = list.filter((x) => x.on);
    if (!todo.length) { this.setState({ err: 'Отметь хотя бы один момент.' }); return; }
    this.setState({ busy: true, err: '', progress: 'Загружаем редактор…' });
    try {
      const ff = await loadFFmpeg();
      for (let k = 0; k < todo.length; k++) {
        await this.cutOne(todo[k], ff, k, todo.length);
      }
      this.setState({ busy: false, progress: 'Готово: ролики скачаны в «Загрузки».' });
    } catch (e) {
      this.setState({ busy: false, progress: '', err: 'Нарезка не удалась: ' + (e.message || e) + '. Проверь, что файл — видео и что браузер поддерживает нарезку (Chrome, Edge, Firefox).' });
    }
  }
  renderVals() {
    const s = this.state;
    const cut = (item) => this.cutSelected([item]);
    const items = s.items.map((it, idx) => ({
      on: !!it.on,
      time: this.fmtOffset(it.start - s.recFrom), why: it.why, caption: it.caption,
      len: Math.round(it.end - it.start) + ' с',
      status: '',
      toggle: () => this.setState({ items: s.items.map((x, j) => (j === idx ? Object.assign({}, x, { on: !x.on }) : x)) }),
      setCaption: (e) => this.setState({ items: s.items.map((x, j) => (j === idx ? Object.assign({}, x, { caption: e.target.value }) : x)) }),
      cut: () => cut(it),
    }));
    const n = s.items.filter((x) => x.on).length;
    return {
      hasFile: !!this.file, fileName: s.fileName,
      pickFile: (e) => this.pickFile(e),
      recText: s.recText, setRecText: (e) => this.setRecText(e),
      lastStream: () => this.lastStream(),
      busyOrFind: !!(s.busy || s.findBusy),
      dateColor: s.recText && !s.recValid ? 'var(--n-12)' : 'var(--n-9)',
      dateHint: s.recText && !s.recValid ? 'Дата не распознана: пиши так, например 25.10.2026 19:00' : 'Или нажми «Последний стрим»: дата подставится сама',
      isV: s.orient === 'v', isH: s.orient === 'h',
      setOrient: (e) => this.setState({ orient: e.target.value === 'h' ? 'h' : 'v' }),
      plate: s.plate, setPlate: (e) => this.setState({ plate: e.target.value }),
      findMoments: () => this.findMoments(),
      busy: !!(s.busy || s.findBusy),
      findLabel: s.findBusy ? 'Ищем…' : 'Найти моменты',
      hasItems: items.length > 0, noItems: s.loaded && !items.length,
      items,
      busyOrNone: !!(s.busy || !n),
      cutAll: () => this.cutSelected(s.items),
      cutAllLabel: n ? 'Нарезать выбранные (' + n + ')' : 'Нет выбранных',
      progress: s.progress,
      hasErr: !!s.err, err: s.err,
    };
  }
}
DCMount(Component);
</script>
