<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreOps — нарезки</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="assets/theme.js?v=460ce522"></script>
<script src="assets/api.js?v=aea5953e"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--n-1)}
a{color:var(--n-12);text-decoration:none}a:hover{color: var(--accent-on)}
[hidden]{display:none!important}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.card{display:flex;flex-direction:column;gap:12px;min-width:0;padding:20px 22px;border-radius:12px;background:rgb(var(--n-2-rgb) / .62);border:1px solid rgb(var(--n-13-rgb) / .10);box-shadow:inset 0 1px 0 rgb(var(--n-13-rgb) / .06)}
.h2{margin:0;font-size:18px;line-height:24px;font-weight:600}
.hint{margin:0;font-size:13px;line-height:18px;color:var(--n-9)}
.lab{font-size:13px;line-height:18px;font-weight:500;color:var(--n-11)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.inp{box-sizing:border-box;height:38px;padding:0 12px;border-radius:6px;background:var(--s-3);border:1px solid var(--n-8);color:var(--n-12);font:400 14px/20px var(--font-sans),sans-serif;width:100%;min-width:0}
.inp:hover{border-color:var(--n-9)}
.btn{height:40px;padding:0 16px;border-radius:6px;border:0;background:var(--n-13);color:var(--n-1);font:500 14px/20px var(--font-sans),sans-serif;cursor:pointer;flex:none}
.btn:disabled{opacity:.5;cursor:default}
.btn-s{height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--n-6);background:transparent;color:var(--n-12);font:500 14px/20px var(--font-sans),sans-serif;cursor:pointer;flex:none}
.btn-s:hover{border-color:var(--n-9)}
.btn-s:disabled{opacity:.5;cursor:default}
.note{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:8px;border:1px solid var(--n-6);background:var(--s-3)}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:20px 16px;border-radius:8px;border:1px dashed var(--n-5)}
.step{display:flex;gap:12px;align-items:flex-start;min-width:0}
.stepn{width:26px;height:26px;border-radius:999px;border:1px solid var(--n-6);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--n-11);flex:none}
.clip{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:10px;border:1px solid var(--n-5);background:var(--s-2);min-width:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--n-12);outline-offset:2px}
</style>
<style>
.sb{flex:1 1 200px;max-width:248px;min-width:200px;align-self:flex-start;position:sticky;top:88px;box-sizing:border-box;padding:12px;border-radius:8px;background:rgb(var(--n-13-rgb) / .03);border:1px solid rgb(var(--n-13-rgb) / .06);display:flex;flex-direction:column;gap:2px;font-family:var(--font-sans),system-ui,sans-serif}
.sb-h{margin:0;padding:16px 12px 8px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--n-9)}
.sb-h:first-child{padding-top:8px}
.sb-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--n-10);text-decoration:none;white-space:nowrap;overflow:hidden}
a.sb-i:hover{background:rgb(var(--n-13-rgb) / .04);color:var(--n-12)}
.sb-i[aria-current="page"]{background:rgb(var(--n-13-rgb) / .10);color:var(--n-12);box-shadow:inset 2px 0 0 var(--n-12)}
.sb-ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sb-n{margin-left:auto;font:400 12px/1 'JetBrains Mono',monospace;color:var(--n-9)}
.sb-off{color:var(--n-7)}
.sb-tag{margin-left:auto;font-size:11px;padding:1px 6px;border:1px dashed var(--n-6);border-radius:4px;color:var(--n-8)}
.sb-sep{height:1px;background:var(--n-5);margin:10px 0}
.sb-search{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;margin:0 0 8px;border:1px solid var(--n-6);border-radius:8px;background:rgb(var(--n-13-rgb) / .03);color:var(--n-9)}
.sb-search:focus-within{border-color:var(--n-12)}
.sb-search input{flex:1;min-width:0;min-width:0;border:0;outline:0;background:transparent;color:var(--n-12);font:400 14px/20px 'Onest',sans-serif;padding:0}
.sb-search input::placeholder{color:var(--n-9)}
.sb-search input::-webkit-search-cancel-button{display:none}
.sb-search kbd{font:400 10px/1 'JetBrains Mono',monospace;margin-left:auto;color:var(--n-9);border:1px solid var(--n-6);border-radius:4px;padding:2px 5px;white-space:nowrap}
.sb-empty{margin:8px 12px;font-size:13px;color:var(--n-9)}
.sb-hide{display:none!important}
@media (max-width: 900px){.sb{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}.sb-h,.sb-sep{display:none}}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var nav = document.querySelector('nav.sb'), box = nav && nav.querySelector('[data-sb-search]');
  if (!box) return;
  var empty = nav.querySelector('[data-sb-empty]');
  function apply() {
    var q = box.value.trim().toLowerCase(), any = false, group = null, groupHit = false;
    var rows = Array.prototype.slice.call(nav.children).filter(function (el) { return el.matches('a.sb-i, span.sb-i, p.sb-h, div.sb-sep'); });
    rows.forEach(function (el) {
      if (el.matches('p.sb-h')) { if (group) group.classList.toggle('sb-hide', !groupHit && !!q); group = el; groupHit = false; el.classList.remove('sb-hide'); return; }
      if (el.matches('div.sb-sep')) { el.classList.toggle('sb-hide', !!q); return; }
      var hit = !q || (el.textContent + ' ' + (el.getAttribute('data-kw') || '')).toLowerCase().indexOf(q) !== -1;
      el.classList.toggle('sb-hide', !hit);
      if (hit) { groupHit = true; any = true; }
    });
    if (group) group.classList.toggle('sb-hide', !!q && !groupHit);
    if (empty) empty.hidden = any || !q;
  }
  box.addEventListener('input', apply);
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var first = nav.querySelector('a.sb-i:not(.sb-hide)'); if (first) location.href = first.getAttribute('href'); }
    if (e.key === 'Escape') { box.value = ''; apply(); box.blur(); }
  });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); box.focus(); box.select(); }
  });
});
</script>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="min-height: 100vh; background: var(--page-bg); color: var(--n-12); font-family: var(--font-sans), system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 200; background: rgb(var(--n-1-rgb) / 0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgb(var(--n-13-rgb) / 0.08)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="#F2F2F2" data-stroke="12"></rect><rect x="6" y="8" width="16" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="13" width="10" height="2" fill="#F2F2F2" data-fill="12"></rect><rect x="6" y="18" width="13" height="2" fill="#8F8F8F" data-fill="9"></rect></svg>StreOps</a>
<a href="settings.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; border-radius: 6px; font-size: 14px; font-weight: 500" aria-label="Профиль" data-dc-keep data-stre-user><span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, var(--n-10), var(--n-6)); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--n-1)" data-av></span><span data-name>Профиль</span><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1920px; margin: 0 auto">
<nav aria-label="Разделы стрим-панели" class="sb" data-dc-keep>
<label class="sb-search"><svg class="sb-ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" data-sb-search placeholder="Поиск" aria-label="Найти раздел" autocomplete="off"><kbd>Ctrl K</kbd></label><p class="sb-empty" data-sb-empty hidden>Такого раздела нет</p>
<p class="sb-h">Сегодня</p>
<a href="panel.html" class="sb-i" data-kw="главная статистика эфир статус"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Старт</a>
<p class="sb-h">Чат</p>
<a href="moderation.html" class="sb-i" data-kw="фильтр чат удалить бан таймаут проверка"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Модерация</a>
<a href="mods.html" class="sb-i" data-kw="мод модераторы помощник права журнал"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Помощники</a>
<a href="commands.html" class="sb-i" data-kw="команда ответ чат кулдаун"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Команды</a>
<a href="timers.html" class="sb-i" data-kw="таймер сообщение напоминание"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6M12 2v3"/></svg>Таймеры</a>
<p class="sb-h">Музыка</p>
<a href="music.html" class="sb-i" data-kw="музыка трек плеер заказ очередь песня"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Очередь и заказы</a>
<a href="manage.html" class="sb-i" data-kw="помощник канал трек музыка добавить"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Управлять каналом</a>
<p class="sb-h">Эфир и сайт</p>
<a href="widgets.html" class="sb-i" data-kw="виджет obs браузер ссылка чат розыгрыш"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Виджеты для OBS</a>
<a href="site-settings.html" class="sb-i" data-kw="сайт подписчики видео значок галочка модератор"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Мой сайт</a>
<p class="sb-h">Интерактив</p>
<a href="giveaways.html" class="sb-i" data-kw="розыгрыш приз участники победитель"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/></svg>Розыгрыши</a>
<a href="clips.html" class="sb-i" aria-current="page" data-kw="нарезка клип момент видео"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 9-12 9z"/><path d="M3 3v18"/></svg>Нарезки</a>
<div class="sb-sep"></div>
<a href="settings.html" class="sb-i" data-kw="тариф оплата аккаунт email промокод"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Настройки</a>
<a href="support.html" class="sb-i" data-kw="помощь вопрос обращение"><svg class="sb-ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Поддержка</a>
</nav>
<div style="flex: 999 1 640px; min-width: 0">
<nav aria-label="Хлебные крошки"><ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px"><li><a href="panel.html" style="color: var(--n-9)">Стрим-панель</a></li><li aria-hidden="true" style="color: var(--n-7)">/</li><li><span style="color: var(--n-9)">Чат-бот</span></li><li aria-hidden="true" style="color: var(--n-7)">/</li><li aria-current="page" style="color: var(--n-12)">Нарезки</li></ol></nav>

<div style="margin-top: 16px">
<h1 style="margin: 0; font-size: 32px; line-height: 38px; letter-spacing: -0.02em; font-weight: 600">Нарезки</h1>
<p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: var(--n-10)">Короткие ролики из твоих эфиров: самые оживлённые моменты с подписью и плашкой канала. Нарезка идёт в браузере, файл записи на сервер не загружается.</p>
</div>

<section class="card" aria-labelledby="cl-how" style="margin-top: 24px">
<h2 id="cl-how" class="h2">Как это работает</h2>
<p class="hint" style="font-size: 14px; line-height: 20px; color: var(--n-10)">Нарезка — короткий кусок эфира, около минуты. Его можно сохранить и выложить отдельным видео.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
<div class="step"><span class="stepn" aria-hidden="true">1</span><div style="display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Находим пики</p><p class="hint">Смотрим, где в чате было больше всего сообщений и были донаты, подписки или рейды. Самые оживлённые 30 секунд эфира — это пик.</p></div></div>
<div class="step"><span class="stepn" aria-hidden="true">2</span><div style="display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Вырезаем окно</p><p class="hint">Вокруг пика берётся около минуты: 20 секунд до него и 40 секунд после начала.</p></div></div>
<div class="step"><span class="stepn" aria-hidden="true">3</span><div style="display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Сохраняем ролик</p><p class="hint">Готовый файл MP4 скачивается в «Загрузки» твоего браузера. Исходная запись не меняется.</p></div></div>
</div>
</section>

<div style="margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start">

<section class="card" aria-labelledby="cl-src">
<h2 id="cl-src" class="h2">1. Запись стрима</h2>
<p class="hint">Выбери файл записи, который сохранил OBS, и укажи, когда он начался. От этого зависит, в каком месте файла вырезается ролик.</p>
<template data-if="hasMeErr"><div role="alert" class="note"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Не вижу твой канал</p><p style="margin: 0; font-size: 13px; line-height: 18px; color: var(--n-10)">{{ meErr }}</p><div><button type="button" class="btn-s" onClick="{{ retryMe }}">Повторить</button></div></div></template>

<div class="fld">
<label class="lab" for="cl-file">Файл записи (MP4, MKV, MOV)</label>
<input id="cl-file" type="file" accept="video/*" onChange="{{ pickFile }}" style="font: 400 14px/20px var(--font-sans), sans-serif; color: var(--n-10); max-width: 100%">
<template data-if="hasFile"><p class="mono" style="margin: 0; font-size: 13px; line-height: 18px; color: var(--n-10); overflow-wrap: anywhere">{{ fileName }}</p></template>
<template data-if="noFile"><p class="hint">Файл пока не выбран. Моменты можно искать и без него, а вот нарезать — нельзя.</p></template>
<p class="hint">Файл остаётся на твоём компьютере. Выбрать его можно и позже, перед нарезкой.</p>
</div>

<div class="fld">
<label class="lab" for="cl-date">Когда началась запись (ДД.ММ.ГГГГ ЧЧ:ММ)</label>
<div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center">
<input id="cl-date" class="inp mono" type="text" inputmode="numeric" placeholder="25.10.2026 19:00" maxlength="16" value="{{ recText }}" onChange="{{ setRecText }}" onInput="{{ setRecText }}" aria-describedby="cl-date-hint" style="width: 180px; flex: 0 0 180px; font-size: 13px">
<button type="button" class="btn-s" onClick="{{ lastStream }}" disabled="{{ busy }}" style="height: 38px; padding: 0 12px; font-size: 13px">Взять время последнего эфира</button>
</div>
<span id="cl-date-hint" class="hint" style="color: {{ dateColor }}">{{ dateHint }}</span>
<p class="hint">Если включил запись раньше начала эфира, укажи время, когда начал запись в OBS.</p>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px">
<div class="fld">
<label class="lab" for="cl-fmt">Формат</label>
<select id="cl-fmt" class="inp" onChange="{{ setOrient }}"><option value="v" selected="{{ isV }}">Вертикальный 9:16 (Shorts, Reels)</option><option value="h" selected="{{ isH }}">Горизонтальный 16:9</option></select>
</div>
<div class="fld">
<label class="lab" for="cl-plate">Плашка канала</label>
<input id="cl-plate" class="inp" type="text" maxlength="60" value="{{ plate }}" onChange="{{ setPlate }}" onInput="{{ setPlate }}">
</div>
</div>
<p class="hint">Вертикальный формат — 720×1280, кадр обрезается по центру. Горизонтальный — 1280×720. Плашка — надпись в углу ролика: по умолчанию имя канала и ссылка на него.</p>
</section>

<section class="card" aria-labelledby="cl-list">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap">
<h2 id="cl-list" class="h2">2. Моменты</h2>
<template data-if="hasItems"><button type="button" class="btn-s" onClick="{{ findNow }}" disabled="{{ busy }}" style="height: 34px; padding: 0 12px; font-size: 13px">Найти заново</button></template>
</div>
<p class="hint">{{ listHint }}</p>

<template data-if="showBotWarn"><div role="note" class="note"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Бот не подключён к каналу</p><p style="margin: 0; font-size: 13px; line-height: 18px; color: var(--n-10)">Моменты берутся из чата и событий, которые бот записывает во время эфира. Без подключённого бота их не будет. Подключить можно в <a href="panel.html" style="text-decoration: underline">Стрим-панели</a>, на вкладке «Обзор».</p></div></template>

<template data-if="hasFindErr"><div role="alert" class="note"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Не получилось найти моменты</p><p style="margin: 0; font-size: 13px; line-height: 18px; color: var(--n-10)">{{ findErr }}</p><div><button type="button" class="{{ findRetryCls }}" onClick="{{ retryFind }}" disabled="{{ busy }}">Повторить</button></div></div></template>

<template data-if="isLoading"><p role="status" style="margin: 0; font-size: 14px; line-height: 20px; color: var(--n-10)">Загружаем моменты…</p></template>

<template data-if="isEmpty"><div class="empty"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Пока нет нарезок</p><p class="hint" style="line-height: 19px">Нажми «Найти моменты»: сайт сам подберёт самые оживлённые куски эфира. Дату можно не указывать, тогда возьмём последний эфир.</p><button type="button" class="btn" onClick="{{ findNow }}" disabled="{{ findDisabled }}">{{ findLabel }}</button></div></template>

<template data-if="isNoData"><div class="empty"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">За этот эфир пока нет данных</p><p class="hint" style="line-height: 19px">Проверь, что дата верная и бот был подключён в этот день. Если бот был выключен, моментов не будет. Можно выбрать другой эфир или написать в <a href="support.html" style="text-decoration: underline">поддержку</a>.</p><button type="button" class="btn-s" onClick="{{ retryFind }}" disabled="{{ busy }}">Попробовать ещё раз</button></div></template>

<template data-for="items" data-as="c"><div class="clip">
<label style="display: flex; gap: 10px; align-items: flex-start; cursor: pointer; min-width: 0"><input type="checkbox" checked="{{ c.on }}" onChange="{{ c.toggle }}" aria-label="Взять момент {{ c.range }}" style="width: 18px; height: 18px; margin-top: 2px; flex: none"><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span class="mono" style="font-size: 14px; line-height: 20px; color: var(--n-12)">{{ c.range }}</span><span style="font-size: 13px; line-height: 18px; color: var(--n-10)">{{ c.why }}</span><span style="font-size: 12px; line-height: 16px; color: var(--n-9); overflow-wrap: anywhere">{{ c.src }}</span></span></label>
<label class="fld"><span class="lab" style="font-size: 12px; color: var(--n-10)">Подпись на ролике</span><input class="inp" type="text" maxlength="90" value="{{ c.caption }}" onChange="{{ c.setCaption }}" aria-label="Подпись момента {{ c.range }}"></label>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap"><span style="font-size: 12px; color: var(--n-9)">Длительность: {{ c.len }}</span><button type="button" class="btn-s" onClick="{{ c.cut }}" disabled="{{ c.cutOff }}" style="height: 34px; padding: 0 12px; font-size: 13px">Нарезать только этот</button></div>
</div></template>

<template data-if="hasItems"><div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center"><button type="button" class="btn" onClick="{{ cutAll }}" disabled="{{ cutOff }}">{{ cutLabel }}</button><span role="status" style="font-size: 13px; line-height: 18px; color: var(--n-10)">{{ progress }}</span></div>
<p class="hint">Каждый ролик скачается отдельным файлом MP4 в «Загрузки». Чем длиннее запись, тем дольше нарезка.</p>
</div></template>

<template data-if="hasCutErr"><div role="alert" class="note"><p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">Нарезка не удалась</p><p style="margin: 0; font-size: 13px; line-height: 18px; color: var(--n-10)">{{ cutErr }}</p><div><button type="button" class="btn-s" onClick="{{ retryCut }}" disabled="{{ busy }}">Повторить</button></div></div></template>

<p class="hint">Подпись взята из заметного сообщения в чате: проверь её перед публикацией. Длинные записи (больше 2 часов) нарезаются дольше, поэтому режь по моментам, как сейчас.</p>
</section>

</div>
</div>
</div>
</div>
</template>
<script src="assets/dc-lite.js?v=5f8ce08a"></script>
<script>
const FF_BASE = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm';
const FF_UTIL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js';
let ffmpegPromise = null;

// подписи событий для понятных причин моментов (в API приходят технические названия)
const EV_RU = { donation: 'донат', sub: 'подписка', resub: 'продление подписки', gift: 'подарочные подписки', raid: 'рейд', follow: 'новый фолловер' };

function ruPlural(n, forms) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return forms[0];
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return forms[1];
  return forms[2];
}

// ffmpeg.wasm грузим с CDN при первом запуске; запись остаётся на компьютере
function loadFFmpeg() {
  if (!ffmpegPromise) {
    ffmpegPromise = (async () => {
      const { FFmpeg } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js');
      const { toBlobURL } = await import(FF_UTIL);
      const ff = new FFmpeg();
      // рабочий скрипт грузим как blob, а его относительные импорты переписываем на полные адреса CDN
      const wbase = 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm';
      const wsrc = await (await fetch(wbase + '/worker.js')).text();
      const wfix = wsrc.replace(/from\s*"\.\/([^"]+)"/g, 'from "' + wbase + '/$1"').replace(/from\s*'\.\/([^']+)'/g, "from '" + wbase + "/$1'");
      await ff.load({
        classWorkerURL: URL.createObjectURL(new Blob([wfix], { type: 'text/javascript' })),
        coreURL: await toBlobURL(FF_BASE + '/ffmpeg-core.js', 'text/javascript'),
        wasmURL: await toBlobURL(FF_BASE + '/ffmpeg-core.wasm', 'application/wasm'),
      });
      return ff;
    })().catch((e) => { ffmpegPromise = null; throw e; });
  }
  return ffmpegPromise;
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.file = null;
    this.srcName = 'src.mp4';
    this.lastUseLast = false;
    this.lastCut = [];
    this.state = {
      token: '', meReady: false, meErr: '', botOn: true,
      recFrom: 0, recText: '', recValid: false, fileName: '', orient: 'v', plate: '',
      items: [], listState: 'idle', findErr: '',
      cutBusy: false, progress: '', cutErr: '',
    };
  }
  componentDidMount() { this.loadMe(false); }

  // Ключ канала и статус бота берём из профиля. Если профиль не открылся, показываем ошибку с «Повторить».
  loadMe(retry) {
    this.setState({ meErr: '' });
    const p = retry ? StreAPI.refreshMe() : StreAPI.me();
    p.then((m) => {
      const u = m && m.user;
      if (!u) { this.setState({ meReady: false, meErr: 'Обнови страницу или войди через Twitch заново.' }); return; }
      this.setState({
        token: u.widgetToken || '', botOn: !!u.botEnabled, meReady: true, meErr: '',
        plate: this.state.plate || (u.name + ' · twitch.tv/' + u.login),
      });
    });
  }

  // ДД.ММ.ГГГГ ЧЧ:ММ → unix-секунды (локальное время), иначе null
  parseRec(text) {
    const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})\s+(\d{1,2}):(\d{2})$/.exec((text || '').trim());
    if (!m) return null;
    const d = new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5], 0);
    if (d.getDate() !== +m[1] || d.getHours() !== +m[4]) return null;
    return Math.floor(d.getTime() / 1000);
  }
  formatRec(ts) {
    const d = new Date(ts * 1000);
    const p = (n) => String(n).padStart(2, '0');
    return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  setRecText(e) {
    const text = e.target.value;
    const ts = this.parseRec(text);
    if (ts) this.setState({ recText: text, recValid: true, recFrom: ts });
    else this.setState({ recText: text, recValid: false });
  }
  fmtOffset(sec) {
    sec = Math.max(0, Math.round(sec));
    const p = (n) => String(n).padStart(2, '0');
    return p(Math.floor(sec / 3600)) + ':' + p(Math.floor(sec % 3600 / 60)) + ':' + p(sec % 60);
  }

  // «Взять время последнего эфира»: сервер сам выбирает последний эфир и возвращает дату его начала
  lastStream() { this.findMoments(true); }

  // Понятный текст ошибки: технические сообщения заменяем
  errText(e) {
    const m = (e && e.message) || 'что-то пошло не так';
    if (/Ключ не подошёл/.test(m)) return 'Ключ канала не подошёл. Обнови страницу: ключ загрузится заново.';
    return m;
  }

  async findMoments(useLast) {
    const s = this.state;
    this.lastUseLast = !!useLast;
    if (!useLast && s.recText.trim() && !s.recValid) {
      this.setState({ listState: s.items.length ? 'ok' : 'error', findErr: 'Дата не распознана. Напиши так: 25.10.2026 19:00' });
      return;
    }
    if (!s.token) { this.setState({ listState: s.items.length ? 'ok' : 'error', findErr: 'Не вижу ключ канала. Обнови страницу.' }); return; }
    // пустая дата = последний эфир (from не передаём)
    const from = useLast || !s.recText.trim() ? 0 : s.recFrom;
    this.setState({ listState: 'loading', findErr: '' });
    try {
      const q = { t: s.token, count: '6' };
      if (from) q.from = String(from);
      const j = await StreAPI.get('clips.highlights', q);
      const items = (j.items || []).map((it, i) => ({
        i, start: it.start, end: it.end,
        events: (it.events || []).map((ev) => EV_RU[ev] || ev),
        chat: Number(it.chat) || 0,
        caption: it.title || 'Лучший момент стрима',
        on: true,
      }));
      this.setState({ items, recFrom: j.from, recText: this.formatRec(j.from), recValid: true, listState: items.length ? 'ok' : 'nodata', findErr: '' });
    } catch (e) {
      this.setState({ listState: this.state.items.length ? 'ok' : 'error', findErr: this.errText(e) });
    }
  }

  pickFile(e) {
    const f = e.target.files && e.target.files[0];
    this.file = f || null;
    this.setState({ fileName: f ? f.name + ' · ' + (f.size / 1048576).toFixed(0) + ' МБ' : '' });
  }

  // Плашка и подпись рисуются на картинке и накладываются на видео в ffmpeg
  overlayPng(caption, W, H) {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    const s = this.state;
    const pad = Math.round(W * 0.03);
    g.font = '600 ' + Math.round(W * 0.034) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
    const plateText = s.plate || '';
    const pw = Math.min(W - 2 * pad, g.measureText(plateText).width + pad * 2);
    const ph = Math.round(W * 0.06);
    g.fillStyle = 'rgba(12, 10, 10, 0.82)';
    g.beginPath(); g.roundRect(pad, pad, pw, ph, ph / 2); g.fill();
    g.fillStyle = '#FFFFFE';
    g.textBaseline = 'middle';
    g.fillText(plateText, pad + pad, pad + ph / 2);
    // подпись внизу: перенос по словам
    g.font = '700 ' + Math.round(W * 0.046) + 'px system-ui, -apple-system, Segoe UI, sans-serif';
    const maxW = W - pad * 4;
    const words = caption.split(' ');
    const lines = []; let line = '';
    words.forEach((w) => { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
    if (line) lines.push(line);
    const lh = Math.round(W * 0.06);
    const top = H - pad * 2 - lh * lines.length - Math.round(H * 0.04);
    g.fillStyle = 'rgba(12, 10, 10, 0.7)';
    g.beginPath(); g.roundRect(pad, top - pad / 2, W - pad * 2, lh * lines.length + pad, pad); g.fill();
    g.fillStyle = '#FFFFFE';
    lines.forEach((t, i) => { g.fillText(t, W / 2 - g.measureText(t).width / 2, top + lh * i + lh / 2); });
    return g.getImageData(0, 0, W, H).data; // сырые пиксели RGBA: без декодирования PNG
  }

  // Один ролик: отрезок [start, end] от начала записи, плашка и подпись, скачивание MP4
  async cutOne(item, ff, index, total) {
    const s = this.state;
    const vertical = s.orient === 'v';
    const W = vertical ? 720 : 1280, H = vertical ? 1280 : 720;
    const dur = item.end - item.start;
    const off = item.start - s.recFrom; // смещение от начала файла записи
    if (off < 0) throw new Error('момент раньше начала файла. Проверь дату и время начала записи');
    const rgba = this.overlayPng(item.caption || '', W, H);
    await ff.writeFile('ov.raw', rgba);
    const vf = vertical ? 'scale=-2:' + H + ',crop=' + W + ':' + H : 'scale=' + W + ':-2,crop=' + W + ':' + H;
    this.setState({ progress: 'Режем ' + (index + 1) + ' из ' + total + '…' });
    await ff.exec(['-ss', String(off), '-i', this.srcName, '-t', String(dur), '-f', 'rawvideo', '-pix_fmt', 'rgba', '-s', W + 'x' + H, '-i', 'ov.raw',
      '-filter_complex', '[0:v]' + vf + '[b];[b][1:v]overlay=0:0[v]', '-map', '[v]', '-map', '0:a?',
      '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '23', '-pix_fmt', 'yuv420p',
      '-c:a', 'aac', '-b:a', '160k', '-movflags', '+faststart', 'out.mp4']);
    const data = await ff.readFile('out.mp4');
    if (!data || data.length < 2000) throw new Error('в этом месте записи нет кадров. Проверь дату и время начала записи: момент должен попадать внутрь файла');
    await ff.deleteFile('out.mp4');
    const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
    const a = document.createElement('a');
    const name = (s.plate.split(' · ')[0] || 'stream').replace(/[^\wА-Яа-яЁё-]+/g, '_') + '_' + this.fmtOffset(off).replace(/:/g, '-') + '.mp4';
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  // Нарезка списка моментов. На вход — уже отфильтрованный список (только выбранные или один момент).
  async cutList(list) {
    if (!this.file) { this.setState({ cutErr: 'Сначала выбери файл записи в шаге 1.' }); return; }
    if (!list.length) { this.setState({ cutErr: 'Отметь хотя бы один момент.' }); return; }
    this.lastCut = list;
    this.setState({ cutBusy: true, cutErr: '', progress: 'Загружаем редактор видео…' });
    let ff = null;
    try {
      ff = await loadFFmpeg();
      const { fetchFile } = await import(FF_UTIL);
      const ext = (this.file.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '') || 'mp4';
      this.srcName = 'src.' + ext;
      // файл записи кладём в память редактора один раз на весь список
      await ff.writeFile(this.srcName, await fetchFile(this.file));
      for (let k = 0; k < list.length; k++) {
        await this.cutOne(list[k], ff, k, list.length);
      }
      this.setState({ cutBusy: false, progress: 'Готово: ' + list.length + ' ' + ruPlural(list.length, ['ролик', 'ролика', 'роликов']) + ' сохранено в «Загрузки».' });
    } catch (e) {
      this.setState({ cutBusy: false, progress: '', cutErr: 'Нарезка не удалась: ' + (e.message || e) + '. Проверь, что выбран видеофайл, и попробуй Chrome, Edge или Firefox.' });
    } finally {
      if (ff) { try { await ff.deleteFile(this.srcName); } catch (err) { /* файла уже нет */ } }
    }
  }

  renderVals() {
    const s = this.state;
    const n = s.items.filter((x) => x.on).length;
    const hasItems = s.items.length > 0;
    const hasFile = !!this.file;
    const busy = s.cutBusy || s.listState === 'loading';
    const items = s.items.map((it, idx) => {
      const parts = [];
      if (it.events.length) parts.push(it.events.join(', '));
      if (it.chat) parts.push(it.chat + ' ' + ruPlural(it.chat, ['сообщение', 'сообщения', 'сообщений']) + ' в чате');
      const why = parts.length ? (parts.join(' · ')).replace(/^./, (c) => c.toUpperCase()) : 'Оживлённый момент';
      return {
        on: !!it.on,
        toggle: () => this.setState({ items: this.state.items.map((x, j) => (j === idx ? Object.assign({}, x, { on: !x.on }) : x)) }),
        range: this.fmtOffset(it.start - s.recFrom) + ' – ' + this.fmtOffset(it.end - s.recFrom),
        len: Math.round(it.end - it.start) + ' с',
        why,
        src: 'Отрезок в записи эфира' + (hasFile ? ' · ' + this.file.name : ' · файл не выбран'),
        caption: it.caption,
        setCaption: (e) => this.setState({ items: this.state.items.map((x, j) => (j === idx ? Object.assign({}, x, { caption: e.target.value }) : x)) }),
        cut: () => this.cutList([this.state.items[idx]]),
        cutOff: busy || !hasFile,
      };
    });
    const cutLabel = s.cutBusy ? 'Режем…' : !hasFile ? 'Сначала выбери файл записи' : n ? 'Нарезать выбранные (' + n + ')' : 'Выбери хотя бы один момент';
    const typed = s.recText.trim() !== '';
    return {
      hasFile, fileName: s.fileName, noFile: !hasFile,
      pickFile: (e) => this.pickFile(e),
      recText: s.recText, setRecText: (e) => this.setRecText(e),
      dateColor: typed && !s.recValid ? 'var(--n-12)' : 'var(--n-9)',
      dateHint: typed && !s.recValid ? 'Дата не распознана. Напиши так: 25.10.2026 19:00' : typed ? 'Дата распознана.' : 'Пусто: возьмём время последнего эфира. Или напиши дату сам, например 25.10.2026 19:00',
      lastStream: () => this.lastStream(),
      busy,
      isV: s.orient === 'v', isH: s.orient === 'h',
      setOrient: (e) => this.setState({ orient: e.target.value === 'h' ? 'h' : 'v' }),
      plate: s.plate, setPlate: (e) => this.setState({ plate: e.target.value }),
      hasMeErr: !!s.meErr, meErr: s.meErr, retryMe: () => this.loadMe(true),
      showBotWarn: s.meReady && !s.botOn,
      findNow: () => this.findMoments(false),
      findDisabled: busy || !s.meReady,
      findLabel: s.listState === 'loading' ? 'Загружаем…' : 'Найти моменты',
      retryFind: () => this.findMoments(this.lastUseLast),
      findRetryCls: hasItems ? 'btn-s' : 'btn',
      hasFindErr: !!s.findErr, findErr: s.findErr,
      isLoading: s.listState === 'loading' && !hasItems,
      isEmpty: s.listState === 'idle' && !hasItems,
      isNoData: s.listState === 'nodata',
      hasItems,
      listHint: hasItems
        ? 'Отметь нужные. Подпись можно поменять: она выйдет на ролике.'
        : 'Моменты идут по времени эфира. Список хранится, пока открыта эта страница: если обновишь её, моменты придётся найти заново.',
      items,
      cutAll: () => this.cutList(this.state.items.filter((x) => x.on)),
      cutOff: busy || !hasFile || n === 0,
      cutLabel,
      progress: s.progress,
      hasCutErr: !!s.cutErr, cutErr: s.cutErr,
      retryCut: () => this.cutList(this.lastCut),
    };
  }
}
DCMount(Component);
</script>
